        ${outlookHtml}
        <div class="sub-label" style="margin-top:8px;" data-learn="HOW MUCH OF YOUR EXPECTED INCOME HAS ACTUALLY ARRIVED THIS MONTH. MARK INCOME AS RECEIVED ON THE LOG INCOME TAB."><span class="stat-lbl">RECEIVED</span> <span class="stat-val">${Util.esc(Util.fmtMoney(received, 0))}</span> <span class="stat-lbl">OF</span> <span class="stat-val">${Util.esc(Util.fmtMoney(expectedIncome, 0))}</span> <span class="stat-lbl">EXPECTED</span></div>
        ${BudgetEngine.titheEnabled(s) ? `<div class="sub-label" style="margin-top:8px;" data-learn="HOW MUCH OF YOUR TITHE HAS BEEN SET ASIDE SO FAR, BASED ON INCOME MARKED RECEIVED THIS MONTH, OF THE FULL TITHE EXPECTED ON YOUR TOTAL EXPECTED INCOME."><span class="stat-lbl">TITHED</span> <span class="stat-val">${Util.esc(Util.fmtMoney(titheReceived, 0))}</span> <span class="stat-lbl">OF</span> <span class="stat-val">${Util.esc(Util.fmtMoney(titheExpected, 0))}</span></div>` : ""}
        <div class="sub-label" style="margin-top:8px;" data-learn="TOTAL BUDGETED = TITHE + BILLS + DEBT MINIMUMS + SPENDING BUDGETS, FOR YOUR FULL EXPECTED MONTH, SO IT DOESN'T MOVE AS PAYCHECKS LAND. ON CREDIT = TOTAL OF THIS MONTH'S CREDIT TRANSACTIONS THAT AREN'T PAID OFF YET."><span class="stat-val">${Util.esc(Util.fmtMoney(budgeted, 0))}</span> <span class="stat-lbl">BUDGETED ·</span> <span class="stat-val">${Util.esc(Util.fmtMoney(credit, 0))}</span> <span class="stat-lbl">ON CREDIT</span></div>
        ${peopleHtml}
        ${dueSoonHtml}
        ${savingsHtml}
        ` : ""}
        ${staleHtml}
        ${rollHtml}
      </section>`;
  }

  function tabBodyHtml(s, tab) {
    switch (tab) {
      case "dashboard": return dashboardBodyHtml(s);
      case "bills": return billsBodyHtml(s);
      case "debts": return debtsBodyHtml(s);
      case "log":
      default: return logBodyHtml(s);
    }
  }

  // Everything that slides on a swipe: the tab's own sections plus the footer.
  // The inner form is what the swipe drops into its offscreen incoming panel.
  function swipeBodyInner(s, tab) {
    return tabBodyHtml(s, tab) + footer();
  }
  function swipeBodyHtml(s, tab) {
    return `<div class="swipe-body">${swipeBodyInner(s, tab)}</div>`;
  }

  function screenShell(s, tab) {
    return `
      <div class="screen">
        ${appHeader("lime")}
        ${limeBlock(s, tab)}
        <div class="swipe-stage">${swipeBodyHtml(s, tab)}</div>
      </div>
      ${tabBar()}`;
  }

  function bindTab(s, tab) {
    bindGlobalTabs();
    bindLimeBlockEvents(s);
    if (tab === "log") bindLogEvents(s);
    else if (tab === "bills") bindBillsEvents(s);
    else if (tab === "debts") bindDebtsEvents(s);
    else if (tab === "dashboard") bindDashboardEvents(s);
  }

  function bindDashboardEvents(s) {
    root.querySelectorAll("[data-action=cat-toggle]").forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.cat || null;
        // Tapping the open row closes it, so the same tap both opens and
        // dismisses and no row can be left stuck open.
        dashCatOpen = dashCatOpen === id ? null : id;
        render();
      });
    });
    root.querySelectorAll("[data-action=open-funding]").forEach(el => {
      el.addEventListener("click", () => openFundingForm(s));
    });
  }

  // The month-rollover nudge now lives in the shared lime block, so its handler
  // has to be bound on every tab rather than only on LOG.
  function bindLimeBlockEvents(s) {
    root.querySelectorAll("[data-action=open-new-month-inline]").forEach(el => {
      el.addEventListener("click", () => {
        newMonthChoices = {};
        newMonthOpen = true;
        render();
      });
    });
    root.querySelectorAll("[data-action=open-balance]").forEach(el => {
      el.addEventListener("click", () => openBalanceOverlay(null));
    });
    // Only rendered onto the hero while the figure is negative, so there is
    // nothing to unbind when it recovers.
    root.querySelectorAll("[data-action=open-shortfall]").forEach(el => {
      el.addEventListener("click", () => {
        shortfallOpen = el.dataset.which === "safe" ? "safe" : "tight";
        render();
      });
    });
    root.querySelectorAll("[data-action=dismiss-gap]").forEach(el => {
      el.addEventListener("click", () => {
        if (balanceGapNotice) balanceGapNotice.dismissed = true;
        render();
      });
    });
    root.querySelectorAll("[data-action=open-rollovers]").forEach(el => {
      el.addEventListener("click", () => {
        newMonthChoices = {};
        newMonthOpen = true;
        render();
      });
    });
    root.querySelectorAll("[data-action=lime-toggle]").forEach(el => {
      el.addEventListener("click", () => {
        limeExpanded = !limeExpanded;
        try { localStorage.setItem("clear.limeOpen", limeExpanded ? "1" : "0"); } catch (e) {}
        render();
      });
    });
    root.querySelectorAll("[data-action=dismiss-roll]").forEach(el => {
      el.addEventListener("click", () => {
        if (monthRollNotice) monthRollNotice.dismissed = true;
        render();
      });
    });
  }

  // New Month + Import overlays are separate layers living outside #root.
  // The overlay renderers strip prior overlays themselves, but when NEITHER
  // should be showing they never run, which used to leave a stale overlay node
  // on screen (e.g. the review overlay lingering after a committed import).
  function syncOverlays(s) {
    const wantNewMonth = !!s && !!newMonthOpen;
    const wantImport = !!s && !!(importFlow.open && importFlow.stage);
    const wantBalance = !!s && !!balanceForm;
    const wantPayday = !!s && !!paydayForm;
    const wantShortfall = !!s && !!shortfallOpen;
    if (!wantNewMonth && !wantImport && !wantBalance && !wantPayday && !wantShortfall) {
      document.querySelectorAll(".overlay").forEach(o => o.remove());
      return;
    }
    if (wantNewMonth) renderNewMonthOverlay(s);
    if (wantImport) renderImportOverlay(s);
    if (wantShortfall) renderShortfallOverlay(s, shortfallOpen);
    if (wantPayday) renderPaydayOverlay(s);
    // Last, so confirming a balance straight after an import sits on top.
    if (wantBalance) renderBalanceOverlay(s);
  }

  /* ------------- LOG SCREEN ------------- */
  // Returns the LOG tab's own sections. The lime block, header, footer and tab
  // bar are the shell's job; see screenShell().
  function logBodyHtml(s) {
    const isCouple = s.settings && s.settings.mode === "couple";
    const received = BudgetEngine.receivedIncome(s);
    const expectedIncome = BudgetEngine.totalIncome(s);

    // Spending categories only. Bills are tracked on the BILLS tab and debt
    // payments on the DEBTS screen, so neither belongs in the manual purchase
    // picker. The txn editor still lists both so existing/imported transactions
    // stay editable and re-categorizable.
    const chips = [];
    (s.spendingCategories||[]).forEach(c => chips.push({ id: c.id, label: c.label, type: "spending" }));

    // recent transactions for the VIEWED month (local UI state), most recent first.
    // Everything else on this screen still keys off s.currentMonth.
    const catLookup = {};
    (s.spendingCategories||[]).forEach(c => catLookup[c.id] = c.label);
    (s.bills||[]).forEach(b => catLookup[b.id] = b.label);
    (s.debts||[]).forEach(d => catLookup[d.id] = d.label);
    catLookup["tithe"] = "TITHE";
    // Clamp the viewed month: never past currentMonth (no future browsing) and
    // never earlier than the oldest transaction month in the doc.
    const allTxnMonths = (s.transactions||[])
      .map(t => (t.month || "")).filter(m => /^\d{4}-\d{2}$/.test(m));
    const oldestTxnMonth = allTxnMonths.length ? allTxnMonths.slice().sort()[0] : s.currentMonth;
    let activeMonth = viewedTxnMonth || s.currentMonth;
    if (activeMonth > s.currentMonth) activeMonth = s.currentMonth;
    if (activeMonth < oldestTxnMonth) activeMonth = oldestTxnMonth;
    viewedTxnMonth = activeMonth === s.currentMonth ? null : activeMonth;
    const canGoBack = activeMonth > oldestTxnMonth;
    const canGoForward = activeMonth < s.currentMonth;
    const monthLabel = activeMonth === s.currentMonth
      ? `THIS MONTH · ${Util.fmtMonthLong(activeMonth)}`
      : Util.fmtMonthLong(activeMonth);
    // Sort newest first. `date` is day-granular, so everything logged today ties
    // and a plain stable sort left them in insertion order — oldest on top.
    // Tie-break on position in the stored array (append order) so the most
    // recently added row wins. Decorate-sort-undecorate keeps this stable.
    const txns = (s.transactions||[]).filter(t => t.month === activeMonth)
      .map((t, i) => ({ t, i }))
      .sort((a, b) => (a.t.date < b.t.date ? 1 : (a.t.date > b.t.date ? -1 : b.i - a.i)))
      .map(x => x.t);

    const chipsHtml = chips.map(c => {
      const cls = "chip " + (logForm.categoryId === c.id ? "active " : "") +
        (c.type === "debt" ? "debt-chip " : (c.type === "bill" ? "bill-chip " : ""));
      return `<button class="${cls}" data-action="pick-cat" data-id="${Util.esc(c.id)}" data-type="${c.type}">${Util.esc(c.label)}</button>`;
    }).join("");

    const personChips = isCouple ? `
      <div data-learn="WHO (COUPLE MODE). PICK A NAME OR JOINT. THE DASHBOARD SHOWS PER-PERSON SPENDING TOTALS.">
        <div class="sub-label">WHO</div>
        <div class="chips" data-scroll-key="log-person-chips">
          ${[s.settings.names[0], s.settings.names[1], "JOINT"].map(p => {
            const val = p.toUpperCase();
            return `<button class="chip ${logForm.person===val?'active':''}" data-action="pick-person" data-person="${Util.esc(val)}">${Util.esc(p)}</button>`;
          }).join("")}
        </div>
      </div>` : "";

    // Card chip row (visible only when CREDIT is the selected payment type)
    const cards = s.creditCards || [];
    const cardChipsHtml = logForm.paymentType === "credit" ? `
      <div data-learn="WHICH CARD. PICK THE CREDIT CARD YOU USED SO THE DASHBOARD CAN TALLY UNPAID CREDIT PER CARD. IF NO CARD IS PICKED, IT FALLS UNDER GENERIC CREDIT.">
        <div class="sub-label">WHICH CARD</div>
        ${cards.length ? `
          <div class="chips" data-scroll-key="log-card-chips">
            ${cards.map(c => `<button class="chip ${logForm.cardId===c.id?'active':''}" data-action="pick-card" data-id="${Util.esc(c.id)}">${Util.esc(c.label)}</button>`).join("")}
            ${logForm.cardId ? `<button class="chip" data-action="pick-card" data-id="">× NONE</button>` : ""}
          </div>
        ` : `<div class="meta">NO CARDS; ADD THEM IN SETTINGS</div>`}
      </div>` : "";

    const banks = s.banks || [];
    const bankChipsHtml = (logForm.paymentType === "cash" && banks.length) ? `
      <div data-learn="WHICH BANK. IF YOU KEEP MORE THAN ONE CHECKING ACCOUNT, PICK THE ONE THIS CAME OUT OF. ADD ACCOUNTS IN SETTINGS.">
        <div class="sub-label">WHICH BANK</div>
        <div class="chips" data-scroll-key="log-bank-chips">
          ${banks.map(b => `<button class="chip ${logForm.bankId===b.id?'active':''}" data-action="pick-bank" data-id="${Util.esc(b.id)}">${Util.esc(b.label)}</button>`).join("")}
          ${logForm.bankId ? `<button class="chip" data-action="pick-bank" data-id="">× NONE</button>` : ""}
        </div>
      </div>` : "";

    const txnRowsHtml = txns.length ? txns.map(t => renderTxnRow(s, t, catLookup)).join("") :
      `<div class="meta" style="padding: 12px 0;">NO TRANSACTIONS YET THIS MONTH</div>`;
    // Counter for transactions that were imported without a category selected.
    const needsCount = txns.filter(t => t.needsCategory || (t.source === "import" && !t.categoryId)).length;
    const needsCounterHtml = needsCount > 0
      ? `<div class="sub-label text-danger" style="margin-top: 12px;">${needsCount} TRANSACTION${needsCount === 1 ? "" : "S"} NEED A CATEGORY</div>`
      : "";

    // ---- LOG INCOME sub-tab ----------------------------------------------
    // An income source counts as CLEARED for the month when an incomeLog entry
    // exists with that incomeId and month.
    const logMonth = s.currentMonth;
    const clearedFor = (incomeId) =>
      (s.incomeLog || []).find(e => e && e.incomeId === incomeId && e.month === logMonth) || null;

    const incPersonChips = isCouple ? `
      <div>
        <div class="sub-label">WHO</div>
        <div class="chips" data-scroll-key="inc-person-chips" data-learn="WHO RECEIVED THIS MONEY.">
          ${[s.settings.names[0], s.settings.names[1], "JOINT"].map(p => {
            const val = (p || "").toUpperCase();
            return `<button class="chip ${incomeForm.person === val ? "active" : ""}" data-action="inc-pick-person" data-person="${Util.esc(val)}">${Util.esc(p)}</button>`;
          }).join("")}
        </div>
      </div>` : "";

    // Same WHICH BANK picker the purchase form uses. Income always lands in an
    // account, so unlike purchases there's no payment type gating it.
    const incBankChipsHtml = banks.length ? `
      <div data-learn="WHICH BANK. IF YOU KEEP MORE THAN ONE CHECKING ACCOUNT, PICK THE ONE THIS LANDED IN. ADD ACCOUNTS IN SETTINGS.">
        <div class="sub-label">WHICH BANK</div>
        <div class="chips" data-scroll-key="inc-bank-chips">
          ${banks.map(b => `<button class="chip ${incomeForm.bankId===b.id?'active':''}" data-action="inc-pick-bank" data-id="${Util.esc(b.id)}">${Util.esc(b.label)}</button>`).join("")}
          ${incomeForm.bankId ? `<button class="chip" data-action="inc-pick-bank" data-id="">× NONE</button>` : ""}
        </div>
      </div>` : "";

    // Pay-date order: the list reads the way the month actually happens.
    const incExpectedRows = (s.income || []).length
      ? BudgetEngine.incomeByDate(s).map(i => {
          // One slot per pay day this month. A source that pays once has a
          // single slot and keeps the plain checkbox it always had; anything
          // that pays more often collapses behind a chevron.
          const landings = BudgetEngine.landingsForMonth(s, i, logMonth);
          const multi = landings.length > 1;
          const open = !!incExpanded[i.id];
          const clearedCount = landings.filter(l => l.entry).length;
          const entry = landings.length ? landings[0].entry : clearedFor(i.id);
          const expected = Number(i.amount) || 0;
          const actual = entry ? (Number(entry.amount) || 0) : 0;
          const showActual = !multi && entry && Math.abs(actual - expected) >= 0.01;
          const freq = BudgetEngine.incomeFrequency(i);
          const day = Number(i.dueDateOfMonth) || 0;
          const monthly = BudgetEngine.incomeMonthlyAmount(i);
          const showMonthly = freq.id !== "monthly";
          // Each pay day, its own amount, its own tick. Received amounts that
          // differ from the expected one are shown per landing rather than
          // rolled up, because that is the whole reason to split them out.
          const subRows = multi && open ? landings.map(l => {
            const got = l.entry ? (Number(l.entry.amount) || 0) : 0;
            const differs = l.entry && Math.abs(got - l.amount) >= 0.01;
            return `
              <div class="inc-sub">
                <div>
                  <div class="inc-sub-label">${Util.esc(Util.fmtDateShort(l.date))}</div>
                  ${differs ? `<div class="meta">RECEIVED ${Util.esc(Util.fmtMoney(got, 2))}</div>` : ""}
                </div>
                <div class="inc-amt">${Util.esc(Util.fmtMoney(l.amount, 0))}</div>
                <button class="txn-check ${l.entry ? "checked" : ""}" data-action="inc-toggle" data-id="${Util.esc(i.id)}" data-idx="${l.index}" aria-label="RECEIVED ON ${Util.esc(Util.fmtDateShort(l.date))}" data-learn="MARK THIS ONE PAY DAY AS RECEIVED. EACH PAY DAY IS TRACKED SEPARATELY, SO TICKING THIS ONE LEAVES THE OTHERS ALONE. SAFE TO SPEND STOPS WAITING ON THIS PAYCHECK AND COUNTS IT AS MONEY YOU HAVE."></button>
              </div>`;
          }).join("") : "";
          return `
            <div class="inc-row">
              <div>
                <div class="inc-label">${Util.esc(i.label)}</div>
                <div class="meta" data-learn="HOW OFTEN THIS SOURCE PAYS, AND WHICH DAY OF THE MONTH IT LANDS. PAY DAY ORDERS THIS LIST AND DRIVES THE SAFE TO SPEND FORECAST.">${Util.esc(freq.label)}${day ? ` · DAY ${day}` : ""}${showMonthly ? ` · ${Util.esc(Util.fmtMoney(monthly, 0))}/MO` : ""}</div>
                ${showActual ? `<div class="meta">RECEIVED ${Util.esc(Util.fmtMoney(actual, 2))}</div>` : ""}
              </div>
              <div>
                <div class="inc-amt">${
                  (incExpEdit && incExpEdit.id === i.id)
                    ? `<input class="wiz-amt" id="inc-exp-input" data-action="inc-exp-input" data-id="${Util.esc(i.id)}" inputmode="decimal" value="${Util.esc(incExpEdit.value)}" aria-label="EXPECTED AMOUNT">`
                    : `<button class="link" style="padding:0;min-height:auto;text-decoration:none;border-bottom:1px solid rgba(26,58,140,0.4);font-size:15px;font-weight:400;letter-spacing:inherit;" data-action="inc-exp-edit" data-id="${Util.esc(i.id)}" data-learn="TAP TO CHANGE WHAT YOU EXPECT FROM THIS SOURCE. IT SAVES WHEN YOU PRESS ENTER OR TAP AWAY. IT ONLY MOVES THE EXPECTED FIGURE; IF THIS SOURCE IS ALREADY MARKED CLEARED, THE AMOUNT YOU ACTUALLY RECEIVED IS LEFT ALONE.">${Util.esc(Util.fmtMoney(expected, 0))}</button>`
                }</div>
                ${BudgetEngine.titheEnabled(s) ? `<button class="link" style="padding:0;min-height:auto;display:block;font-size:11px;opacity:0.75;text-align:right;" data-action="goto-tithe-bill" data-learn="THIS SOURCE'S SHARE OF YOUR TITHE, ON WHAT IT ADDS UP TO IN A MONTH. TAP TO SEE IT ON THE BILLS TAB, WHERE THE RATE IS EDITABLE.">(TITHE: ${Util.esc(Util.fmtMoney(monthly * BudgetEngine.tithePercent(s) / 100, 2))})</button>` : ""}
              </div>
              ${multi
                ? `<button class="inc-chev ${open ? "open" : ""}${clearedCount === landings.length ? " all-clear" : ""}" data-action="inc-expand" data-id="${Util.esc(i.id)}" aria-expanded="${open ? "true" : "false"}" aria-label="${clearedCount} OF ${landings.length} PAY DAYS CLEARED · ${open ? "COLLAPSE" : "EXPAND"}" data-learn="THIS SOURCE PAYS MORE THAN ONCE A MONTH, SO ONE CHECKBOX COULDN'T SAY WHICH PAYCHECK HAD ARRIVED. THE COUNT IS HOW MANY OF THIS MONTH'S PAY DAYS HAVE LANDED; OPEN IT FOR A ROW PER PAY DAY, EACH WITH ITS OWN TICK.">${clearedCount}/${landings.length} <span class="arrow">⌄</span></button>`
                : `<button class="txn-check ${entry ? "checked" : ""}" data-action="inc-toggle" data-id="${Util.esc(i.id)}" data-idx="0" aria-label="CLEARED" data-learn="MARK THIS INCOME AS RECEIVED FOR THIS MONTH. CHECKING IT RAISES SAFE TO SPEND BY THE AMOUNT MINUS YOUR TITHE PERCENTAGE. UNCHECKING UNDOES IT EXACTLY."></button>`}
            </div>
            ${subRows}
            <div style="margin-top:-4px;">
              <button class="link" style="padding:0;min-height:auto;font-size:11px;letter-spacing:0.14em;" data-action="edit-item" data-kind="income" data-id="${Util.esc(i.id)}" data-learn="EDIT THIS INCOME SOURCE'S NAME, EXPECTED AMOUNT, OR DUE DAY. IT'S THE SAME RECORD SETTINGS EDITS, SO CHANGES SHOW IN BOTH PLACES.">EDIT →</button>
            </div>
            ${editStates["income_" + i.id] ? renderEditForm("income", i) : ""}`;
        }).join("")
      : `<div class="meta">NO INCOME SOURCES YET · ADD ONE BELOW</div>`;

    const incomeSectionHtml = `
      <div class="section-label" style="margin-top:16px;" data-learn="LOG INCOME BLOCK. RECORD MONEY YOU ACTUALLY RECEIVED, OR TICK AN EXPECTED SOURCE BELOW AS CLEARED.">→ LOG INCOME</div>
      <div class="stack-24" style="margin-top:24px;">
        <div>
          <div class="sub-label">AMOUNT</div>
          <input class="underline big num-input" id="inc-amount" inputmode="decimal" placeholder="$0.00" value="${Util.esc(incomeForm.amount)}" data-learn="ENTER THE AMOUNT YOU ACTUALLY RECEIVED.">
        </div>
        ${incPersonChips}
        ${incBankChipsHtml}
        ${BudgetEngine.titheEnabled(s) ? `
        <div data-learn="WHETHER THIS MONEY COUNTS TOWARD YOUR TITHE. DEFAULTS TO YES; PICK NO FOR SOMETHING LIKE A GIFT OR REIMBURSEMENT YOU DON'T TITHE ON.">
          <div class="sub-label">TITHE?</div>
          <div class="chips">
            <button class="chip ${incomeForm.tithe !== "no" ? "active" : ""}" data-action="inc-pick-tithe" data-tithe="yes">YES</button>
            <button class="chip ${incomeForm.tithe === "no" ? "active" : ""}" data-action="inc-pick-tithe" data-tithe="no">NO</button>
          </div>
        </div>` : ""}
        <div>
          <div class="sub-label">NOTE</div>
          <input class="underline" id="inc-note" placeholder="WHERE DID IT COME FROM?" value="${Util.esc(incomeForm.note)}" maxlength="60" data-learn="WHERE THIS MONEY CAME FROM, LIKE 'BIRTHDAY GIFT' OR 'SIDE JOB'. THIS BECOMES THE LABEL ON THE ENTRY. YOUR SET-UP PAYCHECKS ARE TICKED OFF IN THE LIST BELOW INSTEAD.">
        </div>
        ${formErrors.income ? `<div class="text-danger meta">${Util.esc(formErrors.income)}</div>` : ""}
        <button class="cta" data-action="inc-log-it" data-learn="RECORD THIS MONEY AS RECEIVED. SAFE TO SPEND GOES UP BY THE AMOUNT MINUS YOUR TITHE PERCENTAGE.">→ LOG IT</button>
      </div>

      <div class="section-label" style="margin-top:32px;" data-learn="YOUR SET-UP INCOME SOURCES AND WHETHER EACH HAS ARRIVED THIS MONTH. ONLY CLEARED INCOME COUNTS TOWARD SAFE TO SPEND. EDITING OR ADDING HERE CHANGES THE SAME RECORDS SETTINGS USES.">→ EXPECTED</div>
      <div style="margin-top:16px;">
        <div class="inc-head">
          <div class="sub-label">SOURCE</div>
          <div class="sub-label">EXPECTED</div>
          <div class="sub-label">CLEARED?</div>
        </div>
        ${incExpectedRows}
        <div style="margin-top:12px;">
          ${addForms.income ? renderAddForm("income") : `<button class="link" data-action="show-add" data-kind="income" data-learn="ADD AN EXPECTED INCOME SOURCE. IT'S THE SAME LIST SETTINGS KEEPS, SO IT SHOWS UP IN BOTH PLACES.">* ADD INCOME →</button>`}
        </div>
        <div class="sub-label" style="margin-top:16px;">RECEIVED ${Util.esc(Util.fmtMoney(received, 0))} OF ${Util.esc(Util.fmtMoney(expectedIncome, 0))} EXPECTED</div>
        ${BudgetEngine.titheEnabled(s) ? `<div class="sub-label" style="margin-top:4px;">TITHED ${Util.esc(Util.fmtMoney(BudgetEngine.titheOnReceived(s), 0))} OF ${Util.esc(Util.fmtMoney(BudgetEngine.tithe(s), 0))}</div>` : ""}
      </div>`;

    return `
        <section class="section ${logSubTab === "income" ? "teal" : "gray"}">
          <div class="subtab-row" data-learn="SWITCH BETWEEN LOGGING A PURCHASE AND LOGGING INCOME YOU'VE RECEIVED. YOUR HALF-FILLED FORM IS KEPT WHEN YOU SWITCH.">
            <button class="subtab ${logSubTab === "purchase" ? "active" : ""}" data-action="log-subtab" data-sub="purchase" data-learn="LOG MONEY GOING OUT.">LOG A PURCHASE</button>
            <button class="subtab ${logSubTab === "income" ? "active" : ""}" data-action="log-subtab" data-sub="income" data-learn="LOG MONEY COMING IN, AND MARK YOUR EXPECTED INCOME AS RECEIVED.">LOG INCOME</button>
          </div>
          ${logSubTab === "income" ? incomeSectionHtml : `
          <div class="section-label" style="margin-top:16px;" data-learn="LOG A PURCHASE BLOCK. FILL IN AMOUNT, CHOOSE DEBIT OR CREDIT, AND HIT LOG IT. CATEGORY IS OPTIONAL.">→ LOG A PURCHASE</div>
          <div class="stack-24" style="margin-top:24px;">
            <div>
              <div class="sub-label">AMOUNT</div>
              <input class="underline big num-input" id="log-amount" inputmode="decimal" placeholder="$0.00" value="${Util.esc(logForm.amount)}" data-learn="ENTER THE PURCHASE AMOUNT IN DOLLARS. DECIMALS OPTIONAL.">
            </div>
            ${personChips}
            ${bankChipsHtml}
            <div>
              <div class="sub-label">PAYMENT</div>

  // Writes the whole income array back. s.income is an array, so this is a
  // read-modify-write of the entire list; arrayUnion is for transaction
  // appends only and would duplicate entries here.
  async function commitIncomeExpected(s) {
    if (!incExpEdit) return;
    const id = incExpEdit.id;
    const raw = String(incExpEdit.value == null ? "" : incExpEdit.value);
    incExpEdit = null;
    const src = (s.income || []).find(x => x.id === id);
    if (!src) { render(); return; }
    const parsed = parseFloat(raw.replace(/[^0-9.\-]/g, ""));
    const next = isFinite(parsed) ? Math.round(parsed * 100) / 100 : (Number(src.amount) || 0);
    if (next === (Number(src.amount) || 0)) { render(); return; }
    const arr = (s.income || []).map(x => x.id === id ? { ...x, amount: next } : x);
    try {
      // Only i.amount moves. incomeLog is untouched, so a source already marked
      // cleared keeps the exact figure that was actually received.
      await DataService.update({ income: arr });
    } catch (e) {
      formErrors.income = "COULDN'T SAVE; CHECK CONNECTION";
      console.warn(e);
    }
    render();
  }

  function bindLogEvents(s) {
    ensureScrollHintObserver("txn", '[data-scroll-key="txn-scroll"]');

    if (amt) amt.addEventListener("input", e => { logForm.amount = e.target.value; });
    const note = root.querySelector("#log-note");
    if (note) note.addEventListener("input", e => { logForm.note = e.target.value; });

    // ---- Log screen sub-tabs + LOG INCOME -------------------------------
    // Switching sub-tabs only changes local UI state; logForm is untouched so a
    // half-filled purchase survives the round trip.
    // (open-new-month-inline moved to bindLimeBlockEvents; the nudge that fires
    // it now renders in the shared lime block on every tab.)
    root.querySelectorAll("[data-action=log-subtab]").forEach(el => {

    });

    // ---- Inline edit of an expected-income amount ------------------------
    root.querySelectorAll("[data-action=inc-exp-edit]").forEach(el => {
      el.addEventListener("click", () => {

        render();

    });
    const expInput = root.querySelector("#inc-exp-input");
    if (expInput) {
      // Focus and select so the first keystroke replaces the old figure.

      expInput.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); commitIncomeExpected(s); }

      });
      // Tapping anywhere else commits, which is the whole point of an inline

  async function saveBulkCategoryEdits(s) {
    const ids = Object.keys(bulkSelection).filter(id => bulkSelection[id]);
    if (!ids.length || !bulkStagedCategoryId) return;
    const catId = bulkStagedCategoryId;
    const spending = s.spendingCategories || [];
    const bills = s.bills || [];
    const type = spending.some(c => c.id === catId) ? "spending" : (bills.some(b => b.id === catId) ? "bill" : "spending");
    const idSet = new Set(ids);
    const mapUpdates = {};
    const newTxns = (s.transactions || []).map(t => {
      if (!idSet.has(t.id)) return t;
      if (t.categoryType === "debt") return t; // safety: debt txns excluded upstream but re-guard here
      const key = t.merchantKey || ImportEngine.normalizeMerchantKey(ImportEngine.cleanDescription(t.note || ""));
      const updated = { ...t, categoryId: catId, categoryType: type };
      if (updated.needsCategory) delete updated.needsCategory;
      if (key) mapUpdates[key] = catId;
      return updated;
    });
    const patch = { transactions: newTxns };
    if (Object.keys(mapUpdates).length) patch.merchantMap = { ...(s.merchantMap || {}), ...mapUpdates };
    try {
      await DataService.update(patch);
      Object.keys(bulkSelection).forEach(k => delete bulkSelection[k]);
      bulkStagedCategoryId = null;
      bulkPickerOpen = false;
      bulkDeleteConfirmOpen = false;
      render();
    } catch (e) { alert("COULDN'T SAVE; CHECK CONNECTION"); console.warn(e); }
  }

  // Bulk delete. Mirrors deleteTxn(), including reversing any debt balance the
  // deleted rows had applied — applyDebtDelta is a no-op for non-debt rows, and
  // debt rows can't be checked today, but chaining it keeps the two delete paths
  // behaving identically if that ever changes.
  async function deleteBulkTxns(s) {
    const ids = Object.keys(bulkSelection).filter(id => bulkSelection[id]);
    if (!ids.length) return;
    const idSet = new Set(ids);
    const removed = (s.transactions || []).filter(t => idSet.has(t.id));
    if (!removed.length) return;
    let debts = s.debts;
    removed.forEach(t => { debts = applyDebtDelta(debts, t, null); });
    const patch = {
      transactions: (s.transactions || []).filter(t => !idSet.has(t.id)),
      debts: debts
    };
    try {
      await DataService.update(patch);
      removed.forEach(t => closeTxnEditor(t.id));
      Object.keys(bulkSelection).forEach(k => delete bulkSelection[k]);
      bulkStagedCategoryId = null;
      bulkPickerOpen = false;
      bulkDeleteConfirmOpen = false;
      render();
    } catch (e) { alert("COULDN'T DELETE; CHECK CONNECTION"); console.warn(e); }
  }

  async function clearAllTransactions(s) {
    try {
      await DataService.update({ transactions: [] });
      clearLogConfirmOpen = false;
      Object.keys(bulkSelection).forEach(k => delete bulkSelection[k]);
      bulkStagedCategoryId = null;
      bulkPickerOpen = false;
      bulkDeleteConfirmOpen = false;
      render();
    } catch (e) { alert("COULDN'T CLEAR; CHECK CONNECTION"); console.warn(e); }
  }

  // Render a single transaction row plus (optionally) its inline editor / delete confirm.
  function renderTxnRow(s, t, catLookup) {
    // Clean at render time so legacy rows (imported before V11 or manually
    // typed with a copy/pasted prefix) also read cleanly.
    const cleanedNote = ImportEngine.cleanDescription(t.note || "");
    const displayNote = cleanedNote || t.note || "";
    const catLabel = catLookup[t.categoryId] || "";
    const needsCat = !!t.needsCategory || (t.source === "import" && !t.categoryId);
    const isDebtTxn = t.categoryType === "debt";
    let tag;
    if (needsCat) {
      tag = "ASSIGN";
    } else if (t.paymentType === "credit") {
      const cl = cardLabelFor(s, t.cardId);
      tag = cl ? cl : "CREDIT";
    } else if (t.bankId) {
      // Mirrors the credit path: show which account it came from when picked.
      const bl = bankLabelFor(s, t.bankId);
      tag = bl ? bl : "DEBIT";
    } else if (t.person && t.person !== "JOINT") {
      tag = t.person;
    } else {
      tag = "DEBIT";
    }
    const edit = txnEdits[t.id];
    const expanded = !!edit;
    const err = formErrors["txn_" + t.id];
    const selected = !!bulkSelection[t.id];
    const staged = bulkStagedCategoryId && selected;
    const stagedCatLabel = staged ? (catLookup[bulkStagedCategoryId] || "") : "";
    const chkClass = "txn-check" + (selected ? " checked" : "") + (isDebtTxn ? " disabled" : "");
    const chkLearn = isDebtTxn
      ? "DEBT PAYMENTS CAN'T BE BULK-EDITED. RE-CATEGORIZING THEM REQUIRES BALANCE RECONCILIATION."
      : "CHECK ROWS TO BULK-EDIT THEIR CATEGORY. A CONTROL BAR APPEARS ABOVE THE LIST WHEN ONE OR MORE ARE CHECKED.";
    const row = `
      <div class="txn-row ${expanded ? 'expanded' : ''} ${needsCat ? 'needs-category' : ''} ${selected ? 'selected' : ''}"
           data-action="toggle-txn" data-id="${Util.esc(t.id)}"
           data-learn="TAP TO EDIT AMOUNT, CATEGORY, PAYMENT METHOD, OR NOTE. TAP AGAIN TO CLOSE. THE × BUTTON INSIDE DELETES THE TRANSACTION.">
        <button class="${chkClass}" data-action="bulk-toggle" data-id="${Util.esc(t.id)}" ${isDebtTxn ? "disabled" : ""} aria-label="SELECT" data-learn="${Util.esc(chkLearn)}"></button>
        <div class="txn-date">${Util.esc(Util.fmtDateShort(t.date))}</div>
        <div class="txn-note">
          ${Util.esc(displayNote || catLabel)}
          <span class="txn-tag ${needsCat ? 'needs' : ''}" data-learn="${Util.esc(needsCat ? "THIS IMPORTED TRANSACTION HAS NO CATEGORY YET. TAP THE ROW TO PICK ONE; DASHBOARD BARS AND SAFE TO SPEND WILL UPDATE ONCE ASSIGNED." : (t.paymentType === "credit" ? "PAID WITH CREDIT. IF A CARD IS LINKED THE CARD LABEL SHOWS HERE INSTEAD OF 'CREDIT'." : "PAID WITH PAID FROM CHECKING. IN COUPLE MODE THIS TAG SHOWS WHO PAID."))}">${Util.esc(tag)}</span>
        </div>
        <div class="txn-cat ${staged ? 'staged' : ''}">${Util.esc(staged ? stagedCatLabel : catLabel)}</div>
        <div class="txn-amt">-${Util.esc(Util.fmtMoney(Number(t.amount)||0, 2))}</div>
      </div>`;
    if (!expanded) return row;
    return row + renderTxnEditor(s, t, edit, err);
  }

  function renderTxnEditor(s, t, edit, err) {
    const f = edit.form;
    const isCouple = s.settings && s.settings.mode === "couple";
    const cards = s.creditCards || [];

    // A debt payment has no category to choose: the category IS the debt it was
    // paid against. So the picker is dropped for those rows and replaced with a
    // line naming the debt, rather than left out silently — a missing field
    // reads as a bug. Re-pointing a payment at a different debt isn't offered
    // here; the bulk editor already refuses debt rows for the same reason, and
    // delete-and-re-log is the clean correction.
    const isDebtTxn = t.categoryType === "debt";
    const debtLabel = isDebtTxn
      ? (((s.debts || []).find(d => d.id === t.categoryId) || {}).label || "DEBT")
      : "";

    // For every other txn the editor's picker mirrors the log form: spending +
    // bills only.
    const chips = [];
    if (!isDebtTxn) {
      (s.spendingCategories||[]).forEach(c => chips.push({ id: c.id, label: c.label, type: "spending" }));
      (s.bills||[]).forEach(b => chips.push({ id: b.id, label: b.label, type: "bill" }));
    }
    const chipsHtml = chips.map(c => {
      const cls = "chip " + (f.categoryId === c.id ? "active " : "") +
        (c.type === "bill" ? "bill-chip " : "");
      return `<button class="${cls}" data-action="txn-edit-cat" data-txn="${Util.esc(t.id)}" data-id="${Util.esc(c.id)}" data-type="${c.type}">${Util.esc(c.label)}</button>`;
    }).join("");

    const categoryFieldHtml = isDebtTxn
      ? `<div class="field"><label>PAID TOWARD</label><div class="meta" style="padding:6px 0;">${Util.esc(debtLabel)}</div></div>`
      : `<div class="field"><label>CATEGORY</label><div class="chips" style="margin-top:4px;" data-scroll-key="txn-edit-cat-${Util.esc(t.id)}">${chipsHtml}</div></div>`;

    // Card row lives inside .field for the same min-width:0 cascade the CATEGORY
    // row gets. Prior to V9 this was a plain <div> — reproduced the iOS overflow
    // when a credit txn had 4+ cards and 10+ categories.
    // Debt payments are debit-only, matching the LOG PAYMENT form. Leaving the
    // toggle here let a card-linked debt be marked as paid with its own card:
    // the balance dropped while that same card's unpaid credit rose, so no money
    // moved yet Safe to Spend fell. Neither control is offered for those rows,
    // and saveTxnEdit pins them to cash regardless.
    const payFieldHtml = isDebtTxn ? "" : `
        <div class="field"><label>PAYMENT</label>
          <div class="toggle-row">
            <button class="toggle ${f.paymentType==='cash'?'active':''}" data-action="txn-edit-pay" data-txn="${Util.esc(t.id)}" data-pay="cash">DEBIT</button>
            <button class="toggle ${f.paymentType==='credit'?'active':''}" data-action="txn-edit-pay" data-txn="${Util.esc(t.id)}" data-pay="credit">CREDIT</button>
          </div>
        </div>`;

    const cardChipsHtml = (!isDebtTxn && f.paymentType === "credit") ? `
      <div class="field">
        <label>WHICH CARD</label>
        ${cards.length ? `
          <div class="chips" data-scroll-key="txn-edit-card-${Util.esc(t.id)}">
            ${cards.map(c => `<button class="chip ${f.cardId===c.id?'active':''}" data-action="txn-edit-card" data-txn="${Util.esc(t.id)}" data-id="${Util.esc(c.id)}">${Util.esc(c.label)}</button>`).join("")}
            ${f.cardId ? `<button class="chip" data-action="txn-edit-card" data-txn="${Util.esc(t.id)}" data-id="">× NONE</button>` : ""}
          </div>
        ` : `<div class="meta">NO CARDS; ADD THEM IN SETTINGS</div>`}
      </div>` : "";

    const personChips = isCouple ? `
      <div class="field">
        <label>WHO PAID</label>
        <div class="chips" data-scroll-key="txn-edit-person-${Util.esc(t.id)}">
          ${[s.settings.names[0], s.settings.names[1], "JOINT"].map(p => {
            const val = p.toUpperCase();
            return `<button class="chip ${f.person===val?'active':''}" data-action="txn-edit-person" data-txn="${Util.esc(t.id)}" data-person="${Util.esc(val)}">${Util.esc(p)}</button>`;
          }).join("")}
        </div>
      </div>` : "";

    const confirmHtml = edit.deleteConfirm ? `
      <div class="txn-confirm">
        <span>DELETE?</span>
        <button data-action="txn-delete-cancel" data-txn="${Util.esc(t.id)}">NO</button>
        <button class="yes" data-action="txn-delete-yes" data-txn="${Util.esc(t.id)}">YES</button>
      </div>` : `
      <div class="txn-actions">
        <button data-action="txn-close" data-txn="${Util.esc(t.id)}">× CLOSE</button>
        <button class="del-btn" data-action="txn-delete-ask" data-txn="${Util.esc(t.id)}">× DELETE</button>
      </div>`;

    return `
      <div class="inline-form">
        <div class="sub-label">EDIT TRANSACTION</div>
        <div class="field"><label>AMOUNT</label><input data-action="txn-edit-field" data-txn="${Util.esc(t.id)}" data-field="amount" value="${Util.esc(f.amount)}" inputmode="decimal"></div>
        ${categoryFieldHtml}
        ${payFieldHtml}
        ${cardChipsHtml}
        ${personChips}
        <div class="field"><label>NOTE</label><input data-action="txn-edit-field" data-txn="${Util.esc(t.id)}" data-field="note" value="${Util.esc(f.note)}" maxlength="60"></div>
        ${err ? `<div class="text-danger meta">${Util.esc(err)}</div>` : ""}
        <div class="row-actions">
          <button class="cta ghost" data-action="txn-close" data-txn="${Util.esc(t.id)}">× CANCEL</button>
          <button class="cta" data-action="txn-save" data-txn="${Util.esc(t.id)}">→ SAVE</button>
        </div>
        ${confirmHtml}
      </div>`;
  }

  function findTxn(s, id) { return (s.transactions||[]).find(x => x.id === id); }

  function openTxnEditor(s, id) {
    const t = findTxn(s, id);
    if (!t) return;
    txnEdits[id] = {
      form: {
        amount: String(Number(t.amount) || 0),
        categoryId: t.categoryId || null,
        categoryType: t.categoryType || null,
        paymentType: t.paymentType || "cash",
        person: t.person || "JOINT",
        note: t.note || "",
        cardId: t.cardId || null
      },
      deleteConfirm: false
    };
    formErrors["txn_" + id] = "";
  }

  function closeTxnEditor(id) {
    delete txnEdits[id];
    delete formErrors["txn_" + id];
  }

  function bindTxnRowEvents(s) {
    root.querySelectorAll("[data-action=toggle-txn]").forEach(el => {
      el.addEventListener("click", (e) => {
        // Ignore clicks that already targeted a button inside an expanded editor.
        if (e.target !== el && e.target.closest("button,input")) return;
        const id = el.dataset.id;
        if (txnEdits[id]) closeTxnEditor(id); else openTxnEditor(s, id);
        render();
      });
    });
    root.querySelectorAll("[data-action=txn-close]").forEach(el => {
      el.addEventListener("click", (e) => { e.stopPropagation(); closeTxnEditor(el.dataset.txn); render(); });
    });
    root.querySelectorAll("[data-action=txn-edit-field]").forEach(el => {
      el.addEventListener("input", (e) => {
        e.stopPropagation();
        const ed = txnEdits[el.dataset.txn]; if (!ed) return;
        ed.form[el.dataset.field] = e.target.value;
      });
      el.addEventListener("click", e => e.stopPropagation());
    });
    root.querySelectorAll("[data-action=txn-edit-cat]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const ed = txnEdits[el.dataset.txn]; if (!ed) return;
        ed.form.categoryId = el.dataset.id;
        ed.form.categoryType = el.dataset.type;
        render();
      });
    });
    root.querySelectorAll("[data-action=txn-edit-pay]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const ed = txnEdits[el.dataset.txn]; if (!ed) return;
        ed.form.paymentType = el.dataset.pay;
        if (ed.form.paymentType !== "credit") ed.form.cardId = null;
        render();
      });
    });
    root.querySelectorAll("[data-action=txn-edit-card]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const ed = txnEdits[el.dataset.txn]; if (!ed) return;
        ed.form.cardId = el.dataset.id || null;
        render();
      });
    });
    root.querySelectorAll("[data-action=txn-edit-person]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const ed = txnEdits[el.dataset.txn]; if (!ed) return;
        ed.form.person = el.dataset.person;
        render();
      });
    });
    root.querySelectorAll("[data-action=txn-save]").forEach(el => {
      el.addEventListener("click", (e) => { e.stopPropagation(); saveTxnEdit(s, el.dataset.txn); });
    });
    root.querySelectorAll("[data-action=txn-delete-ask]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const ed = txnEdits[el.dataset.txn]; if (!ed) return;
        ed.deleteConfirm = true;
        render();
      });
    });
    root.querySelectorAll("[data-action=txn-delete-cancel]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const ed = txnEdits[el.dataset.txn]; if (!ed) return;
        ed.deleteConfirm = false;
        render();
      });
    });
    root.querySelectorAll("[data-action=txn-delete-yes]").forEach(el => {
      el.addEventListener("click", (e) => { e.stopPropagation(); deleteTxn(s, el.dataset.txn); });
    });
  }

  async function saveTxnEdit(s, id) {
    const ed = txnEdits[id];
    const old = findTxn(s, id);
    if (!ed || !old) return;
    formErrors["txn_" + id] = "";
    const amount = parseFloat(ed.form.amount);
    if (!isFinite(amount) || amount <= 0) {
      formErrors["txn_" + id] = "ENTER A VALID AMOUNT"; render(); return;
    }
    // Same rule as the log form: no category is not an error, it's Misc.
    let miscPatch = {};
    let edCategoryId = ed.form.categoryId;
    let edCategoryType = ed.form.categoryType;
    if (!edCategoryId) {
      const m = ensureMiscCategory(s);
      edCategoryId = m.cat.id;
      edCategoryType = "spending";
      miscPatch = m.patch;
    }
    const isCouple = s.settings && s.settings.mode === "couple";
    const person = isCouple ? ed.form.person : (s.settings.names[0] || "ME").toUpperCase();
    // Debt payments are debit-only. Pinned here rather than trusted from the
    // form so a record saved as credit under an older build is corrected the
    // next time it's opened and saved.
    const isDebtTxn = edCategoryType === "debt";
    const paymentType = isDebtTxn ? "cash" : ed.form.paymentType;
    const updated = {
      ...old,
      amount: Math.round(amount * 100) / 100,
      categoryId: edCategoryId,
      categoryType: edCategoryType,
      paymentType: paymentType,
      person: person,
      note: (ed.form.note || "").toUpperCase().slice(0, 60),
      cardId: paymentType === "credit" ? (ed.form.cardId || null) : null,
      source: old.source || "manual"
    };
    // Assigning a category to a previously-import-with-no-category txn:
    // clear the flag and also update merchantMap so future imports learn from it.
    if (updated.categoryId) delete updated.needsCategory;
    const patch = {
      transactions: (s.transactions||[]).map(x => x.id === id ? updated : x),
      debts: applyDebtDelta(s.debts, old, updated),
      ...miscPatch
    };
    if (updated.categoryId && old.source === "import" && (old.needsCategory || !old.categoryId)) {
      const key = old.merchantKey || ImportEngine.normalizeMerchantKey(old.note || updated.note || "");
      if (key) patch.merchantMap = { ...(s.merchantMap || {}), [key]: updated.categoryId };
    }
    // Filing a transaction under a bill is the clearest statement there is that
    // this payment IS that bill, so treat it as one: mark the bill paid for the
    // month the payment lands in, linked to this transaction so the balance
    // counts it once, and teach billMap so the next import matches it without
    // asking. This is the same learning the import review does, reached from
    // the transaction instead of from the statement.
    if (edCategoryType === "bill") {
      const targetBill = (s.bills || []).find(b => b.id === edCategoryId);
      if (targetBill) {
        const monthYM = String(updated.date || "").slice(0, 7) || s.currentMonth;
        const allPaid = { ...(s.billsPaid || {}) };
        const forMonth = { ...(allPaid[monthYM] || {}) };
        const existing = forMonth[targetBill.id];
        // Don't stomp a record that already points at a different payment.
        if (!existing || !existing.paid || existing.txnId === updated.id || !existing.txnId) {
          forMonth[targetBill.id] = {
            paid: true,
            paidDate: updated.date || Util.todayISO(),
            amount: Math.round((Number(updated.amount) || 0) * 100) / 100,
            createdAt: (existing && existing.createdAt) || Date.now(),
            source: "manual",
            txnId: updated.id
          };
          allPaid[monthYM] = forMonth;
          patch.billsPaid = allPaid;
        }
        const bkey = old.merchantKey || ImportEngine.normalizeMerchantKey(old.note || updated.note || "");
        if (bkey) patch.billMap = { ...(s.billMap || {}), [bkey]: targetBill.id };
      }
    }
    try {
      await DataService.update(patch);
      closeTxnEditor(id);
      render();
    } catch (err) { alert("COULDN'T SAVE; CHECK CONNECTION"); console.warn(err); }
  }

  async function deleteTxn(s, id) {
    const old = findTxn(s, id);
    if (!old) return;
    const patch = {
      transactions: (s.transactions||[]).filter(x => x.id !== id),
      debts: applyDebtDelta(s.debts, old, null)
    };
    try {
      await DataService.update(patch);
      closeTxnEditor(id);
      render();
    } catch (err) { alert("COULDN'T DELETE; CHECK CONNECTION"); console.warn(err); }
  }

  // Record money actually received. Appends with arrayUnion for the same reason
  // transactions do: two phones logging at once must not clobber each other.
  async function submitIncome(s) {
    formErrors.income = "";
    const amount = parseFloat(incomeForm.amount);
    if (!isFinite(amount) || amount <= 0) {
      formErrors.income = "ENTER A VALID AMOUNT";
      render();
      return;
    }
    // This form is for one-off income only. Set-up paychecks are cleared by
    // ticking them in the expected-income list, so there's no source picker
    // here; the note doubles as the entry's label.
    const note = (incomeForm.note || "").trim();
    const isCouple = s.settings && s.settings.mode === "couple";
    const person = isCouple ? incomeForm.person : (s.settings.names[0] || "ME").toUpperCase();
    const date = Util.todayISO();
    const entry = {
      id: Util.uuid(),
      incomeId: null,
      label: (note || "INCOME").toUpperCase().slice(0, 60),
      amount: Math.round(amount * 100) / 100,
      date: date,
      month: date.slice(0, 7),
      person: person,
      note: note.toUpperCase().slice(0, 60),
      bankId: incomeForm.bankId || null,
      tithe: incomeForm.tithe !== "no",
      createdAt: Date.now(),
      source: "manual"
    };
    try {
      await DataService.update({ incomeLog: DataService.appendTxns(entry) });
      incomeForm.amount = "";
      incomeForm.note = "";
      incomeForm.tithe = "yes";
      formErrors.income = "";
      render();
    } catch (e) { alert("COULDN'T SAVE; CHECK CONNECTION"); console.warn(e); }
  }

  // Checkbox on the expected-income list. One pay day at a time: `landingIndex`
  // says which of this month's landings for the source is being ticked, so a
  // fortnightly earner can clear the first paycheck and leave the second
  // standing. Checking creates an entry tagged with that slot; unchecking
  // removes exactly the entry occupying it, whether it was ticked here, typed
  // into LOG INCOME, or imported.
  async function toggleIncomeCleared(s, incomeId, landingIndex) {
    const src = (s.income || []).find(i => i.id === incomeId);
    if (!src) return;
    const log = s.incomeLog || [];
    const idx = Number.isFinite(landingIndex) ? landingIndex : 0;
    const slots = BudgetEngine.landingsForMonth(s, src, s.currentMonth);
    const slot = slots[idx] || slots[0] || null;
    const existing = slot ? slot.entry : null;
    try {
      if (existing) {
        // By identity, not by source: the other pay days this month have their
        // own entries and must survive. Falls back to object identity for any
        // entry old enough not to carry an id.
        await DataService.update({
          incomeLog: log.filter(e => existing.id ? (e && e.id !== existing.id) : e !== existing)
        });
      } else {
        const isCouple = s.settings && s.settings.mode === "couple";
        // The landing's own pay day, not today, when it has already been and
        // gone. The date decides whether the money is treated as arriving
        // after your last confirmed balance, and a paycheck from the 1st
        // ticked on the 22nd is already inside a balance confirmed since.
        const today = Util.todayISO();
        const date = slot && slot.date < today ? slot.date : today;
        const entry = {
          id: Util.uuid(),
          incomeId: incomeId,
          landingIndex: idx,
          label: (src.label || "").toUpperCase().slice(0, 60),
          amount: Math.round((slot ? slot.amount : Number(src.amount) || 0) * 100) / 100,
          date: date,
          month: s.currentMonth,
          person: isCouple ? "JOINT" : (s.settings.names[0] || "ME").toUpperCase(),
          note: "",
          tithe: true,
          createdAt: Date.now(),
          source: "manual"
        };
        await DataService.update({ incomeLog: DataService.appendTxns(entry) });
        // Only on the way in, and only if the month hasn't been muted: money
        // just landed, so this is the moment to decide what to do with it.
        // Untickng a paycheck is a correction and asks nothing.
        if (!paydayMuted(s.currentMonth)) {
          render();
          openPaydayForm(DataService.get() || s, incomeId, idx);
          return;
        }
      }
      render();
    } catch (e) { alert("COULDN'T SAVE; CHECK CONNECTION"); console.warn(e); }
  }

  function renderReceiptScan(s) {
    const f = receiptScan;
    if (!f) return "";
    const ios = isIOSDevice();
    const err = f.error ? `<div class="text-danger meta" style="margin-top:8px;">${Util.esc(f.error)}</div>` : "";

    if (f.step === "review" && f.parsed) {
      const p = f.parsed;
      const m = f.match;
      const matchHtml = (m && !f.matchDismissed) ? `
        <div class="text-danger meta" style="margin-top:12px;">
          ${m.tier === "exact" ? "ALREADY LOGGED" : "LOOKS LIKE ONE YOU ALREADY LOGGED"}:
          ${Util.esc(Util.fmtMoney(Number(m.txn.amount) || 0, 2))} ON ${Util.esc(Util.fmtDateShort(m.txn.date))}${m.txn.note ? " · " + Util.esc(m.txn.note) : ""}
        </div>
        <div class="meta" style="margin-top:4px;">SAVING THIS WOULD COUNT THE PURCHASE TWICE.</div>
        <div class="row-actions">
          <button class="cta ghost" data-action="receipt-cancel">× DON'T LOG IT</button>
          <button class="cta" data-action="receipt-dupe-ok">→ LOG IT ANYWAY</button>
        </div>` : "";
      return `
        <div class="inline-form">
          <div class="sub-label">CHECK WHAT IT READ</div>
          <div class="field"><label>TOTAL</label><input data-action="receipt-field" data-field="amount" value="${Util.esc(p.amount)}" inputmode="decimal" placeholder="0.00"></div>
          <div class="field"><label>DATE${p.dateFound ? "" : " (NOT FOUND; USING TODAY)"}</label><input type="date" data-action="receipt-field" data-field="date" value="${Util.esc(p.date)}"></div>
          <div class="field"><label>SHOP</label><input data-action="receipt-field" data-field="merchant" value="${Util.esc(p.merchant)}" maxlength="60" placeholder="OPTIONAL"></div>
          <div class="meta">CORRECT ANYTHING THAT'S WRONG. YOU'LL STILL PICK THE CATEGORY AND PAYMENT METHOD ABOVE BEFORE IT SAVES.</div>
          ${err}
          ${matchHtml}
          ${(m && !f.matchDismissed) ? "" : `
            <div class="row-actions">
              <button class="cta ghost" data-action="receipt-back">← BACK TO TEXT</button>
              <button class="cta" data-action="receipt-use">→ USE THESE DETAILS</button>
            </div>`}
        </div>`;
    }

    const busyHtml = f.busy ? `
      <div class="meta" style="margin-top:8px;">READING THE PHOTO${f.progress ? " · " + f.progress + "%" : ""}... THIS CAN TAKE A FEW SECONDS.</div>` : "";

    return `
      <div class="inline-form">
        <div class="sub-label">SCAN A RECEIPT</div>
        ${ios ? `
          <div class="meta">LONG-PRESS IN THE BOX BELOW AND CHOOSE <strong>SCAN TEXT</strong>, THEN POINT YOUR CAMERA AT THE RECEIPT. THAT USES THE SCANNER BUILT INTO YOUR IPHONE, SO THE RECEIPT NEVER LEAVES YOUR PHONE.</div>
        ` : `
          <div class="meta">PASTE OR TYPE THE RECEIPT TEXT BELOW, OR TAKE A PHOTO AND LET THE APP READ IT.</div>
        `}
        <div class="field" style="margin-top:8px;">
          <label>RECEIPT TEXT</label>
          <textarea data-action="receipt-text" rows="5" style="width:100%;background:transparent;border:1px solid rgba(26,58,140,0.35);color:var(--cobalt);font:inherit;font-size:16px;padding:8px;" placeholder="${ios ? "LONG-PRESS HERE → SCAN TEXT" : "RECEIPT TEXT"}">${Util.esc(f.text || "")}</textarea>
        </div>
        <label class="link" style="display:inline-block;margin-top:4px;">
          ${ios ? "⊕ OR TAKE A PHOTO INSTEAD" : "⊕ TAKE A PHOTO"}
          <input type="file" accept="image/*" capture="environment" data-action="receipt-photo" style="display:none;">
        </label>
        ${ios ? `<div class="meta" style="margin-top:4px;opacity:0.75;">THE PHOTO READER IS LESS ACCURATE THAN SCAN TEXT; USE IT ONLY IF SCAN TEXT ISN'T IN YOUR MENU.</div>` : ""}
        ${busyHtml}
        ${err}
        <div class="row-actions">
          <button class="cta ghost" data-action="receipt-cancel">× CANCEL</button>
          <button class="cta" data-action="receipt-read"${f.busy ? " disabled" : ""}>→ READ IT</button>
        </div>
      </div>`;
  }

  /* ------------- RECEIPT SCAN ------------- */
  // Two ways in, because no web page can open a text scanner by itself:
  //
  //  1. iOS/iPadOS: the OS scanner (Live Text). Long-press the box, choose Scan
  //     Text, point at the receipt. Apple's recognition is far better than
  //     anything shippable here, it runs on the device, and it costs nothing.
  //     We can't trigger it from script, so the panel points at it instead.
  //  2. Anywhere else: a photo through tesseract.js, fetched only when actually
  //     used so nobody pays the download for a feature they never touch.
  //
  // Either way the text lands in the same box and is parsed by the same code,
  // and nothing is saved until it's been shown for checking.
  const TESSERACT_SRC = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
  let tesseractLoad = null;

  // Opens the messaging app with the invite already written; the recipient is
  // left blank on purpose, since that's the one thing only the user can fill in.
  // Shared by the setup code screen and the Settings household row.
  //
  // The separator differs by platform and getting it wrong opens an empty
  // message: iOS wants sms:&body=, everything else sms:?body=. The raw code is
  // sent rather than the dashed display form, matching SHARE, so nobody has to
  // guess whether the dashes are part of it — and the link goes along because a
  // code on its own doesn't say where to enter it.
  function textHouseholdCode(code) {
    const link = location.origin + location.pathname;
    const body = "Join our CLEAR budget. Household code: " + code
      + "\nOpen " + link + " on your phone, tap JOIN, and enter the code.";
    window.location.href = "sms:" + (isIOSDevice() ? "&" : "?") + "body=" + encodeURIComponent(body);
  }

  function isIOSDevice() {
    const ua = navigator.userAgent || "";
    // iPadOS 13+ reports itself as Macintosh; touch points disambiguate.
    return /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1);
  }

  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (tesseractLoad) return tesseractLoad;
    tesseractLoad = new Promise((resolve, reject) => {
      const sc = document.createElement("script");
      sc.src = TESSERACT_SRC;
      sc.onload = () => window.Tesseract ? resolve(window.Tesseract) : reject(new Error("READER DIDN'T LOAD"));
      sc.onerror = () => { tesseractLoad = null; reject(new Error("COULDN'T DOWNLOAD THE READER; CHECK CONNECTION")); };
      document.head.appendChild(sc);
    });
    return tesseractLoad;
  }

  // Pull the three fields worth having off a receipt. Deliberately built on the
  // import engine's own primitives: findAmounts already knows that a bare
  // integer is a store id and not money, and parseDate already handles every
  // format a receipt is likely to print.
  function parseReceiptText(raw) {
    const lines = String(raw == null ? "" : raw).split(/\r?\n/)
      .map(l => l.trim()).filter(Boolean);

    // Merchant: receipts put the name at the top. Take the first line carrying
    // real words rather than a phone number or an address of digits.
    let merchant = "";
    for (const l of lines) {
      if ((l.match(/[A-Za-z]/g) || []).length >= 3) { merchant = l; break; }
    }

    let date = null;
    for (const l of lines) {
      const hit = ImportEngine.findDate(l);
      if (hit && hit.iso) { date = hit.iso; break; }
    }

    // Total: the last line that says TOTAL and carries money. Subtotals, item
    // counts and savings lines all say "total" too, so they're excluded.
    const isTotalLine = (l) =>
      /\btotals?\b/i.test(l) &&
      !/\bsub[\s-]?total\b/i.test(l) &&
      !/\btotal\s+(items?|qty|quantity|savings?|discounts?|tax)\b/i.test(l);
    let amount = null;
    for (let i = lines.length - 1; i >= 0 && amount == null; i--) {
      if (!isTotalLine(lines[i])) continue;
      const amts = ImportEngine.findAmounts(lines[i]) || [];
      if (amts.length) amount = amts[amts.length - 1].value;
    }
    // No TOTAL line found — fall back to the largest amount on the receipt,
    // which is the total far more often than not.
    if (amount == null) {
      lines.forEach(l => (ImportEngine.findAmounts(l) || []).forEach(a => {
        if (amount == null || a.value > amount) amount = a.value;
      }));
    }

    return {
      amount: amount == null ? null : Math.abs(amount),
      date: date,
      merchant: ImportEngine.cleanDescription(merchant).toUpperCase().slice(0, 60)
    };
  }

  // Same duplicate detection the spreadsheet and paste imports run, so a receipt
  // for something already logged is caught by the same rules. The one deliberate
  // difference: the bulk import skips a match silently, whereas here it's shown
  // and the choice is yours.
  function findReceiptMatch(cand, txns) {
    const fz = ImportEngine.findFuzzyMatch(cand, txns);
    if (fz) return { txn: fz, tier: "fuzzy" };
    if (!ImportEngine.isExactDupe(cand, txns)) return null;
    // isExactDupe only reports that one exists; find it so it can be shown.
    const nd = ImportEngine.normalizeDescForCompare(cand.description);
    const amt = Math.round(Math.abs(Number(cand.amount) || 0) * 100);
    const hit = (txns || []).find(t => t.date === cand.date
      && Math.round(Math.abs(Number(t.amount) || 0) * 100) === amt
      && ImportEngine.normalizeDescForCompare(t.note || "") === nd);
    return hit ? { txn: hit, tier: "exact" } : null;
  }

  function receiptReadText(s) {
    if (!receiptScan) return;
    const text = String(receiptScan.text || "").trim();
    if (!text) { receiptScan.error = "NOTHING TO READ YET"; render(); return; }
    const parsed = parseReceiptText(text);
    if (parsed.amount == null) {
      receiptScan.error = "COULDN'T FIND A TOTAL. CHECK THE TEXT, OR TYPE THE AMOUNT IN YOURSELF AFTER TAPPING USE THESE DETAILS.";
    } else {
      receiptScan.error = "";
    }
    receiptScan.parsed = {
      amount: parsed.amount == null ? "" : String(parsed.amount.toFixed(2)),
      date: parsed.date || Util.todayISO(),
      merchant: parsed.merchant || "",
      dateFound: !!parsed.date
    };
    receiptScan.match = findReceiptMatch(
      { date: receiptScan.parsed.date, amount: parsed.amount || 0, description: parsed.merchant || "" },
      s.transactions || []
    );
    receiptScan.matchDismissed = false;
    receiptScan.step = "review";
    render();
  }

  async function receiptRunOcr(s, file) {
    if (!receiptScan || !file) return;
    receiptScan.busy = true; receiptScan.progress = 0; receiptScan.error = "";
    render();
    try {
      const T = await loadTesseract();
      const res = await T.recognize(file, "eng", {
        logger: (m) => {
          if (!receiptScan || !m || m.status !== "recognizing text") return;
          const pct = Math.round((m.progress || 0) * 100);
          if (pct !== receiptScan.progress) { receiptScan.progress = pct; render(); }
        }
      });
      if (!receiptScan) return;
      receiptScan.text = (res && res.data && res.data.text) || "";
      receiptScan.busy = false;
      if (!receiptScan.text.trim()) {
        receiptScan.error = "COULDN'T READ ANYTHING FROM THAT PHOTO. TRY AGAIN IN BETTER LIGHT, OR TYPE THE TOTAL IN YOURSELF.";
        render();
        return;
      }
      receiptReadText(s);
    } catch (err) {
      console.warn(err);
      if (!receiptScan) return;
      receiptScan.busy = false;
      receiptScan.error = (err && err.message) || "COULDN'T READ THAT PHOTO";
      render();
    }
  }

  // Hand the checked details to the normal purchase form. Category, payment
  // method and card/bank are still picked there, so a scanned purchase goes
  // through exactly the same save path — and the same rules — as a typed one.
  function receiptUseDetails() {
    if (!receiptScan || !receiptScan.parsed) return;
    const p = receiptScan.parsed;
    const amt = parseFloat(p.amount);
    if (!isFinite(amt) || amt <= 0) { receiptScan.error = "ENTER A VALID AMOUNT"; render(); return; }
    logForm.amount = String(amt);
    logForm.note = String(p.merchant || "").toUpperCase().slice(0, 60);
    logForm.date = /^\d{4}-\d{2}-\d{2}$/.test(p.date) ? p.date : null;
    receiptScan = null;
    render();
  }

  // Catch-all for anything logged without a category. Picking one is no longer
  // a gate on logging: a transaction that never gets recorded is worse for
  // accuracy than one filed under Misc, and Safe To Spend now moves with real
  // spending, so blocking the form would mean blocking the balance too.
  // Reuses the existing Misc category when there is one rather than breeding
  // duplicates. Returns { cat, patch } — patch is empty when nothing new.
  function ensureMiscCategory(s) {
    const cats = s.spendingCategories || [];
    const found = cats.find(c => c && /^\s*misc/i.test(String(c.label || "")));
    if (found) return { cat: found, patch: {} };
    const cat = { id: Util.uuid(), label: "Misc / All Others", budgeted: 0, type: "spending" };
    return { cat, patch: { spendingCategories: [...cats, cat] } };
  }

  async function submitLog(s) {
    formErrors.log = "";
    const amount = parseFloat(logForm.amount);
    if (!isFinite(amount) || amount <= 0) {
      formErrors.log = "ENTER A VALID AMOUNT";
      render();
      return;
    }
    // Category is optional. Left blank, it falls to Misc instead of erroring.
    let miscPatch = {};
    let categoryId = logForm.categoryId;
    let categoryType = logForm.categoryType;
    if (!categoryId) {
      const m = ensureMiscCategory(s);
      categoryId = m.cat.id;
      categoryType = "spending";
      miscPatch = m.patch;
    }
    const isCouple = s.settings && s.settings.mode === "couple";
    const person = isCouple ? logForm.person : (s.settings.names[0] || "ME").toUpperCase();
    const txn = {
      id: Util.uuid(),
      // A scanned receipt carries the date printed on it; anything typed by hand
      // is today, as it always was.
      date: logForm.date || Util.todayISO(),
      amount: Math.round(amount * 100) / 100,
      categoryId: categoryId,
      categoryType: categoryType,
      note: (logForm.note || "").toUpperCase().slice(0, 60),
      paymentType: logForm.paymentType,
      person: person,
      month: s.currentMonth,
      cardId: logForm.paymentType === "credit" ? (logForm.cardId || null) : null,
      bankId: logForm.paymentType === "cash" ? (logForm.bankId || null) : null,
      // Wall-clock write time. The balance anchor uses it to tell a row logged
      // just after a balance was confirmed from one that was already in it.
      createdAt: Date.now(),
      source: "manual"
    };
    const patch = { transactions: DataService.appendTxns(txn), ...miscPatch };

    // If logging against a debt, decrement its balance
    if (categoryType === "debt") {
      const debts = (s.debts||[]).map(d => {
        if (d.id !== categoryId) return d;
        const newBal = Math.max(0, (Number(d.balance)||0) - amount);
        return { ...d, balance: Math.round(newBal * 100) / 100 };
      });
      patch.debts = debts;
    }

    try {
      await DataService.update(patch);
      // Reset form
      logForm.amount = "";
      logForm.note = "";
      // A receipt's date belongs to that receipt only; never carry it forward.
      logForm.date = null;
      // keep last-used category and payment for convenience
      render();
    } catch (err) {
      console.warn(err);
      alert("COULDN'T SAVE; CHECK CONNECTION");
    }
  }

  /* ------------- DASHBOARD ------------- */
  function dashboardBodyHtml(s) {
    // Debt block
    const totalDebt = BudgetEngine.totalDebt(s);
    const mins = BudgetEngine.totalDebtMins(s);
    const target = BudgetEngine.targetDebt(s);

    // Category rows
    const elapsed = BudgetEngine.monthElapsed(s);
    const dayInfo = BudgetEngine.monthDayInfo(s);
    const cats = (s.spendingCategories||[]);

    // The rows behind a category total. Every figure on this tab should be
    // openable, so a number you don't recognise can be traced to the purchases
    // that made it rather than taken on trust.
    const txnLineHtml = t => `
        <div class="cat-txn">
          <span class="cat-txn-date">${Util.esc(Util.fmtDateShort(t.date) || "—")}</span>
          <span class="cat-txn-note">${Util.esc(t.note || "NO DESCRIPTION")}${t.paymentType === "credit" ? " · CREDIT" : ""}</span>
          <span class="cat-txn-amt">${Util.esc(Util.fmtMoney(BudgetEngine.num(t.amount), 2))}</span>
        </div>`;
    const txnListHtml = (txns, emptyMsg) => `
        <div class="cat-txns">
          ${txns.length ? txns.map(txnLineHtml).join("") : `<div class="cat-txn-empty">${Util.esc(emptyMsg)}</div>`}
        </div>`;

    const catRows = cats.map(c => {
      const spent = BudgetEngine.categorySpent(s, c.id);
      const roll = BudgetEngine.rolloverAmount(s, c.id);
      const budget = BudgetEngine.num(c.budgeted) + roll;
      const remaining = budget - spent;
      const pct = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
      // Pace-aware, not just absolute. Over budget is always red. Otherwise a
      // category only warns when it's meaningfully ahead of where the calendar
      // is — 80% spent on the 5th is a problem, on the 28th it isn't.
      const spentFrac = budget > 0 ? spent / budget : 0;
      const barClass = spentFrac >= 1
        ? "danger"
        : (spentFrac > elapsed + 0.30 ? "danger"
          : (spentFrac > elapsed + 0.12 ? "warn" : ""));
      const remainClass = remaining < 0 ? "text-danger" : "";
      const open = dashCatOpen === c.id;
      // Whether this category is holding money says which way its spending
      // moves Safe To Spend, so it belongs on the row rather than buried.
      const funded = BudgetEngine.categoryFunded(s, c.id);
      const held = BudgetEngine.categoryReserve(s, c.id);
      const fundLine = funded > 0
        ? `SET ASIDE ${Util.fmtMoney(funded,0)} · ${Util.fmtMoney(held,0)} STILL HELD`
        : `NOTHING SET ASIDE · SPENDING COMES OFF SAFE TO SPEND`;
      return `
        <div class="cat-row${open ? " open" : ""}">
          <div class="cat-head" data-action="cat-toggle" data-cat="${Util.esc(c.id)}">
            <div class="cat-line">
              <span>${open ? "▾" : "▸"} ${Util.esc(c.label)}</span>
              <span>${Util.esc(Util.fmtMoney(spent,0))} / ${Util.esc(Util.fmtMoney(budget,0))}</span>
            </div>
            <div class="progress ${barClass}"><span style="width:${pct}%"></span></div>
            <div class="cat-remaining ${remainClass}">${Util.esc(Util.fmtMoney(remaining,0))} REMAINING${roll ? " · ROLLOVER " + Util.esc(Util.fmtMoney(roll,0)) : ""}</div>
            <div class="cat-fund">${Util.esc(fundLine)}</div>
          </div>
          ${open ? txnListHtml(BudgetEngine.categoryTxns(s, c.id), "NOTHING IN THIS CATEGORY THIS MONTH") : ""}
        </div>`;
    }).join("") || `<div class="meta">NO CATEGORIES YET</div>`;

    /* Spending that never got a category used to be invisible: it left the
       account and landed on no row, so the categories added up to less than
       was actually spent and there was nowhere to go looking. It is its own
       row now. Nothing is ever set aside for it, so unlike a funded category
       it comes straight off Safe To Spend — which is exactly why it is worth
       being able to see and clear down. */
    const uncatTxns = BudgetEngine.uncategorizedTxns(s);
    const uncatSpent = BudgetEngine.uncategorizedSpent(s);
    const uncatOpen = dashCatOpen === UNCAT_KEY;
    const uncatRow = `
        <div class="cat-row uncat${uncatOpen ? " open" : ""}">
          <div class="cat-head" data-action="cat-toggle" data-cat="${UNCAT_KEY}">
            <div class="cat-line">
              <span>${uncatOpen ? "▾" : "▸"} UNCATEGORIZED</span>
              <span class="${uncatSpent > 0 ? "text-warn" : ""}">${Util.esc(Util.fmtMoney(uncatSpent,0))}</span>
            </div>
            <div class="cat-remaining">${uncatTxns.length} TRANSACTION${uncatTxns.length === 1 ? "" : "S"} · COMES STRAIGHT OFF SAFE TO SPEND</div>
          </div>
          ${uncatOpen ? txnListHtml(uncatTxns, "EVERYTHING THIS MONTH HAS A CATEGORY") : ""}
        </div>`;

    // Credit block
    const unpaid = BudgetEngine.totalUnpaidCredit(s);
    const cashCover = BudgetEngine.cashToCover(s);
    const covered = cashCover >= unpaid;
    const shortfall = unpaid - cashCover;

    // Per-card breakdown of unpaid credit this month.
    // Transactions whose card was deleted (or that never had one) fall into "CREDIT".
    const cards = s.creditCards || [];
    const cardTotals = new Map();
    let untagged = 0;
    (s.transactions || []).forEach(t => {
      if (t.paymentType !== "credit" || t.month !== s.currentMonth) return;
      const amt = Number(t.amount) || 0;
      const label = cardLabelFor(s, t.cardId);
      if (label) cardTotals.set(label, (cardTotals.get(label) || 0) + amt);
      else untagged += amt;
    });
    const cardRowsHtml = (cards.length || untagged > 0) ? (() => {
      const rows = [];
      cards.forEach(c => {
        const v = cardTotals.get(c.label) || 0;
        const linkedDebt = c.debtId ? (s.debts||[]).find(d => d.id === c.debtId) : null;
        const debtSuffix = linkedDebt ? ` (DEBT: ${Util.fmtMoney(Number(linkedDebt.balance)||0,0)})` : "";
        rows.push(`<div class="sub-label" style="margin-top:4px;">${Util.esc(c.label)}: ${Util.esc(Util.fmtMoney(v,0))}${Util.esc(debtSuffix)}</div>`);
      });
      if (untagged > 0) rows.push(`<div class="sub-label" style="margin-top:4px;">CREDIT: ${Util.esc(Util.fmtMoney(untagged,0))}</div>`);
      return rows.join("");
    })() : "";

    return `
        <section class="section terracotta" data-learn="TOTAL DEBT SUMMARY. SUM OF EVERY DEBT'S BALANCE. TARGETING SHOWS WHICH DEBT GETS THE EXTRA PAYMENT NEXT UNDER YOUR CHOSEN PAYOFF ORDER.">
          <div class="section-label">→ TOTAL DEBT</div>
          <div class="hero" style="margin-top:8px;" data-learn="COMBINED BALANCE OF EVERY DEBT.">${Util.esc(Util.fmtMoney(totalDebt,0))}</div>
          <div class="sub-label" style="margin-top:8px;" data-learn="MONTHLY MINIMUM PAYMENTS ACROSS ALL DEBTS. THESE ARE ALWAYS SUBTRACTED FROM SAFE TO SPEND.">MINIMUMS: ${Util.esc(Util.fmtMoney(mins,0))}/MO</div>
          <div class="sub-label" style="margin-top:4px;" data-learn="THE DEBT YOUR EXTRA PAYMENT GOES TO NEXT UNDER THE CURRENT PAYOFF ORDER (AVALANCHE OR SNOWBALL).">${target ? `TARGETING: ${Util.esc(target.label)} · ${Util.esc(Util.fmtMoney(Number(target.balance)||0,0))} REMAINING` : "NO ACTIVE DEBTS"}</div>
        </section>

        <section class="section teal" data-learn="SPENDING CATEGORIES. EACH ROW SHOWS SPENT / BUDGETED WITH A PROGRESS BAR. THE BAR COMPARES YOUR SPENDING AGAINST HOW FAR THROUGH THE MONTH YOU ARE, SO 80% SPENT ON THE 5TH WARNS BUT 80% ON THE 28TH DOESN'T. RED ALWAYS MEANS OVER BUDGET OR WELL AHEAD OF PACE.">
          <div class="section-label">→ CATEGORIES</div>
          <div class="sub-label" style="margin-top:12px;" data-learn="HOW FAR THROUGH THE MONTH YOU ARE. CATEGORY BARS ARE JUDGED AGAINST THIS, NOT JUST AGAINST YOUR BUDGET.">DAY ${dayInfo.day} OF ${dayInfo.daysInMonth} · ${dayInfo.pct}% THROUGH THE MONTH</div>
          <div class="cat-fund-bar">
            <span class="sub-label">${Util.esc(Util.fmtMoney(BudgetEngine.totalReserved(s),0))} SET ASIDE AND UNSPENT</span>
            <button class="link" data-action="open-funding" data-learn="SET MONEY ASIDE INTO YOUR CATEGORIES. IT STOPS COUNTING AS SAFE TO SPEND, AND SPENDING IN THAT CATEGORY THEN COMES OUT OF WHAT YOU SET ASIDE.">SET ASIDE →</button>
          </div>
          <div style="margin-top:24px;">${catRows}${uncatRow}</div>
        </section>

        <section class="section lavender" data-learn="CREDIT THIS MONTH. UNPAID = SUM OF CREDIT TRANSACTIONS NOT YET PAID OFF. SHORTFALL WARNS WHEN CHECKING CAN'T COVER IT.">
          <div class="section-label">→ CREDIT THIS MONTH</div>
          <div class="sub-label" style="margin-top:12px;" data-learn="TOTAL CREDIT TRANSACTIONS THIS MONTH THAT HAVEN'T BEEN PAID OFF.">UNPAID: ${Util.esc(Util.fmtMoney(unpaid,0))}</div>
          ${cardRowsHtml ? `<div style="margin-top:12px;" data-learn="PER-CARD BREAKDOWN OF UNPAID CREDIT THIS MONTH. IF A CARD IS LINKED TO A DEBT, THE DEBT BALANCE SHOWS IN PARENTHESES.">${cardRowsHtml}</div>` : ""}
          ${covered ? "" : `
          <div class="sub-label text-danger" style="margin-top:12px;" data-learn="SHORTFALL MEANS CHECKING CAN'T FULLY COVER YOUR UNPAID CREDIT; YOU'LL CARRY A BALANCE.">
            ← SHORTFALL: ${Util.esc(Util.fmtMoney(shortfall,0))}
          </div>`}
        </section>`;
  }

  /* ------------- BILLS SCREEN ------------- */
  // Status tracking only. Checking a bill off deliberately does NOT touch
  // Safe to Spend, Budgeted, or any category total — bills are already fully
  // subtracted as budgeted amounts, and nothing here writes a transaction.
  // Shared by Settings and the Bills tab, so editing the rate from either
  // place shows the same inline form and writes the same settings.tithePercent.
  function renderTitheEditForm() {
    return `
      <div class="inline-form">
        <div class="sub-label">EDIT TITHE RATE</div>
        <div class="field"><label>PERCENT (0-100)</label><input id="tithe-input" value="${Util.esc(titheEdit.value)}" inputmode="decimal"></div>
        ${formErrors.tithe ? `<div class="text-danger meta">${Util.esc(formErrors.tithe)}</div>` : ""}
        <div class="row-actions">
          <button class="cta ghost" data-action="cancel-tithe">× CANCEL</button>
          <button class="cta" data-action="save-tithe">→ SAVE</button>
        </div>
      </div>`;
  }

  function billsBodyHtml(s) {
    const month = s.currentMonth;
    const paidMap = (s.billsPaid || {})[month] || {};
    const bills = s.bills || [];
    const todayDay = Number(Util.todayISO().slice(8, 10)) || 0;
    const sameMonth = Util.todayISO().slice(0, 7) === month;

    const paidTotal = bills.reduce((a, b) => {
      const rec = paidMap[b.id];
      return a + (rec && rec.paid ? (Number(rec.amount) || 0) : 0);
    }, 0);
    const paidCount = bills.filter(b => paidMap[b.id] && paidMap[b.id].paid).length;
    const expectedTotal = BudgetEngine.totalBills(s);

    // Tithe rides along as the first row of the BILLS list — same idea as the
    // credit-card rows below: synthesized on the fly, not a stored s.bills
    // entry, so there's exactly one source of truth (settings.tithePercent +
    // income) instead of a record that could drift from it. Fully absent from
    // the list (not just zeroed) while the Settings on/off switch is off.
    const titheOn = BudgetEngine.titheEnabled(s);
    const titheAmt = BudgetEngine.tithe(s);
    const titheRec = paidMap["tithe"];
    const titheIsPaid = titheOn && !!(titheRec && titheRec.paid);
    const titheFromImport = titheIsPaid && titheRec.source === "import";
    // Tithe is given out of paychecks, so it breaks down by pay day — one
    // tickable share per landing — the same way the income list does. A month
    // with a single pay day has nothing to break down and keeps the plain
    // checkbox it always had.
    const titheLandingsList = titheOn ? BudgetEngine.titheLandings(s) : [];
    const titheMulti = titheLandingsList.length > 1;
    const titheDone = titheLandingsList.filter(l =>
      !!(BudgetEngine.titheLandingRecord(s, l, paidMap).rec || {}).paid).length;
    const titheSubPaidTotal = titheLandingsList.reduce((a, l) => {
      const rec = BudgetEngine.titheLandingRecord(s, l, paidMap).rec;
      return a + (rec && rec.paid ? (Number(rec.amount) || 0) : 0);
    }, 0);
    // The lump checkmark means "the whole thing, given in one go" and wins
    // outright so a paid lump plus some ticked pay days never double counts;
    // otherwise whatever pay days are ticked contribute their share.
    const titheEffectivePaid = titheIsPaid ? titheAmt : titheSubPaidTotal;
    const titheFullyCleared = titheOn && (titheIsPaid ||
      (titheLandingsList.length > 0 && titheDone === titheLandingsList.length));
    const titheClearedCount = titheIsPaid ? titheLandingsList.length : titheDone;

    const titheSubRowsHtml = (titheOn && titheMulti && titheExpanded) ? `
      <div class="inc-sub">
        <div class="inc-sub-label">GIVEN AS ONE LUMP</div>
        <div class="inc-amt">${Util.esc(Util.fmtMoney(titheAmt, 2))}</div>
