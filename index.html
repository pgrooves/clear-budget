            <button class="cta big" data-action="setup-names-next">→ NEXT</button>
          </div>`;
      } else {
        content = `
          <div class="setup-inner">
            <button class="link" data-action="setup-back">← BACK</button>
            <h2>WHAT'S YOUR NAME?</h2>
            <div>
              <div class="sub-label">YOUR NAME</div>
              <input class="underline big" id="setup-name-1" value="${Util.esc(setupState.names[0])}" placeholder="NAME" maxlength="20">
            </div>
            <div style="flex:1"></div>
            <button class="cta big" data-action="setup-names-next">→ NEXT</button>
          </div>`;
      }
    } else if (setupState.step === "code") {
      content = `
        <div class="setup-inner">
          <button class="link" data-action="setup-back">← BACK</button>
          <h2>YOUR HOUSEHOLD CODE</h2>
          <div class="code-display">${Util.esc(Util.fmtCode(setupState.generatedCode))}</div>
          <div class="row" style="justify-content:center; flex-wrap:wrap;">
            <button class="copy-btn" data-action="copy-code" data-code="${Util.esc(setupState.generatedCode)}">COPY →</button>
            ${(typeof navigator !== "undefined" && navigator.share)
              ? `<button class="copy-btn" data-action="share-code" data-code="${Util.esc(setupState.generatedCode)}" data-learn="SEND YOUR CODE TO NOTES, MESSAGES, OR A PASSWORD MANAGER IN ONE TAP.">SHARE →</button>`
              : ""}
          </div>
          <div class="meta" style="text-align:center; margin-top:16px;">YOUR PARTNER ENTERS THIS CODE ON THEIR PHONE TO SYNC</div>
          <div style="flex:1"></div>
          <div class="text-danger meta" style="margin-bottom:12px;">SAVE THIS CODE SOMEWHERE SAFE. IT IS THE ONLY WAY BACK INTO THIS HOUSEHOLD AND IT CANNOT BE RECOVERED.</div>
          <button class="link" data-action="ack-code" data-learn="CONFIRM YOU HAVE SAVED YOUR HOUSEHOLD CODE. START STAYS LOCKED UNTIL YOU DO, BECAUSE A LOST CODE CANNOT BE RECOVERED." style="margin-bottom:12px;">${setupState.codeAcked ? "×" : "+"} I'VE SAVED MY CODE</button>
          ${setupState.error ? `<div class="text-danger meta">${Util.esc(setupState.error)}</div>` : ""}
          <button class="cta big${setupState.codeAcked ? "" : " ghost"}" data-action="setup-start">→ START</button>
        </div>`;
    } else if (setupState.step === "join") {
      content = `
        <div class="setup-inner">
          <button class="link" data-action="setup-back">← BACK</button>
          <h2>ENTER HOUSEHOLD CODE</h2>
          <div>
            <div class="sub-label">HOUSEHOLD CODE</div>
            <input class="underline big" id="setup-join-code" name="household-code" autocomplete="username" value="${Util.esc(Util.fmtCode(setupState.joinCode))}" placeholder="XXXXX-XXXXX" maxlength="11" autocapitalize="characters" autocorrect="off" spellcheck="false" style="text-transform: uppercase;">
          </div>
          ${setupState.error ? `<div class="text-danger meta">${Util.esc(setupState.error)}</div>` : ""}
          <div style="flex:1"></div>
          <button class="cta big" data-action="setup-join-submit">→ JOIN HOUSEHOLD</button>
        </div>`;
    } else if (setupState.step === "joining") {
      // Always give the user a way out; a lookup that never resolves must not
      // strand them on a screen with no controls.
      content = `
        <div class="setup-inner">
          <h2>JOINING...</h2>
          <div style="flex:1"></div>
          <button class="link center" data-action="setup-join-cancel">× CANCEL</button>
        </div>`;
    }
    root.innerHTML = `<div class="setup">${content}</div>`;
    bindSetupEvents();
  }

  function bindSetupEvents() {
    root.querySelectorAll("[data-action]").forEach(el => {
      el.addEventListener("click", handleSetupAction);
    });
    const n1 = root.querySelector("#setup-name-1");
    if (n1) n1.addEventListener("input", e => { setupState.names[0] = e.target.value; });
    const n2 = root.querySelector("#setup-name-2");
    if (n2) n2.addEventListener("input", e => { setupState.names[1] = e.target.value; });
    const jc = root.querySelector("#setup-join-code");
    if (jc) jc.addEventListener("input", e => {
      // Strip everything non-alphanumeric (dashes, spaces, punctuation from
      // pasted values are silently removed rather than blocking the paste) and
      // uppercase. Cap at 10 to accommodate the new-format code; legacy 6-char
      // codes still validate at submit time.
      const raw = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 10);
      setupState.joinCode = raw;
      // Re-format visually as XXXXX-XXXXX at length 10; leave shorter values
      // (including in-progress typing and legacy 6-char) unformatted.
      e.target.value = Util.fmtCode(raw);
    });
  }

  async function handleSetupAction(e) {
    const el = e.currentTarget;
    const action = el.dataset.action;
    if (action === "setup-mode") {
      setupState.mode = el.dataset.mode;
      setupState.step = "names";
      setupState.error = "";
      renderSetup();
    } else if (action === "setup-back") {
      setupState.error = "";
      if (setupState.step === "names") setupState.step = "who";
      else if (setupState.step === "code") setupState.step = "names";
      else if (setupState.step === "join") setupState.step = "who";
      renderSetup();
    } else if (action === "setup-names-next") {
      const n1 = (setupState.names[0]||"").trim();
      const n2 = (setupState.names[1]||"").trim();
      if (!n1 || (setupState.mode === "couple" && !n2)) {
        setupState.error = "PLEASE ENTER NAME(S)";
        renderSetup();
        return;
      }
      setupState.names[0] = n1.toUpperCase();
      setupState.names[1] = setupState.mode === "couple" ? n2.toUpperCase() : "";
      setupState.generatedCode = DataService.generateCode();
      // A newly generated code needs its own acknowledgement.
      setupState.codeAcked = false;
      setupState.step = "code";
      setupState.error = "";
      renderSetup();
    } else if (action === "setup-goto-join") {
      setupState.step = "join";
      setupState.error = "";
      renderSetup();
    } else if (action === "copy-code") {
      const code = el.dataset.code;
      try {
        await navigator.clipboard.writeText(code);
        el.textContent = "COPIED";
        setTimeout(() => { el.textContent = "COPY →"; }, 1200);
      } catch (err) {
        el.textContent = "COPY FAILED";
      }
    } else if (action === "ack-code") {
      setupState.codeAcked = !setupState.codeAcked;
      setupState.error = "";
      renderSetup();
    } else if (action === "share-code") {
      // Feature-detected at render time; the reliable way to get the code into
      // Notes, Messages, or a password manager in one tap. No UA sniffing.
      try {
        await navigator.share({ title: "CLEAR household code", text: el.dataset.code });
      } catch (err) {
        // User dismissed the share sheet, or sharing is unavailable. Nothing to do.
      }
    } else if (action === "setup-start") {
      if (!setupState.codeAcked) {
        setupState.error = "PLEASE SAVE YOUR CODE FIRST, THEN CONFIRM ABOVE";
        renderSetup();
        return;
      }
      try {
        setupState.error = "";
        const id = setupState.generatedCode;
        const names = setupState.mode === "couple" ? [setupState.names[0], setupState.names[1]] : [setupState.names[0]];
        const data = buildDefaultData(setupState.mode, names);
        DataService.setHouseholdIdLocal(id);
        await DataService.set(data);
        // Offer the setup wizard as soon as the app comes up, so a new
        // household never lands on a budget full of zeroes with no guidance.
        importFlow.wizard = true;
        importFlow.open = true;
        importFlow.stage = "wizard-offer";
        DataService.subscribe(id);
        // renderApp will happen on snapshot
        renderLoading("SYNCING...");
      } catch (err) {
        console.warn(err);
        setupState.error = "COULDN'T CREATE HOUSEHOLD; CHECK YOUR CONNECTION";
        renderSetup();
      }
    } else if (action === "setup-join-cancel") {
      // Abandon an in-flight lookup and return to code entry.
      setupState.joinInFlight = false;
      setupState.step = "join";
      setupState.error = "";
      renderSetup();
    } else if (action === "setup-join-submit") {
      // Normalize once more at submit time in case the value was set
      // programmatically or via autofill. Strip anything non-alphanumeric.
      const code = (setupState.joinCode || "").toUpperCase().replace(/[^A-Z0-9]/g, "").trim();
      // Accept legacy 6-char codes AND the new 10-char format. Nothing else.
      if (code.length !== 6 && code.length !== 10) {
        setupState.error = "CODE MUST BE 6 OR 10 CHARACTERS";
        renderSetup();
        return;
      }
      // Codes are drawn from a confusable-free alphabet (no I, O, 0 or 1), and
      // the Firestore rules enforce exactly that character class on the
      // document id. Checking it here too means a typo'd character reports as
      // a bad code instead of surfacing as a permission failure that reads
      // like a network problem.
      if (!/^[A-HJ-NP-Z2-9]+$/.test(code)) {
        setupState.error = "CODE HAS INVALID CHARACTERS; IT NEVER CONTAINS I, O, 0 OR 1";
        renderSetup();
        return;
      }
      // Persist the normalized value so downstream reads see the canonical form.
      setupState.joinCode = code;
      setupState.step = "joining";
      setupState.error = "";
      setupState.joinInFlight = true;
      renderSetup();
      try {
        // Firestore's get() can hang indefinitely when the network is
        // unreachable or the request is otherwise stalled, which used to leave
        // the user on "JOINING..." forever. Bound it.
        const exists = await Promise.race([
          DataService.checkExists(code),
          new Promise((_, reject) =>
            setTimeout(() => reject(new Error("join-timeout")), 12000))
        ]);
        // The user cancelled while we were waiting; abandon this result.
        if (!setupState.joinInFlight) return;
        setupState.joinInFlight = false;
        if (!exists) {
          setupState.step = "join";
          setupState.error = "NO HOUSEHOLD FOUND WITH THAT CODE";
          renderSetup();
          return;
        }
        DataService.setHouseholdIdLocal(code);
        DataService.subscribe(code);
        renderLoading("SYNCING...");
      } catch (err) {
        console.warn(err);
        if (!setupState.joinInFlight) return;
        setupState.joinInFlight = false;
        setupState.step = "join";
        // Distinguish the three real failure modes so the message matches the
        // cause. A rules rejection is not a connection problem and must not
        // tell the user to check their network.
        setupState.error = (err && err.message === "join-timeout")
          ? "TIMED OUT; CHECK YOUR CONNECTION AND TRY AGAIN"
          : (err && err.code === "permission-denied")
            ? "THAT CODE ISN'T VALID"
            : "COULDN'T CONNECT; CHECK YOUR CONNECTION";
        renderSetup();
      }
    }
  }

  /* ------------- LOADING SCREEN ------------- */
  // ------------- LOADING SCREEN SHIMMER CLIMAX -------------
  // Waiting: white shimmer sweeps L→R across CLEAR, brightening for the first
  // RAMP_SWEEPS sweeps then plateauing indefinitely. Climax: one final ~0.62x
  // sweep peaking at PEAK=1.0 with the band widening. Whiteout: full-screen
  // white overlay fades up in FLASH_UP_MS, real screen renders under it, fades
  // down in FLASH_DOWN_MS. If reduced-motion is set, we skip the animation and
  // hard-swap as before.
  const LOAD_SWEEP_MS   = 700;
  const LOAD_RAMP_SWEEPS = 3;
  const LOAD_PEAK       = 1.0;
  const LOAD_CLIMAX_RATIO = 0.62;
  const LOAD_FLASH_UP_MS = 300;
  const LOAD_FLASH_DOWN_MS = 460;
  // Half-width in "background-position %" — the transparent region either side
  // of the peak in the loading gradient. Widens with intensity.
  const LOAD_HW_MIN = 6;    // at sweep 0
  const LOAD_HW_MAX = 12;   // end of ramp / plateau
  const LOAD_HW_CLIMAX = 30; // during climax
  const LOAD_PEAK_START = 0.32;
  const LOAD_PEAK_TOP   = 0.72;
  const LOAD_BLOOM_TOP  = 0.10;

  // Loading effect driver — persists across renderLoading calls so the same
  // rAF loop keeps running until finishLoading() plays the climax + handoff.
  const loadFx = {
    raf: 0,
    started: 0,      // performance.now() when the animation started
    sweepIndex: 0,
    finishing: false,
    finishStart: 0,  // when climax started
    finishCb: null,  // callback to render the real screen at whiteout peak
    minPlayedResolved: false,
    afterMinPlayed: null,
    torn: false      // true if renderSetup/renderApp took over early
  };

  function loadReducedMotion() {
    try { return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
    catch (e) { return false; }
  }

  function loadTeardown() {
    loadFx.torn = true;
    if (loadFx.raf) { cancelAnimationFrame(loadFx.raf); loadFx.raf = 0; }
    // Clear the CSS variables so the next mount starts fresh.
    const r = document.documentElement;
    r.style.removeProperty("--lb-pos");
    r.style.removeProperty("--lb-peak");
    r.style.removeProperty("--lb-hw");
    r.style.removeProperty("--lb-bloom");
    r.style.removeProperty("--lb-msg");
    // Also remove any lingering flash element.
    const f = document.getElementById("load-flash");
    if (f) f.remove();
  }

  // Paint helper — pulled out so the min-sweep branch can flush a final
  // pre-climax frame before invoking the queued kick() callback.
  function loadPaint(pos, peak, hw, bloom, msg) {
    const r = document.documentElement;
    r.style.setProperty("--lb-pos", pos.toFixed(1) + "%");
    r.style.setProperty("--lb-peak", peak.toFixed(3));
    r.style.setProperty("--lb-hw", hw.toFixed(1) + "%");
    r.style.setProperty("--lb-bloom", bloom.toFixed(3));
    r.style.setProperty("--lb-msg", msg.toFixed(3));
  }

  function loadTick(now) {
    // V14 root-cause fix: clear the raf id FIRST so any code that runs during
    // this callback (kick(), noteActivity-style helpers, etc.) sees "not
    // scheduled" and can queue a fresh frame. Previously loadFx.raf still
    // held the id of the frame currently executing, and kick()'s
    // "if (!loadFx.raf)" guard skipped the reschedule — killing the loop
    // permanently on fast loads. See coordinator's V13 blocker report.
    loadFx.raf = 0;
    if (loadFx.torn) return;

    const t = now - loadFx.started;
    const sweep = Math.floor(t / LOAD_SWEEP_MS);
    const phase = (t % LOAD_SWEEP_MS) / LOAD_SWEEP_MS; // 0..1
    let pos = phase * 100;
    const rampT = Math.min(1, sweep / Math.max(1, LOAD_RAMP_SWEEPS - 1));
    let peak = LOAD_PEAK_START + (LOAD_PEAK_TOP - LOAD_PEAK_START) * rampT;
    let hw   = LOAD_HW_MIN + (LOAD_HW_MAX - LOAD_HW_MIN) * rampT;
    let bloom = LOAD_BLOOM_TOP * rampT;
    let msg = 1;

    if (loadFx.finishing) {
      const climaxMs = LOAD_SWEEP_MS * LOAD_CLIMAX_RATIO;
      const ct = now - loadFx.finishStart;
      const p = Math.min(1, ct / climaxMs);
      pos = p * 100;
      peak = LOAD_PEAK_TOP + (LOAD_PEAK - LOAD_PEAK_TOP) * p;
      hw   = LOAD_HW_MAX + (LOAD_HW_CLIMAX - LOAD_HW_MAX) * p;
      bloom = LOAD_BLOOM_TOP + (1 - LOAD_BLOOM_TOP) * p;
      msg = 1 - p;
      loadPaint(pos, peak, hw, bloom, msg);
      if (p >= 1) {
        // Climax complete → whiteout + handoff. No reschedule here.
        loadStartHandoff();
        return;
      }
      loadFx.raf = requestAnimationFrame(loadTick);
      return;
    }

    if (!loadFx.minPlayedResolved && t >= LOAD_SWEEP_MS) {
      loadFx.minPlayedResolved = true;
      if (typeof loadFx.afterMinPlayed === "function") {
        const cb = loadFx.afterMinPlayed;
        loadFx.afterMinPlayed = null;
        loadPaint(pos, peak, hw, bloom, msg);
        // cb() is kick(); after V14 it can schedule cleanly because raf is 0.
        cb();
        // Belt-and-braces: guarantee continuity even if cb() ever changes
        // and forgets to reschedule.
        if (!loadFx.raf && !loadFx.torn) loadFx.raf = requestAnimationFrame(loadTick);
        return;
      }
    }

    loadPaint(pos, peak, hw, bloom, msg);
    loadFx.raf = requestAnimationFrame(loadTick);
  }

  function loadStartHandoff() {
    // Ensure a flash overlay exists (added by renderLoading), then fade up.
    let flash = document.getElementById("load-flash");
    if (!flash) {
      flash = document.createElement("div");
      flash.id = "load-flash";
      flash.className = "load-flash";
      document.body.appendChild(flash);
    }
    flash.style.setProperty("--flash-dur", LOAD_FLASH_UP_MS + "ms");
    // Force reflow so the transition kicks in from opacity 0.
    // eslint-disable-next-line no-unused-expressions
    flash.offsetHeight;
    flash.classList.add("on");
    setTimeout(() => {
      // At whiteout peak: render the real screen under the flash, then fade
      // the flash back down.
      if (typeof loadFx.finishCb === "function") {
        try { loadFx.finishCb(); } catch (e) { console.warn(e); }
      }
      const f2 = document.getElementById("load-flash");
      if (f2) {
        f2.style.setProperty("--flash-dur", LOAD_FLASH_DOWN_MS + "ms");
        // Force reflow before removing .on so the transition applies.
        // eslint-disable-next-line no-unused-expressions
        f2.offsetHeight;
        f2.classList.remove("on");
        setTimeout(() => { if (f2 && f2.parentNode) f2.parentNode.removeChild(f2); }, LOAD_FLASH_DOWN_MS + 40);
      }
      // The rAF loop stops here — no more frames scheduled.
      loadFx.raf = 0;
      loadFx.finishing = false;
      loadFx.finishCb = null;
      loadFx.started = 0;
      loadFx.minPlayedResolved = false;
      loadFx.afterMinPlayed = null;
    }, LOAD_FLASH_UP_MS + 10);
  }

  // Public hook: play the climax + whiteout, then invoke cb() to render the
  // real screen. Guarantees at least one full sweep before the climax so a
  // fast load never reads as a jarring flash.
  //
  // V14 safety net: no matter what happens to the animation (rAF starvation
  // in a background tab, a future regression in loadTick, etc.), the app is
  // guaranteed to render within MAX_MS of finishLoading being called. A
  // cosmetic animation must never block the real UI from appearing.
  function finishLoading(cb) {
    if (loadReducedMotion() || activeView !== "loading") {
      // Reduced-motion or not currently on the loading screen: hard-swap.
      loadTeardown();
      if (typeof cb === "function") cb();
      return;
    }
    let done = false;
    const wrappedCb = () => {
      if (done) return;
      done = true;
      if (typeof cb === "function") { try { cb(); } catch (e) { console.warn(e); } }
    };
    loadFx.finishCb = wrappedCb;
    // Hard ceiling: sweep + climax + fade-up + 1500ms grace. Beyond this we
    // force the handoff regardless of animation state.
    const MAX_MS = LOAD_SWEEP_MS + (LOAD_SWEEP_MS * LOAD_CLIMAX_RATIO) + LOAD_FLASH_UP_MS + 1500;
    setTimeout(() => {
      if (done) return;
      console.warn("finishLoading: safety net fired at " + MAX_MS + "ms; forcing handoff");
      loadTeardown();
      wrappedCb();
    }, MAX_MS);
    const kick = () => {
      loadFx.finishing = true;
      loadFx.finishStart = performance.now();
      if (!loadFx.raf && !loadFx.torn) loadFx.raf = requestAnimationFrame(loadTick);
    };
    if (loadFx.minPlayedResolved) kick();
    else loadFx.afterMinPlayed = kick;
  }

  function renderLoading(msg) {
    activeView = "loading";
    loadFx.torn = false;
    const reduced = loadReducedMotion();
    root.innerHTML = `
      <div class="loading">
        <div class="brand">CLEAR</div>
        <div class="msg">${Util.esc(msg || "LOADING...")}</div>
        <button class="link center" data-action="reset-household">← USE A DIFFERENT HOUSEHOLD CODE</button>
      </div>`;
    const btn = root.querySelector("[data-action=reset-household]");
    if (btn) btn.addEventListener("click", () => {
      // User bailed mid-animation: cancel the rAF loop, remove flash, and
      // restore normal setup screen behavior.
      loadTeardown();
      DataService.clearHouseholdId();
      setupState.step = "who";
      setupState.mode = null;
      setupState.names = ["", ""];
      setupState.generatedCode = "";
      setupState.codeAcked = false;
      setupState.joinCode = "";
      setupState.error = "";
      setupState.joinInFlight = false;
      renderSetup();
    });
    if (reduced) {
      // Static loading screen; no rAF loop, no shimmer variables.
      return;
    }
    // Reset transient CSS vars to sweep start.
    const r = document.documentElement;
    r.style.setProperty("--lb-pos", "0%");
    r.style.setProperty("--lb-peak", LOAD_PEAK_START.toFixed(3));
    r.style.setProperty("--lb-hw", LOAD_HW_MIN + "%");
    r.style.setProperty("--lb-bloom", "0");
    r.style.setProperty("--lb-msg", "1");
    // Start the driver if not already running.
    if (!loadFx.raf) {
      loadFx.started = performance.now();
      loadFx.finishing = false;
      loadFx.minPlayedResolved = false;
      loadFx.afterMinPlayed = null;
      loadFx.raf = requestAnimationFrame(loadTick);
    }
  }

  /* ------------- APP SHELL RENDERERS ------------- */
  // General scroll-preservation layer around innerHTML-based re-renders.
  // Every scrollable container gets a stable data-scroll-key. Before rebuild
  // we snapshot { key -> {left, top} } across the WHOLE document (main tree
  // plus body-level overlays), then after rebuild we restore matching keys.
  // Window scroll is preserved when the logical screen didn't change; on tab
  // switch or overlay open/close we start fresh at top.
  let lastRenderKey = null;

  function computeRenderKey() {
    const id = DataService.getHouseholdId();
    if (!id) return "setup";
    const s = DataService.get();
    if (!s) return "loading";
    const screen = settingsOpen ? "settings" : ("tab:" + currentTab);
    const overlay = importFlow.open && importFlow.stage ? ("import:" + importFlow.stage)
                    : (newMonthOpen ? "newmonth" : "none");
    return `${screen}|${overlay}`;
  }

  function captureScrollState() {
    const containers = new Map();
    document.querySelectorAll("[data-scroll-key]").forEach(el => {
      const k = el.getAttribute("data-scroll-key");
      if (!k) return;
      containers.set(k, { left: el.scrollLeft || 0, top: el.scrollTop || 0 });
    });
    return {
      containers,
      windowX: window.scrollX || window.pageXOffset || 0,
      windowY: window.scrollY || window.pageYOffset || 0
    };
  }

  function restoreScrollState(state, preserveWindow) {
    // Container scrolls: restore synchronously; retry once in the next frame
    // for any container that couldn't take the set (e.g. still zero-size during
    // layout). Only restore when the key existed before AND persists after.
    const els = document.querySelectorAll("[data-scroll-key]");
    const pending = [];
    els.forEach(el => {
      const k = el.getAttribute("data-scroll-key");
      if (!k) return;
      const saved = state.containers.get(k);
      if (!saved) return;
      if (saved.left) el.scrollLeft = saved.left;
      if (saved.top)  el.scrollTop  = saved.top;
      const missedLeft = saved.left && el.scrollLeft !== saved.left;
      const missedTop  = saved.top  && el.scrollTop  !== saved.top;
      if (missedLeft || missedTop) pending.push({ el, saved });
    });
    if (pending.length) {
      requestAnimationFrame(() => {
        pending.forEach(({ el, saved }) => {
          if (saved.left) el.scrollLeft = saved.left;
          if (saved.top)  el.scrollTop  = saved.top;
        });
      });
    }
    if (preserveWindow) {
      // Instant, no smooth animation — we want zero visible jump.
      window.scrollTo(state.windowX, state.windowY);
    } else {
      // Different screen/overlay than we captured: start at the top. Simply
      // declining to restore is not enough — the document keeps whatever
      // scroll offset it already had, which lands the user mid-page after a
      // tab switch.
      window.scrollTo(0, 0);
    }
  }

  function render() {
    // Capture BEFORE any DOM mutation so we see the outgoing scroll state
    // (including any body-level overlay currently attached).
    const captured = captureScrollState();
    const nextKey = computeRenderKey();
    const sameScreen = lastRenderKey === nextKey;

    _renderCore();

    lastRenderKey = nextKey;
    // Only restore window scroll on within-screen re-renders. Tab switches
    // and overlay open/close start at top as they did before.
    restoreScrollState(captured, sameScreen);
    // Container heights may have changed; update the floating scroll button.
    if (typeof refreshScrollBtn === "function") refreshScrollBtn();
  }

  function _renderCore() {
    const id = DataService.getHouseholdId();
    if (!id) { activeView = "setup"; renderSetup(); syncOverlays(null); return; }
    const s = DataService.get();
    if (!s) { renderLoading("SYNCING..."); return; }
    // NOTE: overlays must be synced on the settings path too — NEW MONTH is
    // launched from inside Settings, and an early return here used to skip the
    // overlay dispatch entirely so the overlay never appeared.
    if (settingsOpen) { renderSettings(s); syncOverlays(s); return; }
    activeView = "app";
    // One assignment point for the whole app shell. The four tab renderers
    // return strings and never touch the DOM, which is what lets the swipe
    // build a neighbouring tab off to the side before it is committed.
    root.innerHTML = screenShell(s, currentTab);
    bindTab(s, currentTab);
    syncOverlays(s);
  }

  /* ------------- SHARED APP SHELL ------------- */
  // Every tab is the same three pieces: the pinned header, one shared lime
  // block, and the tab's own body. Only the body slides on a swipe.

  const TAB_LABELS = { dashboard: "DASH", log: "LOG", bills: "BILLS", debts: "DEBTS" };

  function tabLabelText(tab) {
    return "→ " + (TAB_LABELS[tab] || String(tab || "").toUpperCase());
  }

  function tabLineHtml(tab) {
    return `
      <div class="tabline" data-learn="WHICH TAB YOU'RE ON. IT SLIDES ACROSS WHEN YOU SWIPE BETWEEN TABS.">
        <div class="tabline-layer"><div class="section-label">${Util.esc(tabLabelText(tab))}</div></div>
      </div>`;
  }

  // The one lime block, identical on all four tabs apart from the label line.
  // Merged from what LOG and DASHBOARD each used to render separately; every
  // figure reads from s.currentMonth so no tab can drift onto a different month.
  function limeBlock(s, tab) {
    const isCouple = !!(s.settings && s.settings.mode === "couple");
    const safe = BudgetEngine.safeToSpend(s);
    const budgeted = BudgetEngine.totalBudgeted(s);
    const credit = BudgetEngine.totalUnpaidCredit(s);
    const received = BudgetEngine.receivedIncome(s);
    const expectedIncome = BudgetEngine.totalIncome(s);
    const heroDanger = safe < 0 ? "danger" : "";

    // Per-person spend (was Dashboard-only).
    let peopleHtml = "";
    if (isCouple) {
      const p1 = ((s.settings.names || [])[0] || "").toUpperCase();
      const p2 = ((s.settings.names || [])[1] || "").toUpperCase();
      peopleHtml = `<div class="sub-label" style="margin-top:8px;" data-learn="HOW MUCH EACH OF YOU HAS SPENT THIS MONTH. SET WHO PAID WHEN YOU LOG A PURCHASE.">${Util.esc(p1)}: ${Util.esc(Util.fmtMoney(BudgetEngine.personSpent(s, p1), 0))} SPENT · ${Util.esc(p2)}: ${Util.esc(Util.fmtMoney(BudgetEngine.personSpent(s, p2), 0))} SPENT</div>`;
    }

    // Bills due or overdue (was Log-only).
    const dayInfo = BudgetEngine.monthDayInfo(s);
    const paidThisMonth = (s.billsPaid || {})[s.currentMonth] || {};
    const unpaidBills = (s.bills || []).filter(b => {
      if (paidThisMonth[b.id] && paidThisMonth[b.id].paid) return false;
      return (Number(b.dueDateOfMonth) || 0) > 0;
    });
    const overdueBills = unpaidBills.filter(b => Number(b.dueDateOfMonth) < dayInfo.day);
    const dueSoonBills = unpaidBills.filter(b => {
      const d = Number(b.dueDateOfMonth);
      return d >= dayInfo.day && d <= dayInfo.day + 7;
    });
    const sumOf = (arr) => arr.reduce((a, b) => a + (Number(b.amount) || 0), 0);
    const dueSoonHtml = (overdueBills.length || dueSoonBills.length) ? `
      <div class="sub-label ${overdueBills.length ? "text-danger" : ""}" style="margin-top:8px;" data-learn="UNPAID BILLS THAT ARE PAST THEIR DUE DAY, OR COMING UP IN THE NEXT SEVEN DAYS. TICK THEM OFF ON THE BILLS TAB AND THEY DISAPPEAR FROM HERE.">${
        overdueBills.length
          ? `${overdueBills.length} BILL${overdueBills.length===1?"":"S"} OVERDUE · ${Util.esc(Util.fmtMoney(sumOf(overdueBills),0))}${dueSoonBills.length ? ` · ${dueSoonBills.length} DUE IN 7 DAYS` : ""}`
          : `${dueSoonBills.length} BILL${dueSoonBills.length===1?"":"S"} DUE IN 7 DAYS · ${Util.esc(Util.fmtMoney(sumOf(dueSoonBills),0))}`
      }</div>` : "";

    // Month-rollover nudge (was Log-only).
    const realMonth = Util.currentMonthYM();
    const monthStale = !!(s.currentMonth && realMonth > s.currentMonth);
    const staleHtml = monthStale ? `
      <div class="sub-label text-danger" style="margin-top:8px;" data-learn="THE CALENDAR HAS MOVED ON BUT THE APP IS STILL TRACKING THE OLD MONTH. EVERY FIGURE HERE DESCRIBES THAT OLD MONTH UNTIL YOU ROLL FORWARD. TAP TO START THE NEW MONTH.">IT'S ${Util.esc(Util.fmtMonthLong(realMonth))} · <button class="link text-danger" data-action="open-new-month-inline">START NEW MONTH →</button></div>` : "";

    return `
      <section class="section lime" style="padding-top:80px;" data-learn="SAFE TO SPEND BLOCK. THE BIG NUMBER IS WHAT'S TRULY LEFT TO SPEND THIS MONTH AFTER TITHE, BILLS, DEBT MINIMUMS, AND UNPAID CREDIT ARE SET ASIDE. IT STAYS PUT ON EVERY TAB SO THE FIGURE THAT MATTERS IS ALWAYS THE FIRST THING YOU SEE.">
        ${tabLineHtml(tab)}
        <div class="meta" style="opacity:0.75; margin:12px 0;" data-learn="EVERY NUMBER IN THIS BLOCK IS FOR THIS MONTH ONLY. USE NEW MONTH IN SETTINGS TO ROLL FORWARD.">MONTH OF ${Util.esc(Util.fmtMonthLong(s.currentMonth))}</div>
        <div class="sub-label" data-learn="SUB-LABEL FOR THE SAFE TO SPEND NUMBER BELOW.">SAFE TO SPEND</div>
        <div class="hero ${heroDanger}" data-learn="WHAT'S TRULY LEFT TO SPEND THIS MONTH AFTER TITHE, BILLS, DEBT MINIMUMS, AND UNPAID CREDIT ARE SET ASIDE. GOES RED WHEN NEGATIVE.">${Util.esc(Util.fmtMoney(safe, 0))}</div>
        <div class="sub-label" style="margin-top:8px;" data-learn="HOW MUCH OF YOUR EXPECTED INCOME HAS ACTUALLY ARRIVED THIS MONTH. ONLY RECEIVED INCOME COUNTS TOWARD SAFE TO SPEND. MARK INCOME AS RECEIVED ON THE LOG INCOME TAB.">RECEIVED ${Util.esc(Util.fmtMoney(received, 0))} OF ${Util.esc(Util.fmtMoney(expectedIncome, 0))} EXPECTED</div>
        <div class="sub-label" style="margin-top:8px;" data-learn="TOTAL BUDGETED = TITHE + BILLS + DEBT MINIMUMS + SPENDING BUDGETS, FOR YOUR FULL EXPECTED MONTH, SO IT DOESN'T MOVE AS PAYCHECKS LAND. ON CREDIT = TOTAL OF THIS MONTH'S CREDIT TRANSACTIONS THAT AREN'T PAID OFF YET.">${Util.esc(Util.fmtMoney(budgeted, 0))} BUDGETED · ${Util.esc(Util.fmtMoney(credit, 0))} ON CREDIT</div>
        ${peopleHtml}
        ${dueSoonHtml}
        ${staleHtml}
      </section>`;
  }

  function tabBodyHtml(s, tab) {
    switch (tab) {
      case "dashboard": return dashboardBodyHtml(s);
      case "bills": return billsBodyHtml(s);
      case "debts": return debtsBodyHtml(s);
      case "log":
      default: return logBodyHtml(s);
    }
  }

  // Everything that slides on a swipe: the tab's own sections plus the footer.
  // The inner form is what the swipe drops into its offscreen incoming panel.
  function swipeBodyInner(s, tab) {
    return tabBodyHtml(s, tab) + footer();
  }
  function swipeBodyHtml(s, tab) {
    return `<div class="swipe-body">${swipeBodyInner(s, tab)}</div>`;
  }

  function screenShell(s, tab) {
    return `
      <div class="screen">
        ${appHeader("lime")}
        ${limeBlock(s, tab)}
        <div class="swipe-stage">${swipeBodyHtml(s, tab)}</div>
      </div>
      ${tabBar()}`;
  }

  function bindTab(s, tab) {
    bindGlobalTabs();
    bindLimeBlockEvents(s);
    if (tab === "log") bindLogEvents(s);
    else if (tab === "bills") bindBillsEvents(s);
    else if (tab === "debts") bindDebtsEvents(s);
  }

  // The month-rollover nudge now lives in the shared lime block, so its handler
  // has to be bound on every tab rather than only on LOG.
  function bindLimeBlockEvents(s) {
    root.querySelectorAll("[data-action=open-new-month-inline]").forEach(el => {
      el.addEventListener("click", () => {
        newMonthChoices = {};
        newMonthOpen = true;
        render();
      });
    });
  }

  // New Month + Import overlays are separate layers living outside #root.
  // The overlay renderers strip prior overlays themselves, but when NEITHER
  // should be showing they never run, which used to leave a stale overlay node
  // on screen (e.g. the review overlay lingering after a committed import).
  function syncOverlays(s) {
    const wantNewMonth = !!s && !!newMonthOpen;
    const wantImport = !!s && !!(importFlow.open && importFlow.stage);
    if (!wantNewMonth && !wantImport) {
      document.querySelectorAll(".overlay").forEach(o => o.remove());
      return;
    }
    if (wantNewMonth) renderNewMonthOverlay(s);
    if (wantImport) renderImportOverlay(s);
  }

  /* ------------- LOG SCREEN ------------- */
  // Returns the LOG tab's own sections. The lime block, header, footer and tab
  // bar are the shell's job; see screenShell().
  function logBodyHtml(s) {
    const isCouple = s.settings && s.settings.mode === "couple";
    const received = BudgetEngine.receivedIncome(s);
    const expectedIncome = BudgetEngine.totalIncome(s);

    // Spending categories only. Bills are tracked on the BILLS tab and debt
    // payments on the DEBTS screen, so neither belongs in the manual purchase
    // picker. The txn editor still lists both so existing/imported transactions
    // stay editable and re-categorizable.
    const chips = [];
    (s.spendingCategories||[]).forEach(c => chips.push({ id: c.id, label: c.label, type: "spending" }));

    // recent transactions for the VIEWED month (local UI state), most recent first.
    // Everything else on this screen still keys off s.currentMonth.
    const catLookup = {};
    (s.spendingCategories||[]).forEach(c => catLookup[c.id] = c.label);
    (s.bills||[]).forEach(b => catLookup[b.id] = b.label);
    (s.debts||[]).forEach(d => catLookup[d.id] = d.label);
    // Clamp the viewed month: never past currentMonth (no future browsing) and
    // never earlier than the oldest transaction month in the doc.
    const allTxnMonths = (s.transactions||[])
      .map(t => (t.month || "")).filter(m => /^\d{4}-\d{2}$/.test(m));
    const oldestTxnMonth = allTxnMonths.length ? allTxnMonths.slice().sort()[0] : s.currentMonth;
    let activeMonth = viewedTxnMonth || s.currentMonth;
    if (activeMonth > s.currentMonth) activeMonth = s.currentMonth;
    if (activeMonth < oldestTxnMonth) activeMonth = oldestTxnMonth;
    viewedTxnMonth = activeMonth === s.currentMonth ? null : activeMonth;
    const canGoBack = activeMonth > oldestTxnMonth;
    const canGoForward = activeMonth < s.currentMonth;
    const monthLabel = activeMonth === s.currentMonth
      ? `THIS MONTH · ${Util.fmtMonthLong(activeMonth)}`
      : Util.fmtMonthLong(activeMonth);
    // Sort newest first. `date` is day-granular, so everything logged today ties
    // and a plain stable sort left them in insertion order — oldest on top.
    // Tie-break on position in the stored array (append order) so the most
    // recently added row wins. Decorate-sort-undecorate keeps this stable.
    const txns = (s.transactions||[]).filter(t => t.month === activeMonth)
      .map((t, i) => ({ t, i }))
      .sort((a, b) => (a.t.date < b.t.date ? 1 : (a.t.date > b.t.date ? -1 : b.i - a.i)))
      .map(x => x.t);

    const chipsHtml = chips.map(c => {
      const cls = "chip " + (logForm.categoryId === c.id ? "active " : "") +
        (c.type === "debt" ? "debt-chip " : (c.type === "bill" ? "bill-chip " : ""));
      return `<button class="${cls}" data-action="pick-cat" data-id="${Util.esc(c.id)}" data-type="${c.type}">${Util.esc(c.label)}</button>`;
    }).join("");

    const personChips = isCouple ? `
      <div data-learn="WHO PAID (COUPLE MODE). PICK A NAME OR JOINT. THE DASHBOARD SHOWS PER-PERSON SPENDING TOTALS.">
        <div class="sub-label">WHO PAID</div>
        <div class="chips" data-scroll-key="log-person-chips">
          ${[s.settings.names[0], s.settings.names[1], "JOINT"].map(p => {
            const val = p.toUpperCase();
            return `<button class="chip ${logForm.person===val?'active':''}" data-action="pick-person" data-person="${Util.esc(val)}">${Util.esc(p)}</button>`;
          }).join("")}
        </div>
      </div>` : "";

    // Card chip row (visible only when CREDIT is the selected payment type)
    const cards = s.creditCards || [];
    const cardChipsHtml = logForm.paymentType === "credit" ? `
      <div data-learn="WHICH CARD. PICK THE CREDIT CARD YOU USED SO THE DASHBOARD CAN TALLY UNPAID CREDIT PER CARD. IF NO CARD IS PICKED, IT FALLS UNDER GENERIC CREDIT.">
        <div class="sub-label">WHICH CARD</div>
        ${cards.length ? `
          <div class="chips" data-scroll-key="log-card-chips">
            ${cards.map(c => `<button class="chip ${logForm.cardId===c.id?'active':''}" data-action="pick-card" data-id="${Util.esc(c.id)}">${Util.esc(c.label)}</button>`).join("")}
            ${logForm.cardId ? `<button class="chip" data-action="pick-card" data-id="">× NONE</button>` : ""}
          </div>
        ` : `<div class="meta">NO CARDS; ADD THEM IN SETTINGS</div>`}
      </div>` : "";

    const banks = s.banks || [];
    const bankChipsHtml = (logForm.paymentType === "cash" && banks.length) ? `
      <div data-learn="WHICH BANK. IF YOU KEEP MORE THAN ONE CHECKING ACCOUNT, PICK THE ONE THIS CAME OUT OF. ADD ACCOUNTS IN SETTINGS.">
        <div class="sub-label">WHICH BANK</div>
        <div class="chips" data-scroll-key="log-bank-chips">
          ${banks.map(b => `<button class="chip ${logForm.bankId===b.id?'active':''}" data-action="pick-bank" data-id="${Util.esc(b.id)}">${Util.esc(b.label)}</button>`).join("")}
          ${logForm.bankId ? `<button class="chip" data-action="pick-bank" data-id="">× NONE</button>` : ""}
        </div>
      </div>` : "";

    const txnRowsHtml = txns.length ? txns.map(t => renderTxnRow(s, t, catLookup)).join("") :
      `<div class="meta" style="padding: 12px 0;">NO TRANSACTIONS YET THIS MONTH</div>`;
    // Counter for transactions that were imported without a category selected.
    const needsCount = txns.filter(t => t.needsCategory || (t.source === "import" && !t.categoryId)).length;
    const needsCounterHtml = needsCount > 0
      ? `<div class="sub-label text-danger" style="margin-top: 12px;">${needsCount} TRANSACTION${needsCount === 1 ? "" : "S"} NEED A CATEGORY</div>`
      : "";

    // ---- LOG INCOME sub-tab ----------------------------------------------
    // An income source counts as CLEARED for the month when an incomeLog entry
    // exists with that incomeId and month.
    const logMonth = s.currentMonth;
    const clearedFor = (incomeId) =>
      (s.incomeLog || []).find(e => e && e.incomeId === incomeId && e.month === logMonth) || null;

    const incPersonChips = isCouple ? `
      <div>
        <div class="sub-label">WHO</div>
        <div class="chips" data-scroll-key="inc-person-chips" data-learn="WHO RECEIVED THIS MONEY.">
          ${[s.settings.names[0], s.settings.names[1], "JOINT"].map(p => {
            const val = (p || "").toUpperCase();
            return `<button class="chip ${incomeForm.person === val ? "active" : ""}" data-action="inc-pick-person" data-person="${Util.esc(val)}">${Util.esc(p)}</button>`;
          }).join("")}
        </div>
      </div>` : "";

    // Same WHICH BANK picker the purchase form uses. Income always lands in an
    // account, so unlike purchases there's no payment type gating it.
    const incBankChipsHtml = banks.length ? `
      <div data-learn="WHICH BANK. IF YOU KEEP MORE THAN ONE CHECKING ACCOUNT, PICK THE ONE THIS LANDED IN. ADD ACCOUNTS IN SETTINGS.">
        <div class="sub-label">WHICH BANK</div>
        <div class="chips" data-scroll-key="inc-bank-chips">
          ${banks.map(b => `<button class="chip ${incomeForm.bankId===b.id?'active':''}" data-action="inc-pick-bank" data-id="${Util.esc(b.id)}">${Util.esc(b.label)}</button>`).join("")}
          ${incomeForm.bankId ? `<button class="chip" data-action="inc-pick-bank" data-id="">× NONE</button>` : ""}
        </div>
      </div>` : "";

    const incExpectedRows = (s.income || []).length
      ? (s.income || []).map(i => {
          const entry = clearedFor(i.id);
          const expected = Number(i.amount) || 0;
          const actual = entry ? (Number(entry.amount) || 0) : 0;
          const showActual = entry && Math.abs(actual - expected) >= 0.01;
          return `
            <div class="inc-row">
              <div>
                <div class="inc-label">${Util.esc(i.label)}</div>
                ${showActual ? `<div class="meta">RECEIVED ${Util.esc(Util.fmtMoney(actual, 2))}</div>` : ""}
              </div>
              <div class="inc-amt">${
                (incExpEdit && incExpEdit.id === i.id)
                  ? `<input class="wiz-amt" id="inc-exp-input" data-action="inc-exp-input" data-id="${Util.esc(i.id)}" inputmode="decimal" value="${Util.esc(incExpEdit.value)}" aria-label="EXPECTED AMOUNT">`
                  : `<button class="link" style="padding:0;min-height:auto;text-decoration:none;border-bottom:1px solid rgba(26,58,140,0.4);font-size:15px;font-weight:400;letter-spacing:inherit;" data-action="inc-exp-edit" data-id="${Util.esc(i.id)}" data-learn="TAP TO CHANGE WHAT YOU EXPECT FROM THIS SOURCE. IT SAVES WHEN YOU PRESS ENTER OR TAP AWAY. IT ONLY MOVES THE EXPECTED FIGURE; IF THIS SOURCE IS ALREADY MARKED CLEARED, THE AMOUNT YOU ACTUALLY RECEIVED IS LEFT ALONE.">${Util.esc(Util.fmtMoney(expected, 0))}</button>`
              }</div>
              <button class="txn-check ${entry ? "checked" : ""}" data-action="inc-toggle" data-id="${Util.esc(i.id)}" aria-label="CLEARED" data-learn="MARK THIS INCOME AS RECEIVED FOR THIS MONTH. CHECKING IT RAISES SAFE TO SPEND BY THE AMOUNT MINUS YOUR TITHE PERCENTAGE. UNCHECKING UNDOES IT EXACTLY."></button>
            </div>`;
        }).join("")
      : `<div class="meta">NO INCOME SOURCES; ADD THEM IN SETTINGS</div>`;

    const incomeSectionHtml = `
      <div class="section-label" style="margin-top:16px;" data-learn="LOG INCOME BLOCK. RECORD MONEY YOU ACTUALLY RECEIVED, OR TICK AN EXPECTED SOURCE BELOW AS CLEARED.">→ LOG INCOME</div>
      <div class="stack-24" style="margin-top:24px;">
        <div>
          <div class="sub-label">AMOUNT</div>
          <input class="underline big num-input" id="inc-amount" inputmode="decimal" placeholder="$0.00" value="${Util.esc(incomeForm.amount)}" data-learn="ENTER THE AMOUNT YOU ACTUALLY RECEIVED.">
        </div>
        ${incPersonChips}
        ${incBankChipsHtml}
        <div>
          <div class="sub-label">NOTE</div>
          <input class="underline" id="inc-note" placeholder="WHERE DID IT COME FROM?" value="${Util.esc(incomeForm.note)}" maxlength="60" data-learn="WHERE THIS MONEY CAME FROM, LIKE 'BIRTHDAY GIFT' OR 'SIDE JOB'. THIS BECOMES THE LABEL ON THE ENTRY. YOUR SET-UP PAYCHECKS ARE TICKED OFF IN THE LIST BELOW INSTEAD.">
        </div>
        ${formErrors.income ? `<div class="text-danger meta">${Util.esc(formErrors.income)}</div>` : ""}
        <button class="cta" data-action="inc-log-it" data-learn="RECORD THIS MONEY AS RECEIVED. SAFE TO SPEND GOES UP BY THE AMOUNT MINUS YOUR TITHE PERCENTAGE.">→ LOG IT</button>
      </div>

      <div style="margin-top:32px;" data-learn="YOUR SET-UP INCOME SOURCES AND WHETHER EACH HAS ARRIVED THIS MONTH. ONLY CLEARED INCOME COUNTS TOWARD SAFE TO SPEND.">
        <div class="inc-head">
          <div class="sub-label">SOURCE</div>
          <div class="sub-label">EXPECTED</div>
          <div class="sub-label">CLEARED?</div>
        </div>
        ${incExpectedRows}
        <div class="sub-label" style="margin-top:16px;">RECEIVED ${Util.esc(Util.fmtMoney(received, 0))} OF ${Util.esc(Util.fmtMoney(expectedIncome, 0))} EXPECTED</div>
      </div>`;

    return `
        <section class="section ${logSubTab === "income" ? "teal" : "gray"}">
          <div class="subtab-row" data-learn="SWITCH BETWEEN LOGGING A PURCHASE AND LOGGING INCOME YOU'VE RECEIVED. YOUR HALF-FILLED FORM IS KEPT WHEN YOU SWITCH.">
            <button class="subtab ${logSubTab === "purchase" ? "active" : ""}" data-action="log-subtab" data-sub="purchase" data-learn="LOG MONEY GOING OUT.">LOG A PURCHASE</button>
            <button class="subtab ${logSubTab === "income" ? "active" : ""}" data-action="log-subtab" data-sub="income" data-learn="LOG MONEY COMING IN, AND MARK YOUR EXPECTED INCOME AS RECEIVED.">LOG INCOME</button>
          </div>
          ${logSubTab === "income" ? incomeSectionHtml : `
          <div class="section-label" style="margin-top:16px;" data-learn="LOG A PURCHASE BLOCK. FILL IN AMOUNT, PICK A CATEGORY, CHOOSE DEBIT OR CREDIT, AND HIT LOG IT.">→ LOG A PURCHASE</div>
          <div class="stack-24" style="margin-top:24px;">
            <div>
              <div class="sub-label">AMOUNT</div>
              <input class="underline big num-input" id="log-amount" inputmode="decimal" placeholder="$0.00" value="${Util.esc(logForm.amount)}" data-learn="ENTER THE PURCHASE AMOUNT IN DOLLARS. DECIMALS OPTIONAL.">
            </div>
            <div data-learn="CATEGORY PICKER. TAP A CHIP TO ASSIGN THIS PURCHASE TO A SPENDING CATEGORY OR A BILL. DEBTS AREN'T LISTED HERE — LOG DEBT PAYMENTS FROM THE DEBTS TAB.">
              <div class="sub-label">CATEGORY</div>
              <div class="chips" data-scroll-key="log-cat-chips">${chipsHtml || `<div class="meta">NO CATEGORIES; ADD SOME IN SETTINGS</div>`}</div>
            </div>
            <div>
              <div class="sub-label">PAYMENT</div>
              <div class="toggle-row" data-learn="DEBIT SUBTRACTS FROM SAFE TO SPEND IMMEDIATELY. CREDIT LEAVES SAFE TO SPEND FLAT UNTIL YOU PAY THE CARD; UNPAID CREDIT IS TRACKED IN THE CREDIT THIS MONTH BLOCK ON THE DASHBOARD.">
                <button class="toggle ${logForm.paymentType==='cash'?'active':''}" data-action="pick-pay" data-pay="cash" data-learn="MONEY FROM YOUR CHECKING ACCOUNT. THE AMOUNT COMES OUT OF SAFE TO SPEND NOW.">DEBIT</button>
                <button class="toggle ${logForm.paymentType==='credit'?'active':''}" data-action="pick-pay" data-pay="credit" data-learn="CREDIT CARD. THE AMOUNT SITS UNDER UNPAID CREDIT UNTIL THE CARD IS PAID OFF.">CREDIT</button>
              </div>
            </div>
            ${cardChipsHtml}
            ${bankChipsHtml}
            ${personChips}
            <div>
              <div class="sub-label">NOTE</div>
              <input class="underline" id="log-note" placeholder="NOTE (OPTIONAL)" value="${Util.esc(logForm.note)}" maxlength="60" data-learn="OPTIONAL SHORT NOTE FOR THE TRANSACTION LIST (E.G. 'HEB RUN').">
            </div>
            ${formErrors.log ? `<div class="text-danger meta">${Util.esc(formErrors.log)}</div>` : ""}
            <button class="cta" data-action="log-it" data-learn="SAVE THIS TRANSACTION. IT APPEARS IN THE LIST BELOW AND ON YOUR PARTNER'S PHONE; SAFE TO SPEND AND CATEGORY BARS UPDATE INSTANTLY.">→ LOG IT</button>
          </div>`}
        </section>

        <section class="section off-white">
          <div class="section-label" style="margin-bottom:24px;" data-learn="TRANSACTIONS. EVERYTHING YOU'VE LOGGED OR IMPORTED, PLUS THE IMPORT TOOLS AND THE MONTH NAVIGATOR.">→ TRANSACTIONS</div>
          <button class="link" data-action="import-toggle" data-learn="IMPORT FROM BANK. UPLOAD A CSV FROM YOUR BANK OR PASTE STATEMENT TEXT. THE APP MATCHES CATEGORIES, DETECTS DUPLICATES, AND LETS YOU REVIEW BEFORE ANYTHING IS SAVED.">${importMenuOpen ? "× CLOSE" : "→ IMPORT FROM BANK"}</button>
          ${importMenuOpen ? `
            <div class="import-actions">

  // Writes the whole income array back. s.income is an array, so this is a
  // read-modify-write of the entire list; arrayUnion is for transaction
  // appends only and would duplicate entries here.
  async function commitIncomeExpected(s) {
    if (!incExpEdit) return;
    const id = incExpEdit.id;
    const raw = String(incExpEdit.value == null ? "" : incExpEdit.value);
    incExpEdit = null;
    const src = (s.income || []).find(x => x.id === id);
    if (!src) { render(); return; }
    const parsed = parseFloat(raw.replace(/[^0-9.\-]/g, ""));
    const next = isFinite(parsed) ? Math.round(parsed * 100) / 100 : (Number(src.amount) || 0);
    if (next === (Number(src.amount) || 0)) { render(); return; }
    const arr = (s.income || []).map(x => x.id === id ? { ...x, amount: next } : x);
    try {
      // Only i.amount moves. incomeLog is untouched, so a source already marked
      // cleared keeps the exact figure that was actually received.
      await DataService.update({ income: arr });
    } catch (e) {
      formErrors.income = "COULDN'T SAVE; CHECK CONNECTION";
      console.warn(e);
    }
    render();
  }

  function bindLogEvents(s) {
    const amt = root.querySelector("#log-amount");
    if (amt) amt.addEventListener("input", e => { logForm.amount = e.target.value; });
    const note = root.querySelector("#log-note");
    if (note) note.addEventListener("input", e => { logForm.note = e.target.value; });

    // ---- Log screen sub-tabs + LOG INCOME -------------------------------
    // Switching sub-tabs only changes local UI state; logForm is untouched so a
    // half-filled purchase survives the round trip.
    // (open-new-month-inline moved to bindLimeBlockEvents; the nudge that fires
    // it now renders in the shared lime block on every tab.)
    root.querySelectorAll("[data-action=log-subtab]").forEach(el => {
      el.addEventListener("click", () => { logSubTab = el.dataset.sub; render(); });
    });

    // ---- Inline edit of an expected-income amount ------------------------
    root.querySelectorAll("[data-action=inc-exp-edit]").forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.id;
        const src = (s.income || []).find(x => x.id === id);
        incExpEdit = { id, value: src ? String(Number(src.amount) || 0) : "" };
        render();
      });
    });
    const expInput = root.querySelector("#inc-exp-input");
    if (expInput) {
      // Focus and select so the first keystroke replaces the old figure.
      try { expInput.focus(); expInput.select(); } catch (e) {}
      expInput.addEventListener("input", e => {
        if (incExpEdit) incExpEdit.value = e.target.value;
      });
      expInput.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); commitIncomeExpected(s); }
        else if (e.key === "Escape") { e.preventDefault(); incExpEdit = null; render(); }
      });
      // Tapping anywhere else commits, which is the whole point of an inline
      // edit; there is no save button competing for the row's width.
      expInput.addEventListener("blur", () => { commitIncomeExpected(s); });
    }
    const iAmt = root.querySelector("#inc-amount");
    if (iAmt) iAmt.addEventListener("input", e => { incomeForm.amount = e.target.value; });
    const iNote = root.querySelector("#inc-note");
    if (iNote) iNote.addEventListener("input", e => { incomeForm.note = e.target.value; });
    root.querySelectorAll("[data-action=inc-pick-bank]").forEach(el => {
      el.addEventListener("click", () => { incomeForm.bankId = el.dataset.id || null; render(); });
    });
    root.querySelectorAll("[data-action=inc-pick-person]").forEach(el => {
      el.addEventListener("click", () => { incomeForm.person = el.dataset.person; render(); });
    });
    root.querySelectorAll("[data-action=inc-log-it]").forEach(el => {
      el.addEventListener("click", () => submitIncome(s));
    });
    root.querySelectorAll("[data-action=inc-toggle]").forEach(el => {
      el.addEventListener("click", () => toggleIncomeCleared(s, el.dataset.id));
    });

    root.querySelectorAll("[data-action=pick-cat]").forEach(el => {
      el.addEventListener("click", () => {
        logForm.categoryId = el.dataset.id;
        logForm.categoryType = el.dataset.type;
        render();
      });
    });
    root.querySelectorAll("[data-action=pick-pay]").forEach(el => {
      el.addEventListener("click", () => {
        logForm.paymentType = el.dataset.pay;
        if (logForm.paymentType !== "credit") logForm.cardId = null;
        render();
      });
    });
    root.querySelectorAll("[data-action=pick-bank]").forEach(el => {
      el.addEventListener("click", () => { logForm.bankId = el.dataset.id || null; render(); });
    });
    root.querySelectorAll("[data-action=pick-card]").forEach(el => {
      el.addEventListener("click", () => { logForm.cardId = el.dataset.id || null; render(); });
    });
    root.querySelectorAll("[data-action=pick-person]").forEach(el => {
      el.addEventListener("click", () => { logForm.person = el.dataset.person; render(); });
    });
    const cta = root.querySelector("[data-action=log-it]");
    if (cta) cta.addEventListener("click", () => submitLog(s));

    // Import entry point
    root.querySelectorAll("[data-action=import-toggle]").forEach(el => {
      el.addEventListener("click", () => { importMenuOpen = !importMenuOpen; render(); });
    });
    root.querySelectorAll("[data-action=dismiss-import-notice]").forEach(el => {
      el.addEventListener("click", () => { if (postImportNotice) postImportNotice.dismissed = true; render(); });
    });
    // Transaction-list month navigator. Clamps happen in the render pass so the
    // handlers just shift by one calendar month.
    root.querySelectorAll("[data-action=month-prev]").forEach(el => {
      el.addEventListener("click", () => {
        const cur = viewedTxnMonth || s.currentMonth;
        let [y, m] = cur.split("-").map(Number);
        m--; if (m < 1) { m = 12; y--; }
        viewedTxnMonth = `${y}-${String(m).padStart(2,"0")}`;
        render();
      });
    });
    root.querySelectorAll("[data-action=month-next]").forEach(el => {
      el.addEventListener("click", () => {
        const cur = viewedTxnMonth || s.currentMonth;
        let [y, m] = cur.split("-").map(Number);
        m++; if (m > 12) { m = 1; y++; }
        const next = `${y}-${String(m).padStart(2,"0")}`;
        // No future browsing: snap back to null (pinned to currentMonth).
        viewedTxnMonth = next >= s.currentMonth ? null : next;
        render();
      });
    });
    root.querySelectorAll("[data-action=import-csv-pick]").forEach(el => {
      el.addEventListener("click", () => {
        const fi = root.querySelector("#csv-file-input");
        if (fi) fi.click();
      });
    });
    const fi = root.querySelector("#csv-file-input");
    if (fi) fi.addEventListener("change", (e) => onCsvFilePicked(s, e.target.files && e.target.files[0]));
    root.querySelectorAll("[data-action=import-paste]").forEach(el => {
      el.addEventListener("click", () => openPasteOverlay());
    });
    // Bulk category-edit handlers
    root.querySelectorAll("[data-action=bulk-toggle]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.dataset.id;
        if (bulkSelection[id]) delete bulkSelection[id]; else bulkSelection[id] = true;
        // Any change to the selection invalidates a pending delete confirm, so
        // the count in "DELETE N?" can never drift from what's actually checked.
        bulkDeleteConfirmOpen = false;
        // Clear staged category if nothing is selected anymore.
        if (!Object.keys(bulkSelection).length) { bulkStagedCategoryId = null; bulkPickerOpen = false; }
        render();
      });
    });
    root.querySelectorAll("[data-action=bulk-set-category]").forEach(el => {
      el.addEventListener("click", () => { bulkPickerOpen = !bulkPickerOpen; render(); });
    });
    root.querySelectorAll("[data-action=bulk-pick]").forEach(el => {
      el.addEventListener("click", () => {

        render();
      });
    });
    root.querySelectorAll("[data-action=bulk-save]").forEach(el => {
      el.addEventListener("click", () => saveBulkCategoryEdits(s));
    });
    root.querySelectorAll("[data-action=bulk-cancel]").forEach(el => {
      el.addEventListener("click", () => {
        Object.keys(bulkSelection).forEach(k => delete bulkSelection[k]);
        bulkStagedCategoryId = null;
        bulkPickerOpen = false;
        bulkDeleteConfirmOpen = false;
        render();
      });
    });
    root.querySelectorAll("[data-action=bulk-delete-ask]").forEach(el => {
      el.addEventListener("click", () => { bulkDeleteConfirmOpen = true; bulkPickerOpen = false; render(); });
    });
    root.querySelectorAll("[data-action=bulk-delete-cancel]").forEach(el => {
      el.addEventListener("click", () => { bulkDeleteConfirmOpen = false; render(); });
    });
    root.querySelectorAll("[data-action=bulk-delete-yes]").forEach(el => {
      el.addEventListener("click", () => deleteBulkTxns(s));
    });
    // Clear-log confirm
    root.querySelectorAll("[data-action=clear-log-open]").forEach(el => {
      el.addEventListener("click", () => { clearLogConfirmOpen = true; render(); });
    });
    root.querySelectorAll("[data-action=clear-log-cancel]").forEach(el => {
      el.addEventListener("click", () => { clearLogConfirmOpen = false; render(); });
    });
    root.querySelectorAll("[data-action=clear-log-confirm]").forEach(el => {
      el.addEventListener("click", () => clearAllTransactions(s));
    });

    bindTxnRowEvents(s);
  }

  // Bulk category-edit control bar rendered between the month nav and the list.

      .join("");

        <span class="sub-label">${n} SELECTED</span>

        ${bulkStagedCategoryId ? `<button class="link" data-action="bulk-save" data-learn="COMMIT THE STAGED CATEGORY TO EVERY CHECKED ROW IN ONE WRITE. ALSO UPDATES MERCHANT MEMORY.">→ SAVE</button>` : ""}
        <button class="link text-danger" data-action="bulk-delete-ask" data-learn="PERMANENTLY DELETE EVERY CHECKED ROW. ASKS FOR CONFIRMATION FIRST.">× DELETE</button>
        <button class="link text-danger" data-action="bulk-cancel" data-learn="CLEAR ALL CHECKBOXES AND ANY STAGED CATEGORY.">× CANCEL</button>
