  // Merge, never clobber: a proposal whose name matches an existing entry
  // updates that entry's amount/day instead of creating a duplicate.
  async function commitWizard(s) {
    const r = importFlow.wizardResult;
    if (!r) return;
    const picks = importFlow.wizardPicks, edits = importFlow.wizardEdits;
    const valOf = (p, f) => {
      const e = edits[p.id] || {};
      const v = e[f] != null ? e[f] : p[f];
      const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
      return isFinite(n) ? n : 0;
    };
    const income = (s.income || []).slice();
    const bills = (s.bills || []).slice();
    // An existing entry may only absorb ONE proposal. Without this, two
    // paychecks from the same employer both fuzzy-match "Paycheck 1" and the
    // second silently overwrites the first, leaving "Paycheck 2" at zero.
    const usedIncome = new Set(), usedBills = new Set();
    // Two paychecks from one employer share a merchant name. Append the day so
    // the budget doesn't end up with two identically-named entries.
    const labelFor = (p, siblings) => {
      const dupes = siblings.filter(x => x.label === p.label && picks[x.id]);
      if (dupes.length < 2) return p.label;
      const e = edits[p.id] || {};
      const d = e.dueDateOfMonth != null ? e.dueDateOfMonth : p.dueDateOfMonth;
      return (p.label + " · DAY " + d).slice(0, 60);
    };
    let added = 0, updated = 0;
    r.income.filter(p => picks[p.id]).forEach(p => {
      const amt = Math.round(valOf(p, "amount") * 100) / 100;
      const day = Math.min(28, Math.max(1, Math.round(valOf(p, "dueDateOfMonth")) || 1));
      const hit = income.find(i => !usedIncome.has(i.id) && fuzzyLabelMatch(i.label, p.label));
      if (hit) { usedIncome.add(hit.id); hit.amount = amt; hit.dueDateOfMonth = day; updated++; }
      else {
        const nid = Util.uuid();
        usedIncome.add(nid);
        income.push({ id: nid, label: labelFor(p, r.income), amount: amt, dueDateOfMonth: day });
        added++;
      }
    });
    r.bills.filter(p => picks[p.id]).forEach(p => {
      const amt = Math.round(valOf(p, "amount") * 100) / 100;
      const day = Math.min(28, Math.max(1, Math.round(valOf(p, "dueDateOfMonth")) || 1));
      const hit = bills.find(b => !usedBills.has(b.id) && fuzzyLabelMatch(b.label, p.label));
      if (hit) { usedBills.add(hit.id); hit.amount = amt; hit.dueDateOfMonth = day; updated++; }
      else {
        const nid = Util.uuid();
        usedBills.add(nid);
        bills.push({ id: nid, label: labelFor(p, r.bills), amount: amt, dueDateOfMonth: day, category: "bill" });
        added++;
      }
    });
    if (!added && !updated) {
      importFlow.error = "TICK AT LEAST ONE ITEM, OR SKIP FOR NOW";
      render();
      return;
    }
    let finalIncome = income, finalBills = bills;
    if (importFlow.wizardTidy) {
      finalIncome = income.filter(i => Number(i.amount) > 0 || usedIncome.has(i.id));
      finalBills = bills.filter(b => Number(b.amount) > 0 || usedBills.has(b.id));
    }
    try {
      await DataService.update({ income: finalIncome, bills: finalBills });
      resetImportFlow();
      importMenuOpen = false;
      currentTab = "log";
      render();
    } catch (e) { alert("COULDN'T SAVE; CHECK CONNECTION"); console.warn(e); }
  }

  function renderImportOverlay(s) {
    // Idempotent: remove any prior .overlay before appending a fresh one so
    // handlers can just call render() without a manual overlay.remove() first.
    // captureScrollState() in the render wrapper already read the outgoing
    // scroll positions off the prior overlay by the time we get here.
    const priorOverlays = document.querySelectorAll(".overlay");
    priorOverlays.forEach(o => o.remove());
    const stage = importFlow.stage;
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    // The .overlay element is itself the scroller (.overlay-inner is not), so
    // the scroll key belongs here or deep-scrolling a long review list resets
    // to the top on every chip tap. Keyed per stage so each stage starts fresh
    // but re-renders within a stage preserve position.
    overlay.setAttribute("data-scroll-key", "import-overlay-" + stage);
    let inner = "";
    if (stage === "wizard-offer") inner = renderWizardOffer();
    else if (stage === "wizard-review") inner = renderWizardReview(s);
    else if (stage === "paste-input") inner = renderPasteInput();
    else if (stage === "shot-input") inner = renderShotInput();
    else if (stage === "ask-date") inner = renderAskDate();
    else if (stage === "no-dates") inner = renderNoDates();
    else if (stage === "error") inner = renderImportError();
    else if (stage === "learning") inner = renderLearning(s);
    else if (stage === "review") inner = renderReview(s);
    overlay.innerHTML = `<div class="overlay-inner" data-scroll-key="import-overlay-inner">${inner}</div>`;
    document.body.appendChild(overlay);
    bindImportOverlay(s, overlay);
  }

      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div class="overlay-title">→ PASTE TRANSACTIONS</div>
        <button class="link" data-action="import-cancel">× CLOSE</button>
      </div>
      <div class="text-danger meta" style="margin-top:8px;">COULDN'T FIND DATES IN THIS TEXT; TRY COPYING THE TRANSACTION ROWS ONLY, WITHOUT HEADERS OR SUMMARIES</div>
      <textarea class="paste-area" style="margin-top:16px;" id="paste-input">${Util.esc(importFlow.rawText)}</textarea>
      <button class="cta" style="margin-top:16px;" data-action="paste-parse">→ TRY AGAIN</button>
    `;
  }

  function renderImportError() {
    return `
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div class="overlay-title">→ IMPORT</div>
        <button class="link" data-action="import-cancel">× CLOSE</button>
      </div>
      <div class="text-danger meta">${Util.esc(importFlow.error || "SOMETHING WENT WRONG")}</div>
    `;

  function renderLearning(s) {
    if (importFlow.kind === "csv") return renderLearningCsv(s);
    return renderLearningPaste(s);
  }

  function renderLearningCsv(s) {
    const l = importFlow.learn;
    const headers = importFlow.csvHeaders;
    const sampleRows = importFlow.csvRows.slice(0, 3);
    const roleOf = (i) => {
      if (l.dateColumn === i) return "picked date";
      if (l.amountColumn === i) return "picked amount";
      if (l.descriptionColumn === i) return "picked description";
      if (l.balanceColumn === i) return "picked balance";
      return "";
    };
    const headerCells = headers.map((h, i) => {
      const dot = (role) => (l[role+"Column"] === i ? "* " : "");
      return `<th>
        <div>${Util.esc(h || `COL ${i+1}`)}</div>
        <button class="csv-col-btn ${l.dateColumn===i?'picked':''}" data-action="csv-pick-col" data-role="date" data-i="${i}">${dot("date")}DATE</button>
        <button class="csv-col-btn ${l.amountColumn===i?'picked':''}" data-action="csv-pick-col" data-role="amount" data-i="${i}">${dot("amount")}AMOUNT</button>
        <button class="csv-col-btn ${l.descriptionColumn===i?'picked':''}" data-action="csv-pick-col" data-role="description" data-i="${i}">${dot("description")}DESC</button>
        <button class="csv-col-btn ${l.balanceColumn===i?'picked':''}" data-action="csv-pick-col" data-role="balance" data-i="${i}">${dot("balance")}BALANCE</button>
      </th>`;
    }).join("");
    const rowsHtml = sampleRows.map(r => `<tr>${r.map(c => `<td>${Util.esc(c)}</td>`).join("")}</tr>`).join("");
    return `
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div class="overlay-title">→ NEW ACCOUNT</div>
        <button class="link" data-action="import-cancel">× CLOSE</button>
      </div>
      <div class="overlay-sub">MAP COLUMNS FROM ${Util.esc(importFlow.fileName || "CSV")}</div>
      <div class="meta" style="margin-top:8px; opacity:0.75;">DATE, AMOUNT AND DESC ARE REQUIRED. BALANCE IS OPTIONAL — MAP IT AND CLEAR WILL OFFER THE CLOSING BALANCE WHEN YOU CONFIRM YOUR ACCOUNT BALANCE. TAP A PICKED BUTTON AGAIN TO UNSET IT.</div>
      <div class="csv-preview"><table>
        <thead><tr>${headerCells}</tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table></div>
      ${renderAccountInfoBlock()}
      ${importFlow.error ? `<div class="text-danger meta" style="margin-top:12px;">${Util.esc(importFlow.error)}</div>` : ""}
      <button class="cta" style="margin-top:24px;" data-action="learning-continue">→ CONTINUE</button>
    `;
  }

  function renderLearningPaste(s) {
    const l = importFlow.learn;
    const items = importFlow.pasteItems.slice(0, 3);
    const previewHtml = items.map(it => `
      <div class="preview-txn">
        <div class="d">${Util.esc(Util.fmtDateShort(it.date))}</div>
        <div class="desc">${Util.esc(it.description)}</div>
        <div class="a">${Util.esc((it.amount<0?'-':'')+Util.fmtMoney(Math.abs(it.amount),2).replace(/^-\$/,'$'))}</div>
      </div>
    `).join("");
    const balanceQ = (l.hasBalancePrompt && !l.somethingsWrong) ? `
      <div class="overlay-sub" style="margin-top:24px;">SOME LINES HAVE TWO DOLLAR AMOUNTS. IS THE SECOND ONE A RUNNING BALANCE?</div>
      <div class="toggle-row">
        <button class="toggle ${l.balanceIsAmount===false?'active':''}" data-action="learn-balance" data-v="ignore">YES; IGNORE IT</button>
        <button class="toggle ${l.balanceIsAmount===true?'active':''}" data-action="learn-balance" data-v="amount">NO; IT'S THE AMOUNT</button>
      </div>
    ` : "";
    // Show negative-is-purchase only when the paste is ambiguous (mixed signs).
    const signQ = l.negativeIsPurchase == null ? `
      <div class="overlay-sub" style="margin-top:24px;">ARE PURCHASES SHOWN AS NEGATIVE NUMBERS?</div>
      <div class="toggle-row">
        <button class="toggle ${l.negativeIsPurchase===true?'active':''}" data-action="learn-sign" data-v="yes">YES</button>
        <button class="toggle ${l.negativeIsPurchase===false?'active':''}" data-action="learn-sign" data-v="no">NO</button>
      </div>
    ` : "";
    // Effective override values displayed on the re-parse controls.
    const ov = l.override || {};
    const auto = importFlow.pasteStructure || { amountPos: "first", linesPerTxn: 1 };
    const effAmountPos = ov.amountPos || auto.amountPos;
    const effSecondBal = ov.secondIsBalance == null ? true : !!ov.secondIsBalance;
    const effLines = ov.linesPerTxn || auto.linesPerTxn;
    const wrongPanel = l.somethingsWrong ? `
      <div class="overlay-sub" style="margin-top:24px;">AMOUNT IS THE</div>
      <div class="toggle-row">
        <button class="toggle ${effAmountPos==='first'?'active':''}" data-action="reparse-amt" data-v="first">FIRST NUMBER</button>
        <button class="toggle ${effAmountPos==='last'?'active':''}" data-action="reparse-amt" data-v="last">LAST NUMBER</button>
      </div>
      <div class="overlay-sub" style="margin-top:16px;">SECOND NUMBER IS A RUNNING BALANCE</div>
      <div class="toggle-row">
        <button class="toggle ${effSecondBal===true?'active':''}" data-action="reparse-sec" data-v="yes">YES</button>
        <button class="toggle ${effSecondBal===false?'active':''}" data-action="reparse-sec" data-v="no">NO</button>
      </div>
      <div class="overlay-sub" style="margin-top:16px;">LINES PER TRANSACTION</div>
      <div class="toggle-row">
        <button class="toggle ${effLines===1?'active':''}" data-action="reparse-lpt" data-v="1">1</button>
        <button class="toggle ${effLines===2?'active':''}" data-action="reparse-lpt" data-v="2">2</button>
        <button class="toggle ${effLines===3?'active':''}" data-action="reparse-lpt" data-v="3">3</button>
      </div>
      <button class="cta ghost" style="margin-top:12px;" data-action="reparse-preview">→ RE-PREVIEW</button>
    ` : "";
    return `
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div class="overlay-title">→ NEW ACCOUNT</div>
        <button class="link" data-action="import-cancel">× CLOSE</button>
      </div>
      <div class="overlay-sub">HERE'S WHAT WE FOUND; DOES THIS LOOK RIGHT?</div>
      <div style="margin-top:12px;">${previewHtml || `<div class="meta">NO TRANSACTIONS DETECTED</div>`}</div>
      <div class="toggle-row" style="margin-top:12px;">
        <button class="toggle ${l.somethingsWrong?'':'active'}" data-action="paste-looks-right">LOOKS RIGHT</button>
        <button class="toggle ${l.somethingsWrong?'active':''}" data-action="paste-somethings-wrong">× SOMETHING'S WRONG</button>
      </div>
      ${wrongPanel}
      ${balanceQ}
      ${signQ}
      ${renderAccountInfoBlock()}
      ${importFlow.error ? `<div class="text-danger meta" style="margin-top:12px;">${Util.esc(importFlow.error)}</div>` : ""}
      <button class="cta" style="margin-top:24px;" data-action="learning-continue">→ CONTINUE</button>
    `;
  }

  function renderAccountInfoBlock() {
    const l = importFlow.learn;
    return `
      <div class="overlay-sub" style="margin-top:24px;">WHAT SHOULD WE CALL THIS ACCOUNT?</div>
      <input class="underline" style="margin-top:8px;" id="learn-label" value="${Util.esc(l.label)}" placeholder="CHASE CHECKING" maxlength="24">
      <div class="overlay-sub" style="margin-top:24px;">IS THIS A CREDIT CARD OR CHECKING ACCOUNT?</div>
      <div class="toggle-row">
        <button class="toggle ${l.paymentType==='cash'?'active':''}" data-action="learn-pay" data-v="cash">CHECKING</button>

      </div>

  }

  function renderReview(s) {
    const isCouple = s.settings && s.settings.mode === "couple";
    const currentMonth = s.currentMonth;
    const allRows = importFlow.reviewRows;
    const spendingCats = s.spendingCategories || [];
    const cards = s.creditCards || [];
    const shown = importFlow.showOlder ? allRows : allRows.filter(r => r.date.slice(0,7) >= currentMonth);
    const olderCount = allRows.length - shown.length;
    const label = importFlow.matchedProfile ? importFlow.matchedProfile.label : (importFlow.learn.label || "IMPORT");
    const recognized = !!importFlow.matchedProfile && !importFlow.stageWasLearning;
    const rowsHtml = shown.map(r => renderReviewRow(r, spendingCats, cards, isCouple, s)).join("") ||
      `<div class="meta" style="padding:16px;">NO TRANSACTIONS IN THE CURRENT MONTH</div>`;
    const importable = allRows.filter(r => !r.skipped).length;
    const uncatCount = allRows.filter(r => !r.skipped && !r.categoryId).length;
    const autoRes = importFlow.autoMatchResult;
    // Off-month breakdown BEFORE import, so nothing vanishes silently.
    const monthBuckets = {};
    for (const r of allRows) {
      if (r.skipped) continue;
      const ym = (r.date || "").slice(0, 7);
      if (!ym) continue;
      if (ym === s.currentMonth) continue;
      monthBuckets[ym] = (monthBuckets[ym] || 0) + 1;
    }
    const offMonthHtml = Object.keys(monthBuckets).length ? `
      <div class="text-danger meta" style="margin-top:8px;">
        ${Object.keys(monthBuckets).sort().map(ym => `${monthBuckets[ym]} ROW${monthBuckets[ym]===1?'':'S'} DATED ${Util.esc(Util.fmtMonthLong(ym))}`).join(" · ")}
      </div>
    ` : "";
    // When the layout carried a running balance, the parse was checked against
    // it rather than guessed. Saying so is the difference between "we think
    // this is right" and "the arithmetic closes" — and it is the thing that
    // makes a screenshot import trustworthy.
    const st = importFlow.pasteStructure;
    const chainHtml = (st && st.chainScore != null && st.hasBalance) ? (
      st.chainScore >= 0.999
        ? `<div class="overlay-sub text-success" style="opacity:0.85;" data-learn="EVERY ROW'S RUNNING BALANCE MATCHES THE ONE BELOW IT PLUS ITS OWN AMOUNT. THAT MEANS THE AMOUNTS WERE READ CORRECTLY — IT IS ARITHMETIC, NOT A GUESS.">✓ BALANCES CHECK OUT ACROSS EVERY ROW</div>`
        : `<div class="overlay-sub text-danger" style="opacity:0.9;" data-learn="THE RUNNING BALANCES DON'T ALL ADD UP, WHICH USUALLY MEANS AN AMOUNT WAS MISREAD OR A ROW IS MISSING. CHECK THE AMOUNTS BELOW AGAINST YOUR BANK BEFORE IMPORTING.">× SOME BALANCES DON'T ADD UP · CHECK THE AMOUNTS BELOW</div>`
    ) : "";
    const pendingHtml = importFlow.pendingSkipped ? `
      <div class="overlay-sub" style="opacity:0.7;" data-learn="PENDING TRANSACTIONS HAVEN'T POSTED YET. THE AMOUNT CAN STILL CHANGE AND THEY'LL SHOW UP AGAIN ONCE THEY CLEAR, SO THEY'RE LEFT OUT TO AVOID IMPORTING THEM TWICE.">${importFlow.pendingSkipped} PENDING ROW${importFlow.pendingSkipped === 1 ? "" : "S"} SKIPPED · THEY'LL IMPORT ONCE THEY POST</div>` : "";
    const choicePanel = importFlow.choicePanelOpen ? `
      <div class="settings-group" style="margin-top:16px; background: var(--gray-light);">
        <h3 class="text-danger">${uncatCount} OF ${importable} ROWS HAVE NO CATEGORY</h3>
        ${autoRes ? `<div class="meta" style="margin-bottom:12px;">MATCHED ${autoRes.matched} OF ${autoRes.total}${autoRes.remaining>0 ? `; ${autoRes.remaining} STILL NEED CATEGORIES` : ""}</div>` : ""}
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button class="cta ghost" data-action="import-auto-match">→ AUTO-MATCH CATEGORIES</button>
          <button class="cta ghost" data-action="import-later">→ IMPORT; ASSIGN LATER</button>
          <button class="cta ghost" data-action="import-pick-one-by-one">→ PICK ONE BY ONE</button>
        </div>
      </div>
    ` : "";
    return `
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div class="overlay-title">→ REVIEW IMPORT</div>
        <button class="link" data-action="import-cancel">× CLOSE</button>
      </div>
      <div class="overlay-sub">${recognized ? "RECOGNIZED: " : ""}${Util.esc(label)}</div>
      <div class="overlay-sub" style="opacity:0.7;">${importable} OF ${allRows.length} WILL BE IMPORTED${uncatCount ? ` · ${uncatCount} NEED CATEGORIES` : ""}</div>
      ${chainHtml}
      ${pendingHtml}
      ${offMonthHtml}
      <div style="margin-top:16px;">${rowsHtml}</div>
      ${olderCount > 0 || importFlow.showOlder ? `
        <button class="link" style="margin-top:16px;" data-action="toggle-older">${importFlow.showOlder ? "× HIDE OLDER" : `→ SHOW OLDER TRANSACTIONS (${olderCount})`}</button>
      ` : ""}
      ${importFlow.error ? `<div class="text-danger meta" style="margin-top:12px;">${Util.esc(importFlow.error)}</div>` : ""}
      ${choicePanel}
      <button class="cta" style="margin-top:24px;" data-action="import-commit">→ IMPORT ALL</button>
    `;
  }

  function renderReviewRow(r, spendingCats, cards, isCouple, s) {
    const needsCategory = !r.skipped && !r.categoryId;
    const chips = spendingCats.map(c => `
      <button class="review-cat-chip ${r.categoryId===c.id?'active':''}" data-action="review-cat" data-id="${Util.esc(r.id)}" data-cat="${Util.esc(c.id)}">
        ${Util.esc(c.label)}${(r.categoryAuto && r.categoryId===c.id) ? `<span class="auto">AUTO</span>` : ""}
      </button>
    `).join("");
    const catLabelHtml = needsCategory
      ? `<div class="review-cat-label needs">× PICK A CATEGORY</div>`
      : (r.skipped ? "" : `<div class="review-cat-label">CATEGORY</div>`);
    const personChips = isCouple ? `
      <div class="review-cat-chips" style="margin-top:6px;" data-scroll-key="review-person-${Util.esc(r.id)}">
        ${[s.settings.names[0], s.settings.names[1], "JOINT"].map(p => {
          const val = p.toUpperCase();
          return `<button class="review-cat-chip ${r.person===val?'active':''}" data-action="review-person" data-id="${Util.esc(r.id)}" data-p="${Util.esc(val)}">${Util.esc(p)}</button>`;
        }).join("")}
      </div>
    ` : "";
    const cardChips = r.paymentType === "credit" && cards.length ? `
      <div class="review-cat-chips" style="margin-top:6px;" data-scroll-key="review-card-${Util.esc(r.id)}">
        ${cards.map(c => `<button class="review-cat-chip ${r.cardId===c.id?'active':''}" data-action="review-card" data-id="${Util.esc(r.id)}" data-c="${Util.esc(c.id)}">${Util.esc(c.label)}</button>`).join("")}
        ${r.cardId ? `<button class="review-cat-chip" data-action="review-card" data-id="${Util.esc(r.id)}" data-c="">× NONE</button>` : ""}
      </div>
    ` : "";
    return `
      <div class="review-row ${r.skipped ? 'skipped' : ''} ${needsCategory ? 'needs-category' : ''}">
        <div class="review-row-line">
          <div class="d">${Util.esc(Util.fmtDateShort(r.date))}</div>
          <div class="desc">${Util.esc(r.description)}</div>
          <div class="a">${r.isDeposit ? "+" : "-"}${Util.esc(Util.fmtMoney(r.amount, 2).replace(/^-\$/, "$"))}</div>
        </div>
        ${catLabelHtml}
        <div class="review-cat-chips" data-scroll-key="review-cat-${Util.esc(r.id)}">${chips || `<div class="meta">NO SPENDING CATEGORIES</div>`}</div>
        ${personChips}
        <div class="review-controls">
          <button class="toggle ${r.paymentType==='cash'?'active':''}" data-action="review-pay" data-id="${Util.esc(r.id)}" data-v="cash">DEBIT</button>
          <button class="toggle ${r.paymentType==='credit'?'active':''}" data-action="review-pay" data-id="${Util.esc(r.id)}" data-v="credit">CREDIT</button>
          ${r.skipped
            ? `<button class="unskip-btn" data-action="review-skip" data-id="${Util.esc(r.id)}" data-v="off">→ UN-SKIP</button>`
            : `<button class="skip-btn" data-action="review-skip" data-id="${Util.esc(r.id)}" data-v="on">× SKIP</button>`}
        </div>
        ${cardChips}
        ${r.skipped && r.skipReason ? `<div class="review-skip-reason">${Util.esc(r.skipReason)}</div>` : ""}
        ${(r.incomeMatch && r.incomeMatch.tier === "fuzzy" && r.incomeMatch.answer === null) ? `
          <div class="txn-confirm" style="flex-basis:100%;">
            <span>IS THIS YOUR EXPECTED INCOME PAYMENT (${Util.esc(r.incomeMatch.label)}) LISTED IN YOUR SETTINGS?</span>
            <button data-action="review-income-answer" data-id="${Util.esc(r.id)}" data-v="no">NO</button>
            <button class="yes" data-action="review-income-answer" data-id="${Util.esc(r.id)}" data-v="yes">YES</button>
          </div>` : ""}
        ${(r.incomeMatch && r.incomeMatch.answer === "yes") ? `<div class="review-skip-reason">INCOME: ${Util.esc(r.incomeMatch.label)} · WILL BE CLEARED</div>` : ""}
        ${(r.billMatch && r.billMatch.tier === "fuzzy" && r.billMatch.answer === null) ? `
          <div class="txn-confirm" style="flex-basis:100%;">
            <span>IS THIS YOUR BILL (${Util.esc(r.billMatch.label)}) FROM YOUR SETTINGS?</span>
            <button data-action="review-bill-answer" data-id="${Util.esc(r.id)}" data-v="no">NO</button>
            <button class="yes" data-action="review-bill-answer" data-id="${Util.esc(r.id)}" data-v="yes">YES</button>
          </div>` : ""}
        ${(r.billMatch && (r.billMatch.tier === "exact" || r.billMatch.answer === "yes")) ? `<div class="review-skip-reason">BILL: ${Util.esc(r.billMatch.label)} · WILL BE MARKED PAID</div>` : ""}
      </div>
    `;
  }

  function bindImportOverlay(s, overlay) {
    const q = sel => overlay.querySelectorAll(sel);
    q("[data-action=wizard-skip]").forEach(el => el.addEventListener("click", () => {
      resetImportFlow();
      render();
    }));
    q("[data-action=wizard-paste]").forEach(el => el.addEventListener("click", () => {
      importFlow.kind = "paste";
      importFlow.stage = "paste-input";
      render();
    }));
    q("[data-action=wizard-csv]").forEach(el => el.addEventListener("click", () => {
      // The log screen's file input isn't in this overlay, so make a transient
      // one rather than depending on another screen's markup.
      importFlow.kind = "csv";
      const fi = document.createElement("input");
      fi.type = "file";
      fi.accept = ".csv,text/csv";
      fi.style.display = "none";
      document.body.appendChild(fi);
      fi.addEventListener("change", () => {
        const f = fi.files && fi.files[0];
        fi.remove();
        if (f) onCsvFilePicked(s, f);
      });
      fi.click();
    }));
    q("[data-action=wizard-pick]").forEach(el => el.addEventListener("click", () => {
      const id = el.dataset.id;
      importFlow.wizardPicks[id] = !importFlow.wizardPicks[id];
      importFlow.error = "";
      render();
    }));
    q("[data-action=wizard-edit]").forEach(el => el.addEventListener("input", e => {
      const id = el.dataset.id, f = el.dataset.field;
      if (!importFlow.wizardEdits[id]) importFlow.wizardEdits[id] = {};
      importFlow.wizardEdits[id][f] = e.target.value;
    }));
    q("[data-action=wizard-tidy]").forEach(el => el.addEventListener("click", () => {
      importFlow.wizardTidy = !importFlow.wizardTidy;
      render();
    }));
    q("[data-action=wizard-confirm]").forEach(el => el.addEventListener("click", () => commitWizard(s)));
    q("[data-action=import-cancel]").forEach(el => el.addEventListener("click", () => {
      resetImportFlow();
      render();
    }));
    const ta = overlay.querySelector("#paste-input");
    if (ta) ta.addEventListener("input", e => { importFlow.rawText = e.target.value; });
    q("[data-action=paste-parse]").forEach(el => el.addEventListener("click", () => {
      onPasteSubmit(s);
    }));
    q("[data-action=shot-pick]").forEach(el => el.addEventListener("click", () => {
      const input = overlay.querySelector("#shot-file-input");
      if (input) input.click();
    }));
    overlay.querySelectorAll("#shot-file-input").forEach(el => {
      el.addEventListener("change", () => {
        const files = el.files;
        // Clear the input so picking the same file twice still fires change.
        const picked = files && files.length ? Array.from(files) : [];
        el.value = "";
        if (picked.length) shotsRunOcr(s, picked);
      });
    });
    q("[data-action=shot-parse]").forEach(el => el.addEventListener("click", () => {
      onShotsSubmit(s);
    }));
    overlay.querySelectorAll("#ask-date-input").forEach(el => {
      el.addEventListener("input", () => { if (importFlow.askDate) importFlow.askDate.value = el.value; });
    });
    q("[data-action=ask-date-back]").forEach(el => el.addEventListener("click", () => {
      importFlow.askDate = null;
      importFlow.assumeDate = null;
      importFlow.stage = importFlow.kind === "paste" ? "paste-input" : "shot-input";
      render();
    }));
    q("[data-action=ask-date-confirm]").forEach(el => el.addEventListener("click", () => {
      const a = importFlow.askDate;
      if (!a) return;
      const v = String(a.value || "").trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v) || isNaN(new Date(v + "T00:00:00"))) {
        a.error = "ENTER A VALID DATE";
        render();
        return;
      }
      importFlow.assumeDate = v;
      importFlow.askDate = null;
      if (importFlow.kind === "paste") { onPasteSubmit(s); return; }
      finishShotParse(s, ImportEngine.textParse(importFlow.rawText || "", { assumeDate: v }));
    }));
    q("[data-action=csv-pick-col]").forEach(el => el.addEventListener("click", () => {
      const i = parseInt(el.dataset.i, 10);
      const role = el.dataset.role;
      const l = importFlow.learn;
      // Balance is optional, so tapping the picked column again clears it —
      // otherwise a mis-tap would be stuck on and there is no "none" chip.
      if (role === "date") l.dateColumn = i;
      else if (role === "amount") l.amountColumn = i;
      else if (role === "description") l.descriptionColumn = i;
      else if (role === "balance") l.balanceColumn = (l.balanceColumn === i ? null : i);
      render();
    }));
    q("[data-action=paste-looks-right]").forEach(el => el.addEventListener("click", () => {
      // Collapse the re-parse panel; the user is satisfied with the current preview.
      importFlow.learn.somethingsWrong = false;
      render();
    }));
    q("[data-action=paste-somethings-wrong]").forEach(el => el.addEventListener("click", () => {
      // Reveal inline re-parse controls; do NOT commit best-guess to review yet.
      importFlow.learn.somethingsWrong = true;
      importFlow.error = "";
      // Seed override defaults from the auto-detected structure so the toggles
      // show the current state rather than blanks.
      const auto = importFlow.pasteStructure || {};
      const ov = importFlow.learn.override || {};
      if (ov.amountPos == null) ov.amountPos = auto.amountPos || "first";
      if (ov.secondIsBalance == null) ov.secondIsBalance = true;
      if (ov.linesPerTxn == null) ov.linesPerTxn = auto.linesPerTxn || 1;
      importFlow.learn.override = ov;
      render();
    }));
    q("[data-action=reparse-amt]").forEach(el => el.addEventListener("click", () => {
      const ov = importFlow.learn.override; ov.amountPos = el.dataset.v;
      render();
    }));
    q("[data-action=reparse-sec]").forEach(el => el.addEventListener("click", () => {
      const ov = importFlow.learn.override; ov.secondIsBalance = (el.dataset.v === "yes");
      render();
    }));
    q("[data-action=reparse-lpt]").forEach(el => el.addEventListener("click", () => {
      const ov = importFlow.learn.override; ov.linesPerTxn = parseInt(el.dataset.v, 10) || 1;
      render();
    }));
    q("[data-action=reparse-preview]").forEach(el => el.addEventListener("click", () => {
      // Re-run textParse with the current overrides and refresh preview.
      const ov = importFlow.learn.override || {};
      const rep = ImportEngine.textParse(importFlow.rawText, {
        amountPos: ov.amountPos || undefined,
        secondIsBalance: ov.secondIsBalance == null ? undefined : ov.secondIsBalance,
        linesPerTxn: ov.linesPerTxn || undefined
      });
      importFlow.pasteItems = rep.items;
      // Structure stays auto-detected (fingerprint stability); do not overwrite it.
      render();
    }));
    q("[data-action=learn-balance]").forEach(el => el.addEventListener("click", () => {
      // Legacy question kept when NOT in the SOMETHING'S WRONG panel.
      const isAmount = el.dataset.v === "amount";
      importFlow.learn.balanceIsAmount = isAmount;
      // Also mirror into override.amountPos so downstream consumers see one truth.
      importFlow.learn.override.amountPos = isAmount ? "last" : "first";
      render();
    }));
    q("[data-action=learn-sign]").forEach(el => el.addEventListener("click", () => {
      importFlow.learn.negativeIsPurchase = (el.dataset.v === "yes");
      render();
    }));
    q("[data-action=learn-pay]").forEach(el => el.addEventListener("click", () => {
      importFlow.learn.paymentType = el.dataset.v;
      render();
    }));
    const labelInput = overlay.querySelector("#learn-label");
    if (labelInput) labelInput.addEventListener("input", e => { importFlow.learn.label = e.target.value; });
    q("[data-action=learning-continue]").forEach(el => el.addEventListener("click", () => {
      importFlow.error = "";
      // Read the label from the input at commit time so we don't drop keystrokes.
      const li = overlay.querySelector("#learn-label");
      if (li) importFlow.learn.label = li.value;
      finalizeLearningAndReview(s);
    }));
    q("[data-action=toggle-older]").forEach(el => el.addEventListener("click", () => {
      importFlow.showOlder = !importFlow.showOlder;
      render();
    }));
    q("[data-action=review-cat]").forEach(el => el.addEventListener("click", () => {
      const r = importFlow.reviewRows.find(x => x.id === el.dataset.id);
      if (!r) return;
      r.categoryId = el.dataset.cat;
      r.categoryType = "spending";
      r.categoryAuto = false; // user chose it now
      // Once no row is missing a category, drop the block banner.
      if (importFlow.error && !importFlow.reviewRows.some(x => !x.skipped && !x.categoryId)) importFlow.error = "";
      render();
    }));
    q("[data-action=review-person]").forEach(el => el.addEventListener("click", () => {
      const r = importFlow.reviewRows.find(x => x.id === el.dataset.id);
      if (!r) return;
      r.person = el.dataset.p;
      render();
    }));
    q("[data-action=review-card]").forEach(el => el.addEventListener("click", () => {
      const r = importFlow.reviewRows.find(x => x.id === el.dataset.id);
      if (!r) return;
      r.cardId = el.dataset.c || null;
      render();
    }));
    q("[data-action=review-pay]").forEach(el => el.addEventListener("click", () => {
      const r = importFlow.reviewRows.find(x => x.id === el.dataset.id);
      if (!r) return;
      r.paymentType = el.dataset.v;
      if (r.paymentType !== "credit") r.cardId = null;
      render();
    }));
    q("[data-action=review-skip]").forEach(el => el.addEventListener("click", () => {
      const r = importFlow.reviewRows.find(x => x.id === el.dataset.id);
      if (!r) return;
      if (el.dataset.v === "off") { r.skipped = false; r.skipReason = ""; }
      else { r.skipped = true; r.skipReason = r.skipReason || "SKIPPED"; }
      if (importFlow.error && !importFlow.reviewRows.some(x => !x.skipped && !x.categoryId)) importFlow.error = "";
      render();
    }));
    q("[data-action=review-income-answer]").forEach(el => el.addEventListener("click", () => {
      const r = importFlow.reviewRows.find(x => x.id === el.dataset.id);
      if (!r || !r.incomeMatch) return;
      r.incomeMatch.answer = el.dataset.v;
      // NO means "this deposit isn't that expected paycheck". Remember the
      // rejection so the same question isn't asked again next month.
      if (el.dataset.v === "no") { r.incomeRejected = true; r.incomeMatch = null; }
      render();
    }));
    q("[data-action=review-bill-answer]").forEach(el => el.addEventListener("click", () => {
      const r = importFlow.reviewRows.find(x => x.id === el.dataset.id);
      if (!r || !r.billMatch) return;
      if (el.dataset.v === "yes") {
        r.billMatch.answer = "yes";
        // Assign the bill as this row's category unless one is already set.
        if (!r.categoryId) {
          r.categoryId = r.billMatch.billId;
          r.categoryType = "bill";
          r.categoryAuto = true;
        }
        if (importFlow.error && !importFlow.reviewRows.some(x => !x.skipped && !x.categoryId)) importFlow.error = "";
      } else {
        // NO leaves it as an ordinary uncategorized import row, and is
        // remembered so this merchant isn't proposed as a bill again.
        r.billRejected = true;
        r.billMatch = null;
      }
      render();
    }));
    q("[data-action=import-commit]").forEach(el => el.addEventListener("click", () => {
      commitImport(s);
    }));
    q("[data-action=import-auto-match]").forEach(el => el.addEventListener("click", () => {
      const result = bulkAutoMatchCategories(s, importFlow.reviewRows);
      importFlow.autoMatchResult = result;
      // If everything is now categorized, we can commit straight through; else
      // keep the panel visible so the user can pick IMPORT-LATER or PICK-ONE.
      if (result.remaining === 0) {
        importFlow.choicePanelOpen = false;
        commitImportWrite(s, { allowUncategorized: false });
        return;
      }
      render();
    }));
    q("[data-action=import-later]").forEach(el => el.addEventListener("click", () => {
      importFlow.choicePanelOpen = false;
      commitImportWrite(s, { allowUncategorized: true });
    }));
    q("[data-action=import-pick-one-by-one]").forEach(el => el.addEventListener("click", () => {
      importFlow.choicePanelOpen = false;
      importFlow.autoMatchResult = null;
      render();
    }));
  }

  /* ------------- NEW MONTH OVERLAY (only allowed modal) ------------- */
  // The month advances on its own, so this is no longer a gate you pass to
  // start one — it is where you keep or clear what was carried across into the
  // month you are already in. Only categories that actually brought something
  // with them are listed; the rest have nothing to decide.
  function renderNewMonthOverlay(s) {
    const month = s.currentMonth;
    const cats = (s.spendingCategories||[]);
    const withRoll = cats
      .map(c => ({ cat: c, candidate: BudgetEngine.rolloverCandidate(s, c, month) }))
      .filter(x => x.candidate > 0);
    const rows = withRoll.map(({ cat, candidate }) => {
      // Default reflects what is actually stored, so reopening shows the state
      // you left rather than resetting to "keep" every time.
      const stored = BudgetEngine.rolloverAmountIn(s, cat.id, month);
      const choice = newMonthChoices[cat.id] || (stored > 0 ? "roll" : "reset");
      return `
        <div class="rollover-row">
          <h4>${Util.esc(cat.label)}</h4>
          <div class="amt">${Util.esc(Util.fmtMoney(candidate,0))} CARRIED IN</div>
          <div class="choice-row">
            <button class="${choice==='roll'?'active':''}" data-action="nm-choice" data-id="${Util.esc(cat.id)}" data-choice="roll">KEEP IT</button>
            <button class="${choice==='reset'?'active':''}" data-action="nm-choice" data-id="${Util.esc(cat.id)}" data-choice="reset">CLEAR TO $0</button>
          </div>
        </div>`;
    }).join("");

    // Idempotent: strip any prior overlay before appending a fresh one.
    document.querySelectorAll(".overlay").forEach(o => o.remove());
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    // .overlay is the scroller; see note in renderImportOverlay.
    overlay.setAttribute("data-scroll-key", "newmonth-overlay");
    overlay.innerHTML = `
      <div class="overlay-inner" data-scroll-key="newmonth-overlay-inner">
        <button class="link" data-action="nm-cancel">× CLOSE</button>
        <h2 class="section-label" style="margin-top:16px;">→ ROLLOVERS</h2>
        <div class="meta" style="margin-top:8px;">${Util.esc(Util.fmtMonthLong(month))} · CARRIED IN FROM ${Util.esc(Util.fmtMonthLong(Util.prevMonthYM(month)))}</div>
        <div class="meta" style="margin-top:8px; opacity:0.8;">THE BUDGET MONTH FOLLOWS THE CALENDAR AND UNSPENT MONEY COMES WITH IT. CLEAR ANYTHING YOU'D RATHER START FRESH.</div>
        <div style="margin-top:24px;">${rows || `<div class="meta">NOTHING WAS CARRIED INTO THIS MONTH.</div>`}</div>
        <div class="meta" style="margin-top:24px; opacity:0.8;">SAFE TO SPEND IS BASED ON WHAT'S ACTUALLY IN YOUR ACCOUNT, SO CONFIRMING YOUR BALANCE AT THE START OF A MONTH CLEARS ANYTHING THAT NEVER GOT LOGGED.</div>
        <button class="cta" style="margin-top:12px;" data-action="nm-balance">→ CONFIRM MY BALANCE</button>
        ${withRoll.length ? `<button class="cta big" style="margin-top:12px;" data-action="nm-confirm">→ SAVE ROLLOVERS</button>` : ""}
      </div>`;
    document.body.appendChild(overlay);

    overlay.querySelectorAll("[data-action=nm-choice]").forEach(el => {
      el.addEventListener("click", () => {
        newMonthChoices[el.dataset.id] = el.dataset.choice;
        // Route through the wrapper so scroll state is preserved; the overlay
        // renderer is idempotent (removes any prior overlay before appending).
        render();
      });
    });
    overlay.querySelector("[data-action=nm-cancel]").addEventListener("click", () => {
      newMonthOpen = false; newMonthChoices = {}; render();
    });
    // Anchoring is independent of the rollover choice — the balance is "right
    // now" either way — so this opens the same overlay on top and leaves the
    // choices untouched underneath.
    overlay.querySelector("[data-action=nm-balance]").addEventListener("click", () => openBalanceOverlay(null));
    const confirmBtn = overlay.querySelector("[data-action=nm-confirm]");
    if (confirmBtn) confirmBtn.addEventListener("click", () => confirmNewMonth(s, overlay));
  }

  // Writes the rollover amounts for the month already in progress. It does not
  // move currentMonth — the calendar does that.
  async function confirmNewMonth(s, overlay) {
    const month = s.currentMonth;
    const rollovers = {};
    (s.spendingCategories||[]).forEach(c => {
      const candidate = BudgetEngine.rolloverCandidate(s, c, month);
      if (candidate <= 0) return;
      const stored = BudgetEngine.rolloverAmountIn(s, c.id, month);
      const choice = newMonthChoices[c.id] || (stored > 0 ? "roll" : "reset");
      if (choice === "roll") rollovers[c.id] = candidate;
    });
    const patch = {};
    const mr = Object.assign({}, s.monthlyRollover || {});
    mr[month] = rollovers;
    patch.monthlyRollover = mr;
    try {
      await DataService.update(patch);
      newMonthOpen = false;
      newMonthChoices = {};
      render();
    } catch (e) { alert("COULDN'T UPDATE"); console.warn(e); }
  }

  /* ------------- BALANCE ANCHOR ------------- */
  // Opening seeds today's date and, when an import just handed us one, the
  // balance it found. The field is always editable — an extracted balance is a
  // convenience, never the authority, because a statement's closing balance is
  // as-of its own date rather than as-of now.
  function openBalanceOverlay(prefill) {
    balanceForm = {
      amount: prefill != null && isFinite(Number(prefill)) ? String(Math.round(Number(prefill) * 100) / 100) : "",
      date: Util.todayISO(),
      error: "",
      prefill: prefill != null && isFinite(Number(prefill))
    };
    render();
  }

  function renderBalanceOverlay(s) {
    const f = balanceForm;
    const anchor = BudgetEngine.latestAnchor(s);
    const projected = anchor ? BudgetEngine.projectedBalance(s) : null;

    document.querySelectorAll(".overlay").forEach(o => o.remove());
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.setAttribute("data-scroll-key", "balance-overlay");
    overlay.innerHTML = `
      <div class="overlay-inner" data-scroll-key="balance-overlay-inner">
        <button class="link" data-action="bal-cancel">× CLOSE</button>
        <h2 class="section-label" style="margin-top:16px;">→ CONFIRM BALANCE</h2>
        <div class="meta" style="margin-top:8px;">WHAT DOES YOUR BANK SAY YOUR CHECKING BALANCE IS RIGHT NOW? EVERYTHING YOU LOG FROM HERE MOVES THIS NUMBER UNTIL YOU CONFIRM IT AGAIN.</div>
        ${f.prefill ? `<div class="meta" style="margin-top:12px; opacity:0.8;">PRE-FILLED FROM YOUR IMPORT. CHECK IT AGAINST YOUR BANK BEFORE SAVING; A STATEMENT BALANCE CAN BE A FEW DAYS OLD.</div>` : ""}
        ${anchor ? `<div class="meta" style="margin-top:12px; opacity:0.8;">LAST CONFIRMED ${Util.esc(Util.fmtDateShort(anchor.date))} AT ${Util.esc(Util.fmtMoney(Number(anchor.amount) || 0, 0))} · TRACKED NOW AT ${Util.esc(Util.fmtMoney(projected, 0))}</div>` : ""}
        <div style="margin-top:24px;">
          <div class="sub-label">BALANCE</div>
          <input id="bal-amount" class="underline big num-input" inputmode="decimal" placeholder="$0.00" value="${Util.esc(f.amount)}">
        </div>
        <div style="margin-top:24px;">
          <div class="sub-label">AS OF</div>
          <input id="bal-date" class="underline" type="date" value="${Util.esc(f.date)}">
        </div>
        ${f.error ? `<div class="text-danger meta" style="margin-top:12px;">${Util.esc(f.error)}</div>` : ""}
        <button class="cta big" style="margin-top:24px;" data-action="bal-save">→ SAVE BALANCE</button>
      </div>`;
    document.body.appendChild(overlay);

    const amtEl = overlay.querySelector("#bal-amount");

    dateEl.addEventListener("input", () => { balanceForm.date = dateEl.value; });
    overlay.querySelector("[data-action=bal-cancel]").addEventListener("click", () => {

  /* The breakdown behind one of the two headline figures. Two columns that
     reconcile to that figure exactly — what you have against what is already
     claiming it — then the things worth looking at.

     `which` decides which number is being explained, and the two read
     differently on purpose. Safe To Spend is about the stretch you're standing
     in and the things you can fix today; the Tightest Point is about a day you
     can see coming and how the obligations around it are arranged. Sharing one
     renderer keeps the arithmetic identical; the wording and the note list are
     where they diverge. */
  function renderShortfallOverlay(s, which) {
    const mode = which === "safe" ? "safe" : "tight";
    const r = BudgetEngine.shortfallReport(s, mode);
    const isSafe = mode === "safe";
    const money = (n, d) => Util.esc(Util.fmtMoney(n, d == null ? 0 : d));
    // Dates come off the walk as full ISO now, because the low point can fall
    // in next month and a bare day number could not say which.
    const dayLabel = iso => Util.esc(Util.fmtDateShort(iso));
    const isToday = r.date <= r.startISO;
    const short = r.amount < 0;

    const row = (label, amount, sub) => `
        <div class="cat-txn">
          <span class="cat-txn-note">${Util.esc(label)}${sub ? ` <span style="opacity:0.6;">${sub}</span>` : ""}</span>
          <span class="cat-txn-amt">${money(amount)}</span>
        </div>`;

    const haveRows = row(r.balanceDate ? "BALANCE ONCE PAYDAY CLEARS" : "IN THE ACCOUNT NOW",
                         r.balance, r.balanceDate ? "· " + dayLabel(r.balanceDate) : "")
      + r.incoming.map(e => row(e.label, e.amount, "· " + dayLabel(e.date))).join("");
    const claimRows = r.claims.map(c => row(c.label, c.amount, c.date ? "· " + dayLabel(c.date) : "")).join("");

    // The opening sentence: what the figure means, over what stretch, and how
    // it relates to the other one.
    // When the dip lands on payday itself, naming the date twice reads like a
    // stutter — say what it means instead.
    const dipOnPayday = !!r.payDate && r.date === r.payDate;
    // Two different dates belong in this sentence — the payday that closes the
    // window, and the day the low actually falls on — and running them
    // together made the second one describe the first: "YOUR NEXT PAYCHECK ON
    // AUG 5, WHICH IS TODAY" states that the paycheck is today when it is the
    // dip that is. The low gets its own sentence so neither date can be read
    // as the other.
    const windowPhrase = r.payDate
      ? `YOUR NEXT PAYCHECK ON ${dayLabel(r.payDate)}`
      : "THE END OF THE HORIZON";
    const lowSentence = isToday
      ? "THE LOW POINT IS TODAY."
      : dipOnPayday
        ? `THE LOW POINT IS ${dayLabel(r.date)} ITSELF, ONCE THAT DAY'S BILLS GO OUT.`
        : `THE LOW POINT IS ${dayLabel(r.date)}.`;
    const lead = isSafe
      ? `SAFE TO SPEND IS <b>${money(r.amount)}</b> — THE LOWEST YOUR BALANCE GETS BETWEEN NOW AND ${windowPhrase}. ${lowSentence} SPEND UP TO IT AND EVERY BILL DUE IN THAT STRETCH STILL CLEARS. EVERYTHING BELOW ADDS UP TO EXACTLY THAT.`
      : r.hasAfter
        ? `YOUR TIGHTEST POINT IS <b>${money(r.amount)}</b>, ON ${dayLabel(r.date)}. THAT'S THE LOWEST YOUR BALANCE GETS ONCE YOUR ${dayLabel(r.payDate)} PAYCHECK HAS LANDED, THROUGH ${dayLabel(r.horizonEnd)}. SAFE TO SPEND COVERS GETTING TO PAYDAY; THIS IS WHAT'S WAITING ON THE OTHER SIDE OF IT. EVERYTHING BELOW ADDS UP TO EXACTLY THAT.`
        : `YOUR TIGHTEST POINT IS <b>${money(r.amount)}</b>${isToday ? " — AND IT'S TODAY" : `, ON ${dayLabel(r.date)}`}. NO PAYCHECK IS EXPECTED BEFORE ${dayLabel(r.horizonEnd)}, SO THIS IS SIMPLY THE LOWEST YOUR BALANCE GETS BETWEEN NOW AND THEN. EVERYTHING BELOW ADDS UP TO EXACTLY THAT.`;

    // A costed note is only worth stating when undoing the cause actually
    // shifts the figure being explained; rounding to whole dollars means
    // anything under fifty cents is the same number on screen.
    const moves = after => after != null && Math.abs(after - r.amount) >= 0.5;

    // Each note is one sentence about one cause, and where the cause can be
    // undone the sentence carries what the number would become.
    const noteHtml = r.notes.map(n => {
      if (n.kind === "income") {
        const names = n.labels.slice(0, 2).join(", ") + (n.labels.length > 2 ? " AND OTHERS" : "");
        // A paycheck logged against a pay day that predates your last
        // confirmed balance is already inside that balance, so logging it
        // moves nothing. Printing "AND THIS BECOMES" with the number that is
        // already on screen reads like a bug, so say what actually happens.
        return `<li><b>${n.count} PAYCHECK${n.count === 1 ? " HASN'T" : "S HAVEN'T"} BEEN LOGGED</b> · ${Util.esc(names)}, ${money(n.amount)} EXPECTED. THIS DELIBERATELY DOESN'T COUNT MONEY THAT HASN'T ARRIVED.${moves(n.after) ? ` LOG IT AND THIS BECOMES ${money(n.after)}.` : n.after == null ? "" : ` LOGGING IT WON'T MOVE THIS FIGURE, BUT IT CLEARS THE WARNING.`}</li>`;
      }
      if (n.kind === "reserved") {
        return `<li><b>${money(n.amount)} IS SET ASIDE IN CATEGORIES</b> · THAT MONEY IS STILL YOURS, JUST SPOKEN FOR, SO IT ISN'T COUNTED HERE.${moves(n.after) ? ` RELEASE IT AND THIS BECOMES ${money(n.after)}.` : ""}</li>`;
      }
      if (n.kind === "lateBills") {
        // Tickable right here. A bill that already left the account is being
        // counted twice — once inside the confirmed balance and once as a
        // claim pinned to today — and sending the user to another tab to fix
        // it is why it was still sitting unticked.
        const ticks = (n.bills || []).map(b => `
          <div class="cat-txn">
            <span class="cat-txn-note">
              <button class="txn-check" data-action="shortfall-bill-paid" data-id="${Util.esc(b.id)}" aria-label="MARK PAID"></button>
              ${Util.esc(b.label)}
            </span>
            <span class="cat-txn-amt">${money(b.amount)}</span>
          </div>`).join("");
        return `<li><b>${n.count} BILL${n.count === 1 ? " IS" : "S ARE"} PAST DUE AND UNTICKED</b> · ${money(n.amount)}. UNTICKED BILLS ARE HELD AGAINST TODAY. IF YOU'VE ALREADY PAID THEM, TICK THEM OFF HERE.
          <div class="cat-txns" style="margin-top:8px;">${ticks}</div></li>`;
      }
      if (n.kind === "staleAnchor") {
        return `<li><b>YOUR BALANCE WAS LAST CONFIRMED ${n.days} DAYS AGO</b> · EVERYTHING HERE IS CARRIED FORWARD FROM THAT, SO THE OLDER IT IS THE MORE IT CAN HAVE DRIFTED. UPDATING IT TAKES A FEW SECONDS.</li>`;
      }
      if (n.kind === "bigTxns") {
        const items = n.items.map(t => `${Util.esc(t.note)} ${money(t.amount, 2)}`).join(" · ");
        return `<li><b>BIGGEST PURCHASES SINCE YOU CONFIRMED</b> · ${items}. WORTH A GLANCE FOR A WRONG AMOUNT OR SOMETHING IMPORTED TWICE.</li>`;
      }
      if (n.kind === "uncategorized") {
        return `<li><b>${money(n.amount)} ISN'T IN A CATEGORY</b> · ${n.count} TRANSACTION${n.count === 1 ? "" : "S"}. NOTHING IS EVER SET ASIDE FOR THESE, SO THEY COME STRAIGHT OFF THIS NUMBER.</li>`;
      }
      // --- Safe To Spend only: the hand-off to the other figure.
      if (n.kind === "seeTightest") {
        return `<li><b>IT'S TIGHTER ON THE OTHER SIDE OF PAYDAY</b> · ${money(n.amount)} ON ${dayLabel(n.date)}. THIS NUMBER ONLY PROMISES TO GET YOU TO PAYDAY. TAP TIGHTEST POINT FOR WHAT HAPPENS AFTER.</li>`;
      }
      // --- Tightest Point only: shape and timing rather than hygiene.
      if (n.kind === "heaviestDay") {
        const items = n.items.map(i => `${Util.esc(i.label)} ${money(i.amount)}`).join(" · ");
        const more = n.count > n.items.length ? ` AND ${n.count - n.items.length} MORE` : "";
        return `<li><b>${dayLabel(n.date)} IS THE HEAVIEST DAY · ${money(n.amount)} GOES OUT AT ONCE</b> · ${items}${more}. THIS IS THE PILE-UP THAT MAKES THE DIP. MOVING ONE OF THESE TO A DIFFERENT DAY WOULD DO MORE THAN CUTTING ANY OF THEM.</li>`;
      }
      if (n.kind === "payPosition") {
        if (!n.count) {
          return `<li><b>NO PAYCHECK LANDS BEFORE IT</b> · ${n.nextDate ? `YOUR NEXT ONE IS ${dayLabel(n.nextDate)}, AFTER THIS POINT.` : "NOTHING IS EXPECTED IN THE NEXT FIVE WEEKS."} SO THIS DIP HAS TO BE COVERED OUT OF WHAT'S IN THE ACCOUNT NOW.</li>`;
        }
        return `<li><b>${n.count} PAYCHECK${n.count === 1 ? " IS" : "S ARE"} ALREADY COUNTED IN THIS</b> · ${money(n.amount)} LANDS BEFORE IT${n.lastDate ? `, THE LAST ON ${dayLabel(n.lastDate)}` : ""}. ${short ? "THE DIP IS WHAT'S LEFT AFTER THAT MONEY ARRIVES, NOT SOMETHING GETTING PAID WOULD FIX." : "THIS IS WHAT'S LEFT ONCE THAT MONEY HAS ARRIVED AND THE BILLS BEHIND IT HAVE GONE OUT."}</li>`;
      }
      if (n.kind === "biggestClaim") {
        return `<li><b>${Util.esc(n.label)} IS THE SINGLE BIGGEST CLAIM</b> · ${money(n.amount)} ON ${dayLabel(n.date)}, ${Math.round(n.share * 100)}% OF EVERYTHING GOING OUT BY THEN.</li>`;
      }

  // Opened by a paycheck tick. Savings rows are seeded unticked with their
  // budgeted amount: the question is whether the money actually moved, and
  // pre-answering yes would mark transfers that never happened.
  function openPaydayForm(s, incomeId, landingIndex) {
    const src = (s.income || []).find(i => i.id === incomeId);
    if (!src) return;
    const paid = (s.billsPaid || {})[s.currentMonth] || {};
    const savings = {};
    (s.bills || []).filter(b => b.category === "savings").forEach(b => {
      if (paid[b.id] && paid[b.id].paid) return;
      savings[b.id] = { on: false, amount: String(Math.round((Number(b.amount) || 0) * 100) / 100) };
    });
    // Which pay day just landed. The tithe question, and the record it writes,
    // belong to that one landing rather than to the source as a whole — the
    // Bills tab ticks the same pay day under the same id.
    const idx = Number.isFinite(landingIndex) ? landingIndex : 0;
    const landing = BudgetEngine.titheLandings(s)
      .find(l => l.incomeId === incomeId && l.index === idx) || null;
    paydayForm = {
      fundingOnly: false,
      incomeId,
      landingIndex: idx,
      landing,
      label: String(src.label || "PAYCHECK").toUpperCase(),
      amount: Math.round((landing ? landing.amount : Number(src.amount) || 0) * 100) / 100,
      fundMode: "share",
      tithe: false,
      savings,
      error: ""
    };
    render();
  }

  // Everything the screen decides goes out in one write, so a dropped
  // connection cannot leave the categories funded but the tithe unrecorded.
  async function savePayday(s) {
    const f = paydayForm;
    if (!f) return;
    const month = s.currentMonth;
    const patch = {};

    if (f.fundMode !== "none") {
      const plan = BudgetEngine.fundingPlan(s, f.fundMode);
      const funding = { ...(s.categoryFunding || {}) };
      const forMonth = { ...(funding[month] || {}) };
      plan.forEach(p => {
        if (p.add > 0) forMonth[p.id] = Math.round((BudgetEngine.num(forMonth[p.id]) + p.add) * 100) / 100;
      });
      funding[month] = forMonth;
      patch.categoryFunding = funding;
    }

    const allPaid = { ...(s.billsPaid || {}) };
    const paidMonth = { ...(allPaid[month] || {}) };
    let touchedPaid = false;
    if (f.tithe && f.incomeId) {
      // Per pay day, under the id the Bills tab ticks, so the two screens
      // never write two records for the same share.
      const key = f.landing ? f.landing.key : "tithe:" + f.incomeId;
      const already = f.landing
        ? BudgetEngine.titheLandingRecord(s, f.landing, paidMonth).rec
        : paidMonth[key];
      if (!(already && already.paid)) {
        // amount x percent lands in cents, so one round then /100 is exact.
        paidMonth[key] = {
          paid: true, paidDate: Util.todayISO(),
          amount: f.landing
            ? Math.round(f.landing.share * 100) / 100
            : Math.round(f.amount * BudgetEngine.tithePercent(s)) / 100,
          createdAt: Date.now(), source: "payday", txnId: null
        };
        touchedPaid = true;
      }
    }
    let badAmount = false;
    Object.keys(f.savings || {}).forEach(id => {
      const row = f.savings[id];
      if (!row || !row.on) return;
      const amt = parseFloat(String(row.amount).replace(/[^0-9.]/g, ""));
      if (!isFinite(amt) || amt <= 0) { badAmount = true; return; }
      paidMonth[id] = {
        paid: true, paidDate: Util.todayISO(),
        amount: Math.round(amt * 100) / 100,
        createdAt: Date.now(), source: "payday", txnId: null
      };
      touchedPaid = true;
    });
    if (badAmount) { f.error = "ENTER A VALID SAVINGS AMOUNT"; render(); return; }
    if (touchedPaid) { allPaid[month] = paidMonth; patch.billsPaid = allPaid; }

    if (!Object.keys(patch).length) { paydayForm = null; render(); return; }
    try {
      await DataService.update(patch);
      paydayForm = null;
      render();
    } catch (e) {
      f.error = "COULDN'T SAVE; CHECK CONNECTION";
      console.warn(e);
      render();
    }
  }

  async function saveBalance(s) {
    const f = balanceForm;
    if (!f) return;
    // Balances get typed with dollar signs and thousands separators far more
    // often than purchase amounts do, so strip anything that isn't part of the
    // number. A negative is legitimate — an overdrawn account is a real state.
    const amount = parseFloat(String(f.amount).replace(/[^0-9.\-]/g, ""));
    if (!isFinite(amount)) { f.error = "ENTER A VALID BALANCE"; render(); return; }
    const date = String(f.date || "").trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || isNaN(new Date(date + "T00:00:00"))) {
      f.error = "ENTER A VALID DATE"; render(); return;
    }
    // Snapshot what we thought BEFORE the new anchor lands, so the gap compares
    // the old projection against the confirmed truth.
    const hadAnchor = BudgetEngine.hasAnchor(s);
    const expected = hadAnchor ? BudgetEngine.projectedBalance(s) : 0;
    const entry = {
      id: Util.uuid(),
      date,
      amount: Math.round(amount * 100) / 100,
      createdAt: Date.now(),
      source: f.prefill ? "import" : "manual"
    };
    try {
      await DataService.update({ balanceChecks: DataService.appendTxns(entry) });
      balanceGapNotice = hadAnchor ? {
        expected: Math.round(expected * 100) / 100,
        entered: entry.amount,
        gap: Math.round((entry.amount - expected) * 100) / 100,
        dismissed: false
      } : null;
      // A gap of a rounding cent or two is noise, not signal.
      if (balanceGapNotice && Math.abs(balanceGapNotice.gap) < 1) balanceGapNotice = null;
      balanceForm = null;
      render();
    } catch (e) { alert("COULDN'T SAVE; CHECK CONNECTION"); console.warn(e); }
  }

  /* ------------- GLOBAL EVENTS ------------- */
  function bindGlobalTabs() {
    root.querySelectorAll(".tab").forEach(el => {
      el.addEventListener("click", () => { currentTab = el.dataset.tab; settingsOpen = false; render(); });
    });
    root.querySelectorAll("[data-action=open-settings]").forEach(el => {
      el.addEventListener("click", () => { settingsOpen = true; render(); });
    });
    // Learner-mode toggle button is rendered next to gear on every screen.
    // Also fires the toggle if user tapped the ? while learner mode was on
    // (the capture-phase learner handler below explicitly whitelists it).
    root.querySelectorAll("[data-action=learner-toggle]").forEach(el => {
      el.addEventListener("click", () => {
        learnerMode = !learnerMode;
        learnerCalloutText = "";
        document.body.classList.toggle("learner-on", learnerMode);
        const cal = document.getElementById("learn-callout");
        if (cal) cal.classList.remove("on");
        render();
      });
    });
  }

  // Install floating chrome that survives #root re-renders: the scroll button
  // and the learner callout. Both are appended once to <body>.

  /* ------------- SWIPE CAROUSEL BETWEEN TABS ------------- */
  // Horizontal swipe moves between the four main tabs in tab-bar order.
  // Always on; there is no setting. Only prefers-reduced-motion changes
  // anything, and then only by dropping the slide (the tab still changes).
  //
  // True carousel. As soon as the gesture locks horizontal we build the
  // neighbouring tab into an offscreen panel sitting exactly one screen-width
  // away, and from then on the outgoing body and the incoming panel are moved
  // together by the same delta. They stay exactly `width` apart for the whole
  // drag AND the whole release animation, so the substrate behind them is never
  // uncovered and no black band can appear.
  //
  // Only .swipe-body and the tab label move. The lime block, .app-header and
  // .tabbar are untouched, which is also what keeps the fixed header pinned:
  // a transform on any ancestor of a position:fixed element makes it resolve
  // against that ancestor instead of the viewport.
  const SWIPE_COMMIT_PX = 60;      // distance that commits a change
  const SWIPE_AXIS_RATIO = 1.0;    // |dx| must beat |dy| by this much
  const SWIPE_LOCK_PX = 10;        // movement before the axis is judged at all
  const SWIPE_LOCK_Y_PX = 18;      // vertical travel that settles an ambiguous drag
  const SWIPE_FLICK_PX = 30;       // a fast flick can commit below the distance
  const SWIPE_FLICK_VEL = 0.5;     // px per ms
  const SWIPE_EDGE_GUARD = 24;     // iOS owns edge swipes for back/forward
  const SWIPE_MS = 240;

  const swipe = {
    active: false, locked: null, dead: false, animating: false,
    x0: 0, y0: 0, t0: 0, dx: 0, width: 0, watchdog: 0,
    stage: null, body: null, line: null,
    incoming: null, lineIncoming: null,
    builtDir: 0, nextTab: null, startTarget: null
  };

  function swipeReduced() {
    try { return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
    catch (e) { return false; }
  }

  // Tab order comes from the rendered tab bar so it can never drift from
  // what the user actually sees.
  function swipeTabOrder() {
    return [...root.querySelectorAll(".tab")].map(el => el.dataset.tab).filter(Boolean);
  }

  // Blocked outright: settings, either overlay, or anything interactive.
  // The lime block is deliberately NOT blocked: a gesture that starts on it
  // drives the swipe like any other, the block simply does not travel.
  function swipeBlocked(target) {
    if (settingsOpen) return true;
    if (newMonthOpen) return true;
    if (balanceForm) return true;
    if (importFlow && importFlow.open) return true;
    if (document.querySelector(".overlay")) return true;
    if (!target || !target.closest) return true;
    if (target.closest("input, textarea, select, button, a, [contenteditable], .chip, .tab, .progress, [data-action]")) return true;
    return false;
  }

  // True when some ancestor rail can still scroll further the way the finger
  // is going. Pinned at its edge, the swipe is allowed through to the carousel.
  function swipeAbsorbedByRail(target, dir) {
    let el = target;
    while (el && el.nodeType === 1) {
      // Stop before body/html: those report a scrollWidth larger than their
      // client width for ordinary reasons, and treating the page itself as a
      // rail would kill every gesture.
      if (el === root || el === document.body || el === document.documentElement) break;
      let ox = "";
      try { ox = getComputedStyle(el).overflowX; } catch (e) { ox = ""; }
      const isRail = (ox === "auto" || ox === "scroll") && el.scrollWidth > el.clientWidth + 1;
      if (isRail) {
        const maxLeft = el.scrollWidth - el.clientWidth;
        if (dir < 0 && el.scrollLeft < maxLeft - 1) return true;  // more to the right
        if (dir > 0 && el.scrollLeft > 1) return true;            // more to the left
      }
      el = el.parentElement;
    }
    return false;
  }

  // Drop every trace of a gesture: the incoming panel, its label twin, and any
  // transform left on the live body or label. Safe to call at any time, and
  // called on every touchstart so an OS-stolen gesture can never strand
  // anything translated.
  function swipeClearStale() {
    document.querySelectorAll(".swipe-incoming, .tabline-incoming").forEach(el => {
      if (el.parentNode) el.parentNode.removeChild(el);
    });
    document.querySelectorAll(".swipe-body, .tabline-layer").forEach(el => {
      el.classList.remove("swipe-animating");
      el.style.transform = "";
      el.style.transition = "";
    });
    document.querySelectorAll(".swipe-stage").forEach(el => { el.style.minHeight = ""; });
    swipe.incoming = null;
    swipe.lineIncoming = null;
  }

  function swipeReset() {
    if (swipe.watchdog) { clearTimeout(swipe.watchdog); swipe.watchdog = 0; }
    swipe.active = false; swipe.locked = null; swipe.dead = false;
    swipe.dx = 0; swipe.builtDir = 0; swipe.nextTab = null;
    swipe.stage = null; swipe.body = null; swipe.line = null;
    swipe.incoming = null; swipe.lineIncoming = null;
    swipe.startTarget = null;
  }

  // Build the neighbour in `dir` and park it exactly one width away. Called
  // once when the axis locks, and again only if the finger crosses back over
  // the origin and the other neighbour becomes the relevant one.
  function swipeBuildIncoming(dir) {
    if (swipe.incoming && swipe.incoming.parentNode) swipe.incoming.parentNode.removeChild(swipe.incoming);
    if (swipe.lineIncoming && swipe.lineIncoming.parentNode) swipe.lineIncoming.parentNode.removeChild(swipe.lineIncoming);
    swipe.incoming = null;
    swipe.lineIncoming = null;
    swipe.builtDir = dir;
    swipe.nextTab = null;

    const order = swipeTabOrder();
    const i = order.indexOf(currentTab);
    const nextIndex = dir < 0 ? i + 1 : i - 1;
    // No neighbour that way: nothing to build, the drag rubber-bands instead.
    if (i < 0 || nextIndex < 0 || nextIndex >= order.length) return;
    const s = DataService.get();
    if (!s || !swipe.stage) return;

    const nextTab = order[nextIndex];
    const panel = document.createElement("div");
    panel.className = "swipe-incoming";
    panel.innerHTML = swipeBodyInner(s, nextTab);

    // Pin the panel's top to whatever the viewport top is showing, so the
    // incoming tab is seen from ITS top while the outgoing one keeps the
    // scroll position the user actually had.
    const rect = swipe.stage.getBoundingClientRect();
    const top = Math.max(0, -rect.top);
    panel.style.top = top + "px";
    panel.style.height = window.innerHeight + "px";
    swipe.stage.appendChild(panel);
    // Guarantee the stage is tall enough to hold the panel, so the panel is
    // never clipped short by a stage whose own content is shorter.
    swipe.stage.style.minHeight = (top + window.innerHeight) + "px";
    swipe.incoming = panel;

    if (swipe.line && swipe.line.parentNode) {
      const li = document.createElement("div");
      li.className = "tabline-layer tabline-incoming";
      li.innerHTML = `<div class="section-label">${Util.esc(tabLabelText(nextTab))}</div>`;
      swipe.line.parentNode.appendChild(li);
      swipe.lineIncoming = li;
    }
    swipe.nextTab = nextTab;
  }

  // Move the pair as one unit. The incoming panel is always parked exactly one
  // width away on the side it is coming from, so the seam between them never
  // opens.
  function swipeMoveTo(dx) {
    const off = dx - swipe.builtDir * swipe.width;
    if (swipe.body) swipe.body.style.transform = "translateX(" + dx + "px)";
    if (swipe.line) swipe.line.style.transform = "translateX(" + dx + "px)";
    if (swipe.incoming) swipe.incoming.style.transform = "translateX(" + off + "px)";
    if (swipe.lineIncoming) swipe.lineIncoming.style.transform = "translateX(" + off + "px)";
  }

  function swipeAnimateTo(bodyX, done) {
    const off = bodyX - swipe.builtDir * swipe.width;
    const parts = [swipe.body, swipe.line, swipe.incoming, swipe.lineIncoming].filter(Boolean);
    parts.forEach(el => el.classList.add("swipe-animating"));
    // Force layout so the starting transforms are committed before animating.
    if (swipe.body) void swipe.body.offsetHeight;
    if (swipe.body) swipe.body.style.transform = "translateX(" + bodyX + "px)";
    if (swipe.line) swipe.line.style.transform = "translateX(" + bodyX + "px)";
    if (swipe.incoming) swipe.incoming.style.transform = "translateX(" + off + "px)";
    if (swipe.lineIncoming) swipe.lineIncoming.style.transform = "translateX(" + off + "px)";

    let fired = false;
    const finish = () => {
      if (fired) return;
      fired = true;
      if (swipe.body) swipe.body.removeEventListener("transitionend", finish);
      done();
    };
    if (swipe.body) swipe.body.addEventListener("transitionend", finish);
    setTimeout(finish, SWIPE_MS + 120);
  }

  function swipeSettleBack() {
    if (swipeReduced() || !swipe.body) { swipeClearStale(); swipeReset(); return; }
    swipe.animating = true;
    swipeAnimateTo(0, () => {
      swipeClearStale();
      swipe.animating = false;
    });
    swipeReset();
  }

  // Commit: slide the pair the remaining distance. Both travel exactly the same
  // number of pixels, so the outgoing body ends one width off screen at the
  // same instant the incoming panel lands at zero. render() then installs the
  // real, event-bound DOM for the new tab.
  function swipeCommit(nextTab, dir) {
    if (swipeReduced()) {
      swipeClearStale();
      swipeReset();
      currentTab = nextTab;
      render();
      return;
    }
    swipe.animating = true;
    // Highlight the destination tab immediately; waiting for the animation
    // makes the bottom bar feel a frame behind the content.
    root.querySelectorAll(".tab").forEach(el => {
      el.classList.toggle("active", el.dataset.tab === nextTab);
    });
    swipeAnimateTo(dir * swipe.width, () => {
      swipeClearStale();
      swipe.animating = false;
      currentTab = nextTab;
      render();
    });
    swipeReset();
  }

  function installSwipeNav() {
    document.addEventListener("touchstart", (e) => {
      if (swipe.animating) { swipe.dead = true; return; }
      swipeReset();
      swipeClearStale();
      if (e.touches.length !== 1) { swipe.dead = true; return; }
      const t = e.touches[0];
      if (t.clientX < SWIPE_EDGE_GUARD || t.clientX > window.innerWidth - SWIPE_EDGE_GUARD) { swipe.dead = true; return; }
      if (swipeBlocked(e.target)) { swipe.dead = true; return; }
      swipe.active = true;
      swipe.x0 = t.clientX; swipe.y0 = t.clientY; swipe.t0 = performance.now();
      swipe.startTarget = e.target;
      swipe.width = window.innerWidth;
    }, { passive: true });

    // Not passive: once the gesture is horizontally locked we preventDefault
    // so the page cannot scroll underneath the slide.
    document.addEventListener("touchmove", (e) => {
      if (!swipe.active || swipe.dead) return;
      if (e.touches.length !== 1) { swipe.dead = true; return; }
      const t = e.touches[0];
      const dx = t.clientX - swipe.x0;
      const dy = t.clientY - swipe.y0;

      if (!swipe.locked) {
        // Touches sample at ~60Hz, so a quick thumb can cover 15-20px between
        // events and the first reading carries real noise. This used to open on
        // whichever axis passed 8px first and then decide immediately and
        // permanently, so one slightly diagonal sample killed the gesture for
        // good — a 15px/11px reading locked vertical, and no amount of sideways
        // travel afterwards could recover it.
        //
        // Now an ambiguous sample decides nothing: horizontal takes ties and
        // mild diagonals, a clearly vertical drag settles it, and anything in
        // between waits for the next sample. The wait is bounded to a sample or
        // two on purpose — once iOS commits to its own scroll a later
        // preventDefault is ignored, so deferring longer would just make the
        // horizontal lock useless.
        const ax = Math.abs(dx), ay = Math.abs(dy);
        if (ax < SWIPE_LOCK_PX && ay < SWIPE_LOCK_PX) return;
        if (ax < ay * SWIPE_AXIS_RATIO) {
          // Not horizontal. Only call it vertical once it really is one;
          // otherwise keep watching rather than locking the gesture out.
          if (ay >= SWIPE_LOCK_Y_PX) { swipe.locked = "y"; }
          return;
        }
        const dir0 = dx < 0 ? -1 : 1;
        if (swipeAbsorbedByRail(swipe.startTarget, dir0)) { swipe.dead = true; return; }
        swipe.stage = root.querySelector(".swipe-stage");
        swipe.body = root.querySelector(".swipe-body");
        swipe.line = root.querySelector(".tabline-layer");
        if (!swipe.stage || !swipe.body) { swipe.dead = true; return; }
        // Park the incoming panel exactly one PANEL width away, not one
        // viewport width: #root is capped at 480px, so on anything wider the
        // two would sit apart by the difference and reopen the gap.
        swipe.width = Math.round(swipe.stage.getBoundingClientRect().width) || window.innerWidth;
        swipe.locked = "x";
        // One build per gesture, here — not per move event.
        swipeBuildIncoming(dir0);
        // Watchdog: if the gesture never reports an end (interrupted by the
        // OS, a system sheet, or backgrounding), settle back rather than
        // leaving anything translated.
        if (swipe.watchdog) clearTimeout(swipe.watchdog);
        swipe.watchdog = setTimeout(() => {
          if (swipe.locked === "x") swipeSettleBack();
          else swipeClearStale();
        }, 2000);
      }
      if (swipe.locked !== "x") return;

      e.preventDefault();
      const dir = dx < 0 ? -1 : 1;
      // Dragged back past the origin: the neighbour we built is now the wrong
      // one. Rebuild for the direction the finger is actually going.
      if (dir !== swipe.builtDir) swipeBuildIncoming(dir);

      // Rubber-band only where there is no tab to bring in.
      const eff = swipe.nextTab ? dx : dx * 0.25;
      swipe.dx = eff;
      swipeMoveTo(eff);
    }, { passive: false });

    const end = () => {
      if (!swipe.active || swipe.dead || swipe.locked !== "x") {
        swipeClearStale();
        swipeReset();
        return;
      }
      const dx = swipe.dx;
      const dt = Math.max(1, performance.now() - swipe.t0);
      const vel = Math.abs(dx) / dt;
      const dir = swipe.builtDir;
      const committed = Math.abs(dx) > SWIPE_COMMIT_PX ||
                        (Math.abs(dx) > SWIPE_FLICK_PX && vel > SWIPE_FLICK_VEL);
      if (committed && swipe.nextTab) swipeCommit(swipe.nextTab, dir);
      else swipeSettleBack();
    };
    document.addEventListener("touchend", end, { passive: true });
    document.addEventListener("touchcancel", () => {
      if (swipe.locked === "x") swipeSettleBack();
      else { swipeClearStale(); swipeReset(); }
    }, { passive: true });
  }
  function installFloatingChrome() {
    if (!document.getElementById("scroll-btn")) {
      const btn = document.createElement("button");
      btn.id = "scroll-btn";
      btn.className = "scroll-btn hidden";
      btn.textContent = "↑";
      btn.setAttribute("aria-label", "SCROLL");
      btn.setAttribute("data-learn", "SCROLL BUTTON. TAP TO JUMP TO THE TOP WHEN YOU'RE FAR DOWN THE PAGE, OR TO THE BOTTOM WHEN YOU'RE NEAR THE TOP. HIDDEN WHEN THE PAGE FITS IN ONE SCREEN.");
      btn.addEventListener("click", (e) => {
        // Learner mode short-circuits via the capture-phase handler below,
        // but guard here too so we never scroll accidentally in learner mode.
        if (learnerMode) return;
        const y = window.scrollY || document.documentElement.scrollTop || 0;
        if (y > 300) window.scrollTo({ top: 0, behavior: "smooth" });
        else window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      });
      document.body.appendChild(btn);
    }
    if (!document.getElementById("learn-callout")) {
      const cal = document.createElement("div");
      cal.id = "learn-callout";
      cal.className = "learn-callout";
      cal.innerHTML = `<div class="title"></div><div class="text"></div>`;
      document.body.appendChild(cal);
    }
    // Capture-phase click handler for learner mode. When learnerMode is on,
    // intercept every click, find nearest data-learn ancestor, show its
    // description, and cancel the underlying action. Learner-toggle itself
    // is explicitly whitelisted so users can turn learner mode off.
    if (!window.__clearLearnerBound) {
      window.__clearLearnerBound = true;
      document.addEventListener("click", (e) => {
        if (!learnerMode) return;
        // Allow the ? icon and its own children through so the toggle works.
        const toggleEl = e.target.closest("[data-action=learner-toggle]");
        if (toggleEl) return;
        // Allow taps on the callout itself to dismiss it.
        const inCallout = e.target.closest("#learn-callout");
        const cal = document.getElementById("learn-callout");
        if (inCallout) {
          if (cal) cal.classList.remove("on");
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        const el = e.target.closest("[data-learn]");
        e.preventDefault();
        e.stopPropagation();
        if (!el) {
          if (cal) cal.classList.remove("on");
          return;
        }
        const text = el.getAttribute("data-learn") || "";
        const title = (el.getAttribute("aria-label") || el.textContent || "").trim().slice(0, 40).toUpperCase();
        if (cal) {
          cal.querySelector(".title").textContent = title;
          cal.querySelector(".text").textContent = text;
          cal.classList.add("on");
        }
      }, true);
    }
    refreshScrollBtn();
  }

  function refreshScrollBtn() {
    const btn = document.getElementById("scroll-btn");
    if (!btn) return;
    const canScroll = document.documentElement.scrollHeight > window.innerHeight + 32;
    if (!canScroll) { btn.classList.add("hidden"); return; }
    btn.classList.remove("hidden");
    const y = window.scrollY || document.documentElement.scrollTop || 0;
    btn.textContent = y > 300 ? "↑" : "↓";
  }

  return { render, renderLoading, finishLoading, installFloatingChrome, installSwipeNav, refreshScrollBtn };
})();

/* ============================================================
   BOOT
   ============================================================ */
(function boot() {
  // Track whether we've ever handed off from the loading screen. First
  // snapshot arrival plays the shimmer climax + whiteout before rendering
  // the real screen; subsequent snapshots are ordinary reactive re-renders.
  let handedOff = false;
  DataService.onData(() => {
    if (!handedOff) {
      handedOff = true;
      UI.finishLoading(() => { UI.render(); UI.refreshScrollBtn(); });
    } else {
      UI.render();
      UI.refreshScrollBtn();
    }
  });
  DataService.onError(() => {
    // If we've never received data and we can't reach Firestore,
    // fall back gracefully — if there's no household ID, show setup.
    if (!DataService.get() && !DataService.getHouseholdId()) {
      UI.render();
    }
  });

  // Persistent DOM elements that survive #root re-renders.
  UI.installFloatingChrome();
  UI.installSwipeNav();

  const existing = DataService.getHouseholdId();
  if (existing) {
    UI.renderLoading("SYNCING...");
    if (db) {
      DataService.subscribe(existing);
      // Safety: if we don't receive data within 6s, keep loading screen but still allow reset
    } else {
      UI.renderLoading("OFFLINE; CAN'T REACH SYNC");
    }
  } else {
    UI.render(); // renders setup
  }

  window.addEventListener("scroll", UI.refreshScrollBtn, { passive: true });
  window.addEventListener("resize", UI.refreshScrollBtn);
})();
</script>
