      <input class="underline" style="margin-top:8px;" id="learn-label" value="${Util.esc(l.label)}" placeholder="CHASE CHECKING" maxlength="24">
      <div class="overlay-sub" style="margin-top:24px;">IS THIS A CREDIT CARD OR CHECKING ACCOUNT?</div>
      <div class="toggle-row">
        <button class="toggle ${l.paymentType==='cash'?'active':''}" data-action="learn-pay" data-v="cash">CHECKING</button>
        <button class="toggle ${l.paymentType==='credit'?'active':''}" data-action="learn-pay" data-v="credit">CREDIT</button>
      </div>
    `;
  }

  function renderReview(s) {
    const isCouple = s.settings && s.settings.mode === "couple";
    const currentMonth = s.currentMonth;
    const allRows = importFlow.reviewRows;
    const spendingCats = s.spendingCategories || [];
    const cards = s.creditCards || [];
    const shown = importFlow.showOlder ? allRows : allRows.filter(r => r.date.slice(0,7) >= currentMonth);
    const olderCount = allRows.length - shown.length;
    const label = importFlow.matchedProfile ? importFlow.matchedProfile.label : (importFlow.learn.label || "IMPORT");
    const recognized = !!importFlow.matchedProfile && !importFlow.stageWasLearning;
    const rowsHtml = shown.map(r => renderReviewRow(r, spendingCats, cards, isCouple, s)).join("") ||
      `<div class="meta" style="padding:16px;">NO TRANSACTIONS IN THE CURRENT MONTH</div>`;
    const importable = allRows.filter(r => !r.skipped).length;
    const uncatCount = allRows.filter(r => !r.skipped && !r.categoryId).length;
    const autoRes = importFlow.autoMatchResult;
    // Off-month breakdown BEFORE import, so nothing vanishes silently.
    const monthBuckets = {};
    for (const r of allRows) {
      if (r.skipped) continue;
      const ym = (r.date || "").slice(0, 7);
      if (!ym) continue;
      if (ym === s.currentMonth) continue;
      monthBuckets[ym] = (monthBuckets[ym] || 0) + 1;
    }
    const offMonthHtml = Object.keys(monthBuckets).length ? `
      <div class="text-danger meta" style="margin-top:8px;">
        ${Object.keys(monthBuckets).sort().map(ym => `${monthBuckets[ym]} ROW${monthBuckets[ym]===1?'':'S'} DATED ${Util.esc(Util.fmtMonthLong(ym))}`).join(" · ")}
      </div>
    ` : "";
    const choicePanel = importFlow.choicePanelOpen ? `
      <div class="settings-group" style="margin-top:16px; background: var(--gray-light);">
        <h3 class="text-danger">${uncatCount} OF ${importable} ROWS HAVE NO CATEGORY</h3>
        ${autoRes ? `<div class="meta" style="margin-bottom:12px;">MATCHED ${autoRes.matched} OF ${autoRes.total}${autoRes.remaining>0 ? `; ${autoRes.remaining} STILL NEED CATEGORIES` : ""}</div>` : ""}
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button class="cta ghost" data-action="import-auto-match">→ AUTO-MATCH CATEGORIES</button>
          <button class="cta ghost" data-action="import-later">→ IMPORT; ASSIGN LATER</button>
          <button class="cta ghost" data-action="import-pick-one-by-one">→ PICK ONE BY ONE</button>
        </div>
      </div>
    ` : "";
    return `
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div class="overlay-title">→ REVIEW IMPORT</div>
        <button class="link" data-action="import-cancel">× CLOSE</button>
      </div>
      <div class="overlay-sub">${recognized ? "RECOGNIZED: " : ""}${Util.esc(label)}</div>
      <div class="overlay-sub" style="opacity:0.7;">${importable} OF ${allRows.length} WILL BE IMPORTED${uncatCount ? ` · ${uncatCount} NEED CATEGORIES` : ""}</div>
      ${offMonthHtml}
      <div style="margin-top:16px;">${rowsHtml}</div>
      ${olderCount > 0 || importFlow.showOlder ? `
        <button class="link" style="margin-top:16px;" data-action="toggle-older">${importFlow.showOlder ? "× HIDE OLDER" : `→ SHOW OLDER TRANSACTIONS (${olderCount})`}</button>
      ` : ""}
      ${importFlow.error ? `<div class="text-danger meta" style="margin-top:12px;">${Util.esc(importFlow.error)}</div>` : ""}
      ${choicePanel}
      <button class="cta" style="margin-top:24px;" data-action="import-commit">→ IMPORT ALL</button>
    `;
  }

  function renderReviewRow(r, spendingCats, cards, isCouple, s) {
    const needsCategory = !r.skipped && !r.categoryId;
    const chips = spendingCats.map(c => `
      <button class="review-cat-chip ${r.categoryId===c.id?'active':''}" data-action="review-cat" data-id="${Util.esc(r.id)}" data-cat="${Util.esc(c.id)}">
        ${Util.esc(c.label)}${(r.categoryAuto && r.categoryId===c.id) ? `<span class="auto">AUTO</span>` : ""}
      </button>
    `).join("");
    const catLabelHtml = needsCategory
      ? `<div class="review-cat-label needs">× PICK A CATEGORY</div>`
      : (r.skipped ? "" : `<div class="review-cat-label">CATEGORY</div>`);
    const personChips = isCouple ? `
      <div class="review-cat-chips" style="margin-top:6px;" data-scroll-key="review-person-${Util.esc(r.id)}">
        ${[s.settings.names[0], s.settings.names[1], "JOINT"].map(p => {
          const val = p.toUpperCase();
          return `<button class="review-cat-chip ${r.person===val?'active':''}" data-action="review-person" data-id="${Util.esc(r.id)}" data-p="${Util.esc(val)}">${Util.esc(p)}</button>`;
        }).join("")}
      </div>
    ` : "";
    const cardChips = r.paymentType === "credit" && cards.length ? `
      <div class="review-cat-chips" style="margin-top:6px;" data-scroll-key="review-card-${Util.esc(r.id)}">
        ${cards.map(c => `<button class="review-cat-chip ${r.cardId===c.id?'active':''}" data-action="review-card" data-id="${Util.esc(r.id)}" data-c="${Util.esc(c.id)}">${Util.esc(c.label)}</button>`).join("")}
        ${r.cardId ? `<button class="review-cat-chip" data-action="review-card" data-id="${Util.esc(r.id)}" data-c="">× NONE</button>` : ""}
      </div>
    ` : "";
    return `
      <div class="review-row ${r.skipped ? 'skipped' : ''} ${needsCategory ? 'needs-category' : ''}">
        <div class="review-row-line">
          <div class="d">${Util.esc(Util.fmtDateShort(r.date))}</div>
          <div class="desc">${Util.esc(r.description)}</div>
          <div class="a">${r.isDeposit ? "+" : "-"}${Util.esc(Util.fmtMoney(r.amount, 2).replace(/^-\$/, "$"))}</div>
        </div>
        ${catLabelHtml}
        <div class="review-cat-chips" data-scroll-key="review-cat-${Util.esc(r.id)}">${chips || `<div class="meta">NO SPENDING CATEGORIES</div>`}</div>
        ${personChips}
        <div class="review-controls">
          <button class="toggle ${r.paymentType==='cash'?'active':''}" data-action="review-pay" data-id="${Util.esc(r.id)}" data-v="cash">DEBIT</button>
          <button class="toggle ${r.paymentType==='credit'?'active':''}" data-action="review-pay" data-id="${Util.esc(r.id)}" data-v="credit">CREDIT</button>
          ${r.skipped
            ? `<button class="unskip-btn" data-action="review-skip" data-id="${Util.esc(r.id)}" data-v="off">→ UN-SKIP</button>`
            : `<button class="skip-btn" data-action="review-skip" data-id="${Util.esc(r.id)}" data-v="on">× SKIP</button>`}
        </div>
        ${cardChips}
        ${r.skipped && r.skipReason ? `<div class="review-skip-reason">${Util.esc(r.skipReason)}</div>` : ""}
        ${(r.incomeMatch && r.incomeMatch.tier === "fuzzy" && r.incomeMatch.answer === null) ? `
          <div class="txn-confirm" style="flex-basis:100%;">
            <span>IS THIS YOUR EXPECTED INCOME PAYMENT (${Util.esc(r.incomeMatch.label)}) LISTED IN YOUR SETTINGS?</span>
            <button data-action="review-income-answer" data-id="${Util.esc(r.id)}" data-v="no">NO</button>
            <button class="yes" data-action="review-income-answer" data-id="${Util.esc(r.id)}" data-v="yes">YES</button>
          </div>` : ""}
        ${(r.incomeMatch && r.incomeMatch.answer === "yes") ? `<div class="review-skip-reason">INCOME: ${Util.esc(r.incomeMatch.label)} · WILL BE CLEARED</div>` : ""}
        ${(r.billMatch && r.billMatch.tier === "fuzzy" && r.billMatch.answer === null) ? `
          <div class="txn-confirm" style="flex-basis:100%;">
            <span>IS THIS YOUR BILL (${Util.esc(r.billMatch.label)}) FROM YOUR SETTINGS?</span>
            <button data-action="review-bill-answer" data-id="${Util.esc(r.id)}" data-v="no">NO</button>
            <button class="yes" data-action="review-bill-answer" data-id="${Util.esc(r.id)}" data-v="yes">YES</button>
          </div>` : ""}
        ${(r.billMatch && (r.billMatch.tier === "exact" || r.billMatch.answer === "yes")) ? `<div class="review-skip-reason">BILL: ${Util.esc(r.billMatch.label)} · WILL BE MARKED PAID</div>` : ""}
      </div>
    `;
  }

  function bindImportOverlay(s, overlay) {
    const q = sel => overlay.querySelectorAll(sel);
    q("[data-action=wizard-skip]").forEach(el => el.addEventListener("click", () => {
      resetImportFlow();
      render();
    }));
    q("[data-action=wizard-paste]").forEach(el => el.addEventListener("click", () => {
      importFlow.kind = "paste";
      importFlow.stage = "paste-input";
      render();
    }));
    q("[data-action=wizard-csv]").forEach(el => el.addEventListener("click", () => {
      // The log screen's file input isn't in this overlay, so make a transient
      // one rather than depending on another screen's markup.
      importFlow.kind = "csv";
      const fi = document.createElement("input");
      fi.type = "file";
      fi.accept = ".csv,text/csv";
      fi.style.display = "none";
      document.body.appendChild(fi);
      fi.addEventListener("change", () => {
        const f = fi.files && fi.files[0];
        fi.remove();
        if (f) onCsvFilePicked(s, f);
      });
      fi.click();
    }));
    q("[data-action=wizard-pick]").forEach(el => el.addEventListener("click", () => {
      const id = el.dataset.id;
      importFlow.wizardPicks[id] = !importFlow.wizardPicks[id];
      importFlow.error = "";
      render();
    }));
    q("[data-action=wizard-edit]").forEach(el => el.addEventListener("input", e => {
      const id = el.dataset.id, f = el.dataset.field;
      if (!importFlow.wizardEdits[id]) importFlow.wizardEdits[id] = {};
      importFlow.wizardEdits[id][f] = e.target.value;
    }));
    q("[data-action=wizard-tidy]").forEach(el => el.addEventListener("click", () => {
      importFlow.wizardTidy = !importFlow.wizardTidy;
      render();
    }));
    q("[data-action=wizard-confirm]").forEach(el => el.addEventListener("click", () => commitWizard(s)));
    q("[data-action=import-cancel]").forEach(el => el.addEventListener("click", () => {
      resetImportFlow();
      render();
    }));
    const ta = overlay.querySelector("#paste-input");
    if (ta) ta.addEventListener("input", e => { importFlow.rawText = e.target.value; });
    q("[data-action=paste-parse]").forEach(el => el.addEventListener("click", () => {
      onPasteSubmit(s);
    }));
    q("[data-action=csv-pick-col]").forEach(el => el.addEventListener("click", () => {
      const i = parseInt(el.dataset.i, 10);
      const role = el.dataset.role;
      if (role === "date") importFlow.learn.dateColumn = i;
      else if (role === "amount") importFlow.learn.amountColumn = i;
      else if (role === "description") importFlow.learn.descriptionColumn = i;
      render();
    }));
    q("[data-action=paste-looks-right]").forEach(el => el.addEventListener("click", () => {
      // Collapse the re-parse panel; the user is satisfied with the current preview.
      importFlow.learn.somethingsWrong = false;
      render();
    }));
    q("[data-action=paste-somethings-wrong]").forEach(el => el.addEventListener("click", () => {
      // Reveal inline re-parse controls; do NOT commit best-guess to review yet.
      importFlow.learn.somethingsWrong = true;
      importFlow.error = "";
      // Seed override defaults from the auto-detected structure so the toggles
      // show the current state rather than blanks.
      const auto = importFlow.pasteStructure || {};
      const ov = importFlow.learn.override || {};
      if (ov.amountPos == null) ov.amountPos = auto.amountPos || "first";
      if (ov.secondIsBalance == null) ov.secondIsBalance = true;
      if (ov.linesPerTxn == null) ov.linesPerTxn = auto.linesPerTxn || 1;
      importFlow.learn.override = ov;
      render();
    }));
    q("[data-action=reparse-amt]").forEach(el => el.addEventListener("click", () => {
      const ov = importFlow.learn.override; ov.amountPos = el.dataset.v;
      render();
    }));
    q("[data-action=reparse-sec]").forEach(el => el.addEventListener("click", () => {
      const ov = importFlow.learn.override; ov.secondIsBalance = (el.dataset.v === "yes");
      render();
    }));
    q("[data-action=reparse-lpt]").forEach(el => el.addEventListener("click", () => {
      const ov = importFlow.learn.override; ov.linesPerTxn = parseInt(el.dataset.v, 10) || 1;
      render();
    }));
    q("[data-action=reparse-preview]").forEach(el => el.addEventListener("click", () => {
      // Re-run textParse with the current overrides and refresh preview.
      const ov = importFlow.learn.override || {};
      const rep = ImportEngine.textParse(importFlow.rawText, {
        amountPos: ov.amountPos || undefined,
        secondIsBalance: ov.secondIsBalance == null ? undefined : ov.secondIsBalance,
        linesPerTxn: ov.linesPerTxn || undefined
      });
      importFlow.pasteItems = rep.items;
      // Structure stays auto-detected (fingerprint stability); do not overwrite it.
      render();
    }));
    q("[data-action=learn-balance]").forEach(el => el.addEventListener("click", () => {
      // Legacy question kept when NOT in the SOMETHING'S WRONG panel.
      const isAmount = el.dataset.v === "amount";
      importFlow.learn.balanceIsAmount = isAmount;
      // Also mirror into override.amountPos so downstream consumers see one truth.
      importFlow.learn.override.amountPos = isAmount ? "last" : "first";
      render();
    }));
    q("[data-action=learn-sign]").forEach(el => el.addEventListener("click", () => {
      importFlow.learn.negativeIsPurchase = (el.dataset.v === "yes");
      render();
    }));
    q("[data-action=learn-pay]").forEach(el => el.addEventListener("click", () => {
      importFlow.learn.paymentType = el.dataset.v;
      render();
    }));
    const labelInput = overlay.querySelector("#learn-label");
    if (labelInput) labelInput.addEventListener("input", e => { importFlow.learn.label = e.target.value; });
    q("[data-action=learning-continue]").forEach(el => el.addEventListener("click", () => {
      importFlow.error = "";
      // Read the label from the input at commit time so we don't drop keystrokes.
      const li = overlay.querySelector("#learn-label");
      if (li) importFlow.learn.label = li.value;
      finalizeLearningAndReview(s);
    }));
    q("[data-action=toggle-older]").forEach(el => el.addEventListener("click", () => {
      importFlow.showOlder = !importFlow.showOlder;
      render();
    }));
    q("[data-action=review-cat]").forEach(el => el.addEventListener("click", () => {
      const r = importFlow.reviewRows.find(x => x.id === el.dataset.id);
      if (!r) return;
      r.categoryId = el.dataset.cat;
      r.categoryType = "spending";
      r.categoryAuto = false; // user chose it now
      // Once no row is missing a category, drop the block banner.
      if (importFlow.error && !importFlow.reviewRows.some(x => !x.skipped && !x.categoryId)) importFlow.error = "";
      render();
    }));
    q("[data-action=review-person]").forEach(el => el.addEventListener("click", () => {
      const r = importFlow.reviewRows.find(x => x.id === el.dataset.id);
      if (!r) return;
      r.person = el.dataset.p;
      render();
    }));
    q("[data-action=review-card]").forEach(el => el.addEventListener("click", () => {
      const r = importFlow.reviewRows.find(x => x.id === el.dataset.id);
      if (!r) return;
      r.cardId = el.dataset.c || null;
      render();
    }));
    q("[data-action=review-pay]").forEach(el => el.addEventListener("click", () => {
      const r = importFlow.reviewRows.find(x => x.id === el.dataset.id);
      if (!r) return;
      r.paymentType = el.dataset.v;
      if (r.paymentType !== "credit") r.cardId = null;
      render();
    }));
    q("[data-action=review-skip]").forEach(el => el.addEventListener("click", () => {
      const r = importFlow.reviewRows.find(x => x.id === el.dataset.id);
      if (!r) return;
      if (el.dataset.v === "off") { r.skipped = false; r.skipReason = ""; }
      else { r.skipped = true; r.skipReason = r.skipReason || "SKIPPED"; }
      if (importFlow.error && !importFlow.reviewRows.some(x => !x.skipped && !x.categoryId)) importFlow.error = "";
      render();
    }));
    q("[data-action=review-income-answer]").forEach(el => el.addEventListener("click", () => {
      const r = importFlow.reviewRows.find(x => x.id === el.dataset.id);
      if (!r || !r.incomeMatch) return;
      r.incomeMatch.answer = el.dataset.v;
      // NO means "this deposit isn't that expected paycheck". Remember the
      // rejection so the same question isn't asked again next month.
      if (el.dataset.v === "no") { r.incomeRejected = true; r.incomeMatch = null; }
      render();
    }));
    q("[data-action=review-bill-answer]").forEach(el => el.addEventListener("click", () => {
      const r = importFlow.reviewRows.find(x => x.id === el.dataset.id);
      if (!r || !r.billMatch) return;
      if (el.dataset.v === "yes") {
        r.billMatch.answer = "yes";
        // Assign the bill as this row's category unless one is already set.
        if (!r.categoryId) {
          r.categoryId = r.billMatch.billId;
          r.categoryType = "bill";
          r.categoryAuto = true;
        }
        if (importFlow.error && !importFlow.reviewRows.some(x => !x.skipped && !x.categoryId)) importFlow.error = "";
      } else {
        // NO leaves it as an ordinary uncategorized import row, and is
        // remembered so this merchant isn't proposed as a bill again.
        r.billRejected = true;
        r.billMatch = null;
      }
      render();
    }));
    q("[data-action=import-commit]").forEach(el => el.addEventListener("click", () => {
      commitImport(s);
    }));
    q("[data-action=import-auto-match]").forEach(el => el.addEventListener("click", () => {
      const result = bulkAutoMatchCategories(s, importFlow.reviewRows);
      importFlow.autoMatchResult = result;
      // If everything is now categorized, we can commit straight through; else
      // keep the panel visible so the user can pick IMPORT-LATER or PICK-ONE.
      if (result.remaining === 0) {
        importFlow.choicePanelOpen = false;
        commitImportWrite(s, { allowUncategorized: false });
        return;
      }
      render();
    }));
    q("[data-action=import-later]").forEach(el => el.addEventListener("click", () => {
      importFlow.choicePanelOpen = false;
      commitImportWrite(s, { allowUncategorized: true });
    }));
    q("[data-action=import-pick-one-by-one]").forEach(el => el.addEventListener("click", () => {
      importFlow.choicePanelOpen = false;
      importFlow.autoMatchResult = null;
      render();
    }));
  }

  /* ------------- NEW MONTH OVERLAY (only allowed modal) ------------- */
  function renderNewMonthOverlay(s) {
    const cats = (s.spendingCategories||[]);
    const rows = cats.map(c => {
      const remaining = BudgetEngine.categoryRemaining(s, c);
      const choice = newMonthChoices[c.id] || "roll";
      return `
        <div class="rollover-row">
          <h4>${Util.esc(c.label)}</h4>
          <div class="amt">${Util.esc(Util.fmtMoney(remaining,0))} UNSPENT</div>
          <div class="choice-row">
            <button class="${choice==='roll'?'active':''}" data-action="nm-choice" data-id="${Util.esc(c.id)}" data-choice="roll">ROLL OVER →</button>
            <button class="${choice==='reset'?'active':''}" data-action="nm-choice" data-id="${Util.esc(c.id)}" data-choice="reset">RESET TO $0</button>
          </div>
        </div>`;
    }).join("");

    // Idempotent: strip any prior overlay before appending a fresh one.
    document.querySelectorAll(".overlay").forEach(o => o.remove());
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    // .overlay is the scroller; see note in renderImportOverlay.
    overlay.setAttribute("data-scroll-key", "newmonth-overlay");
    overlay.innerHTML = `
      <div class="overlay-inner" data-scroll-key="newmonth-overlay-inner">
        <button class="link" data-action="nm-cancel">× CLOSE</button>
        <h2 class="section-label" style="margin-top:16px;">→ NEW MONTH</h2>
        <div class="meta" style="margin-top:8px;">CURRENT: ${Util.esc(Util.fmtMonthLong(s.currentMonth))} · NEXT: ${Util.esc(Util.fmtMonthLong(nextMonth(s.currentMonth)))}</div>
        <div style="margin-top:24px;">${rows || `<div class="meta">NO SPENDING CATEGORIES</div>`}</div>
        <button class="cta big" style="margin-top:24px;" data-action="nm-confirm">→ CONFIRM NEW MONTH</button>
      </div>`;
    document.body.appendChild(overlay);

    overlay.querySelectorAll("[data-action=nm-choice]").forEach(el => {
      el.addEventListener("click", () => {
        newMonthChoices[el.dataset.id] = el.dataset.choice;
        // Route through the wrapper so scroll state is preserved; the overlay
        // renderer is idempotent (removes any prior overlay before appending).
        render();
      });
    });
    overlay.querySelector("[data-action=nm-cancel]").addEventListener("click", () => {
      newMonthOpen = false; render();
    });
    overlay.querySelector("[data-action=nm-confirm]").addEventListener("click", () => confirmNewMonth(s, overlay));
  }

  function nextMonth(ym) {
    let [y, m] = ym.split("-").map(Number);
    m++;
    if (m > 12) { m = 1; y++; }
    return `${y}-${String(m).padStart(2,"0")}`;
  }

  async function confirmNewMonth(s, overlay) {
    const newMonth = nextMonth(s.currentMonth);
    const rollovers = {};
    (s.spendingCategories||[]).forEach(c => {
      const choice = newMonthChoices[c.id] || "roll";
      if (choice === "roll") {
        const remaining = BudgetEngine.categoryRemaining(s, c);
        if (remaining > 0) rollovers[c.id] = Math.round(remaining * 100) / 100;
      }
    });
    const patch = {};
    const mr = Object.assign({}, s.monthlyRollover || {});
    mr[newMonth] = rollovers;
    patch.monthlyRollover = mr;
    patch.currentMonth = newMonth;
    try {
      await DataService.update(patch);
      newMonthOpen = false;
      newMonthChoices = {};
      render();
    } catch (e) { alert("COULDN'T UPDATE"); console.warn(e); }
  }

  /* ------------- GLOBAL EVENTS ------------- */
  function bindGlobalTabs() {
    root.querySelectorAll(".tab").forEach(el => {
      el.addEventListener("click", () => { currentTab = el.dataset.tab; settingsOpen = false; render(); });
    });
    root.querySelectorAll("[data-action=open-settings]").forEach(el => {
      el.addEventListener("click", () => { settingsOpen = true; render(); });
    });
    // Learner-mode toggle button is rendered next to gear on every screen.
    // Also fires the toggle if user tapped the ? while learner mode was on
    // (the capture-phase learner handler below explicitly whitelists it).
    root.querySelectorAll("[data-action=learner-toggle]").forEach(el => {
      el.addEventListener("click", () => {
        learnerMode = !learnerMode;
        learnerCalloutText = "";
        document.body.classList.toggle("learner-on", learnerMode);
        const cal = document.getElementById("learn-callout");
        if (cal) cal.classList.remove("on");
        render();
      });
    });
  }

  // Install floating chrome that survives #root re-renders: the scroll button
  // and the learner callout. Both are appended once to <body>.

  /* ------------- SWIPE CAROUSEL BETWEEN TABS ------------- */
  // Horizontal swipe moves between the four main tabs in tab-bar order.
  // Always on; there is no setting. Only prefers-reduced-motion changes
  // anything, and then only by dropping the slide (the tab still changes).
  //
  // True carousel. As soon as the gesture locks horizontal we build the
  // neighbouring tab into an offscreen panel sitting exactly one screen-width
  // away, and from then on the outgoing body and the incoming panel are moved
  // together by the same delta. They stay exactly `width` apart for the whole
  // drag AND the whole release animation, so the substrate behind them is never
  // uncovered and no black band can appear.
  //
  // Only .swipe-body and the tab label move. The lime block, .app-header and
  // .tabbar are untouched, which is also what keeps the fixed header pinned:
  // a transform on any ancestor of a position:fixed element makes it resolve
  // against that ancestor instead of the viewport.
  const SWIPE_COMMIT_PX = 60;      // distance that commits a change
  const SWIPE_AXIS_RATIO = 1.5;    // |dx| must beat |dy| by this much
  const SWIPE_FLICK_PX = 30;       // a fast flick can commit below the distance
  const SWIPE_FLICK_VEL = 0.5;     // px per ms
  const SWIPE_EDGE_GUARD = 24;     // iOS owns edge swipes for back/forward
  const SWIPE_MS = 240;

  const swipe = {
    active: false, locked: null, dead: false, animating: false,
    x0: 0, y0: 0, t0: 0, dx: 0, width: 0, watchdog: 0,
    stage: null, body: null, line: null,
    incoming: null, lineIncoming: null,
    builtDir: 0, nextTab: null, startTarget: null
  };

  function swipeReduced() {
    try { return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
    catch (e) { return false; }
  }

  // Tab order comes from the rendered tab bar so it can never drift from
  // what the user actually sees.
  function swipeTabOrder() {
    return [...root.querySelectorAll(".tab")].map(el => el.dataset.tab).filter(Boolean);
  }

  // Blocked outright: settings, either overlay, or anything interactive.
  // The lime block is deliberately NOT blocked: a gesture that starts on it
  // drives the swipe like any other, the block simply does not travel.
  function swipeBlocked(target) {
    if (settingsOpen) return true;
    if (newMonthOpen) return true;
    if (importFlow && importFlow.open) return true;
    if (document.querySelector(".overlay")) return true;
    if (!target || !target.closest) return true;
    if (target.closest("input, textarea, select, button, a, [contenteditable], .chip, .tab, .progress, [data-action]")) return true;
    return false;
  }

  // True when some ancestor rail can still scroll further the way the finger
  // is going. Pinned at its edge, the swipe is allowed through to the carousel.
  function swipeAbsorbedByRail(target, dir) {
    let el = target;
    while (el && el.nodeType === 1) {
      // Stop before body/html: those report a scrollWidth larger than their
      // client width for ordinary reasons, and treating the page itself as a
      // rail would kill every gesture.
      if (el === root || el === document.body || el === document.documentElement) break;
      let ox = "";
      try { ox = getComputedStyle(el).overflowX; } catch (e) { ox = ""; }
      const isRail = (ox === "auto" || ox === "scroll") && el.scrollWidth > el.clientWidth + 1;
      if (isRail) {
        const maxLeft = el.scrollWidth - el.clientWidth;
        if (dir < 0 && el.scrollLeft < maxLeft - 1) return true;  // more to the right
        if (dir > 0 && el.scrollLeft > 1) return true;            // more to the left
      }
      el = el.parentElement;
    }
    return false;
  }

  // Drop every trace of a gesture: the incoming panel, its label twin, and any
  // transform left on the live body or label. Safe to call at any time, and
  // called on every touchstart so an OS-stolen gesture can never strand
  // anything translated.
  function swipeClearStale() {
    document.querySelectorAll(".swipe-incoming, .tabline-incoming").forEach(el => {
      if (el.parentNode) el.parentNode.removeChild(el);
    });
    document.querySelectorAll(".swipe-body, .tabline-layer").forEach(el => {
      el.classList.remove("swipe-animating");
      el.style.transform = "";
      el.style.transition = "";
    });
    document.querySelectorAll(".swipe-stage").forEach(el => { el.style.minHeight = ""; });
    swipe.incoming = null;
    swipe.lineIncoming = null;
  }

  function swipeReset() {
    if (swipe.watchdog) { clearTimeout(swipe.watchdog); swipe.watchdog = 0; }
    swipe.active = false; swipe.locked = null; swipe.dead = false;
    swipe.dx = 0; swipe.builtDir = 0; swipe.nextTab = null;
    swipe.stage = null; swipe.body = null; swipe.line = null;
    swipe.incoming = null; swipe.lineIncoming = null;
    swipe.startTarget = null;
  }

  // Build the neighbour in `dir` and park it exactly one width away. Called
  // once when the axis locks, and again only if the finger crosses back over
  // the origin and the other neighbour becomes the relevant one.
  function swipeBuildIncoming(dir) {
    if (swipe.incoming && swipe.incoming.parentNode) swipe.incoming.parentNode.removeChild(swipe.incoming);
    if (swipe.lineIncoming && swipe.lineIncoming.parentNode) swipe.lineIncoming.parentNode.removeChild(swipe.lineIncoming);
    swipe.incoming = null;
    swipe.lineIncoming = null;
    swipe.builtDir = dir;
    swipe.nextTab = null;

    const order = swipeTabOrder();
    const i = order.indexOf(currentTab);
    const nextIndex = dir < 0 ? i + 1 : i - 1;
    // No neighbour that way: nothing to build, the drag rubber-bands instead.
    if (i < 0 || nextIndex < 0 || nextIndex >= order.length) return;
    const s = DataService.get();
    if (!s || !swipe.stage) return;

    const nextTab = order[nextIndex];
    const panel = document.createElement("div");
    panel.className = "swipe-incoming";
    panel.innerHTML = swipeBodyInner(s, nextTab);

    // Pin the panel's top to whatever the viewport top is showing, so the
    // incoming tab is seen from ITS top while the outgoing one keeps the
    // scroll position the user actually had.
    const rect = swipe.stage.getBoundingClientRect();
    const top = Math.max(0, -rect.top);
    panel.style.top = top + "px";
    panel.style.height = window.innerHeight + "px";
    swipe.stage.appendChild(panel);
    // Guarantee the stage is tall enough to hold the panel, so the panel is
    // never clipped short by a stage whose own content is shorter.
    swipe.stage.style.minHeight = (top + window.innerHeight) + "px";
    swipe.incoming = panel;

    if (swipe.line && swipe.line.parentNode) {
      const li = document.createElement("div");
      li.className = "tabline-layer tabline-incoming";
      li.innerHTML = `<div class="section-label">${Util.esc(tabLabelText(nextTab))}</div>`;
      swipe.line.parentNode.appendChild(li);
      swipe.lineIncoming = li;
    }
    swipe.nextTab = nextTab;
  }

  // Move the pair as one unit. The incoming panel is always parked exactly one
  // width away on the side it is coming from, so the seam between them never
  // opens.
  function swipeMoveTo(dx) {
    const off = dx - swipe.builtDir * swipe.width;
    if (swipe.body) swipe.body.style.transform = "translateX(" + dx + "px)";
    if (swipe.line) swipe.line.style.transform = "translateX(" + dx + "px)";
    if (swipe.incoming) swipe.incoming.style.transform = "translateX(" + off + "px)";
    if (swipe.lineIncoming) swipe.lineIncoming.style.transform = "translateX(" + off + "px)";
  }

  function swipeAnimateTo(bodyX, done) {
    const off = bodyX - swipe.builtDir * swipe.width;
    const parts = [swipe.body, swipe.line, swipe.incoming, swipe.lineIncoming].filter(Boolean);
    parts.forEach(el => el.classList.add("swipe-animating"));
    // Force layout so the starting transforms are committed before animating.
    if (swipe.body) void swipe.body.offsetHeight;
    if (swipe.body) swipe.body.style.transform = "translateX(" + bodyX + "px)";
    if (swipe.line) swipe.line.style.transform = "translateX(" + bodyX + "px)";
    if (swipe.incoming) swipe.incoming.style.transform = "translateX(" + off + "px)";
    if (swipe.lineIncoming) swipe.lineIncoming.style.transform = "translateX(" + off + "px)";

    let fired = false;
    const finish = () => {
      if (fired) return;
      fired = true;
      if (swipe.body) swipe.body.removeEventListener("transitionend", finish);
      done();
    };
    if (swipe.body) swipe.body.addEventListener("transitionend", finish);
    setTimeout(finish, SWIPE_MS + 120);
  }

  function swipeSettleBack() {
    if (swipeReduced() || !swipe.body) { swipeClearStale(); swipeReset(); return; }
    swipe.animating = true;
    swipeAnimateTo(0, () => {
      swipeClearStale();
      swipe.animating = false;
    });
    swipeReset();
  }

  // Commit: slide the pair the remaining distance. Both travel exactly the same
  // number of pixels, so the outgoing body ends one width off screen at the
  // same instant the incoming panel lands at zero. render() then installs the
  // real, event-bound DOM for the new tab.
  function swipeCommit(nextTab, dir) {
    if (swipeReduced()) {
      swipeClearStale();
      swipeReset();
      currentTab = nextTab;
      render();
      return;
    }
    swipe.animating = true;
    // Highlight the destination tab immediately; waiting for the animation
    // makes the bottom bar feel a frame behind the content.
    root.querySelectorAll(".tab").forEach(el => {
      el.classList.toggle("active", el.dataset.tab === nextTab);
    });
    swipeAnimateTo(dir * swipe.width, () => {
      swipeClearStale();
      swipe.animating = false;
      currentTab = nextTab;
      render();
    });
    swipeReset();
  }

  function installSwipeNav() {
    document.addEventListener("touchstart", (e) => {
      if (swipe.animating) { swipe.dead = true; return; }
      swipeReset();
      swipeClearStale();
      if (e.touches.length !== 1) { swipe.dead = true; return; }
      const t = e.touches[0];
      if (t.clientX < SWIPE_EDGE_GUARD || t.clientX > window.innerWidth - SWIPE_EDGE_GUARD) { swipe.dead = true; return; }
      if (swipeBlocked(e.target)) { swipe.dead = true; return; }
      swipe.active = true;
      swipe.x0 = t.clientX; swipe.y0 = t.clientY; swipe.t0 = performance.now();
      swipe.startTarget = e.target;
      swipe.width = window.innerWidth;
    }, { passive: true });

    // Not passive: once the gesture is horizontally locked we preventDefault
    // so the page cannot scroll underneath the slide.
    document.addEventListener("touchmove", (e) => {
      if (!swipe.active || swipe.dead) return;
      if (e.touches.length !== 1) { swipe.dead = true; return; }
      const t = e.touches[0];
      const dx = t.clientX - swipe.x0;
      const dy = t.clientY - swipe.y0;

      if (!swipe.locked) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        // Axis lock is permanent for the life of the gesture.
        if (Math.abs(dx) <= Math.abs(dy) * SWIPE_AXIS_RATIO) { swipe.locked = "y"; return; }
        const dir0 = dx < 0 ? -1 : 1;
        if (swipeAbsorbedByRail(swipe.startTarget, dir0)) { swipe.dead = true; return; }
        swipe.stage = root.querySelector(".swipe-stage");
        swipe.body = root.querySelector(".swipe-body");
        swipe.line = root.querySelector(".tabline-layer");
        if (!swipe.stage || !swipe.body) { swipe.dead = true; return; }
        // Park the incoming panel exactly one PANEL width away, not one
        // viewport width: #root is capped at 480px, so on anything wider the
        // two would sit apart by the difference and reopen the gap.
        swipe.width = Math.round(swipe.stage.getBoundingClientRect().width) || window.innerWidth;
        swipe.locked = "x";
        // One build per gesture, here — not per move event.
        swipeBuildIncoming(dir0);
        // Watchdog: if the gesture never reports an end (interrupted by the
        // OS, a system sheet, or backgrounding), settle back rather than
        // leaving anything translated.
        if (swipe.watchdog) clearTimeout(swipe.watchdog);
        swipe.watchdog = setTimeout(() => {
          if (swipe.locked === "x") swipeSettleBack();
          else swipeClearStale();
        }, 2000);
      }
      if (swipe.locked !== "x") return;

      e.preventDefault();
      const dir = dx < 0 ? -1 : 1;
      // Dragged back past the origin: the neighbour we built is now the wrong
      // one. Rebuild for the direction the finger is actually going.
      if (dir !== swipe.builtDir) swipeBuildIncoming(dir);

      // Rubber-band only where there is no tab to bring in.
      const eff = swipe.nextTab ? dx : dx * 0.25;
      swipe.dx = eff;
      swipeMoveTo(eff);
    }, { passive: false });

    const end = () => {
      if (!swipe.active || swipe.dead || swipe.locked !== "x") {
        swipeClearStale();
        swipeReset();
        return;
      }
      const dx = swipe.dx;
      const dt = Math.max(1, performance.now() - swipe.t0);
      const vel = Math.abs(dx) / dt;
      const dir = swipe.builtDir;
      const committed = Math.abs(dx) > SWIPE_COMMIT_PX ||
                        (Math.abs(dx) > SWIPE_FLICK_PX && vel > SWIPE_FLICK_VEL);
      if (committed && swipe.nextTab) swipeCommit(swipe.nextTab, dir);
      else swipeSettleBack();
    };
    document.addEventListener("touchend", end, { passive: true });
    document.addEventListener("touchcancel", () => {
      if (swipe.locked === "x") swipeSettleBack();
      else { swipeClearStale(); swipeReset(); }
    }, { passive: true });
  }
  function installFloatingChrome() {
    if (!document.getElementById("scroll-btn")) {
      const btn = document.createElement("button");
      btn.id = "scroll-btn";
      btn.className = "scroll-btn hidden";
      btn.textContent = "↑";
      btn.setAttribute("aria-label", "SCROLL");
      btn.setAttribute("data-learn", "SCROLL BUTTON. TAP TO JUMP TO THE TOP WHEN YOU'RE FAR DOWN THE PAGE, OR TO THE BOTTOM WHEN YOU'RE NEAR THE TOP. HIDDEN WHEN THE PAGE FITS IN ONE SCREEN.");
      btn.addEventListener("click", (e) => {
        // Learner mode short-circuits via the capture-phase handler below,
        // but guard here too so we never scroll accidentally in learner mode.
        if (learnerMode) return;
        const y = window.scrollY || document.documentElement.scrollTop || 0;
        if (y > 300) window.scrollTo({ top: 0, behavior: "smooth" });
        else window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      });
      document.body.appendChild(btn);
    }
    if (!document.getElementById("learn-callout")) {
      const cal = document.createElement("div");
      cal.id = "learn-callout";
      cal.className = "learn-callout";
      cal.innerHTML = `<div class="title"></div><div class="text"></div>`;
      document.body.appendChild(cal);
    }
    // Capture-phase click handler for learner mode. When learnerMode is on,
    // intercept every click, find nearest data-learn ancestor, show its
    // description, and cancel the underlying action. Learner-toggle itself
    // is explicitly whitelisted so users can turn learner mode off.
    if (!window.__clearLearnerBound) {
      window.__clearLearnerBound = true;
      document.addEventListener("click", (e) => {
        if (!learnerMode) return;
        // Allow the ? icon and its own children through so the toggle works.
        const toggleEl = e.target.closest("[data-action=learner-toggle]");
        if (toggleEl) return;
        // Allow taps on the callout itself to dismiss it.
        const inCallout = e.target.closest("#learn-callout");
        const cal = document.getElementById("learn-callout");
        if (inCallout) {
          if (cal) cal.classList.remove("on");
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        const el = e.target.closest("[data-learn]");
        e.preventDefault();
        e.stopPropagation();
        if (!el) {
          if (cal) cal.classList.remove("on");
          return;
        }
        const text = el.getAttribute("data-learn") || "";
        const title = (el.getAttribute("aria-label") || el.textContent || "").trim().slice(0, 40).toUpperCase();
        if (cal) {
          cal.querySelector(".title").textContent = title;
          cal.querySelector(".text").textContent = text;
          cal.classList.add("on");
        }
      }, true);
    }
    refreshScrollBtn();
  }

  function refreshScrollBtn() {
    const btn = document.getElementById("scroll-btn");
    if (!btn) return;
    const canScroll = document.documentElement.scrollHeight > window.innerHeight + 32;
    if (!canScroll) { btn.classList.add("hidden"); return; }
    btn.classList.remove("hidden");
    const y = window.scrollY || document.documentElement.scrollTop || 0;
    btn.textContent = y > 300 ? "↑" : "↓";
  }

  return { render, renderLoading, finishLoading, installFloatingChrome, installSwipeNav, refreshScrollBtn };
})();

/* ============================================================
   BOOT
   ============================================================ */
(function boot() {
  // Track whether we've ever handed off from the loading screen. First
  // snapshot arrival plays the shimmer climax + whiteout before rendering
  // the real screen; subsequent snapshots are ordinary reactive re-renders.
  let handedOff = false;
  DataService.onData(() => {
    if (!handedOff) {
      handedOff = true;
      UI.finishLoading(() => { UI.render(); UI.refreshScrollBtn(); });
    } else {
      UI.render();
      UI.refreshScrollBtn();
    }
  });
  DataService.onError(() => {
    // If we've never received data and we can't reach Firestore,
    // fall back gracefully — if there's no household ID, show setup.
    if (!DataService.get() && !DataService.getHouseholdId()) {
      UI.render();
    }
  });

  // Persistent DOM elements that survive #root re-renders.
  UI.installFloatingChrome();
  UI.installSwipeNav();

  const existing = DataService.getHouseholdId();
  if (existing) {
    UI.renderLoading("SYNCING...");
    if (db) {
      DataService.subscribe(existing);
      // Safety: if we don't receive data within 6s, keep loading screen but still allow reset
    } else {
      UI.renderLoading("OFFLINE; CAN'T REACH SYNC");
    }
  } else {
    UI.render(); // renders setup
  }

  window.addEventListener("scroll", UI.refreshScrollBtn, { passive: true });
  window.addEventListener("resize", UI.refreshScrollBtn);
})();
</script>

<script>
(function () {
  "use strict";

  var KEY = "clear.sound";
  function enabled() {
    try { return localStorage.getItem(KEY) !== "0"; } catch (e) { return true; }
  }
  function setEnabled(v) {
    try { localStorage.setItem(KEY, v ? "1" : "0"); } catch (e) {}
  }

  var ctx = null;
  function audio() {
    if (ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { ctx = new AC(); } catch (e) { return null; }
    return ctx;
  }

  // One voice: fast attack, exponential decay, triangle wave. Quiet on
  // purpose — peak gain here is roughly a tenth of full scale.
  function tone(freq, start, dur, peak, type) {
    var c = audio();
    if (!c) return;
    var t0 = c.currentTime + start;
    var osc = c.createOscillator();
    var g = c.createGain();
    osc.type = type || "triangle";
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  // Major intervals throughout — that's what reads as cheerful rather than
  // neutral. E6 / G#6 / B6 territory, kept short so nothing rings out.
  var VOICES = {
    tap:     function () { tone(1047, 0, 0.05, 0.030); },
    commit:  function () { tone(784, 0, 0.06, 0.038); tone(1175, 0.055, 0.10, 0.034); },
    dismiss: function () { tone(659, 0, 0.05, 0.028); tone(494, 0.05, 0.09, 0.024); },
    alert:   function () { tone(415, 0, 0.07, 0.032); tone(415, 0.10, 0.09, 0.026); },
    done:    function () { tone(784, 0, 0.06, 0.034); tone(988, 0.06, 0.06, 0.034); tone(1319, 0.12, 0.14, 0.030); }
  };

  var last = 0;
  function play(name) {
    if (!enabled()) return;
    var now = Date.now();
    if (now - last < 45) return;
    last = now;
    var c = audio();
    if (!c) return;
    if (c.state === "suspended") { try { c.resume(); } catch (e) {} }
    var v = VOICES[name];
    if (v) v();
  }

  function voiceFor(action, target) {
    if (!action) {
      if (target.closest(".tab, .chip, .toggle, .txn-row, .scroll-btn")) return "tap";
      return null;
    }
    if (/^(save|add|apply|confirm|commit|copy|yes|import-commit|new-month)/.test(action)) return "commit";
    if (/^(cancel|close|dismiss|skip|unskip)/.test(action)) return "dismiss";
    if (/(delete|remove|reset|signout|clear)/.test(action)) return "alert";
    return "tap";
  }

  // Bubble phase. Learner mode's capture handler calls stopPropagation, so
  // this never fires while learner mode is on — taps stay silent there,
  // matching the rest of the app's behavior.
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || !t.closest) return;

    var toggle = t.closest("[data-action=sound-toggle]");
    if (toggle) {
      var next = !enabled();
      setEnabled(next);
      toggle.classList.toggle("on", next);
      if (window.__clearSoundSvg) toggle.innerHTML = window.__clearSoundSvg(24, next);
      if (next) { var c = audio(); if (c && c.state === "suspended") { try { c.resume(); } catch (err) {} } play("commit"); }
      return;
    }

    var actionEl = t.closest("[data-action]");
    var action = actionEl ? actionEl.getAttribute("data-action") : null;
    var name = voiceFor(action, t);
    if (name) play(name);
  }, false);

  // Unlock the context on the first gesture; iOS won't start it otherwise.
  function unlock() {
    var c = audio();
    if (c && c.state === "suspended") { try { c.resume(); } catch (e) {} }
  }
  window.addEventListener("touchend", unlock, { passive: true, once: true });
  window.addEventListener("click", unlock, { passive: true, once: true });
})();
</script>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  // V13: honor prefers-reduced-motion by lowering the ceiling but still run
  // the driver so the rest-fade to 0 applies (strictly friendlier than the
  // media-query's static 0.14).
  var reduced = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  var BASE = reduced ? 0.14 : 0.22;      // authored ceiling — never exceeded
  var BLOOM = reduced ? 0 : 0.44;
  var RANGE = 34;
  var target = 0, cur = 0, raf = 0;

  var perm = "not-requested";
  var oriCount = 0, motCount = 0, source = "scroll", lastRaw = 0;

  // --- Rest-fade state (V13) ---------------------------------------------
  // Above IDLE_MS since the last real input event, fade --she + --shb to 0
  // over FADE_OUT_MS and park --shp at whichever of 0/100 is the shorter
  // travel from the current position. Any new event snaps fadeAmount back up
  // over FADE_IN_MS and cancels parking. rAF loop STOPS once settled and
  // restarts on the next event, so we don't burn frames while idle.
  var IDLE_MS = 120;
  var FADE_OUT_MS = 400;
  var FADE_IN_MS = 150;
  var fadeAmount = 1;                    // 0..1 multiplier on ceiling
  var lastActivityTs = 0;
  var parkedShp = null;                  // 0 or 100 target when at rest
  var lastFrameTs = 0;                   // dt anchor

  // Scroll is the default driver: no permission, no reset between launches,
  // identical on every device. SWEEP is how many pixels of scrolling equal one
  // full pass of the highlight; the triangle wave sends it out to a bloom at
  // each end and back.
  var SWEEP = 900;
  function scrollTarget() {
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    var doc = document.documentElement;
    var scrollable = doc.scrollHeight > window.innerHeight + 32;
    // V13: no more sine-drift on short screens. Rest-fade handles the
    // "nothing is happening" state cleanly, so we don't need artificial motion.
    if (!scrollable) return 0;
    var phase = (y % SWEEP) / SWEEP;
    return 1 - 4 * Math.abs(phase - 0.5);
  }

  function noteActivity() {
    // Periodic mode is on its own clock; scrolling must not drive or wake it.
    if (shimmerOff || mode === "periodic") return;
    lastActivityTs = performance.now();
    parkedShp = null;                    // cancel parking; user is driving again
    if (!raf) { lastFrameTs = 0; raf = requestAnimationFrame(loop); }
  }
  // Scroll wake-up. Passive listener — never blocks scroll performance.
  window.addEventListener("scroll", noteActivity, { passive: true });

  function paint(shpValue) {
    var k = Math.abs(cur);
    var b = Math.pow(k, 2.6) * BLOOM;
    var eNat = BASE + b * 0.9;           // natural ceiling contribution
    var e = fadeAmount * eNat;
    var bl = fadeAmount * b;
    root.style.setProperty("--shp", shpValue.toFixed(1) + "%");
    root.style.setProperty("--she", e.toFixed(3));
    root.style.setProperty("--shb", bl.toFixed(3));
  }

  // ---- PERIODIC MODE ------------------------------------------------------
  // A timed sweep: the band crosses everything once, then the highlight is
  // fully off until the next one. Nothing here is driven by scrolling.
  //
  // This engine keeps its OWN rAF handle (praf). Sharing `raf` with the tilt
  // loop meant either could cancel or overwrite the other's pending frame, and
  // a half-finished sweep would freeze with the highlight stuck on.
  var PERIOD_MS = 7000;   // a sweep starts this often
  var SWEEP_MS  = 1400;   // how long one traverse takes
  var sweepT0 = 0, periodicTimer = 0, praf = 0;

  function clearPeriodic() {
    if (periodicTimer) { clearTimeout(periodicTimer); periodicTimer = 0; }
    if (praf) { cancelAnimationFrame(praf); praf = 0; }
    sweepT0 = 0;
  }
  function startPeriodicSweep() {
    periodicTimer = 0;
    if (shimmerOff || mode !== "periodic") return;
    sweepT0 = 0;
    if (!praf) praf = requestAnimationFrame(periodicFrame);
  }
  function periodicFrame(now) {
    praf = 0;
    if (shimmerOff || mode !== "periodic") return;
    if (!now) now = performance.now();
    if (!sweepT0) sweepT0 = now;
    var r = document.documentElement;
    var p = (now - sweepT0) / SWEEP_MS;
    if (p >= 1) {
      // Sweep finished: fully dark until the next one.
      r.style.setProperty("--she", "0");
      r.style.setProperty("--shb", "0");
      if (!periodicTimer) {
        periodicTimer = setTimeout(startPeriodicSweep, Math.max(0, PERIOD_MS - SWEEP_MS));
      }
      return;
    }
    r.style.setProperty("--shp", (p * 100).toFixed(1) + "%");
    r.style.setProperty("--she", BASE.toFixed(3));
    r.style.setProperty("--shb", (BLOOM * 0.45).toFixed(3));
    praf = requestAnimationFrame(periodicFrame);
  }

  function loop(now) {
    if (shimmerOff) { raf = 0; applyShimmerOff(); return; }
    // V14: clear raf FIRST so if a synchronous helper (or a future event
    // dispatch that fires inside this callback) calls noteActivity(),
    // its "if (!raf)" guard schedules a fresh frame instead of skipping.
    // Same class of bug the loading driver had — audit and preempt.
    raf = 0;
    if (!now) now = performance.now();
    if (!lastFrameTs) lastFrameTs = now;
    var dt = Math.min(50, now - lastFrameTs); // clamp big jumps (tab switch)
    lastFrameTs = now;

    // Motion wins only once it's actually delivering events; otherwise scroll.
    if (source !== "orientation" && source !== "motion") target = scrollTarget();

    var idle = (now - lastActivityTs) > IDLE_MS;

    // While idle the parking logic below owns `cur`. Applying the target pull
    // here as well made the two fight to an equilibrium short of the park
    // position, so `parkedEnough` never became true and the loop spun at 60fps
    // forever while idle. Only track the scroll/tilt target while active.
    if (!idle) cur += (target - cur) * 0.075;

    if (idle && fadeAmount > 0) {
      fadeAmount = Math.max(0, fadeAmount - dt / FADE_OUT_MS);
    } else if (!idle && fadeAmount < 1) {
      fadeAmount = Math.min(1, fadeAmount + dt / FADE_IN_MS);
    }

    // Park --shp: pick shorter travel from current position to 0 or 100.
    var shpNow = 50 + cur * 50;
    if (idle) {
      if (parkedShp === null) parkedShp = shpNow < 50 ? 0 : 100;
      // Ease shp toward parkedShp on the same timescale as the fade.
      var parkStep = Math.min(1, (dt / FADE_OUT_MS) * 4);
      shpNow = shpNow + (parkedShp - shpNow) * parkStep;
      // Snap the last hair of the ease so `parkedEnough` can actually become
      // true; an asymptotic approach alone never crosses the threshold.
      if (Math.abs(shpNow - parkedShp) < 0.05) shpNow = parkedShp;
      // Keep cur in sync so a wake-up doesn't snap the position back.
      cur = (shpNow - 50) / 50;
    }

    paint(shpNow);
    if (dbg) drawDbg();

    var parkedEnough = (parkedShp === null) || Math.abs(shpNow - parkedShp) < 0.05;
    var settled = idle && fadeAmount === 0 && parkedEnough;
    if (settled) {
      // Stop the loop. noteActivity() will kick it back on next event.
      // raf is already 0 from the top of this tick.
      return;
    }
    // Only reschedule if nothing else did during this callback.
    if (!raf) raf = requestAnimationFrame(loop);
  }

  function setTarget(t) {
    target = Math.max(-1, Math.min(1, t));
  }

  function onOrient(e) {
    var g = e.gamma;
    if (g === null || g === undefined) return;
    oriCount++;
    source = "orientation";
    lastRaw = g;
    setTarget(g / RANGE);
    noteActivity();
  }

  // Fallback for devices that grant motion but report null orientation.
  // accelerationIncludingGravity.x runs about -9.8..9.8 across a full roll.
  function onMotion(e) {
    if (oriCount > 0) return;
    var a = e.accelerationIncludingGravity;
    if (!a || a.x === null || a.x === undefined) return;
    motCount++;
    source = "motion";
    lastRaw = a.x;
    setTarget(-a.x / 5.5);
    noteActivity();
  }

  function listen() {
    window.addEventListener("deviceorientation", onOrient, { passive: true });
    window.addEventListener("devicemotion", onMotion, { passive: true });
  }

  var DOE = window.DeviceOrientationEvent;
  var DME = window.DeviceMotionEvent;
  var needsAsk = !!(DOE && typeof DOE.requestPermission === "function");
  var granted = false;

  function listenAbsolute() {
    window.addEventListener("deviceorientationabsolute", onOrient, { passive: true });
  }

  // Called from passive taps AND from the debug button. iOS requires this to
  // run inside a trusted gesture handler; calling it repeatedly is harmless
  // because it resolves instantly from the remembered answer after the first
  // prompt.
  function requestMotion() {
    if (granted) return;
    if (!needsAsk) {
      perm = DOE ? "not-required" : "no-DeviceOrientationEvent";
      granted = true;
      listen(); listenAbsolute();
      return;
    }
    perm = "asking";
    try {
      DOE.requestPermission().then(function (state) {
        perm = state;
        if (state === "granted") { granted = true; listen(); listenAbsolute(); }
      })["catch"](function (err) { perm = "rejected: " + (err && err.message ? err.message : err); });
    } catch (err) {
      perm = "threw: " + (err && err.message ? err.message : err);
    }
    if (DME && typeof DME.requestPermission === "function") {
      try { DME.requestPermission()["catch"](function () {}); } catch (e2) {}
    }
  }

  window.__clearRequestMotion = requestMotion;

  function motionOptedIn() {
    try { return localStorage.getItem("clear.motion") === "1"; } catch (e) { return false; }
  }

  // Three-state shimmer preference, mirrored from the app script.
  function shimmerModeRaw() {
    try {
      var v = localStorage.getItem("clear.shimmer");
      if (v === "tilt" || v === "off" || v === "periodic") return v;
      return localStorage.getItem("clear.motion") === "1" ? "tilt" : "periodic";
    } catch (e) { return "periodic"; }
  }
  var mode = shimmerModeRaw();
  var shimmerOff = mode === "off";

  // "off" means no highlight at all: park the band, zero the energy and the
  // bloom, and never schedule a frame. The CSS defaults --she to 0.22, so it
  // has to be written explicitly rather than just left alone.
  function applyShimmerOff() {
    var r = document.documentElement;
    r.style.setProperty("--shp", "100%");
    r.style.setProperty("--she", "0");
    r.style.setProperty("--shb", "0");
  }

  // Called by the settings screen so the change takes effect immediately
  // instead of on next load.
  window.__clearApplyShimmerMode = function (next) {
    mode = next;
    shimmerOff = next === "off";
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    clearPeriodic();
    if (shimmerOff) { applyShimmerOff(); return; }
    if (next === "periodic") {
      // prefers-reduced-motion means don't animate unprompted.
      if (reduced) { applyShimmerOff(); return; }
      applyShimmerOff();            // start from a clean, dark state
      startPeriodicSweep();
      return;
    }
    lastActivityTs = performance.now();
    fadeAmount = 1;
    parkedShp = null;
    lastFrameTs = 0;
    raf = requestAnimationFrame(loop);
  };

  // Nothing is requested unless the user turned the tilt sensor on in
  // settings. Where the platform hands sensors over without a prompt we still
  // wait for the opt-in, so behavior matches what the settings screen says.
  if (motionOptedIn()) {
    if (!needsAsk) {
      requestMotion();
    } else {
      // click only. iOS throws NotAllowedError when this prompt is requested
      // from touchend, and a failed attempt used to burn the one chance we had.
      window.addEventListener("click", requestMotion, { passive: true });
    }
  }

  // Diagnostic overlay. Off unless the URL ends in #shimmer-debug, so it
  // costs nothing in normal use. Shows whether sensor events are arriving
  // and whether the CSS variable is actually changing.
  var dbg = null, dbgEl = null, dbgOut = null;
  function drawDbg() {
    if (!dbgOut) return;
    dbgOut.textContent =
      "perm:    " + perm +
      "\nopted in:" + motionOptedIn() +
      "\nsecure:  " + window.isSecureContext +
      "\nhas DOE: " + !!DOE + "   needsAsk: " + needsAsk +
      "\nsource:  " + source +
      "\norient:  " + oriCount + "   motion: " + motCount +
      "\nraw:     " + lastRaw.toFixed(2) +
      "\ntarget:  " + target.toFixed(3) +
      "\n--shp:   " + root.style.getPropertyValue("--shp") +
      "\nUA:      " + navigator.userAgent.slice(0, 44);
  }
  function initDbg() {
    if (dbgEl || String(location.hash).indexOf("shimmer-debug") === -1) return;
    dbg = true;
    dbgEl = document.createElement("div");
    dbgEl.style.cssText = "position:fixed;left:8px;bottom:140px;z-index:9999;padding:8px 10px;background:rgba(0,0,0,.88);border-radius:4px;text-transform:none;letter-spacing:0";
    dbgOut = document.createElement("pre");
    dbgOut.style.cssText = "margin:0;color:#CAFF4C;font:11px/1.45 ui-monospace,Menlo,monospace;white-space:pre";
    var b = document.createElement("button");
    b.textContent = "ENABLE MOTION";
    b.style.cssText = "display:block;width:100%;margin-top:8px;padding:10px;background:#CAFF4C;color:#1A3A8C;border:none;border-radius:4px;font:600 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em";
    b.addEventListener("click", function (ev) {
      ev.stopPropagation();
      requestMotion();
    });
    dbgEl.appendChild(dbgOut);
    dbgEl.appendChild(b);
    document.body.appendChild(dbgEl);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initDbg);
  } else {
    initDbg();
  }
  window.addEventListener("hashchange", initDbg);

  // Backgrounding the tab stops requestAnimationFrame dead. Without this, a
  // sweep interrupted half-way leaves --she at full and the highlight frozen
  // over the text until something wakes the loop — the exact legibility
  // problem the rest-fade exists to prevent. Park dark on hide, resume on show.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") {
      clearPeriodic();
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      if (!shimmerOff) applyShimmerOff();
      return;
    }
    if (shimmerOff) { applyShimmerOff(); return; }
    if (mode === "periodic") {
      applyShimmerOff();
      if (!reduced) startPeriodicSweep();
    } else {
      lastActivityTs = performance.now();
      fadeAmount = 1;
      parkedShp = null;
      lastFrameTs = 0;
      if (!raf) raf = requestAnimationFrame(loop);
    }
  });

  // Boot at ceiling with a brief "hello" pulse; if the user doesn't scroll or
  // tilt, the rest-fade takes it down to 0 within FADE_OUT_MS and the loop
  // parks itself. Any real input restarts everything via noteActivity().
  lastActivityTs = performance.now();
  if (shimmerOff) {
    applyShimmerOff();
  } else if (mode === "periodic") {
    applyShimmerOff();
    if (!reduced) startPeriodicSweep();
  } else {
    raf = requestAnimationFrame(loop);
  }
})();
</script>
