        <button class="txn-check ${titheIsPaid ? "checked" : ""}" data-action="bill-toggle" data-id="tithe" aria-label="GIVEN AS ONE LUMP" data-learn="MARK THE WHOLE MONTH'S TITHE AS GIVEN IN ONE GO. USE THIS INSTEAD OF THE PER-PAY-DAY TICKS BELOW IF YOU GIVE ONCE A MONTH; IT COVERS EVERYTHING AND THE PAY DAY ROWS STOP MATTERING."></button>
      </div>
      ${titheLandingsList.map(l => {
        const found = BudgetEngine.titheLandingRecord(s, l, paidMap);
        const subPaid = !!(found.rec && found.rec.paid);
        return `
        <div class="inc-sub">
          <div>
            <div class="inc-sub-label">${Util.esc(l.label)}</div>
            <div class="meta">${Util.esc(Util.fmtDateShort(l.date))}${l.received ? "" : " · PENDING"}</div>
          </div>
          <div class="inc-amt">${Util.esc(Util.fmtMoney(l.share, 2))}</div>
          <button class="txn-check ${subPaid ? "checked" : ""}" data-action="bill-toggle" data-id="${Util.esc(found.key)}" aria-label="TITHE GIVEN ON ${Util.esc(l.label)} ${Util.esc(Util.fmtDateShort(l.date))}" data-learn="MARK THIS ONE PAY DAY'S SHARE OF YOUR TITHE AS GIVEN. EACH PAY DAY IS TRACKED SEPARATELY, SO TICKING THIS ONE LEAVES THE OTHERS ALONE. THE SHARES ADD UP TO THE TOTAL ON THE ROW ABOVE."></button>
        </div>`;
      }).join("")}` : "";

    const titheRowHtml = titheOn ? `
      <div class="inc-row">
        <div>
          <div class="inc-label">TITHE</div>
          ${titheFromImport ? `<div class="meta">PAID ${Util.esc(Util.fmtMoney(Number(titheRec.amount)||0, 2))} ON ${Util.esc(Util.fmtDateShort(titheRec.paidDate))} · FROM IMPORT</div>` : ""}
        </div>
        <div class="inc-amt">
          ${Util.esc(Util.fmtMoney(titheAmt, 0))}
          <span style="opacity:0.75;">${BudgetEngine.tithePercent(s)}%</span>
        </div>
        ${titheMulti
          ? `<button class="inc-chev ${titheExpanded ? "open" : ""}${titheFullyCleared ? " all-clear" : ""}" data-action="tithe-expand-toggle" aria-expanded="${titheExpanded ? "true" : "false"}" aria-label="${titheClearedCount} OF ${titheLandingsList.length} PAY DAYS TITHED · ${titheExpanded ? "COLLAPSE" : "EXPAND"}" data-learn="YOUR TITHE IS GIVEN OUT OF PAYCHECKS, AND THIS MONTH HAS MORE THAN ONE PAY DAY, SO ONE CHECKBOX COULDN'T SAY WHICH SHARE HAD BEEN GIVEN. THE COUNT IS HOW MANY PAY DAYS ARE TICKED OFF; OPEN IT FOR A ROW PER PAY DAY, PLUS A SINGLE TICK IF YOU GIVE THE WHOLE MONTH AT ONCE.">${titheClearedCount}/${titheLandingsList.length} <span class="arrow">⌄</span></button>`
          : `<button class="txn-check ${titheIsPaid ? "checked" : ""}" data-action="bill-toggle" data-id="tithe" aria-label="PAID" data-learn="MARK YOUR TITHE AS GIVEN FOR THIS MONTH. THE MONEY COMES OUT OF YOUR TRACKED BALANCE AND STOPS BEING HELD BACK, SO SAFE TO SPEND DOESN'T MOVE — IT WAS ALREADY SET ASIDE FOR THIS."></button>`}
      </div>
      <div style="margin-top:-4px;">
        <button class="link" style="padding:0;min-height:auto;font-size:11px;letter-spacing:0.14em;" data-action="edit-tithe" data-learn="EDIT YOUR TITHE RATE. IT'S THE SAME RATE SETTINGS EDITS, SO CHANGES SHOW IN BOTH PLACES.">EDIT →</button>
      </div>
      ${titheEdit.open ? renderTitheEditForm() : ""}
      ${titheSubRowsHtml}` : "";

    const rowFor = (b) => {
      const rec = paidMap[b.id];
      const isPaid = !!(rec && rec.paid);
      const isSavings = b.category === "savings";
      const due = Number(b.dueDateOfMonth) || 0;
      // Overdue styling only for unpaid rows whose due day has already passed
      // in the month we're actually looking at.
      const overdue = !isPaid && sameMonth && due > 0 && due < todayDay;
      const fromImport = isPaid && rec.source === "import";
      // Ticking a bill can silently link it to a transaction already in the
      // ledger, which is what stops the same payment being counted twice.
      // Silent is fine; invisible is not — say which payment it found.
      const linkedTxn = (isPaid && rec.txnId && !fromImport)
        ? (s.transactions || []).find(t => t && t.id === rec.txnId)
        : null;
      const verb = isSavings ? "SAVED" : "PAID";
      return `
        <div class="inc-row">
          <div>
            <div class="inc-label">${Util.esc(b.label)}</div>
            ${fromImport ? `<div class="meta">${verb} ${Util.esc(Util.fmtMoney(Number(rec.amount)||0, 2))} ON ${Util.esc(Util.fmtDateShort(rec.paidDate))} · FROM IMPORT</div>` : ""}
            ${linkedTxn ? `<div class="meta" data-learn="THIS TICK WAS MATCHED TO A TRANSACTION ALREADY IN YOUR LOG, SO THE PAYMENT IS ONLY COUNTED ONCE AGAINST YOUR BALANCE. UNTICK AND RE-TICK IF IT PICKED THE WRONG ONE.">${verb} ${Util.esc(Util.fmtMoney(Number(rec.amount)||0, 2))} ON ${Util.esc(Util.fmtDateShort(rec.paidDate))} · MATCHED ${Util.esc((linkedTxn.note || "A LOGGED PAYMENT").slice(0, 24))}</div>` : ""}
          </div>
          <div class="inc-amt">
            ${Util.esc(Util.fmtMoney(Number(b.amount) || 0, 0))}
            ${isSavings ? "" : `<span class="${overdue ? "text-danger" : ""}" style="opacity:0.75;">DUE ${due || "-"}</span>`}
          </div>
          <button class="txn-check ${isPaid ? "checked" : ""}" data-action="bill-toggle" data-id="${Util.esc(b.id)}" aria-label="${verb}" data-learn="${isSavings ? "MARK THIS SAVINGS TRANSFER AS SAVED FOR THIS MONTH. THE MONEY COMES OUT OF YOUR TRACKED BALANCE AND STOPS BEING HELD BACK, SO SAFE TO SPEND DOESN'T MOVE — IT WAS ALREADY SET ASIDE FOR THIS." : "MARK THIS BILL AS PAID FOR THIS MONTH. THE MONEY COMES OUT OF YOUR TRACKED BALANCE AND STOPS BEING HELD BACK, SO SAFE TO SPEND DOESN'T MOVE — IT WAS ALREADY SET ASIDE FOR THIS."}"></button>
        </div>
        ${renderBillLinkPrompt(b)}`;
    };

    const byDue = (a, b) => (Number(a.dueDateOfMonth) || 0) - (Number(b.dueDateOfMonth) || 0);
    const billItems = bills.filter(b => b.category !== "savings").slice().sort(byDue);
    const savingsItems = bills.filter(b => b.category === "savings").slice().sort(byDue);

    // Credit cards carrying a balance ride along in the RECURRING list so every
    // monthly obligation is visible in one place. A card's figures live on the
    // debt it's linked to (balance, minimum, due day).
    //
    // These rows are not entries in s.bills: card minimums are already
    // subtracted from Safe to Spend as debt minimums, so storing them as real
    // bills would double-count them. Their PAID? tick is the same record the
    // DEBTS tab card uses, so ticking here ticks there and vice versa.
    // A debt carrying a balance becomes a row here whether or not a card is
    // attached to it. Shared shape so a card and a loan render and tick
    // identically; only the label under the name differs.
    const debtRowItem = (d, label, kindLabel) => {
      const paidTxn = tickPayTxnFor(s, d.id);
      // A cleared balance normally drops the row out of this list; keep it
      // while its tick is on, or there'd be no way left to undo the payment.
      if ((Number(d.balance) || 0) <= 0 && !paidTxn) return null;
      return {
        debt: d,
        label: label,
        kindLabel: kindLabel,
        amount: Number(d.minimumPayment) || 0,
        dueDateOfMonth: Number(d.dueDateOfMonth) || 0,
        paidTxn: paidTxn
      };
    };

    const cardBillItems = (s.creditCards || []).map(c => {
      const d = c.debtId ? (s.debts || []).find(x => x.id === c.debtId) : null;
      if (!d) return null;
      return debtRowItem(d, c.label, "CARD MINIMUM");
    }).filter(Boolean).sort(byDue);

    // Loans and anything else in DEBTS with no card attached. These never
    // appeared here at all: the list was built by walking the cards, so a debt
    // nothing was linked to had no way in, and a car loan due on the 10th was
    // invisible on the one tab that answers "what do I still owe this month".
    // Same reasoning as the cards for staying out of s.bills — their minimums
    // already reach Safe To Spend as debt minimums, so storing them as bills
    // would count them twice.
    const cardDebtIds = {};
    (s.creditCards || []).forEach(c => { if (c.debtId) cardDebtIds[c.debtId] = true; });
    const loanBillItems = (s.debts || [])
      .filter(d => d && !cardDebtIds[d.id])
      .map(d => debtRowItem(d, d.label, "LOAN MINIMUM"))
      .filter(Boolean).sort(byDue);

    const debtRowFor = (c) => {
      const due = Number(c.dueDateOfMonth) || 0;
      const paid = !!c.paidTxn;
      const overdue = !paid && sameMonth && due > 0 && due < todayDay;
      // Nothing to log without a minimum on the debt.
      const canPay = c.amount > 0;
      const paidNote = paid
        ? ` · PAID ${Util.fmtMoney(Number(c.paidTxn.amount) || 0, 0)}`
        : (canPay ? "" : " · SET A MINIMUM IN SETTINGS");
      return `
        <div class="inc-row">
          <div>
            <div class="inc-label">${Util.esc(c.label)}</div>
            <div class="meta">${Util.esc(c.kindLabel)}${Util.esc(paidNote)}</div>
          </div>
          <div class="inc-amt">
            ${Util.esc(Util.fmtMoney(c.amount, 0))}
            <span class="${overdue ? "text-danger" : ""}" style="opacity:0.75;">DUE ${due || "-"}</span>
          </div>
          <button class="txn-check ${paid ? "checked" : ""} ${canPay ? "" : "disabled"}"${canPay ? "" : " disabled"} data-action="card-min-toggle" data-id="${Util.esc(c.debt.id)}" aria-label="PAID" data-learn="TICK TO LOG A PAYMENT AGAINST THIS DEBT. IT ASKS WHETHER YOU PAID THE MINIMUM OR A DIFFERENT AMOUNT, THEN RECORDS A DEBIT TRANSACTION AND REDUCES THE BALANCE. IT TICKS ON THE DEBTS TAB TOO; UNTICK TO UNDO BOTH."></button>
        </div>
        ${renderMinPayPrompt(s, c.debt)}`;
    };

    // Cards first, then loans beneath them.
    const debtBillItems = cardBillItems.concat(loanBillItems);
    const cardRowsHtml = debtBillItems.map(debtRowFor).join("");

    // The header figures describe everything listed in this section, cards
    // included, so the count matches what's actually on screen. These sums are
    // local to this block on purpose: BudgetEngine.totalBills stays bills-only
    // so Safe to Spend and Budgeted don't shift.
    // A card's contribution is capped at its minimum: this line is progress
    // toward what's owed, so overpaying a card shouldn't push it past 100%.
    // The full amount paid still shows on the row and in the debt balance.
    const headerPaidTotal = paidTotal + (titheOn ? titheEffectivePaid : 0) + debtBillItems.reduce((a, c) => {
      if (!c.paidTxn) return a;
      return a + Math.min(Number(c.paidTxn.amount) || 0, Number(c.amount) || 0);
    }, 0);
    const headerExpectedTotal = expectedTotal + titheAmt + debtBillItems.reduce(
      (a, c) => a + (Number(c.amount) || 0), 0);
    const headerPaidCount = paidCount + (titheFullyCleared ? 1 : 0) + debtBillItems.filter(c => c.paidTxn).length;
    const headerItemCount = bills.length + (titheOn ? 1 : 0) + debtBillItems.length;

    // Same add-form machinery Settings uses, surfaced at the end of each group.
    const addLink = (kind, label) => addForms[kind]
      ? renderAddForm(kind)
      : `<button class="link" style="margin-top:12px;" data-action="show-add" data-kind="${kind}" data-learn="ADD A NEW ${Util.esc(label)} TO YOUR BUDGET. IT SHOWS UP HERE AND IN SETTINGS.">* ADD ${Util.esc(label)} →</button>`;

    // Each group scrolls on its own, using the same box the transaction list
    // uses. Only the rows scroll: the group title, the column headings and the
    // add link all stay put, so the headings can't scroll away from the rows
    // they describe and both add links are always reachable.
    // Each group is its own sub-tab now, so the group name lives on the tab
    // rather than as a heading above the rows. Only the rows scroll: the column
    // headings and the add link stay put, so the headings can't scroll away
    // from the rows they describe and the add link is always reachable.
    const groupHtml = (title, items, kind, addLabel, extraRows, leadingRows) => `
      <div style="margin-top:24px;">
        ${(items.length || extraRows || leadingRows) ? `
          <div class="inc-head">
            <div class="sub-label">NAME</div>
            <div class="sub-label">AMOUNT</div>
            <div class="sub-label">${kind === "savings" ? "SAVED?" : "PAID?"}</div>
          </div>
          <div class="txn-scroll" data-scroll-key="bills-scroll-${Util.esc(kind)}" data-learn="${Util.esc(title)} FOR THIS MONTH. SCROLL WITHIN THIS BOX.">
            ${leadingRows || ""}
            ${items.map(rowFor).join("")}
            ${extraRows || ""}
            ${kind === "bill" ? scrollHintHtml("bills") : ""}
          </div>
        ` : `<div class="meta">NOTHING HERE YET · ADD ONE BELOW</div>`}
        ${addLink(kind, addLabel)}
      </div>`;

    const listHtml = `
      <div class="subtab-row" style="margin-top:24px;" data-learn="SWITCH BETWEEN YOUR BILLS AND YOUR SAVINGS TRANSFERS. THE FIGURES ABOVE COVER BOTH. YOUR HALF-FILLED ADD FORM IS KEPT WHEN YOU SWITCH.">
        <button class="subtab ${billsSubTab === "bills" ? "active" : ""}" data-action="bills-subtab" data-sub="bills" data-learn="MONTHLY BILLS AND FIXED EXPENSES, PLUS THE MINIMUM ON ANY CREDIT CARD OR LOAN CARRYING A BALANCE.">BILLS</button>
        <button class="subtab ${billsSubTab === "savings" ? "active" : ""}" data-action="bills-subtab" data-sub="savings" data-learn="MONEY YOU SET ASIDE EACH MONTH. TRACKED THE SAME WAY AS A BILL AND SUBTRACTED FROM SAFE TO SPEND THE SAME WAY.">SAVINGS</button>
      </div>
      ${billsSubTab === "savings"
        ? groupHtml("SAVINGS", savingsItems, "savings", "SAVINGS")
        : groupHtml("BILLS", billItems, "bill", "BILL", cardRowsHtml, titheRowHtml)}`;

    // The MONTH OF line and the "→ BILLS" section label used to open this block.
    // Both are redundant now that the shared lime block above carries the month
    // and the tab label.
    return `
        <section class="section lavender" data-learn="BILLS STATUS FOR THIS MONTH. TICK EACH BILL AS IT GETS PAID SO YOU CAN SEE WHAT'S LEFT. THIS IS TRACKING ONLY AND NEVER CHANGES YOUR BUDGET MATH.">
          <div class="section-label">→ RECURRING</div>
          <div class="sub-label" style="margin-top:16px;" data-learn="HOW MUCH OF YOUR MONTHLY TOTAL YOU'VE MARKED PAID SO FAR THIS MONTH. COVERS EVERYTHING LISTED BELOW: BILLS, SAVINGS, AND ANY CREDIT CARD OR LOAN MINIMUMS.">${Util.esc(Util.fmtMoney(headerPaidTotal, 0))} OF ${Util.esc(Util.fmtMoney(headerExpectedTotal, 0))} PAID</div>
          <div class="sub-label" style="margin-top:8px;" data-learn="HOW MANY INDIVIDUAL ROWS BELOW ARE TICKED OFF, CREDIT CARDS AND LOANS INCLUDED.">${headerPaidCount} OF ${headerItemCount} CLEARED</div>
          ${listHtml}
        </section>`;
  }

  function bindBillsEvents(s) {
    ensureScrollHintObserver("bills", '[data-scroll-key="bills-scroll-bill"]');
    root.querySelectorAll("[data-action=bills-subtab]").forEach(el => {
      el.addEventListener("click", () => { billsSubTab = el.dataset.sub; render(); });
    });
    root.querySelectorAll("[data-action=bill-toggle]").forEach(el => {
      el.addEventListener("click", () => toggleBillPaid(s, el.dataset.id));
    });
    root.querySelectorAll("[data-action=bill-link-yes]").forEach(el => {
      el.addEventListener("click", () => {
        const billId = el.dataset.id;
        const p = billLinkPrompts[billId];
        if (!p) return;
        const txn = (s.transactions || []).find(t => t && t.id === p.txnId);
        if (!txn) { delete billLinkPrompts[billId]; render(); return; }
        toggleBillPaid(s, billId, { txn, tier: "exact", certain: true, confirmed: true });
      });
    });
    root.querySelectorAll("[data-action=bill-link-no]").forEach(el => {
      // null (not undefined) means "no link" — it stops toggleBillPaid going
      // back and finding the same candidate again.
      el.addEventListener("click", () => toggleBillPaid(s, el.dataset.id, null));
    });
    root.querySelectorAll("[data-action=tithe-expand-toggle]").forEach(el => {
      el.addEventListener("click", () => { titheExpanded = !titheExpanded; render(); });
    });
    bindCardMinEvents(s);
    // The ADD BILL / ADD SAVINGS links reuse Settings' add-form machinery, and
    // the tithe row's EDIT link reuses Settings' rate editor.
    bindAddFormEvents(s);
    bindTitheEvents(s);
  }

  // Shared by the Settings screen and the Bills tab so tithe is editable from
  // wherever it shows up, against the same settings.tithePercent.
  function bindTitheEvents(s) {
    root.querySelectorAll("[data-action=edit-tithe]").forEach(el => {
      el.addEventListener("click", () => {
        titheEdit.open = true;
        titheEdit.value = String(BudgetEngine.tithePercent(s));
        formErrors.tithe = "";
        render();
      });
    });
    const titheInput = root.querySelector("#tithe-input");
    if (titheInput) titheInput.addEventListener("input", e => { titheEdit.value = e.target.value; });
    root.querySelectorAll("[data-action=cancel-tithe]").forEach(el => {
      el.addEventListener("click", () => { titheEdit.open = false; formErrors.tithe = ""; render(); });
    });
    root.querySelectorAll("[data-action=save-tithe]").forEach(el => {
      el.addEventListener("click", async () => {
        formErrors.tithe = "";
        const n = parseFloat(titheEdit.value);
        if (!isFinite(n) || n < 0 || n > 100) {
          formErrors.tithe = "ENTER A NUMBER 0-100";
          render();
          return;
        }
        try {
          await DataService.update({ "settings.tithePercent": n });
          titheEdit.open = false;
          render();
        } catch (e) { alert("COULDN'T SAVE"); console.warn(e); }
      });
    });
    // Master on/off switch — Settings only, per the tithing group. Off hides
    // tithe everywhere else and zeroes it out of Safe To Spend; the rate
    // itself (settings.tithePercent) is untouched, so flipping back to ON
    // restores the exact same numbers instantly.
    root.querySelectorAll("[data-action=tithe-enable-toggle]").forEach(el => {
      el.addEventListener("click", async () => {
        const on = el.dataset.v === "on";
        if (on === BudgetEngine.titheEnabled(s)) return;
        try {
          await DataService.update({ "settings.titheEnabled": on });
          render();
        } catch (e) { alert("COULDN'T SAVE"); console.warn(e); }
      });
    });
  }

  // Shared by the Settings screen and the Bills tab so both surface the same
  // add-item forms from one implementation.
  function bindAddFormEvents(s) {
    root.querySelectorAll("[data-action=show-add]").forEach(el => {
      el.addEventListener("click", () => {
        const kind = el.dataset.kind;
        if (kind === "income") addForms.income = { label: "", amount: "", dueDateOfMonth: "1" };
        else if (kind === "bill") addForms.bill = { label: "", amount: "", dueDateOfMonth: "1" };
        else if (kind === "savings") addForms.savings = { label: "", amount: "", dueDateOfMonth: "1" };
        else if (kind === "spending") addForms.spending = { label: "", budgeted: "" };
        else if (kind === "card") addForms.card = { label: "" };
        else if (kind === "bank") addForms.bank = { label: "" };
        render();
      });
    });
    root.querySelectorAll("[data-action=add-form-input]").forEach(el => {
      el.addEventListener("input", e => {
        const kind = el.dataset.kind;
        const field = el.dataset.field;
        if (addForms[kind]) addForms[kind][field] = e.target.value;
      });
    });
    root.querySelectorAll("[data-action=cancel-add]").forEach(el => {
      el.addEventListener("click", () => {
        const k = el.dataset.kind;
        addForms[k] = null;
        formErrors["add_" + k] = "";
        render();
      });
    });
    root.querySelectorAll("[data-action=save-add]").forEach(el => {
      el.addEventListener("click", () => saveNewItem(el.dataset.kind, s));
    });
  }

  // Every transaction already claimed by some paid record, so one payment can't
  // be linked to two bills.
  function linkedTxnIds(s) {
    const linked = {};
    const all = s.billsPaid || {};
    Object.keys(all).forEach(m => {
      const forMonth = all[m] || {};
      Object.keys(forMonth).forEach(id => {
        const rec = forMonth[id];
        if (rec && rec.txnId) linked[rec.txnId] = true;
      });
    });
    return linked;
  }

  // Which already-logged transaction, if any, IS this bill's payment?
  //
  // This is not just convenience. A paid record with no txnId counts as money
  // leaving the account, so ticking a bill whose payment is ALREADY in the
  // ledger would subtract it twice and read Safe To Spend low by the whole
  // bill. Finding the link is what prevents that.
  //
  // Scoring is the same matcher the import review uses, run backwards: each
  // candidate transaction is scored against this one bill. "exact" means the
  // name AND the amount agree — confident enough to learn the merchant from.
  // "fuzzy" is close enough to link (which fixes the double-count) but not to
  // teach billMap, since a merchant learned wrong would auto-tick the wrong
  // bill on every future import.
  function findTxnForBill(s, bill, month) {
    if (!bill || !bill.id) return null;
    const ym = /^\d{4}-\d{2}$/.test(String(month || "")) ? month : Util.currentMonthYM();
    const linked = linkedTxnIds(s);

    // Candidates are confined to the cycle being ticked. Bills recur monthly
    // and every cycle looks alike, so a wider window lets LAST month's rent
    // answer for THIS month's — which marks an unpaid bill as paid, releases
    // its reservation, and deducts nothing from the balance because the money
    // left before the last one was confirmed. Safe To Spend then jumps by the
    // full amount of a bill you still owe.
    //
    // A few days of grace before the 1st covers a payment sent early for a
    // bill due on the 1st or 2nd.
    const [y, m] = ym.split("-").map(Number);
    const first = new Date(Date.UTC(y, m - 1, 1));
    const graceStart = new Date(first.getTime() - 5 * 86400000).toISOString().slice(0, 10);
    const monthEnd = new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);

    let best = null;
    for (const t of (s.transactions || [])) {
      if (!t || t.paymentType === "credit") continue;   // never touched checking
      if (t.categoryType === "debt" || t.tickPay) continue; // debt payments have their own tick
      if (linked[t.id]) continue;
      const d = String(t.date || "");
      if (d < graceStart || d > monthEnd) continue;
      const key = t.merchantKey || ImportEngine.normalizeMerchantKey(t.note || "");
      const m = matchSettingsItem({ merchantKey: key, amount: t.amount }, [bill]);
      if (!m) continue;
      const delta = Math.abs((Number(t.amount) || 0) - (Number(bill.amount) || 0));
      // A transaction already filed under this bill is the answer outright.
      const direct = t.categoryId === bill.id;
      // Certain only when the row says so itself: already filed under this
      // bill, or from a merchant previously confirmed as this bill. A close
      // amount is NOT certainty — a $134 transfer to savings sits within a
      // few percent of a $140 electric bill and is nothing to do with it.
      const learned = key && (s.billMap || {})[key] === bill.id;
      const certain = direct || !!learned;
      const cand = { txn: t, tier: direct || learned ? "exact" : m.tier, delta, direct, certain };
      if (!best) { best = cand; continue; }
      if (best.certain !== cand.certain) { if (cand.certain) best = cand; continue; }
      if (best.tier !== "exact" && cand.tier === "exact") { best = cand; continue; }
      if (best.tier === cand.tier && cand.delta < best.delta) best = cand;
    }
    return best ? { txn: best.txn, tier: best.tier, certain: best.certain, direct: best.direct } : null;
  }

  // Clone the whole billsPaid map, mutate only the current month's key, and send
  // the whole map. A nested partial patch would replace the map and destroy
  // sibling months — same pattern monthlyRollover uses in confirmNewMonth.
  async function toggleBillPaid(s, billId, link) {
    const month = s.currentMonth;
    const all = { ...(s.billsPaid || {}) };
    const forMonth = { ...(all[month] || {}) };
    let billLearnPatch = {};
    delete billLinkPrompts[billId];
    if (forMonth[billId] && forMonth[billId].paid) {
      delete forMonth[billId];
    } else {
      // Tithe isn't a stored bill (see BudgetEngine.titheBillView), so it needs
      // its own amount source instead of the s.bills lookup below. Its
      // per-income-source breakdown rows use "tithe:<incomeId>" ids, each
      // independently trackable from the one total checkmark.
      let amount;
      let bill = null;
      if (billId === "tithe") {
        amount = BudgetEngine.tithe(s);
      } else if (billId.indexOf("tithe:") === 0) {
        // Either a per-pay-day id or the pre-split whole-source one; the
        // earliest landing answers to both, so a single lookup covers old and
        // new records and the share always matches what the row displayed.
        const landing = BudgetEngine.titheLandings(s, month)
          .find(l => l.key === billId || l.legacyKey === billId);
        if (landing) {
          amount = landing.share;
        } else {
          // A source deleted since the record was written. Fall back to the
          // old arithmetic so the tick can still be cleared rather than
          // becoming an orphan nothing can remove.
          const src = (s.income || []).find(i => i.id === billId.slice("tithe:".length));
          if (!src) return;
          amount = (Number(src.amount) || 0) * BudgetEngine.tithePercent(s) / 100;
        }
      } else {
        bill = (s.bills || []).find(b => b.id === billId);
        if (!bill) return;
        amount = Number(bill.amount) || 0;
      }
      // If this payment is already sitting in the ledger, link to it rather
      // than recording a second, independent outflow of the same money. But
      // linking marks a bill paid against a specific transaction, so getting it
      // wrong hides an unpaid bill AND shifts Safe To Spend. Only a row that
      // identifies itself — already filed under this bill, or a merchant
      // confirmed as this bill before — goes through without asking.
      //
      // `link` is passed in when the user has just answered the prompt; the
      // `undefined` case is the first press of the checkbox.
      if (link === undefined) {
        const found = bill ? findTxnForBill(s, bill, month) : null;
        if (found && !found.certain) {
          billLinkPrompts[billId] = {
            txnId: found.txn.id,
            note: found.txn.note || "",
            amount: Number(found.txn.amount) || 0,
            date: found.txn.date || "",
            billLabel: bill ? bill.label : ""
          };
          render();
          return;
        }
        link = found;
      }
      forMonth[billId] = {
        paid: true,
        // The transaction's own date beats "today" when we found one — it's
        // when the money actually moved.
        paidDate: link ? (link.txn.date || Util.todayISO()) : Util.todayISO(),
        // Likewise the real amount paid, which may differ from the budgeted one.
        amount: Math.round((link ? (Number(link.txn.amount) || amount) : amount) * 100) / 100,
        // Lets the balance tell a tick made after confirming today's balance
        // from one made before it; see billPaymentsSinceAnchor.
        createdAt: Date.now(),
        source: "manual",
        txnId: link ? link.txn.id : null
      };
      // Learn the merchant only from something the user stood behind — a row
      // already filed under this bill, or a match they just said yes to. A
      // wrong one would silently auto-tick this bill from the wrong merchant on
      // every future import, which is far worse than being asked again.
      if (link && (link.direct || link.confirmed)) {
        const key = link.txn.merchantKey || ImportEngine.normalizeMerchantKey(link.txn.note || "");
        if (key) billLearnPatch = { billMap: { ...(s.billMap || {}), [key]: billId } };
      }
    }
    all[month] = forMonth;
    try {
      await DataService.update({ billsPaid: all, ...billLearnPatch });
      render();
    } catch (e) { alert("COULDN'T SAVE; CHECK CONNECTION"); console.warn(e); }
  }

  // Shared by the BILLS tab card rows and the DEBTS tab cards so one tick works
  // identically from either place.
  function bindCardMinEvents(s) {
    root.querySelectorAll("[data-action=card-min-toggle]").forEach(el => {
      el.addEventListener("click", () => toggleDebtMinPaid(s, el.dataset.id));
    });
    root.querySelectorAll("[data-action=min-pay-min]").forEach(el => {
      el.addEventListener("click", () => {
        const d = (s.debts || []).find(x => x.id === el.dataset.id);
        if (d) logDebtTickPayment(s, el.dataset.id, Number(d.minimumPayment) || 0);
      });
    });
    root.querySelectorAll("[data-action=min-pay-custom]").forEach(el => {
      el.addEventListener("click", () => {
        const d = (s.debts || []).find(x => x.id === el.dataset.id);
        const f = minPayPrompts[el.dataset.id];
        if (!f) return;
        f.mode = "custom";
        // Prefill with the minimum so it's an edit, not a blank field.
        f.amount = d ? String(Number(d.minimumPayment) || "") : "";
        f.error = "";
        render();
      });
    });
    root.querySelectorAll("[data-action=min-pay-input]").forEach(el => {
      el.addEventListener("input", e => {
        const f = minPayPrompts[el.dataset.id];
        if (f) f.amount = e.target.value;
      });
    });
    root.querySelectorAll("[data-action=min-pay-date]").forEach(el => {
      // Both events: iOS date pickers commit on change, desktop fires input.
      // Neither re-renders, so the open picker and any typing aren't disturbed.
      const onDate = e => {
        const f = minPayPrompts[el.dataset.id];
        if (f) f.date = e.target.value;
      };
      el.addEventListener("input", onDate);
      el.addEventListener("change", onDate);
    });
    root.querySelectorAll("[data-action=min-pay-save]").forEach(el => {
      el.addEventListener("click", () => {
        const f = minPayPrompts[el.dataset.id];
        logDebtTickPayment(s, el.dataset.id, parseFloat(f ? f.amount : ""));
      });
    });
    root.querySelectorAll("[data-action=min-pay-cancel]").forEach(el => {
      el.addEventListener("click", () => { delete minPayPrompts[el.dataset.id]; render(); });
    });
  }

  // A card/debt row's PAID? tick is backed by one payment transaction, flagged
  // tickPay so it can be found and undone exactly. The BILLS tab card rows and
  // the DEBTS tab cards both read and write this single record, which is what
  // keeps the two tabs in step: ticking either one ticks both, and the payment
  // itself lands in the ledger like any other, so the log, the debt balance and
  // every total that reads them all move together.
  //
  // Unlike a bill's tick this is a real ledger event, so ticking asks first
  // whether it was the minimum or some other amount rather than assuming.
  function tickPayTxnFor(s, debtId) {
    return (s.transactions || []).find(t =>
      t && t.tickPay && t.categoryType === "debt" &&
      t.categoryId === debtId && t.month === s.currentMonth) || null;
  }

  // Tick opens the confirm step; untick reverses immediately.
  async function toggleDebtMinPaid(s, debtId) {
    const debt = (s.debts || []).find(d => d.id === debtId);
    if (!debt) return;
    const existing = tickPayTxnFor(s, debtId);
    if (!existing) {
      if ((Number(debt.minimumPayment) || 0) <= 0) return;
      minPayPrompts[debtId] = { mode: "ask", amount: "", date: Util.todayISO(), error: "" };
      render();
      return;
    }
    // Undo: drop the payment and let applyDebtDelta restore the balance, the
    // same reversal the txn editor's delete path uses.
    delete minPayPrompts[debtId];
    try {
      await DataService.update({
        transactions: (s.transactions || []).filter(x => x.id !== existing.id),
        debts: applyDebtDelta(s.debts, existing, null)
      });
      render();
    } catch (e) { alert("COULDN'T SAVE; CHECK CONNECTION"); console.warn(e); }
  }

  async function logDebtTickPayment(s, debtId, rawAmount) {
    const debt = (s.debts || []).find(d => d.id === debtId);
    if (!debt) return;
    const f = minPayPrompts[debtId] || (minPayPrompts[debtId] = { mode: "ask", amount: "", date: Util.todayISO(), error: "" });
    const amount = Math.round((Number(rawAmount) || 0) * 100) / 100;
    if (!isFinite(amount) || amount <= 0) {
      f.error = "ENTER A VALID AMOUNT";
      render();
      return;
    }
    const dateISO = String(f.date || "").trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateISO) || isNaN(new Date(dateISO + "T00:00:00"))) {
      f.error = "ENTER A VALID DATE";
      render();
      return;
    }
    const minAmt = Math.round((Number(debt.minimumPayment) || 0) * 100) / 100;
    const isCouple = s.settings && s.settings.mode === "couple";
    const txn = {
      id: Util.uuid(),
      date: dateISO,
      amount: amount,
      categoryId: debtId,
      categoryType: "debt",
      note: amount === minAmt ? "MINIMUM PAYMENT" : "PAYMENT",
      paymentType: "cash",
      person: isCouple ? "JOINT" : ((s.settings.names && s.settings.names[0]) || "ME").toUpperCase(),
      // Keyed to the month being tracked rather than derived from the date, so
      // the tick stays checked on the month you're looking at even when the
      // payment cleared just either side of the month boundary. Dedupe on
      // import compares `date`, which is the real one above.
      month: s.currentMonth,
      cardId: null,
      tickPay: true,
      createdAt: Date.now(),
      source: "manual"
    };
    try {
      await DataService.update({
        transactions: DataService.appendTxns(txn),
        debts: applyDebtDelta(s.debts, null, txn)
      });
      delete minPayPrompts[debtId];
      render();
    } catch (e) { f.error = "COULDN'T SAVE; CHECK CONNECTION"; render(); console.warn(e); }
  }

  // The confirm step itself. Rendered as a sibling of the row that opened it,
  // from either tab, so both places get the identical prompt.
  // Asked before a tick is linked to a transaction that only *looks* like this
  // bill. Saying yes marks it paid against that payment and remembers the
  // merchant; saying no records the tick as its own outflow and leaves the
  // transaction where it is. Either answer is safe — the wrong one silently
  // applied is not.
  function renderBillLinkPrompt(bill) {
    const p = billLinkPrompts[bill.id];
    if (!p) return "";
    const id = Util.esc(bill.id);
    return `
      <div class="inline-form">
        <div class="sub-label">IS THIS THE PAYMENT FOR ${Util.esc(bill.label)}?</div>
        <div class="meta" style="margin-top:8px;"><strong>${Util.esc((p.note || "A LOGGED PAYMENT").slice(0, 48))}</strong> · ${Util.esc(Util.fmtMoney(p.amount, 2))}${p.date ? ` · ${Util.esc(Util.fmtDateShort(p.date))}` : ""}</div>
        <div class="meta" style="margin-top:8px; opacity:0.8;">YES LINKS THEM SO THE PAYMENT ISN'T COUNTED TWICE, AND REMEMBERS THIS MERCHANT FOR NEXT TIME. NO JUST MARKS THE BILL PAID.</div>
        <div class="row-actions">
          <button class="cta ghost" data-action="bill-link-no" data-id="${id}">× NO, IT'S SOMETHING ELSE</button>
          <button class="cta" data-action="bill-link-yes" data-id="${id}">→ YES, THAT'S IT</button>
        </div>
      </div>`;
  }

  function renderMinPayPrompt(s, debt) {
    const f = minPayPrompts[debt.id];
    if (!f) return "";
    const minAmt = Math.round((Number(debt.minimumPayment) || 0) * 100) / 100;
    const id = Util.esc(debt.id);
    // Date the payment actually left the account, not the day you got round to
    // ticking it. Import dedupe compares dates, so a date that matches what the
    // bank will report is what stops the same payment landing twice.
    const dateField = `
      <div class="field"><label>DATE PAID</label><input type="date" data-action="min-pay-date" data-id="${id}" value="${Util.esc(f.date || "")}"></div>
      <div class="meta">USE THE DATE IT LEFT YOUR ACCOUNT, SO AN IMPORTED STATEMENT RECOGNISES IT AS THE SAME PAYMENT.</div>`;
    if (f.mode === "custom") {
      return `
        <div class="inline-form">
          <div class="sub-label">HOW MUCH DID YOU PAY?</div>
          <div class="field"><label>AMOUNT PAID</label><input data-action="min-pay-input" data-id="${id}" value="${Util.esc(f.amount)}" inputmode="decimal" placeholder="${Util.esc(String(minAmt))}"></div>
          ${dateField}
          <div class="meta">LOGS AS A DEBIT AGAINST ${Util.esc(debt.label)} AND REDUCES THE BALANCE BY THIS AMOUNT.</div>
          ${f.error ? `<div class="text-danger meta">${Util.esc(f.error)}</div>` : ""}
          <div class="row-actions">
            <button class="cta ghost" data-action="min-pay-cancel" data-id="${id}">× CANCEL</button>
            <button class="cta" data-action="min-pay-save" data-id="${id}">→ LOG IT</button>
          </div>
        </div>`;
    }
    return `
      <div class="inline-form">
        <div class="sub-label">DID YOU PAY THE MINIMUM?</div>
        <div class="meta">EITHER WAY THIS LOGS A DEBIT AGAINST ${Util.esc(debt.label)} AND REDUCES THE BALANCE.</div>
        ${dateField}
        ${f.error ? `<div class="text-danger meta">${Util.esc(f.error)}</div>` : ""}
        <div class="row-actions">
          <button class="cta ghost" data-action="min-pay-custom" data-id="${id}">A DIFFERENT AMOUNT</button>
          <button class="cta" data-action="min-pay-min" data-id="${id}">→ MINIMUM · ${Util.esc(Util.fmtMoney(minAmt, 0))}</button>
        </div>
        <button class="link" data-action="min-pay-cancel" data-id="${id}" style="margin-top:8px;">× CANCEL</button>
      </div>`;
  }

  /* ------------- DEBTS SCREEN ------------- */
  function debtsBodyHtml(s) {
    // Progress since you started: every debt stores originalBalance, so this is
    // pure arithmetic on data already held. No chart, one line.
    const paidOff = (s.debts || []).reduce((a, d) => {
      const orig = Number(d.originalBalance);
      const bal = Number(d.balance) || 0;
      return a + (isFinite(orig) && orig > bal ? orig - bal : 0);
    }, 0);
    const baseExtra = Math.max(0, BudgetEngine.extraForDebt(s));
    const totalExtra = baseExtra + extraPreview;
    const strat = BudgetEngine.debtStrategy(s);
    const sim = DebtEngine.simulate(s.debts||[], totalExtra, s.currentMonth, strat);
    const debtFree = sim.debtFreeDate || "NOT YET";

    const debtsSorted = BudgetEngine.debtOrder(s.debts||[], strat);
    const stratExplainer = strat === "avalanche"
      ? "HIGHEST RATE FIRST; LESS INTEREST PAID"
      : "SMALLEST BALANCE FIRST; QUICK WINS";

    const cardsHtml = debtsSorted.map((d, i) => {
      const bal = Number(d.balance) || 0;
      const orig = Number(d.originalBalance) || Math.max(bal, 1);
      const paidPct = Math.max(0, Math.min(100, (1 - bal/orig) * 100));
      const payoff = sim.payoffByDebt[d.id] || "NOT YET";
      const heading = i === 0 ? "#1  ATTACKING NOW" : `#${i+1}  (AFTER #${i})`;
      const isEditing = editStates["debt_" + d.id];
      const editHtml = isEditing ? renderEditForm("debt", d) : "";
      const linkedCard = d.cardId ? (s.creditCards||[]).find(c => c.id === d.cardId) : null;
      const payForm = debtPayForms[d.id];
      const payHtml = payForm && payForm.open ? renderDebtPayForm(s, d) : "";
      // Same tick as the card row on the BILLS tab — one record, both tabs.
      const minAmt = Number(d.minimumPayment) || 0;
      const minPaidTxn = tickPayTxnFor(s, d.id);
      const minRowHtml = minAmt > 0 ? `
          <div class="inc-row" style="margin-top:8px;">
            <div>
              <div class="inc-label">MINIMUM THIS MONTH</div>
              <div class="meta">${minPaidTxn ? `PAID ${Util.esc(Util.fmtMoney(Number(minPaidTxn.amount) || 0, 0))}; BALANCE REDUCED` : "TICK TO LOG A PAYMENT"}</div>
            </div>
            <div class="inc-amt">${Util.esc(Util.fmtMoney(minAmt, 0))}</div>
            <button class="txn-check ${minPaidTxn ? "checked" : ""}" data-action="card-min-toggle" data-id="${Util.esc(d.id)}" aria-label="MINIMUM PAID" data-learn="TICK TO LOG A PAYMENT AGAINST THIS DEBT. IT ASKS WHETHER YOU PAID THE MINIMUM OR A DIFFERENT AMOUNT, THEN RECORDS A DEBIT TRANSACTION AND REDUCES THE BALANCE. IT TICKS ALONGSIDE THE CARD ROW ON THE BILLS TAB; UNTICK TO UNDO BOTH."></button>
          </div>
          ${renderMinPayPrompt(s, d)}` : "";
      return `
        <div class="debt-card" data-learn="DEBT CARD. SHOWS YOUR REMAINING BALANCE, HOW MUCH OF THE ORIGINAL IS PAID, THE PROJECTED PAYOFF MONTH, AND THE MINIMUM PAYMENT AND INTEREST RATE.">
          <div class="debt-header">
            <span>${Util.esc(heading)}</span>
            <button class="link" data-action="edit-item" data-kind="debt" data-id="${Util.esc(d.id)}" style="padding:0;min-height:auto;" data-learn="EDIT THE DEBT'S LABEL, BALANCE, MINIMUM PAYMENT, OR INTEREST RATE.">EDIT →</button>
          </div>
          <div class="debt-label">${Util.esc(d.label)}</div>
          <div class="debt-balance">${Util.esc(Util.fmtMoney(bal,0))} REMAINING</div>
          <div class="progress" data-learn="PROGRESS BAR. FILL SHOWS HOW MUCH OF THE ORIGINAL BALANCE IS PAID OFF."><span style="width:${paidPct}%"></span></div>
          <div class="debt-meta">${paidPct.toFixed(0)}% PAID · PAYOFF: ${Util.esc(payoff)}</div>
          <div class="debt-meta">MIN: ${Util.esc(Util.fmtMoney(Number(d.minimumPayment)||0,0))}/MO · RATE: ${(Number(d.interestRate)||0).toFixed(1)}%</div>
          ${linkedCard ? `<div class="debt-meta" data-learn="THIS DEBT IS LINKED TO A CREDIT CARD YOU SET UP IN SETTINGS. LINKING IS INFORMATIONAL; BALANCES STAY INDEPENDENT.">LINKED CARD: ${Util.esc(linkedCard.label)}</div>` : ""}
          ${minRowHtml}
          <button class="link" data-action="debt-pay-open" data-id="${Util.esc(d.id)}" style="margin-top:8px;" data-learn="LOG A PAYMENT AGAINST THIS DEBT. OPENS A FORM (AMOUNT, NOTE). ON SAVE THE BALANCE DECREASES AND A DEBIT TRANSACTION IS RECORDED.">${payForm && payForm.open ? "× CANCEL PAYMENT" : "→ LOG PAYMENT"}</button>
          ${payHtml}
          ${editHtml}
        </div>`;
    }).join("") || `<div class="meta" style="padding:24px;">NO DEBTS YET · ADD ONE BELOW</div>`;

    const addForm = addForms.debt ? renderAddDebtForm() : "";

    return `
        <section class="section terracotta" data-learn="DEBT-FREE DATE. THE MONTH YOU'LL FINISH PAYING OFF EVERY DEBT AT YOUR CURRENT PACE. FACTORS IN MINIMUMS, INTEREST, AND ANY EXTRA PAYMENT.">
          <div class="section-label">→ HOW MUCH LONGER?</div>
          <div class="sub-label" style="margin-top:16px;">DEBT-FREE DATE</div>
          <div class="hero" style="margin-top:8px;">${Util.esc(Util.fmtMonthLong(monthYMFromShort(debtFree)) || debtFree)}</div>
          <div class="sub-label" style="margin-top:8px;">AT CURRENT PACE</div>
          ${paidOff > 0 ? `<div class="sub-label" style="margin-top:8px;" data-learn="HOW MUCH TOTAL DEBT YOU'VE CLEARED SINCE YOU FIRST ENTERED THESE BALANCES. COMPARES EACH DEBT'S ORIGINAL BALANCE TO WHAT'S LEFT.">PAID OFF ${Util.esc(Util.fmtMoney(paidOff,0))} SINCE YOU STARTED</div>` : ""}
        </section>

        <section class="section gray">
          <div class="section-label" data-learn="PAYOFF ORDER TOGGLE. AVALANCHE ATTACKS THE HIGHEST INTEREST RATE FIRST (LESS INTEREST PAID). SNOWBALL ATTACKS THE SMALLEST BALANCE FIRST (QUICK EMOTIONAL WINS).">→ WHAT IF?</div>
          <div class="toggle-row" style="margin-top:8px;">
            <button class="toggle ${strat==='avalanche'?'active':''}" data-action="pick-strategy" data-strategy="avalanche" data-learn="AVALANCHE PAYS THE HIGHEST INTEREST RATE FIRST, TIE-BROKEN BY SMALLER BALANCE. MATHEMATICALLY OPTIMAL; LEAST INTEREST PAID.">AVALANCHE</button>
            <button class="toggle ${strat==='snowball'?'active':''}" data-action="pick-strategy" data-strategy="snowball" data-learn="SNOWBALL PAYS THE SMALLEST BALANCE FIRST, TIE-BROKEN BY HIGHER RATE. QUICK WINS; MOTIVATING BUT MAY COST MORE INTEREST.">SNOWBALL</button>
          </div>
          <div class="sub-label" style="margin-top:8px; opacity:0.85;">${Util.esc(stratExplainer)}</div>

  // Convert "AUG 2025" -> "2025-08" (for fmtMonthLong)
  function monthYMFromShort(shortStr) {
    if (!shortStr || shortStr === "NOT YET") return null;
    const parts = shortStr.split(" ");
    if (parts.length !== 2) return null;
    const names = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    const idx = names.indexOf(parts[0]);
    if (idx < 0) return null;
    return `${parts[1]}-${String(idx+1).padStart(2,"0")}`;
  }

  // Inline LOG PAYMENT form rendered underneath a debt card. Mirrors the log
  // form's field structure so the containment CSS applies. On save, writes a
  // manual transaction (categoryType "debt", categoryId = debt.id) and lets
  // applyDebtDelta reconcile the debt's balance in the same patch.
  // Debt payments are debit-only. The DEBIT/CREDIT pair this form used to carry
  // mirrored the purchase log, but funding a debt payment with credit isn't a
  // thing you can generally do — card issuers don't accept cards for card
  // balances, and most loan servicers don't either. Worse, it let a card-linked
  // debt be "paid" with its own card, which dropped the debt balance and raised
  // that same card's unpaid credit for the month: no money moved, but Safe to
  // Spend fell. A balance transfer, the one adjacent real case, isn't
  // representable here anyway — it should raise the other debt's balance, not
  // add to this month's unpaid credit.
  function renderDebtPayForm(s, d) {
    const f = debtPayForms[d.id];
    const isCouple = s.settings && s.settings.mode === "couple";
    const personChips = isCouple ? `
      <div class="field">
        <label>WHO PAID</label>
        <div class="chips" data-scroll-key="debt-pay-person-${Util.esc(d.id)}">
          ${[s.settings.names[0], s.settings.names[1], "JOINT"].map(p => {
            const val = p.toUpperCase();
            return `<button class="chip ${f.person===val?'active':''}" data-action="debt-pay-person" data-id="${Util.esc(d.id)}" data-p="${Util.esc(val)}">${Util.esc(p)}</button>`;
          }).join("")}
        </div>
      </div>` : "";
    return `
      <div class="inline-form">
        <div class="sub-label">LOG PAYMENT</div>
        <div class="field"><label>AMOUNT</label><input data-action="debt-pay-input" data-id="${Util.esc(d.id)}" data-field="amount" value="${Util.esc(f.amount)}" inputmode="decimal" placeholder="0"></div>
        ${personChips}
        <div class="field"><label>NOTE</label><input data-action="debt-pay-input" data-id="${Util.esc(d.id)}" data-field="note" value="${Util.esc(f.note)}" maxlength="60" placeholder="NOTE (OPTIONAL)"></div>
        ${f.error ? `<div class="text-danger meta">${Util.esc(f.error)}</div>` : ""}
        <div class="row-actions">
          <button class="cta ghost" data-action="debt-pay-cancel" data-id="${Util.esc(d.id)}">× CANCEL</button>
          <button class="cta" data-action="debt-pay-save" data-id="${Util.esc(d.id)}">→ SAVE</button>
        </div>
      </div>`;
  }

  async function saveDebtPayment(s, debtId) {
    const f = debtPayForms[debtId];
    if (!f) return;
    f.error = "";
    const amount = parseFloat(f.amount);
    if (!isFinite(amount) || amount <= 0) { f.error = "ENTER A VALID AMOUNT"; render(); return; }
    const debt = (s.debts || []).find(d => d.id === debtId);
    if (!debt) { f.error = "DEBT NOT FOUND"; render(); return; }
    const isCouple = s.settings && s.settings.mode === "couple";
    const person = isCouple ? (f.person || "JOINT") : ((s.settings.names && s.settings.names[0]) || "ME").toUpperCase();
    const dateISO = Util.todayISO();
    const txn = {
      id: Util.uuid(),
      date: dateISO,
      amount: Math.round(amount * 100) / 100,
      categoryId: debtId,
      categoryType: "debt",
      note: (f.note || "").toUpperCase().slice(0, 60),
      // Debit-only; see renderDebtPayForm for why credit isn't offered.
      paymentType: "cash",
      person: person,
      month: dateISO.slice(0, 7),
      cardId: null,
      createdAt: Date.now(),
      source: "manual"
    };
    // Reuse applyDebtDelta so the debt-balance reconciliation logic is shared
    // with the txn editor's save path — one source of truth for consistency.
    const patch = {
      transactions: DataService.appendTxns(txn),
      debts: applyDebtDelta(s.debts, null, txn)
    };
    try {
      await DataService.update(patch);
      delete debtPayForms[debtId];
      render();
    } catch (err) { f.error = "COULDN'T SAVE; CHECK CONNECTION"; render(); console.warn(err); }
  }

  async function saveNewDebt(s) {
    formErrors.add_debt = "";
    const f = addForms.debt || {};
    const label = (f.label||"").trim();
    if (!label) { formErrors.add_debt = "LABEL REQUIRED"; render(); return; }
    // Fuzzy-match against existing cards before saving.
    if (!f.linkChoice) {
      const match = (s.creditCards || []).find(c => fuzzyLabelMatch(c.label, label));
      if (match) {
        f.pendingMatch = { targetId: match.id, targetLabel: match.label };
        render(); return;
      }
    }
    const balance = parseFloat(f.balance) || 0;
    const min = parseFloat(f.minimumPayment) || 0;
    const rate = parseFloat(f.interestRate) || 0;
    const linkCardId = (f.linkChoice === "yes" && f.pendingMatch) ? f.pendingMatch.targetId : null;
    const newDebt = {
      id: Util.uuid(),
      label: label.toUpperCase(),
      balance: balance,
      originalBalance: balance,
      minimumPayment: min,
      interestRate: rate,
      dueDateOfMonth: parseInt(f.dueDateOfMonth, 10) || null,
      cardId: linkCardId
    };
    const patch = { debts: [...(s.debts||[]), newDebt] };
    if (linkCardId) {
      patch.creditCards = (s.creditCards || []).map(c => c.id === linkCardId ? { ...c, debtId: newDebt.id } : c);
    }
    try {
      await DataService.update(patch);
      addForms.debt = null;
      render();
    } catch (err) { alert("COULDN'T SAVE"); console.warn(err); }
  }

  function renderListItem(kind, item, s) {
    const editing = editStates[kind + "_" + item.id];
    const isLocked = false;
    let mainCell = "";
    let amtCell = "";
    if (kind === "income") {
      mainCell = `<span>${Util.esc(item.label)} · DUE ${item.dueDateOfMonth || 1}</span>`;
      amtCell = `<span>${Util.esc(Util.fmtMoney(Number(item.amount)||0,0))}</span>`;
    } else if (kind === "bill" || kind === "savings") {
      mainCell = `<span>${Util.esc(item.label)} · DUE ${item.dueDateOfMonth || 1}</span>`;
      amtCell = `<span>${Util.esc(Util.fmtMoney(Number(item.amount)||0,0))}</span>`;
    } else if (kind === "spending") {
      mainCell = `<span>${Util.esc(item.label)}</span>`;
      amtCell = `<span>${Util.esc(Util.fmtMoney(Number(item.budgeted)||0,0))}</span>`;
    } else if (kind === "debt") {
      mainCell = `<span>${Util.esc(item.label)}</span>`;
      amtCell = `<span>${Util.esc(Util.fmtMoney(Number(item.balance)||0,0))} · MIN ${Util.esc(Util.fmtMoney(Number(item.minimumPayment)||0,0))}</span>`;
    } else if (kind === "bank") {
      mainCell = `<span>${Util.esc(item.label)}</span>`;
      amtCell = `<span class="locked-tag">BANK</span>`;
    } else if (kind === "card") {
      const linkedDebt = item.debtId ? (s.debts||[]).find(d => d.id === item.debtId) : null;
      mainCell = `<span>${Util.esc(item.label)}${linkedDebt ? `<div class="link-tag">LINKED: ${Util.esc(linkedDebt.label)} DEBT</div>` : ""}</span>`;
      amtCell = `<span class="locked-tag">CARD</span>`;
    }
    const actions = `
      <span class="row-right">
        <button class="link" data-action="edit-item" data-kind="${kind}" data-id="${Util.esc(item.id)}">EDIT</button>
        <button class="del" data-action="delete-item" data-kind="${kind}" data-id="${Util.esc(item.id)}">×</button>
      </span>`;
    const editForm = editing ? renderEditForm(kind, item) : "";
    return `<div class="list-item ${isLocked ? 'locked' : ''}">${mainCell}${amtCell}${actions}</div>${editForm}`;
  }
