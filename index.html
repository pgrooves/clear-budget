// sources, no bills, no savings pots, no spending categories, and a 0% tithe,
// so nothing carries a figure the user didn't put there. Anything else keeps
// the starter framework, which is what every household created before this
// question existed got — RESET passes the household's stored answer, so an
// existing one resets to exactly what it always did.
function buildDefaultData(mode, names, withExamples, titheOn) {
  const nowMonth = Util.currentMonthYM();
  const examples = withExamples !== false;
  return {
    settings: {
      mode, names,
      tithePercent: 10,
      // Independent of the example framework: a household can start empty and
      // still tithe, or take the starter framework and not. Existing
      // households (created before this switch existed) default to true via
      // BudgetEngine.titheEnabled, same as this explicit true does here.
      titheEnabled: titheOn !== false,
      debtStrategy: "avalanche",
      exampleFramework: examples
    },
    income: examples ? exampleIncome() : [],
    bills: examples ? exampleBills() : [],
    spendingCategories: examples ? exampleSpending() : [],
    transactions: [],
    debts: [],
    creditCards: [],
    // Checking/debit accounts, for households with more than one.
    banks: [],
    importProfiles: [],
    merchantMap: {},
    // Learned import identities: merchantKey -> income/bill id, or "__none__"
    // when the user has explicitly said this merchant is NOT one of theirs.
    incomeMap: {},
    billMap: {},
    monthlyRollover: {},
    // Money actually received. A settings income source counts as CLEARED for a
    // month only when an entry exists here with that incomeId and month.
    incomeLog: [],
    // Month-keyed paid-status map, same shape as monthlyRollover:
    // billsPaid[month][billId] = { paid, paidDate, amount, source, txnId }
    billsPaid: {},
    // Dated observations of what the checking account actually held:
    // { id, date, amount, createdAt, source }. A list rather than a single
    // field so re-anchoring mid-month is the same operation as anchoring on
    // the 1st, and so the history stays inspectable.
    balanceChecks: [],
    currentMonth: nowMonth
  };
}

/* ============================================================
   IMPORT ENGINE — pure functions, no DOM
   CSV + line-based text parsing, fingerprints, merchant normalization,
   two-tier duplicate detection. Shared by both input paths.
   ============================================================ */
const ImportEngine = (() => {
  const MON = { JAN:1, FEB:2, MAR:3, APR:4, MAY:5, JUN:6, JUL:7, AUG:8, SEP:9, OCT:10, NOV:11, DEC:12 };
  const pad2 = n => String(n).padStart(2, "0");

  // Resolve a M/D or MON DD (no year) date. Assume current year unless the
  // resulting date lies in the future — then roll back to the prior year.
  function resolveNoYear(month, day, refYear, today) {
    today = today || new Date();
    const y = refYear || today.getFullYear();
    let cand = new Date(y, month - 1, day);
    // 14-day grace window. Bank statements pasted today commonly include
    // postings dated a few days ahead (weekend clearing, pending). Only roll
    // back to the prior year when the candidate is more than 14 days in the
    // future — otherwise the row silently vanished into 2025-07 etc.
    const cutoff = today.getTime() + 14 * 86400000;
    if (cand.getTime() > cutoff) cand = new Date(y - 1, month - 1, day);
    return `${cand.getFullYear()}-${pad2(month)}-${pad2(day)}`;
  }

  // Parse a single date string. Returns ISO YYYY-MM-DD or null.
  function parseDate(str, refYear, today) {
    if (!str) return null;
    const s = String(str).trim().toUpperCase();
    let m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
    if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return `${m[3]}-${pad2(m[1])}-${pad2(m[2])}`;
    if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/))) return `20${m[3]}-${pad2(m[1])}-${pad2(m[2])}`;
    if ((m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/))) return `${m[3]}-${pad2(m[1])}-${pad2(m[2])}`;
    if ((m = s.match(/^(\d{1,2})\/(\d{1,2})$/))) return resolveNoYear(Number(m[1]), Number(m[2]), refYear, today);
    if ((m = s.match(/^([A-Z]{3})\.?\s+(\d{1,2})(?:,?\s+(\d{4}))?$/)) && MON[m[1]]) {
      if (m[3]) return `${m[3]}-${pad2(MON[m[1]])}-${pad2(m[2])}`;
      return resolveNoYear(MON[m[1]], Number(m[2]), refYear, today);
    }
    if ((m = s.match(/^(\d{1,2})\s+([A-Z]{3})\.?\s+(\d{4})$/)) && MON[m[2]]) {
      return `${m[3]}-${pad2(MON[m[2]])}-${pad2(m[1])}`;
    }
    return null;
  }

  // Find the first date token in a line. Returns { iso, raw, index } or null.
  function findDate(line, refYear, today) {
    const patterns = [
      /(\d{4}-\d{1,2}-\d{1,2})/,
      /(\d{1,2}\/\d{1,2}\/\d{4})/,
      /(\d{1,2}\/\d{1,2}\/\d{2})/,
      /(\d{1,2}-\d{1,2}-\d{4})/,
      /(\d{1,2}\/\d{1,2})(?!\d)/,
      /([A-Z]{3})\.?\s+(\d{1,2})(?:,?\s+(\d{4}))?/i,
      /(\d{1,2})\s+([A-Z]{3})\.?\s+(\d{4})/i
    ];
    for (const p of patterns) {
      const m = line.match(p);
      if (!m) continue;
      const raw = m[0];
      const iso = parseDate(raw, refYear, today);
      if (iso) return { iso, raw, index: m.index };
    }
    return null;
  }

  // Find currency-like amount tokens. Returns [{ value, index, len, raw }].
  // Rules (tightened after the T-1044 defect):
  //   (a) A leading "-" counts as a negative sign ONLY when preceded by start-of-line,
  //       whitespace, or "$". A hyphen inside a token like "T-1044" is NOT a sign.
  //   (b) An amount token MUST carry a currency signal: a decimal point, a comma
  //       thousands-group, a leading "$", or accounting parens. Bare integers —
  //       signed or unsigned — never qualify in paste text (store ids like "1044"
  //       and reference codes look like bare integers).
  //   CSV cells that hold a lone signed integer keep their parseFloat fallback in
  //   goToReviewFromCsv, where a cell is unambiguously an amount.
  function findAmounts(line) {
    const results = [];
    const re = /(\()?(-)?(\$)?(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d{2}))?(\))?/g;
    let m;
    while ((m = re.exec(line)) !== null) {
      const openParen = m[1], minus = m[2], dollar = m[3];
      const intPart = m[4] || "", decPart = m[5], closeParen = m[6];
      const startIdx = m.index;
      const hasDec = !!decPart;
      const hasComma = /,/.test(intPart);
      const hasDollar = !!dollar;
      const hasParen = !!openParen && !!closeParen;
      // Boundary check for the leading minus.
      if (minus) {
        const before = startIdx > 0 ? line[startIdx - 1] : "";
        const validBoundary = (startIdx === 0) || /\s/.test(before) || before === "$";
        if (!validBoundary) {
          // The "-" is a hyphen inside a word (e.g. "T-1044"). Skip only the minus
          // and let the regex re-scan from the digit position — that way a genuine
          // "$52.40" tucked inside "REF-$52.40" is still picked up.
          re.lastIndex = startIdx + 1;
          continue;
        }
      }
      // Currency signal is mandatory. Note: minus alone is NOT a signal.
      if (!hasDec && !hasComma && !hasDollar && !hasParen) continue;
      let v = parseFloat(intPart.replace(/,/g, "") + (decPart ? "." + decPart : ""));
      if (!isFinite(v)) continue;
      if (hasParen || minus) v = -Math.abs(v);
      const raw = m[0];
      results.push({ value: v, index: startIdx, len: raw.length, raw });
    }
    return results;
  }

  // CSV parser: handles quoted fields, escaped quotes, CRLF/LF, BOM.
  function csvParse(text) {
    if (text == null) return { headers: [], rows: [] };
    const t = String(text).replace(/^﻿/, "");
    const rows = [];
    let cur = "", row = [], inQuotes = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (inQuotes) {
        if (c === '"') {
          if (t[i + 1] === '"') { cur += '"'; i++; }
          else inQuotes = false;
        } else cur += c;
        continue;
      }
      if (c === '"') { inQuotes = true; continue; }
      if (c === ',') { row.push(cur); cur = ""; continue; }
      if (c === '\r') {
        if (t[i + 1] === '\n') i++;
        row.push(cur); rows.push(row); row = []; cur = "";
        continue;
      }
      if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ""; continue; }
      cur += c;
    }
    if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
    while (rows.length && rows[rows.length - 1].every(c => (c == null ? "" : String(c)).trim() === "")) rows.pop();
    if (!rows.length) return { headers: [], rows: [] };
    const headers = rows[0].map(h => (h == null ? "" : String(h)).trim());
    const dataRows = rows.slice(1).map(r => r.map(c => (c == null ? "" : String(c)).trim()));
    return { headers, rows: dataRows };
  }

  // Parse pasted transaction text. Returns { items, structure }.
  //
  // options:
  //   today, refYear         — clock reference for no-year dates
  //   amountPos              — "first" | "last" override for which token in a group
  //                            is the transaction amount
  //   secondIsBalance        — bool: when a group has multiple amounts, discard the
  //                            non-picked amounts as running balances (default true).
  //                            When false, non-picked amounts stay in the description.
  //   linesPerTxn            — 1 | 2 | 3 override; suppresses auto-grouping detection
  //   balanceIsAmount        — legacy alias, maps to amountPos: "last"
  //
  // `structure` in the return always reflects the AUTO-DETECTED layout so
  // fingerprints stay stable across override changes; `items` reflect the
  // overrides actually applied.
  function textParse(text, options) {
    options = options || {};
    const today = options.today || new Date();
    const refYear = options.refYear || today.getFullYear();
    const rawLines = String(text || "").split(/\r?\n/);
    const lines = rawLines.map(l => l.replace(/\s+/g, " ").trim()).filter(l => l && /\d/.test(l));
    const emptyStruct = { hasDates: false, hasBalance: false, linesPerTxn: 1, datePos: "start", amountPos: "first", detected: 0 };
    if (!lines.length) return { items: [], structure: emptyStruct };

    const lineData = lines.map(l => ({
      line: l,
      date: findDate(l, refYear, today),
      amounts: findAmounts(l)
    }));

    const dated = lineData.filter(x => x.date).length;
    // No date anywhere — a screenshot taken below the heading, or a heading the
    // reader garbled. The rows are still perfectly good if the user tells us
    // what day they're from, so accept a supplied date rather than giving up.
    if (dated === 0) {
      if (options.assumeDate) return parseDateHeadings(lineData, options);
      return { items: [], structure: emptyStruct };
    }

    // --- Date-heading layouts (bank app feeds, screenshots) ---
    // Some statements put the date in a heading — "AUG 02, 2026" — with the
    // rows beneath carrying money and no date of their own. The per-row
    // grouping below keys off a date on every transaction line, so without a
    // separate pass an entire day collapses into one giant transaction. Every
    // banking app that renders a scrollable feed formats this way.
    const headingLines = lineData.filter(x => x.date && !x.amounts.length);
    const moneyLines = lineData.filter(x => x.amounts.length);
    const datedMoneyLines = moneyLines.filter(x => x.date);
    if (headingLines.length && moneyLines.length >= 2 && datedMoneyLines.length <= moneyLines.length * 0.2) {
      return parseDateHeadings(lineData, options);
    }

    // --- Auto-detected structure (stable across overrides) ---
    const rawRatio = lines.length / dated;
    let autoLinesPerTxn = 1;
    if (rawRatio >= 2.5) autoLinesPerTxn = 3;
    else if (rawRatio >= 1.5) autoLinesPerTxn = 2;
    const autoHasBalance = autoLinesPerTxn === 1 && lineData.some(x => x.amounts.length >= 2);
    const autoAmountPos = autoLinesPerTxn === 1 ? "first" : "last";
    let autoDatePos = "start";
    const first = lineData.find(x => x.date && x.amounts.length);
    if (first) autoDatePos = first.date.index <= first.amounts[0].index ? "start" : "end";
    const structure = {
      hasDates: true,
      hasBalance: autoHasBalance,
      linesPerTxn: autoLinesPerTxn,
      datePos: autoDatePos,
      amountPos: autoAmountPos,
      detected: 0
    };

    // --- Apply overrides for item extraction ---
    let effLinesPerTxn = autoLinesPerTxn;
    if (options.linesPerTxn === 1 || options.linesPerTxn === 2 || options.linesPerTxn === 3) {
      effLinesPerTxn = options.linesPerTxn;
    }
    let effAmountPos = options.amountPos === "first" || options.amountPos === "last"
      ? options.amountPos
      : (effLinesPerTxn === 1 ? "first" : "last");
    if (options.balanceIsAmount) effAmountPos = "last"; // legacy
    const effSecondIsBalance = options.secondIsBalance == null ? true : !!options.secondIsBalance;

    // Build groups using effLinesPerTxn.
    const groups = [];
    if (effLinesPerTxn === 1) {
      for (const ld of lineData) if (ld.date && ld.amounts.length) groups.push([ld]);
    } else {
      let cur = null;
      for (const ld of lineData) {
        if (ld.date) {
          if (cur) groups.push(cur);
          cur = [ld];
        } else if (cur) cur.push(ld);
      }
      if (cur) groups.push(cur);
    }

    const items = [];
    for (const g of groups) {
      const dEntry = g.find(x => x.date);
      if (!dEntry) continue;
      const allAmts = [];
      for (const l of g) l.amounts.forEach(a => allAmts.push(a));
      if (!allAmts.length) continue;

      const chosen = effAmountPos === "last" ? allAmts[allAmts.length - 1] : allAmts[0];
      const txnAmt = chosen.value;

      // Running balance, when the layout has one. Previously the non-picked
      // amount was simply thrown away; it's the account balance as of this row,
      // and the newest row's is the closing balance — worth keeping so the
      // balance anchor can be pre-filled instead of typed.
      let runningBalance = null;
      if (effSecondIsBalance && allAmts.length >= 2) {
        const other = allAmts.filter(a => a !== chosen);
        if (other.length) runningBalance = other[other.length - 1].value;
      }

      // Description = combined text with the date and (usually) all amount tokens stripped.
      // If secondIsBalance is false, keep the non-chosen amount tokens in the description.
      let desc = g.map(l => l.line).join(" ");
      desc = desc.split(dEntry.date.raw).join(" ");
      if (effSecondIsBalance) {
        for (const l of g) for (const a of l.amounts) desc = desc.split(a.raw).join(" ");
      } else {
        desc = desc.split(chosen.raw).join(" ");
      }
      desc = desc.replace(/\s+/g, " ").trim();

      items.push({ date: dEntry.date.iso, amount: txnAmt, description: desc, runningBalance });
    }
    structure.detected = items.length;
    return { items, structure };
  }

  // Do the running balances actually add up?
  //
  // Statements list newest first, so each row's balance should equal the NEXT
  // (older) row's balance plus this row's signed amount. When that chain
  // closes, the layout has been read correctly — that is arithmetic, not a
  // guess. It is what lets a screenshot parse be trusted, and it catches an
  // OCR misread of a decimal point for free, since a wrong amount breaks the
  // chain instead of importing silently.
  //
  // Also scored in reverse so an oldest-first statement isn't penalised.
  function balanceChainScore(items) {
    const rows = (items || []).filter(i => i && i.runningBalance != null && isFinite(i.runningBalance) && isFinite(i.amount));
    if (rows.length < 2) return { checked: 0, ok: 0, score: 0 };
    let fwd = 0, rev = 0, checked = 0;
    for (let i = 0; i < rows.length - 1; i++) {
      const a = rows[i], b = rows[i + 1];
      checked++;
      // newest-first: bal[i] = bal[i+1] + amount[i]
      if (Math.abs((b.runningBalance + a.amount) - a.runningBalance) < 0.011) fwd++;
      // oldest-first: bal[i+1] = bal[i] + amount[i+1]
      if (Math.abs((a.runningBalance + b.amount) - b.runningBalance) < 0.011) rev++;
    }
    const ok = Math.max(fwd, rev);
    return { checked, ok, score: checked ? ok / checked : 0 };
  }

  // Closing balance from a parsed set of rows: the running balance on the
  // newest-dated row that has one. Returns null when the layout carries no
  // balance at all, which is the common case for two-column exports.
  function closingBalanceOf(items) {
    const withBal = (items || []).filter(i => i && i.runningBalance != null && isFinite(i.runningBalance));
    if (!withBal.length) return null;
    const newest = withBal.slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    return newest[newest.length - 1].runningBalance;
  }

  // Parse a statement whose dates live in headings rather than on each row.
  //
  // How many lines make up one transaction, and which of its amounts is the
  // money rather than the running balance, are not guessed here. Every
  // plausible shape is built and the one whose running balances actually add
  // up wins. When no shape closes the chain — a layout with no balance column
  // — it falls back to the most rows, which is the old behaviour.
  function parseDateHeadings(lineData, options) {
    options = options || {};
    const effSecondIsBalance = options.secondIsBalance == null ? true : !!options.secondIsBalance;
    const forcedLpt = (options.linesPerTxn >= 1 && options.linesPerTxn <= 3) ? options.linesPerTxn : null;
    const forcedPos = (options.amountPos === "first" || options.amountPos === "last") ? options.amountPos : null;
    // A date the caller supplied for rows with no heading above them. Screenshots
    // are taken mid-scroll all the time, so the top of one routinely lands under
    // a heading that is off screen.
    const assumed = /^\d{4}-\d{2}-\d{2}$/.test(String(options.assumeDate || "")) ? { iso: options.assumeDate } : null;

    // Money-bearing lines appearing before any heading. Without a date to
    // inherit these used to be dropped on the floor; they are counted so the
    // caller can ask rather than lose them silently.
    let orphanLines = 0;
    if (!assumed) {
      for (const ld of lineData) {
        if (ld.date && !ld.amounts.length) break;
        if (ld.amounts.length) orphanLines++;
      }
    }

    const build = (lpt, pos) => {
      const groups = [];
      let currentDate = assumed;
      let buf = [];
      for (const ld of lineData) {
        if (ld.date && !ld.amounts.length) {
          // A heading closes whatever was still being collected; a short tail
          // is kept rather than dropped so nothing goes missing silently.
          if (buf.length) { groups.push({ date: currentDate, lines: buf }); buf = []; }
          currentDate = ld.date;
          continue;
        }
        // Rows above the first heading have no date to inherit.
        if (!currentDate) continue;
        buf.push(ld);
        if (buf.length === lpt) { groups.push({ date: currentDate, lines: buf }); buf = []; }
      }
      if (buf.length) groups.push({ date: currentDate, lines: buf });

      const items = [];
      for (const g of groups) {
        const allAmts = [];
        for (const l of g.lines) l.amounts.forEach(a => allAmts.push(a));
        if (!allAmts.length || !g.date) continue;
        const chosen = pos === "last" ? allAmts[allAmts.length - 1] : allAmts[0];
        let runningBalance = null;
        if (effSecondIsBalance && allAmts.length >= 2) {
          const other = allAmts.filter(a => a !== chosen);
          if (other.length) runningBalance = other[other.length - 1].value;
        }
        let desc = g.lines.map(l => l.line).join(" ");
        if (effSecondIsBalance) {
          for (const l of g.lines) for (const a of l.amounts) desc = desc.split(a.raw).join(" ");
        } else {
          desc = desc.split(chosen.raw).join(" ");
        }
        desc = desc.replace(/\s+/g, " ").trim();
        items.push({
          date: g.date.iso,
          amount: chosen.value,
          description: desc,
          runningBalance,
          // Not posted yet: the amount can still change, the balance shown is
          // a placeholder, and it will arrive again for real once it clears.
          pending: /\bPENDING\b/i.test(desc)
        });
      }
      return items;
    };

    let best = null;
    const lptOptions = forcedLpt ? [forcedLpt] : [2, 1, 3];
    const posOptions = forcedPos ? [forcedPos] : ["first", "last"];
    for (const lpt of lptOptions) {
      for (const pos of posOptions) {
        const items = build(lpt, pos);
        if (!items.length) continue;
        // Pending rows carry a $0.00 placeholder balance, so they'd break a
        // chain that is otherwise perfect. Score on posted rows only.
        const chain = balanceChainScore(items.filter(i => !i.pending));
        const cand = { items, lpt, pos, chain };
        if (!best) { best = cand; continue; }
        if (cand.chain.score > best.chain.score) best = cand;
        else if (cand.chain.score === best.chain.score && cand.items.length > best.items.length) best = cand;
      }
    }
    if (!best) {
      return { items: [], structure: { hasDates: !!assumed, hasBalance: false, linesPerTxn: 1, datePos: "heading", amountPos: "first", detected: 0, dateHeadings: true, chainScore: 0, orphanRows: 0 } };
    }
    return {
      items: best.items,
      structure: {
        hasDates: true,
        hasBalance: best.items.some(i => i.runningBalance != null),
        linesPerTxn: best.lpt,
        datePos: "heading",
        amountPos: best.pos,
        detected: best.items.length,
        dateHeadings: true,
        // Surfaced so the UI can say whether the parse was verified or guessed.
        chainScore: Math.round(best.chain.score * 100) / 100,
        // Transactions stranded above the first heading, in whatever grouping
        // actually won. Non-zero means rows are being dropped unless a date
        // is supplied for them.
        orphanRows: orphanLines ? Math.ceil(orphanLines / best.lpt) : 0
      }
    };
  }

  function computePasteFingerprint(structure) {
    if (!structure) return "";
    return `date-${structure.datePos}|amount-${structure.amountPos}|${structure.linesPerTxn}-line|balance-${structure.hasBalance ? "yes" : "no"}`;
  }
  function computeCsvFingerprint(headers) {
    return (headers || []).map(h => String(h || "").trim().toLowerCase()).join(",");
  }

  // Strip noise from a merchant description and return the leading name.
  // Identical for CSV and paste so a mapping learned via one path applies to the other.
  function normalizeMerchantKey(desc) {
    if (!desc) return "";
    let s = String(desc).toUpperCase();
    s = s.replace(/\bPENDING\b/g, " ");
    // Drop trailing card-number tail like "*1234" that may sit inside a word.
    s = s.replace(/[\*#][0-9]+/g, " ");
    // Split on non-letters; take alphabetic tokens of length >= 2.
    const tokens = s.match(/[A-Z]{2,}/g) || [];
    // Take the first token as the merchant name. Conservative but robust:
    // guarantees CSV "HEB #613 AUSTIN TX" and paste "HEB PENDING" normalize identically.
    return tokens.length ? tokens[0] : "";
  }

  function normalizeDescForCompare(s) {
    return String(s == null ? "" : s).toUpperCase().replace(/[^A-Z0-9]/g, "");
  }

  // Strip bank-noise prefixes from a transaction description. Case-insensitive,
  // applies repeatedly until no known prefix matches, then trims. Prefix must
  // end at a separator (whitespace, "-", ":", "·") or end-of-string so we don't
  // eat characters out of a real merchant name (e.g. "POSITANO" won't lose "POS").
  const CLEAN_PREFIXES = [
    "DEBIT CARD PURCHASE",
    "RECURRING PAYMENT",
    "ONLINE PAYMENT",
    "MOBILE PAYMENT",
    "POS PURCHASE",
    "ACH TRANSFER",
    "WEB TRANSFER",
    "POS PURCH",
    "POS DEBIT",
    "POS CREDIT",
    "ACH TRANS",
    "ACH DEBIT",
    "ACH CREDIT",
    "ONLINE PMT",
    "MOBILE PMT",
    "BILL PAY",
    "BILLPAY",
    "CHECKCARD",
    "WITHDRAWAL",
    "TRANSFER",
    "TXN FEE",
    "PURCHASE",
    "PAYMENT",
    "DEBIT",
    "CREDIT",
    "ACH",
    "POS",
    "PMT"
  ];
  // Longest-first so "POS PURCHASE" wins over "POS".
  const CLEAN_PREFIXES_SORTED = CLEAN_PREFIXES.slice().sort((a, b) => b.length - a.length);
  function cleanDescription(note) {
    if (note == null) return "";
    let s = String(note).trim();
    if (!s) return "";
    let changed = true;
    // Safety cap: no more than 8 iterations even if data goes wild.
    for (let i = 0; changed && i < 8; i++) {
      changed = false;
      // Strip leading separators too so "· CHECKCARD · HEB" matches CHECKCARD.
      const stripped = s.replace(/^[\s\-:·]+/, "");
      if (stripped !== s) { s = stripped; changed = true; }
      const u = s.toUpperCase();
      for (const p of CLEAN_PREFIXES_SORTED) {
        if (u.length < p.length) continue;
        if (u.slice(0, p.length) !== p) continue;
        const after = s.charAt(p.length);
        if (after !== "" && !/[\s\-:·]/.test(after)) continue;
        s = s.slice(p.length).replace(/^[\s\-:·]+/, "");
        changed = true;
        break;
      }
    }
    return s.trim();
  }

  // Tier 1: same date + same amount + same normalized description (against .note).
  function isExactDupe(cand, existing) {
    const nd = normalizeDescForCompare(cand.description);
    const amt = Math.round(Math.abs(Number(cand.amount) || 0) * 100);
    for (const t of existing) {
      if (t.date !== cand.date) continue;
      if (Math.round(Math.abs(Number(t.amount) || 0) * 100) !== amt) continue;
      if (normalizeDescForCompare(t.note || "") === nd) return true;
    }
    return false;
  }

  // Tier 2: same amount, |date delta| within tolerance, only vs source:"manual".
  //
  // Debt payments get a wider window. Tier 1 can't catch them — it compares the
  // statement description against the stored note, and a hand-logged payment
  // reads "MINIMUM PAYMENT" or nothing while the bank line reads something like
  // "AUTOPAY CARD 1234". That leaves this tier as the only guard, and a payment
  // is often recorded some days off from when it actually cleared.
  const FUZZY_DAYS = 3;
  const FUZZY_DAYS_DEBT = 10;
  function findFuzzyMatch(cand, existing) {
    const amt = Math.round(Math.abs(Number(cand.amount) || 0) * 100);
    const cDate = new Date(cand.date + "T00:00:00");
    if (isNaN(cDate)) return null;
    for (const t of existing) {
      if ((t.source || "manual") !== "manual") continue;
      if (Math.round(Math.abs(Number(t.amount) || 0) * 100) !== amt) continue;
      const tDate = new Date(String(t.date || "") + "T00:00:00");
      if (isNaN(tDate)) continue;
      const days = Math.abs((cDate - tDate) / 86400000);
      if (days <= (t.categoryType === "debt" ? FUZZY_DAYS_DEBT : FUZZY_DAYS)) return t;
    }
    return null;
  }


  // Recurrence detection for the setup wizard. Groups parsed rows by merchant
  // key and flags anything that shows up in 2+ distinct months with a stable
  // amount. Deposits become proposed income sources; charges become proposed
  // bills. Pure — no DOM, no Firestore.
  function median(nums) {
    const a = nums.slice().sort((x, y) => x - y);
    if (!a.length) return 0;
    const m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }
  function detectRecurring(items, opts) {
    opts = opts || {};
    const negIsPurchase = opts.negativeIsPurchase !== false;
    const groups = {};
    const allMonths = {};
    for (const it of (items || [])) {
      const signed = Number(it.amount) || 0;
      if (!signed || !it.date) continue;
      allMonths[String(it.date).slice(0, 7)] = true;
      const key = normalizeMerchantKey(cleanDescription(it.description));
      if (!key) continue;
      const isDeposit = negIsPurchase ? signed > 0 : signed < 0;
      const bucket = key + "|" + (isDeposit ? "in" : "out");
      if (!groups[bucket]) {
        groups[bucket] = { key, isDeposit, label: cleanDescription(it.description), rows: [] };
      }
      groups[bucket].rows.push({
        amt: Math.abs(signed),
        day: Number(String(it.date).slice(8, 10)) || 0,
        month: String(it.date).slice(0, 7)
      });
    }
    const spanMonths = Math.max(1, Object.keys(allMonths).length);
    const income = [], bills = [];
    let oneOffTotal = 0;

    for (const b in groups) {
      const g = groups[b];
      // Split a merchant's rows into amount clusters. A semi-monthly paycheck
      // of $2000 and $1000 is TWO recurring items from one employer, not one
      // unstable average — grouping by merchant alone would reject both.
      const sorted = g.rows.slice().sort((x, y) => x.amt - y.amt);
      const clusters = [];
      let cur = [];
      for (const row of sorted) {
        if (!cur.length) { cur = [row]; continue; }
        const prev = cur[cur.length - 1].amt;
        if (Math.abs(row.amt - prev) <= Math.max(1, prev * 0.25)) cur.push(row);
        else { clusters.push(cur); cur = [row]; }
      }
      if (cur.length) clusters.push(cur);

      for (const cl of clusters) {
        const months = {};
        cl.forEach(r => { months[r.month] = true; });
        const monthCount = Object.keys(months).length;
        const amt = median(cl.map(r => r.amt));
        if (monthCount >= 2 && amt > 0) {
          // Spread of the cluster, as a fraction of its own median. Tight
          // spread + seen every month = high confidence.
          const spread = amt > 0
            ? (Math.max.apply(null, cl.map(r => r.amt)) - Math.min.apply(null, cl.map(r => r.amt))) / amt
            : 1;
          const prop = {
            key: g.key,
            label: (g.label || g.key).toUpperCase().slice(0, 60),
            amount: Math.round(amt * 100) / 100,
            dueDateOfMonth: Math.min(28, Math.max(1, Math.round(median(cl.map(r => r.day))) || 1)),
            months: monthCount,
            occurrences: cl.length,
            spread: Math.round(spread * 100) / 100,
            // Pre-ticked in the wizard only when it looks unambiguous.
            confident: monthCount >= Math.min(3, spanMonths) && spread <= 0.15
          };
          if (g.isDeposit) income.push(prop); else bills.push(prop);
        } else if (!g.isDeposit) {
          cl.forEach(r => { oneOffTotal += r.amt; });
        }
      }
    }
    const byAmt = (x, y) => y.amount - x.amount;
    return {
      income: income.sort(byAmt),
      bills: bills.sort(byAmt),
      oneOffMonthlyAvg: Math.round((oneOffTotal / spanMonths) * 100) / 100,
      monthsSeen: spanMonths
    };
  }

  return {
    parseDate, findDate, findAmounts,
    csvParse, textParse, closingBalanceOf, balanceChainScore,
    computePasteFingerprint, computeCsvFingerprint,
    normalizeMerchantKey, normalizeDescForCompare, cleanDescription,
    isExactDupe, findFuzzyMatch,
    detectRecurring, median
  };
})();

  // Look up a credit card label; returns null if the card no longer exists
  // (deleting a card leaves old transactions intact but they fall back to CREDIT).
  function cardLabelFor(s, cardId) {
    if (!cardId) return null;
    const c = (s.creditCards || []).find(x => x.id === cardId);
    return c ? c.label : null;
  }

  function bankLabelFor(s, bankId) {
    if (!bankId) return null;
    const c = (s.banks || []).find(x => x.id === bankId);
    return c ? c.label : null;
  }

  // Fuzzy match between two account/debt labels. Case-insensitive; treats one
  // label containing the other as a match, plus a shared leading 3-char run.
  // Used to prompt the "IS THIS THE SAME AS…" inline confirm.
  function fuzzyLabelMatch(a, b) {
    const A = String(a || "").toUpperCase().trim();
    const B = String(b || "").toUpperCase().trim();
    if (!A || !B) return false;
    if (A === B) return true;
    if (A.includes(B) || B.includes(A)) return true;
    const at = (A.match(/[A-Z]+/g) || [])[0] || "";
    const bt = (B.match(/[A-Z]+/g) || [])[0] || "";
    if (at.length >= 3 && at === bt) return true;
    return false;
  }

  // Pure: compute a new debts array given an "old" (existing) and "new" (post-edit)
  // transaction. Restoring an old debt payment adds the amount back; applying a new
  // debt payment subtracts it. Called for edits and deletes.
  function applyDebtDelta(debts, oldTxn, newTxn) {
    let next = (debts || []).map(d => ({ ...d }));
    if (oldTxn && oldTxn.categoryType === "debt" && oldTxn.categoryId) {
      next = next.map(d => {
        if (d.id !== oldTxn.categoryId) return d;
        const bal = (Number(d.balance) || 0) + (Number(oldTxn.amount) || 0);
        const cap = Number(d.originalBalance);
        const capped = isFinite(cap) && cap > 0 ? Math.min(bal, cap) : bal;
        return { ...d, balance: Math.round(capped * 100) / 100 };
      });
    }
    if (newTxn && newTxn.categoryType === "debt" && newTxn.categoryId) {
      next = next.map(d => {
        if (d.id !== newTxn.categoryId) return d;
        const bal = Math.max(0, (Number(d.balance) || 0) - (Number(newTxn.amount) || 0));
        return { ...d, balance: Math.round(bal * 100) / 100 };
      });
    }
    return next;
  }

  function bindSetupEvents() {
    root.querySelectorAll("[data-action]").forEach(el => {
      el.addEventListener("click", handleSetupAction);
    });
    const n1 = root.querySelector("#setup-name-1");
    if (n1) n1.addEventListener("input", e => { setupState.names[0] = e.target.value; });
    const n2 = root.querySelector("#setup-name-2");
    if (n2) n2.addEventListener("input", e => { setupState.names[1] = e.target.value; });
    const jc = root.querySelector("#setup-join-code");
    if (jc) jc.addEventListener("input", e => {
      // Strip everything non-alphanumeric (dashes, spaces, punctuation from
      // pasted values are silently removed rather than blocking the paste) and
      // uppercase. Cap at 10 to accommodate the new-format code; legacy 6-char
      // codes still validate at submit time.
      const raw = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 10);
      setupState.joinCode = raw;
      // Re-format visually as XXXXX-XXXXX at length 10; leave shorter values
      // (including in-progress typing and legacy 6-char) unformatted.
      e.target.value = Util.fmtCode(raw);
    });
  }

  async function handleSetupAction(e) {
    const el = e.currentTarget;
    const action = el.dataset.action;
    if (action === "setup-mode") {
      setupState.mode = el.dataset.mode;
      setupState.step = "names";
      setupState.error = "";
      renderSetup();
    } else if (action === "setup-back") {
      setupState.error = "";
      if (setupState.step === "names") setupState.step = "who";
      else if (setupState.step === "tithe") setupState.step = "names";
      else if (setupState.step === "examples") setupState.step = "tithe";
      else if (setupState.step === "code") setupState.step = "examples";
      else if (setupState.step === "join") setupState.step = "who";
      renderSetup();
    } else if (action === "setup-names-next") {
      const n1 = (setupState.names[0]||"").trim();
      const n2 = (setupState.names[1]||"").trim();
      if (!n1 || (setupState.mode === "couple" && !n2)) {
        setupState.error = "PLEASE ENTER NAME(S)";
        renderSetup();
        return;
      }
      setupState.names[0] = n1.toUpperCase();
      setupState.names[1] = setupState.mode === "couple" ? n2.toUpperCase() : "";
      setupState.step = "tithe";
      setupState.error = "";
      renderSetup();
    } else if (action === "setup-tithe") {
      setupState.titheEnabled = el.dataset.v === "yes";
      setupState.step = "examples";
      setupState.error = "";
      renderSetup();
    } else if (action === "setup-examples") {
      setupState.useExamples = el.dataset.v === "yes";
      setupState.generatedCode = DataService.generateCode();
      // A newly generated code needs its own acknowledgement.
      setupState.codeAcked = false;
      setupState.step = "code";
      setupState.error = "";
      renderSetup();
    } else if (action === "setup-goto-join") {
      setupState.step = "join";
      setupState.error = "";
      renderSetup();
    } else if (action === "copy-code") {
      const code = el.dataset.code;
      try {
        await navigator.clipboard.writeText(code);
        el.textContent = "COPIED";
        setTimeout(() => { el.textContent = "COPY →"; }, 1200);
      } catch (err) {
        el.textContent = "COPY FAILED";
      }
    } else if (action === "text-code") {
      textHouseholdCode(el.dataset.code);
    } else if (action === "ack-code") {
      setupState.codeAcked = !setupState.codeAcked;
      setupState.error = "";
      renderSetup();
    } else if (action === "share-code") {
      // Feature-detected at render time; the reliable way to get the code into
      // Notes, Messages, or a password manager in one tap. No UA sniffing.
      try {
        await navigator.share({ title: "CLEAR household code", text: el.dataset.code });
      } catch (err) {
        // User dismissed the share sheet, or sharing is unavailable. Nothing to do.
      }
    } else if (action === "setup-start") {
      if (!setupState.codeAcked) {
        setupState.error = "PLEASE SAVE YOUR CODE FIRST, THEN CONFIRM ABOVE";
        renderSetup();
        return;
      }
      try {
        setupState.error = "";
        const id = setupState.generatedCode;
        const names = setupState.mode === "couple" ? [setupState.names[0], setupState.names[1]] : [setupState.names[0]];
        const data = buildDefaultData(setupState.mode, names, setupState.useExamples !== false, setupState.titheEnabled !== false);
        DataService.setHouseholdIdLocal(id);
        await DataService.set(data);
        // Offer the setup wizard as soon as the app comes up, so a new
        // household never lands on a budget full of zeroes with no guidance.
        importFlow.wizard = true;
        importFlow.open = true;
        importFlow.stage = "wizard-offer";
        DataService.subscribe(id);
        // renderApp will happen on snapshot
        renderLoading("SYNCING...");
      } catch (err) {
        console.warn(err);
        setupState.error = "COULDN'T CREATE HOUSEHOLD; CHECK YOUR CONNECTION";
        renderSetup();
      }
    } else if (action === "setup-join-cancel") {
      // Abandon an in-flight lookup and return to code entry.
      setupState.joinInFlight = false;
      setupState.step = "join";
      setupState.error = "";
      renderSetup();
    } else if (action === "setup-join-submit") {
      // Normalize once more at submit time in case the value was set
      // programmatically or via autofill. Strip anything non-alphanumeric.
      const code = (setupState.joinCode || "").toUpperCase().replace(/[^A-Z0-9]/g, "").trim();
      // Accept legacy 6-char codes AND the new 10-char format. Nothing else.
      if (code.length !== 6 && code.length !== 10) {
        setupState.error = "CODE MUST BE 6 OR 10 CHARACTERS";
        renderSetup();
        return;
      }
      // Codes are drawn from a confusable-free alphabet (no I, O, 0 or 1), and
      // the Firestore rules enforce exactly that character class on the
      // document id. Checking it here too means a typo'd character reports as
      // a bad code instead of surfacing as a permission failure that reads
      // like a network problem.
      if (!/^[A-HJ-NP-Z2-9]+$/.test(code)) {
        setupState.error = "CODE HAS INVALID CHARACTERS; IT NEVER CONTAINS I, O, 0 OR 1";
        renderSetup();
        return;
      }
      // Persist the normalized value so downstream reads see the canonical form.
      setupState.joinCode = code;
      setupState.step = "joining";
      setupState.error = "";
      setupState.joinInFlight = true;
      renderSetup();
      try {
        // Firestore's get() can hang indefinitely when the network is
        // unreachable or the request is otherwise stalled, which used to leave
        // the user on "JOINING..." forever. Bound it.
        const exists = await Promise.race([
          DataService.checkExists(code),
          new Promise((_, reject) =>
            setTimeout(() => reject(new Error("join-timeout")), 12000))
        ]);
        // The user cancelled while we were waiting; abandon this result.
        if (!setupState.joinInFlight) return;
        setupState.joinInFlight = false;
        if (!exists) {
          setupState.step = "join";
          setupState.error = "NO HOUSEHOLD FOUND WITH THAT CODE";
          renderSetup();
          return;
        }
        DataService.setHouseholdIdLocal(code);
        DataService.subscribe(code);
        renderLoading("SYNCING...");
      } catch (err) {
        console.warn(err);
        if (!setupState.joinInFlight) return;
        setupState.joinInFlight = false;
        setupState.step = "join";
        // Distinguish the three real failure modes so the message matches the
        // cause. A rules rejection is not a connection problem and must not
        // tell the user to check their network.
        setupState.error = (err && err.message === "join-timeout")
          ? "TIMED OUT; CHECK YOUR CONNECTION AND TRY AGAIN"
          : (err && err.code === "permission-denied")
            ? "THAT CODE ISN'T VALID"
            : "COULDN'T CONNECT; CHECK YOUR CONNECTION";
        renderSetup();
      }
    }
  }

  /* ------------- LOADING SCREEN ------------- */
  // ------------- LOADING SCREEN SHIMMER CLIMAX -------------
  // Waiting: white shimmer sweeps L→R across CLEAR, brightening for the first
  // RAMP_SWEEPS sweeps then plateauing indefinitely. Climax: one final ~0.62x
  // sweep peaking at PEAK=1.0 with the band widening. Whiteout: full-screen
  // white overlay fades up in FLASH_UP_MS, real screen renders under it, fades
  // down in FLASH_DOWN_MS. If reduced-motion is set, we skip the animation and
  // hard-swap as before.
  const LOAD_SWEEP_MS   = 700;
  const LOAD_RAMP_SWEEPS = 3;
  const LOAD_PEAK       = 1.0;
  const LOAD_CLIMAX_RATIO = 0.62;
  const LOAD_FLASH_UP_MS = 300;
  const LOAD_FLASH_DOWN_MS = 460;
  // Half-width in "background-position %" — the transparent region either side
  // of the peak in the loading gradient. Widens with intensity.
  const LOAD_HW_MIN = 6;    // at sweep 0
  const LOAD_HW_MAX = 12;   // end of ramp / plateau
  const LOAD_HW_CLIMAX = 30; // during climax
  const LOAD_PEAK_START = 0.32;
  const LOAD_PEAK_TOP   = 0.72;
  const LOAD_BLOOM_TOP  = 0.10;

  // Loading effect driver — persists across renderLoading calls so the same
  // rAF loop keeps running until finishLoading() plays the climax + handoff.
  const loadFx = {
    raf: 0,
    started: 0,      // performance.now() when the animation started
    sweepIndex: 0,
    finishing: false,
    finishStart: 0,  // when climax started
    finishCb: null,  // callback to render the real screen at whiteout peak
    minPlayedResolved: false,
    afterMinPlayed: null,
    torn: false      // true if renderSetup/renderApp took over early
  };

  function loadReducedMotion() {
    try { return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
    catch (e) { return false; }
  }

  function loadTeardown() {
    loadFx.torn = true;
    if (loadFx.raf) { cancelAnimationFrame(loadFx.raf); loadFx.raf = 0; }
    // Clear the CSS variables so the next mount starts fresh.
    const r = document.documentElement;
    r.style.removeProperty("--lb-pos");
    r.style.removeProperty("--lb-peak");
    r.style.removeProperty("--lb-hw");
    r.style.removeProperty("--lb-bloom");
    r.style.removeProperty("--lb-msg");
    // Also remove any lingering flash element.
    const f = document.getElementById("load-flash");
    if (f) f.remove();
  }

  // Paint helper — pulled out so the min-sweep branch can flush a final
  // pre-climax frame before invoking the queued kick() callback.
  function loadPaint(pos, peak, hw, bloom, msg) {
    const r = document.documentElement;
    r.style.setProperty("--lb-pos", pos.toFixed(1) + "%");
    r.style.setProperty("--lb-peak", peak.toFixed(3));
    r.style.setProperty("--lb-hw", hw.toFixed(1) + "%");
    r.style.setProperty("--lb-bloom", bloom.toFixed(3));
    r.style.setProperty("--lb-msg", msg.toFixed(3));
  }

  function loadTick(now) {
    // V14 root-cause fix: clear the raf id FIRST so any code that runs during
    // this callback (kick(), noteActivity-style helpers, etc.) sees "not
    // scheduled" and can queue a fresh frame. Previously loadFx.raf still
    // held the id of the frame currently executing, and kick()'s
    // "if (!loadFx.raf)" guard skipped the reschedule — killing the loop
    // permanently on fast loads. See coordinator's V13 blocker report.
    loadFx.raf = 0;
    if (loadFx.torn) return;

    const t = now - loadFx.started;
    const sweep = Math.floor(t / LOAD_SWEEP_MS);
    const phase = (t % LOAD_SWEEP_MS) / LOAD_SWEEP_MS; // 0..1
    let pos = phase * 100;
    const rampT = Math.min(1, sweep / Math.max(1, LOAD_RAMP_SWEEPS - 1));
    let peak = LOAD_PEAK_START + (LOAD_PEAK_TOP - LOAD_PEAK_START) * rampT;
    let hw   = LOAD_HW_MIN + (LOAD_HW_MAX - LOAD_HW_MIN) * rampT;
    let bloom = LOAD_BLOOM_TOP * rampT;
    let msg = 1;

    if (loadFx.finishing) {
      const climaxMs = LOAD_SWEEP_MS * LOAD_CLIMAX_RATIO;
      const ct = now - loadFx.finishStart;
      const p = Math.min(1, ct / climaxMs);
      pos = p * 100;
      peak = LOAD_PEAK_TOP + (LOAD_PEAK - LOAD_PEAK_TOP) * p;
      hw   = LOAD_HW_MAX + (LOAD_HW_CLIMAX - LOAD_HW_MAX) * p;
      bloom = LOAD_BLOOM_TOP + (1 - LOAD_BLOOM_TOP) * p;
      msg = 1 - p;
      loadPaint(pos, peak, hw, bloom, msg);
      if (p >= 1) {
        // Climax complete → whiteout + handoff. No reschedule here.
        loadStartHandoff();
        return;
      }
      loadFx.raf = requestAnimationFrame(loadTick);
      return;
    }

    if (!loadFx.minPlayedResolved && t >= LOAD_SWEEP_MS) {
      loadFx.minPlayedResolved = true;
      if (typeof loadFx.afterMinPlayed === "function") {
        const cb = loadFx.afterMinPlayed;
        loadFx.afterMinPlayed = null;
        loadPaint(pos, peak, hw, bloom, msg);
        // cb() is kick(); after V14 it can schedule cleanly because raf is 0.
        cb();
        // Belt-and-braces: guarantee continuity even if cb() ever changes
        // and forgets to reschedule.
        if (!loadFx.raf && !loadFx.torn) loadFx.raf = requestAnimationFrame(loadTick);
        return;
      }
    }

    loadPaint(pos, peak, hw, bloom, msg);
    loadFx.raf = requestAnimationFrame(loadTick);
  }

  function loadStartHandoff() {
    // Ensure a flash overlay exists (added by renderLoading), then fade up.
    let flash = document.getElementById("load-flash");
    if (!flash) {
      flash = document.createElement("div");

    flash.offsetHeight;

      // the flash back down.
      if (typeof loadFx.finishCb === "function") {
        try { loadFx.finishCb(); } catch (e) { console.warn(e); }
      }
      const f2 = document.getElementById("load-flash");
      if (f2) {
        f2.style.setProperty("--flash-dur", LOAD_FLASH_DOWN_MS + "ms");

        // eslint-disable-next-line no-unused-expressions

      loadFx.raf = 0;
      loadFx.finishing = false;
      loadFx.finishCb = null;
      loadFx.started = 0;
      loadFx.minPlayedResolved = false;
      loadFx.afterMinPlayed = null;
    }, LOAD_FLASH_UP_MS + 10);
  }

  // Public hook: play the climax + whiteout, then invoke cb() to render the
  // real screen. Guarantees at least one full sweep before the climax so a
  // fast load never reads as a jarring flash.
  //
  // V14 safety net: no matter what happens to the animation (rAF starvation
  // in a background tab, a future regression in loadTick, etc.), the app is
  // guaranteed to render within MAX_MS of finishLoading being called. A
  // cosmetic animation must never block the real UI from appearing.
  function finishLoading(cb) {
    if (loadReducedMotion() || activeView !== "loading") {
      // Reduced-motion or not currently on the loading screen: hard-swap.
      loadTeardown();
      if (typeof cb === "function") cb();
      return;
    }
    let done = false;
    const wrappedCb = () => {
      if (done) return;
      done = true;
      if (typeof cb === "function") { try { cb(); } catch (e) { console.warn(e); } }
    };
    loadFx.finishCb = wrappedCb;
    // Hard ceiling: sweep + climax + fade-up + 1500ms grace. Beyond this we
    // force the handoff regardless of animation state.
    const MAX_MS = LOAD_SWEEP_MS + (LOAD_SWEEP_MS * LOAD_CLIMAX_RATIO) + LOAD_FLASH_UP_MS + 1500;
    setTimeout(() => {
      if (done) return;
      console.warn("finishLoading: safety net fired at " + MAX_MS + "ms; forcing handoff");
      loadTeardown();
      wrappedCb();
    }, MAX_MS);
    const kick = () => {
      loadFx.finishing = true;
      loadFx.finishStart = performance.now();
      if (!loadFx.raf && !loadFx.torn) loadFx.raf = requestAnimationFrame(loadTick);
    };
    if (loadFx.minPlayedResolved) kick();
    else loadFx.afterMinPlayed = kick;
  }

  function renderLoading(msg) {
    activeView = "loading";
    loadFx.torn = false;
    const reduced = loadReducedMotion();
    root.innerHTML = `
      <div class="loading">
        <div class="brand">CLEAR</div>
        <div class="msg">${Util.esc(msg || "LOADING...")}</div>
        <button class="link center" data-action="reset-household">← USE A DIFFERENT HOUSEHOLD CODE</button>
      </div>`;
    const btn = root.querySelector("[data-action=reset-household]");
    if (btn) btn.addEventListener("click", () => {
      // User bailed mid-animation: cancel the rAF loop, remove flash, and
      // restore normal setup screen behavior.
      loadTeardown();
      DataService.clearHouseholdId();

      setupState.generatedCode = "";

    const id = DataService.getHouseholdId();

    const s = DataService.get();

    const containers = new Map();

      containers.set(k, { left: el.scrollLeft || 0, top: el.scrollTop || 0 });

      windowY: window.scrollY || window.pageYOffset || 0

  function restoreScrollState(state, preserveWindow) {
    // Container scrolls: restore synchronously; retry once in the next frame
    // for any container that couldn't take the set (e.g. still zero-size during
    // layout). Only restore when the key existed before AND persists after.
    const els = document.querySelectorAll("[data-scroll-key]");
    const pending = [];
    els.forEach(el => {
      const k = el.getAttribute("data-scroll-key");
      if (!k) return;
      const saved = state.containers.get(k);
      if (!saved) return;
      if (saved.left) el.scrollLeft = saved.left;
      if (saved.top)  el.scrollTop  = saved.top;
      const missedLeft = saved.left && el.scrollLeft !== saved.left;
      const missedTop  = saved.top  && el.scrollTop  !== saved.top;
      if (missedLeft || missedTop) pending.push({ el, saved });

      requestAnimationFrame(() => {
        pending.forEach(({ el, saved }) => {
          if (saved.left) el.scrollLeft = saved.left;
          if (saved.top)  el.scrollTop  = saved.top;
        });
      });

    if (preserveWindow) {
      // Instant, no smooth animation — we want zero visible jump.
      window.scrollTo(state.windowX, state.windowY);
    } else {

      // declining to restore is not enough — the document keeps whatever
      // scroll offset it already had, which lands the user mid-page after a
      // tab switch.
      window.scrollTo(0, 0);
    }

  // Roll the budget month up to the calendar month, once, as soon as we have
  // data. Runs from the render path because that is the one place guaranteed
  // to see every snapshot; the write flips currentMonth so the patch comes
  // back null forever after, and the in-flight flag stops a burst of renders
  // firing the same write several times over.
  let advanceInFlight = false;
  function maybeAdvanceMonth(s) {
    if (advanceInFlight) return;
    const patch = BudgetEngine.autoAdvancePatch(s);
    if (!patch) return;
    advanceInFlight = true;
    const from = s.currentMonth;
    DataService.update(patch).then(() => {
      // Rolling forward is silent but not hidden: say it happened and offer
      // the rollover review, since money was carried across on your behalf.
      monthRollNotice = { from, to: patch.currentMonth, dismissed: false };
      advanceInFlight = false;
      render();
    }).catch(e => {
      // Offline or a failed write: leave currentMonth alone and let the
      // existing stale-month nudge do its job until the next attempt.
      advanceInFlight = false;
      console.warn("month auto-advance failed", e);
    });

  function render() {
    // Capture BEFORE any DOM mutation so we see the outgoing scroll state
    // (including any body-level overlay currently attached).
    const captured = captureScrollState();
    const nextKey = computeRenderKey();
    const sameScreen = lastRenderKey === nextKey;

    _renderCore();

    lastRenderKey = nextKey;
    // Only restore window scroll on within-screen re-renders. Tab switches
    // and overlay open/close start at top as they did before.

    if (typeof refreshScrollBtn === "function") refreshScrollBtn();
  }

  function _renderCore() {
    const id = DataService.getHouseholdId();
    if (!id) { activeView = "setup"; renderSetup(); syncOverlays(null); return; }
    const s = DataService.get();
    if (!s) { renderLoading("SYNCING..."); return; }
    maybeAdvanceMonth(s);
    // NOTE: overlays must be synced on the settings path too — NEW MONTH is
    // launched from inside Settings, and an early return here used to skip the
    // overlay dispatch entirely so the overlay never appeared.
    if (settingsOpen) { renderSettings(s); syncOverlays(s); return; }
    activeView = "app";

    // return strings and never touch the DOM, which is what lets the swipe
    // build a neighbouring tab off to the side before it is committed.
    root.innerHTML = screenShell(s, currentTab);
    bindTab(s, currentTab);
    syncOverlays(s);
  }

  function swipeHintHtml() {
    if (swipeHintShown) return "";
    swipeHintShown = true;
    return `<div class="swipe-hint" aria-hidden="true">${swipeHintSvg()}</div>`;
  }

  // Same one-shot fade as the swipe and scroll hints, pointing at the red
  // number rather than sitting over a scroll box. Unlike those two it is not
  // permanent: the flag clears whenever Safe To Spend is back above zero (see
  // limeBlock), so a household that dips again in three months gets pointed at
  // the explanation again instead of being expected to remember it.
  function tapHintHtml() {
    if (shortfallHintShown) return "";
    shortfallHintShown = true;
    // Sits under the pair rather than beside a figure — two numbers across a
    // phone leave no room on either baseline — so it points up at them.
    return `<span class="tap-hint" aria-hidden="true">↑ TAP FOR WHY</span>`;
  }

  // Renders the centered scroll-hint for one scroll box, exactly once, and
  // only once that box's IntersectionObserver (see ensureScrollHintObserver)
  // has actually reported it on screen — `pending` is what that observer
  // sets before calling render(). Flips `shown` permanently on the render
  // that consumes it, same one-shot pattern as swipeHintHtml.
  function scrollHintHtml(key) {
    const st = scrollHints[key];
    if (st.shown || !st.pending) return "";
    st.shown = true;
    return `<div class="scroll-hint" aria-hidden="true">${scrollHintSvg()}</div>`;
  }

  // Watches one scroll box for the moment it first becomes visible on
  // screen, then triggers its one-shot hint. Re-attaches on every render
  // while not yet shown, because the app replaces the whole DOM subtree on
  // each render — an observer bound to a prior render's now-detached node
  // would never fire again.
  function ensureScrollHintObserver(key, selector) {
    const st = scrollHints[key];
    if (st.observer) { st.observer.disconnect(); st.observer = null; }
    if (st.shown) return;
    const el = root.querySelector(selector);
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !st.shown && !st.pending) {
          st.pending = true;
          obs.disconnect();
          if (st.observer === obs) st.observer = null;
          render();
        }
      });
    }, { threshold: 0.4 });
    obs.observe(el);
    st.observer = obs;
  }

  // The one lime block, identical on all four tabs apart from the label line.
  // Merged from what LOG and DASHBOARD each used to render separately; every
  // figure reads from s.currentMonth so no tab can drift onto a different month.
  function limeBlock(s, tab) {
    const isCouple = !!(s.settings && s.settings.mode === "couple");
    const outlook = BudgetEngine.cashFlowOutlook(s);
    // The pair: what's free between now and the next paycheck, and the lowest
    // the balance gets across the whole horizon. Both come out of one walk so
    // they can never contradict each other.
    const safe = outlook.windowLow;
    // The far half of the horizon, so it can never restate the left figure.
    const tight = outlook.afterLow;
    const budgeted = BudgetEngine.totalBudgeted(s);
    const credit = BudgetEngine.totalUnpaidCredit(s);
    const received = BudgetEngine.receivedIncome(s);
    const expectedIncome = BudgetEngine.totalIncome(s);
    const titheExpected = BudgetEngine.tithe(s);
    const titheReceived = BudgetEngine.titheOnReceived(s);
    const heroDanger = safe < 0 ? "danger" : "";
    const tightDanger = tight < 0 ? "danger" : "";
    // Back in the black: arm the hint again for the next time it isn't. The
    // tightest point is what the breakdown explains, so it is what the hint
    // tracks.
    if (tight >= 0) shortfallHintShown = false;
    // Every figure below hangs off a confirmed balance. Rather than silently
    // falling back to a different definition when there isn't one, the hero
    // asks for it — a number that quietly changes meaning depending on app
    // state is worse than one that tells you what it needs.
    const anchor = BudgetEngine.latestAnchor(s);
    const anchored = !!anchor;
    const projected = BudgetEngine.projectedBalance(s);
    const stillExpected = BudgetEngine.incomeStillExpected(s);
    const anchorAgeDays = anchor ? Util.daysSince(anchor.date) : 0;
    const overdueInc = BudgetEngine.overdueIncome(s);
    const lowIsToday = outlook.afterLowDate <= outlook.startISO;
    // "AUG 6" rather than a bare day number, so the horizon reads as a date.
    // The low can now fall in next month, so it is formatted from the walk's
    // own ISO date rather than being pasted onto the current month.
    const lowDateLabel = Util.fmtDateShort(outlook.afterLowDate);
    // Sub-text under each figure. The two split the horizon at the next
    // payday, so the notes say which stretch each one covers.
    const safeNote = outlook.windowEnd
      ? `UNTIL ${Util.esc(Util.fmtDateShort(outlook.windowEnd))}`
      : "NO PAYDAY IN THE NEXT 5 WEEKS";
    const tightNote = !outlook.hasAfter
      ? (lowIsToday ? (tight < 0 ? "SHORT TODAY" : "TODAY") : `${tight < 0 ? "SHORT ON" : "LOW ON"} ${Util.esc(lowDateLabel)}`)
      : outlook.afterLowDate === outlook.windowEnd
        ? `AFTER PAYDAY ${Util.esc(lowDateLabel)}`
        : `${tight < 0 ? "SHORT ON" : "LOW ON"} ${Util.esc(lowDateLabel)}`;

    // Per-person spend (was Dashboard-only).
    let peopleHtml = "";
    if (isCouple) {
      const p1 = ((s.settings.names || [])[0] || "").toUpperCase();
      const p2 = ((s.settings.names || [])[1] || "").toUpperCase();
      peopleHtml = `<div class="sub-label" style="margin-top:8px;" data-learn="HOW MUCH EACH OF YOU HAS SPENT THIS MONTH. SET WHO PAID WHEN YOU LOG A PURCHASE."><span class="stat-lbl">${Util.esc(p1)}</span> <span class="stat-val">${Util.esc(Util.fmtMoney(BudgetEngine.personSpent(s, p1), 0))}</span> <span class="stat-lbl">SPENT · ${Util.esc(p2)}</span> <span class="stat-val">${Util.esc(Util.fmtMoney(BudgetEngine.personSpent(s, p2), 0))}</span> <span class="stat-lbl">SPENT</span></div>`;
    }

    // Bills due or overdue (was Log-only).
    const dayInfo = BudgetEngine.monthDayInfo(s);
    const paidThisMonth = (s.billsPaid || {})[s.currentMonth] || {};
    // Savings transfers live in s.bills alongside real bills, but this line
    // counts BILLS — a savings pot you haven't funded yet isn't overdue in the
    // sense of "someone is waiting to be paid", and the BILLS tab already keeps
    // the two on separate sub-tabs.
    const unpaidBills = (s.bills || []).filter(b => {
      if (b.category === "savings") return false;
      if (paidThisMonth[b.id] && paidThisMonth[b.id].paid) return false;
      return (Number(b.dueDateOfMonth) || 0) > 0;
    });
    const overdueBills = unpaidBills.filter(b => Number(b.dueDateOfMonth) < dayInfo.day);
    const dueSoonBills = unpaidBills.filter(b => {
      const d = Number(b.dueDateOfMonth);
      return d >= dayInfo.day && d <= dayInfo.day + 7;
    });
    const sumOf = (arr) => arr.reduce((a, b) => a + (Number(b.amount) || 0), 0);
    const dueSoonHtml = (overdueBills.length || dueSoonBills.length) ? `
      <div class="sub-label ${overdueBills.length ? "text-danger" : ""}" style="margin-top:8px;" data-learn="UNPAID BILLS THAT ARE PAST THEIR DUE DAY, OR COMING UP IN THE NEXT SEVEN DAYS. TICK THEM OFF ON THE BILLS TAB AND THEY DISAPPEAR FROM HERE.">${
        overdueBills.length
          ? `${overdueBills.length} BILL${overdueBills.length===1?"":"S"} OVERDUE · ${Util.esc(Util.fmtMoney(sumOf(overdueBills),0))}${dueSoonBills.length ? ` · ${dueSoonBills.length} DUE IN 7 DAYS` : ""}`
          : `${dueSoonBills.length} BILL${dueSoonBills.length===1?"":"S"} DUE IN 7 DAYS · ${Util.esc(Util.fmtMoney(sumOf(dueSoonBills),0))}`
      }</div>` : "";

    // Savings get their own line rather than sharing the bills one. An unfunded
    // pot isn't late in the way an unpaid bill is, so it reads as progress —
    // how many are set aside and what's still to go — in green rather than red.
    const savingsAll = (s.bills || []).filter(b => b.category === "savings");
    const savingsDone = savingsAll.filter(b => paidThisMonth[b.id] && paidThisMonth[b.id].paid);
    const savingsLeft = savingsAll
      .filter(b => !(paidThisMonth[b.id] && paidThisMonth[b.id].paid))

    const savingsHtml = savingsAll.length ? `

    const balanceHtml = anchored ? `

    const outlookHtml = anchored ? `

      ${overdueInc.length ? `<div class="sub-label text-danger" style="margin-top:8px;" data-learn="A PAY DAY HAS GONE BY WITH NOTHING MARKED RECEIVED. IT IS NOT COUNTED ANYWHERE ABOVE — MONEY THAT WAS DUE AND HASN'T ARRIVED ISN'T MONEY YOU CAN SPEND. IMPORT OR TICK IT OFF AND EVERY FIGURE HERE UPDATES.">${overdueInc.length} PAY DAY${overdueInc.length === 1 ? "" : "S"} PASSED, NOTHING RECEIVED · ${Util.esc(overdueInc.map(i => i.label).join(", ").slice(0, 40))}</div>` : ""}` : "";

    // Gap notice: what the app projected vs what was actually confirmed. Purely

    // Month-rollover nudge (was Log-only).

    // write could not go through — offline, or a rejected save. It is a real

    // Confirmation that the month moved by itself and money came with it.
    const roll = monthRollNotice;
