  /* ------------- SHAREABLE PDF REPORT ------------- */
  // A print-only DOM layer built on demand from current state, printed through
  // the OS print sheet ("Save as PDF"), then torn down. Read-only: it never
  // writes, never adds a listener, and never touches Firestore.
  //
  // Deliberately excluded: the transaction ledger, the household code, card and
  // bank identifiers, import profiles, and merchant map data. This is a
  // highlights document meant to be handed to another person.

  function printRow(label, amount, strong) {
    return `
      <div class="pr-row${strong ? " pr-strong" : ""}">
        <span>${Util.esc(label)}</span>
        <span class="pr-amt">${Util.esc(amount)}</span>
      </div>`;
  }

  function buildPrintReport(s) {
    const B = BudgetEngine;
    const month = s.currentMonth;
    const monthLong = Util.fmtMonthLong(month) || month;
    const isCouple = !!(s.settings && s.settings.mode === "couple");
    const names = (s.settings && s.settings.names) || [];
    const dayInfo = B.monthDayInfo(s);

    // --- 1. Header band
    const headerHtml = `
      <div class="pr-block pr-lime">
        <div class="pr-split">
          <div class="pr-wordmark">CLEAR</div>
          <div class="pr-label" style="text-align:right;margin-bottom:0;">
            GENERATED ${Util.esc(Util.fmtDateShort(Util.todayISO()))}
          </div>
        </div>
        <div class="pr-sub" style="margin-top:10px;">
          MONTH OF ${Util.esc(monthLong)}${isCouple && names[0] && names[1]
            ? " &middot; " + Util.esc(names[0]) + " &amp; " + Util.esc(names[1]) : ""}
        </div>
      </div>`;

    // --- 2. Safe to Spend
    // Same rule as the on-screen hero: with no confirmed balance there is
    // nothing to derive this from, so say so rather than print a figure that
    // reads like a real one.
    const stsAnchored = B.hasAnchor(s);
    const stsOutlook = B.cashFlowOutlook(s);
    const sts = stsOutlook.windowLow;
    const tightest = stsOutlook.afterLow;
    const received = B.receivedIncome(s);
    const expected = B.totalIncome(s);
    const budgeted = B.totalBudgeted(s);
    const stsHtml = `
      <div class="pr-block pr-lime" style="padding-top:4px;">
        <div class="pr-label">SAFE TO SPEND</div>
        <div class="pr-hero${stsAnchored && sts < 0 ? " pr-danger" : ""}">${stsAnchored ? Util.esc(Util.fmtMoney(sts, 0)) : "NO BALANCE CONFIRMED"}</div>
        ${stsAnchored ? `<div class="pr-sub">TIGHTEST POINT ${Util.esc(Util.fmtMoney(tightest, 0))} ON ${Util.esc(Util.fmtDateShort(stsOutlook.afterLowDate))}${stsOutlook.windowEnd ? " &middot; COVERED UNTIL " + Util.esc(Util.fmtDateShort(stsOutlook.windowEnd)) : ""}</div>` : ""}
        <div class="pr-sub">
          ${stsAnchored ? `IN THE ACCOUNT ${Util.esc(Util.fmtMoney(B.projectedBalance(s), 0))} &middot; ` : ""}RECEIVED ${Util.esc(Util.fmtMoney(received, 0))} OF ${Util.esc(Util.fmtMoney(expected, 0))} EXPECTED
          &middot; BUDGETED ${Util.esc(Util.fmtMoney(budgeted, 0))}
        </div>
        <div class="pr-sub" style="margin-top:3px;">
          DAY ${dayInfo.day} OF ${dayInfo.daysInMonth} &middot; ${dayInfo.pct}% THROUGH THE MONTH
        </div>
      </div>`;

    // --- 3. Allocation
    const tithePct = B.tithePercent(s);
    const allocHtml = `
      <div class="pr-block pr-gray">
        <div class="pr-label">WHERE THE MONEY IS ALLOCATED</div>
        ${B.titheEnabled(s) ? printRow("TITHE (" + tithePct + "%)", Util.fmtMoney(B.tithe(s), 0)) : ""}
        ${printRow("BILLS & FIXED", Util.fmtMoney(B.billsSubtotal(s), 0))}
        ${printRow("DEBT MINIMUMS", Util.fmtMoney(B.totalDebtMins(s), 0))}
        ${printRow("SPENDING BUDGETED", Util.fmtMoney(B.spendingBudgetedTotal(s), 0))}
      </div>`;

    // --- 4. Debt
    const debts = s.debts || [];
    const strat = B.debtStrategy(s);
    // Clamp to zero so a month that is running short does not project a
    // negative extra payment. This matches what the Debts tab shows.
    const extra = Math.max(0, B.extraForDebt(s));
    const sim = DebtEngine.simulate(debts, extra, month, strat);
    const debtFree = sim.debtFreeDate || "NOT YET";
    const debtFreeLong = Util.fmtMonthLong(monthYMFromShort(debtFree)) || debtFree;
    const target = B.targetDebt(s);
    const stratExplainer = strat === "avalanche"
      ? "HIGHEST RATE FIRST; LESS INTEREST PAID"
      : "SMALLEST BALANCE FIRST; QUICK WINS";

    const debtLines = B.debtOrder(debts, strat).map((d, i) => {
      const bal = Number(d.balance) || 0;
      const orig = Number(d.originalBalance) || Math.max(bal, 1);
      const paidPct = Math.round(Math.max(0, Math.min(100, (1 - bal / orig) * 100)));
      const payoff = sim.payoffByDebt[d.id] || "NOT YET";
      return `
        <div class="pr-debt">
          <div>
            <div>#${i + 1} ${Util.esc(d.label)}</div>
            <div class="pr-debt-meta">${paidPct}% OF ORIGINAL PAID &middot; PAYOFF ${Util.esc(payoff)}</div>
          </div>
          <div class="pr-amt">${Util.esc(Util.fmtMoney(bal, 0))}</div>
        </div>`;
    }).join("");

    const debtHtml = debts.length ? `
      <div class="pr-block pr-terracotta">
        <div class="pr-label">TOTAL DEBT</div>
        <div class="pr-split" style="align-items:flex-end;">
          <div class="pr-hero" style="font-size:38px;">${Util.esc(Util.fmtMoney(B.totalDebt(s), 0))}</div>
          <div class="pr-label" style="margin-bottom:2px;text-align:right;">
            ${Util.esc(Util.fmtMoney(B.totalDebtMins(s), 0))}/MO MINIMUMS
          </div>
        </div>
        <div class="pr-sub">
          ${Util.esc(strat.toUpperCase())} &middot; ${Util.esc(stratExplainer)}
        </div>
        <div style="margin-top:12px;">
          ${printRow("ATTACKING NOW", target ? Util.esc(target.label) : "NONE", true)}
          ${printRow("PROJECTED DEBT FREE", Util.esc(debtFreeLong), true)}
        </div>
        <div style="margin-top:10px;">${debtLines}</div>
      </div>` : `
      <div class="pr-block pr-terracotta">
        <div class="pr-label">DEBT</div>
        <div class="pr-mid">NO DEBTS TRACKED</div>
      </div>`;

    // --- 5. Spending categories (same pace-aware bar as the dashboard)
    const elapsed = B.monthElapsed(s);
    const catHtml = (s.spendingCategories || []).map(c => {
      const spent = B.categorySpent(s, c.id);
      const roll = B.rolloverAmount(s, c.id);
      const budget = B.num(c.budgeted) + roll;
      const remaining = budget - spent;
      const pct = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
      const spentFrac = budget > 0 ? spent / budget : 0;
      const barClass = spentFrac >= 1
        ? "danger"
        : (spentFrac > elapsed + 0.30 ? "danger"
          : (spentFrac > elapsed + 0.12 ? "warn" : ""));
      return `
        <div class="pr-cat">
          <div class="pr-cat-line">
            <span>${Util.esc(c.label)}</span>
            <span>${Util.esc(Util.fmtMoney(spent, 0))} / ${Util.esc(Util.fmtMoney(budget, 0))}</span>
          </div>
          <div class="pr-bar ${barClass}"><span style="width:${pct}%"></span></div>
          <div class="pr-cat-rem${remaining < 0 ? " pr-danger-text" : ""}">
            ${Util.esc(Util.fmtMoney(remaining, 0))} REMAINING${roll ? " &middot; ROLLOVER " + Util.esc(Util.fmtMoney(roll, 0)) : ""}
          </div>
        </div>`;
    }).join("");

    const categoriesHtml = `
      <div class="pr-block pr-teal">
        <div class="pr-label">SPENDING CATEGORIES</div>
        ${catHtml || `<div class="pr-mid">NO CATEGORIES YET</div>`}
      </div>`;

    // --- 6. Bills status (counts and totals, plus only what is due or late)
    const bills = s.bills || [];
    const paidMap = (s.billsPaid || {})[month] || {};
    const paidCount = bills.filter(b => paidMap[b.id] && paidMap[b.id].paid).length;
    const paidTotal = bills.reduce((a, b) => {
      const rec = paidMap[b.id];
      return a + (rec && rec.paid ? (Number(rec.amount) || 0) : 0);
    }, 0);
    const billsRemaining = Math.max(0, B.totalBills(s) - paidTotal);

    const urgent = bills
      .filter(b => {
        if (paidMap[b.id] && paidMap[b.id].paid) return false;
        const due = Number(b.dueDateOfMonth) || 0;
        return due > 0 && due <= dayInfo.day + 7;
      })
      .sort((a, b) => (Number(a.dueDateOfMonth) || 0) - (Number(b.dueDateOfMonth) || 0));

    const urgentShown = urgent.slice(0, 8);
    const urgentHtml = urgentShown.map(b => {
      const due = Number(b.dueDateOfMonth) || 0;
      const late = due < dayInfo.day;
      return printRow(
        b.label + (late ? " (LATE, DUE " + due + ")" : " (DUE " + due + ")"),
        Util.fmtMoney(Number(b.amount) || 0, 0)
      );
    }).join("");

    const billsHtml = `
      <div class="pr-block pr-lavender">
        <div class="pr-label">BILLS</div>
        <div class="pr-mid">
          ${paidCount} OF ${bills.length} PAID &middot; ${Util.esc(Util.fmtMoney(billsRemaining, 0))} REMAINING THIS MONTH
        </div>
        ${urgentShown.length ? `
          <div class="pr-label" style="margin-top:12px;">DUE NOW OR WITHIN 7 DAYS</div>
          ${urgentHtml}
          ${urgent.length > urgentShown.length
            ? `<div class="pr-sub">+ ${urgent.length - urgentShown.length} MORE UNPAID</div>` : ""}
        ` : `<div class="pr-sub">NOTHING UNPAID IN THE NEXT 7 DAYS</div>`}
      </div>`;

    // --- 7. Credit
    const unpaid = B.totalUnpaidCredit(s);
    const cover = B.cashToCover(s);
    const covered = cover >= unpaid;
    const creditHtml = `
      <div class="pr-block pr-charcoal">
        <div class="pr-label" style="opacity:0.85;">CREDIT</div>
        <div class="pr-row" style="border-bottom-color:rgba(202,255,76,0.25);">
          <span>UNPAID CREDIT THIS MONTH</span>
          <span class="pr-amt">${Util.esc(Util.fmtMoney(unpaid, 0))}</span>
        </div>
        <div class="pr-row" style="border-bottom-color:rgba(202,255,76,0.25);">
          <span>CASH TO COVER IT</span>
          <span class="pr-amt">${Util.esc(Util.fmtMoney(cover, 0))}</span>
        </div>
        <div class="pr-mid" style="margin-top:10px;">
          ${covered
            ? "&rarr; COVERED"
            : "&larr; SHORTFALL: " + Util.esc(Util.fmtMoney(unpaid - cover, 0))}
        </div>
      </div>`;

    // --- 8. Couple split
    let splitHtml = "";
    if (isCouple && names[0] && names[1]) {
      splitHtml = `
        <div class="pr-block pr-gray">
          <div class="pr-label">SPENT THIS MONTH</div>
          ${printRow(names[0], Util.fmtMoney(B.personSpent(s, names[0]), 0), true)}
          ${printRow(names[1], Util.fmtMoney(B.personSpent(s, names[1]), 0), true)}
          ${printRow("JOINT", Util.fmtMoney(B.personSpent(s, "JOINT"), 0), true)}
        </div>`;
    }

    // --- 9. Footer
    const footHtml = `
      <div class="pr-block pr-black">
        <div class="pr-foot">
          &copy; CLEAR &middot; ${Util.esc(monthLong)}<br>
          FIGURES ARE A POINT-IN-TIME SNAPSHOT AS OF ${Util.esc(Util.fmtDateShort(Util.todayISO()))} AND WILL CHANGE AS THE MONTH GOES ON.
        </div>
      </div>`;

    return headerHtml + stsHtml + allocHtml + debtHtml + categoriesHtml
      + billsHtml + creditHtml + splitHtml + footHtml;
  }

  // The report opens as its own page rather than going through window.print().
  //
  // window.print() is simply ignored by iOS Safari here: the diagnostic added in
  // V35 confirmed the report builds without error, print() returns without
  // throwing, and yet neither beforeprint nor the print media query ever fires,
  // so the browser never enters print state at all. Nothing in script can force
  // it to. Opening a real page sidesteps the whole question — Safari's own
  // Share > Print > Save as PDF acts on it, which is the same print sheet as
  // before, just reached through the browser's UI instead of a call it declines.
  //
  // The page carries a copy of this document's stylesheet so it renders exactly
  // as the print layout always did, plus an on-screen override, since the report
  // block is display:none here and only the print stylesheet reveals it.
  // Every .pr-* rule lives inside @media print, so copying the stylesheet alone
  // renders the report completely unstyled in an ordinary tab. Pull that block's
  // contents out so the same rules also apply on screen. Brace-matched rather
  // than regexed because the block contains a nested @page rule.
  function extractPrintCss(css) {
    const at = css.indexOf("@media print");
    if (at < 0) return "";
    const open = css.indexOf("{", at);
    if (open < 0) return "";
    let depth = 0;
    for (let i = open; i < css.length; i++) {
      const c = css[i];
      if (c === "{") depth++;
      else if (c === "}") {
        depth--;
        if (depth === 0) return css.slice(open + 1, i);
      }
    }
    return "";
  }

  function reportFileName(s) {
    return "clear-report-" + String(s.currentMonth || Util.currentMonthYM()) + ".html";
  }

  function buildPrintDocument(s) {
    const css = [...document.querySelectorAll("style")].map(el => el.textContent || "").join("\n");
    const printCss = extractPrintCss(css);
    return `<!doctype html><html><head><meta charset="utf-8">`
      + `<meta name="viewport" content="width=device-width, initial-scale=1">`
      + `<title>CLEAR REPORT</title>`
      /* Original sheet first: it carries the :root colour variables the rules
         below resolve against, and keeps @media print intact for real printing. */
      + `<style>${css}</style>`
      /* The print rules again, un-gated, so the page looks the same on screen. */
      + `<style>${printCss}</style>`
      + `<style>`
      + `html,body{background:#fff;margin:0;padding:0;}`
      + `#print-report{display:block !important;}`
      /* The un-gated block includes "body > * { display:none }", which would
         swallow the instruction bar. A class beats that selector on specificity. */
      + `.pr-howto{display:block !important;font-family:"Helvetica Neue",Arial,sans-serif;`
      + `font-size:11px;letter-spacing:0.12em;text-transform:uppercase;padding:14px 20px 52px;`
      + `background:#1A3A8C;color:#DFFF5B;line-height:1.5;text-align:center;position:relative;}`
      + `.pr-dl{font:inherit;font-size:13px;font-weight:700;letter-spacing:0.14em;`
      + `text-transform:uppercase;background:#DFFF5B;color:#1A3A8C;border:0;cursor:pointer;`
      + `padding:14px 28px;min-height:48px;width:100%;max-width:340px;margin:0 auto 10px;display:block;}`
      + `.pr-howto-text{opacity:0.85;max-width:520px;margin:0 auto;}`
      /* Bottom-right of the bar, not inline with the centered copy above, so it
         reads as "leave this page" rather than another step in the how-to. */
      + `.pr-back{position:absolute;bottom:12px;right:16px;font:inherit;`
      + `font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;`
      + `background:none;border:0;color:#DFFF5B;cursor:pointer;padding:8px 4px;min-height:44px;}`
      /* The instructions are for the screen only; a saved PDF must not carry them. */
      + `@media print{.pr-howto{display:none !important;}}`
      + `</style></head><body>`
      + `<div class="pr-howto">`
      + `<button class="pr-dl" onclick="clearDownloadReport()">\u2913 DOWNLOAD</button>`
      + `<div class="pr-howto-text">SAVES THIS REPORT AS A FILE YOU CAN KEEP OR SEND. FOR A PDF INSTEAD, USE THE SHARE ICON IN THE BROWSER BAR, THEN PRINT. THIS BAR ISN'T INCLUDED EITHER WAY.</div>`
      + `<button class="pr-back" onclick="clearCloseReport()">\u2190 BACK</button>`
      + `</div>`
      + `<div id="print-report">${buildPrintReport(s)}</div>`
      /* The page saves a copy of itself, minus this bar and this script, so the
         downloaded file is the report alone. Written as <\/script> so the string
         doesn't close the app's own script tag while this file is being parsed. */
      + `<script>`
      + `function clearDownloadReport(){`
      + `var d=document.documentElement.cloneNode(true);`
      + `var strip=d.querySelectorAll(".pr-howto,script");`
      + `for(var i=0;i<strip.length;i++){strip[i].parentNode.removeChild(strip[i]);}`
      + `var html="<!doctype html>"+d.outerHTML;`
      + `var b=new Blob([html],{type:"text/html;charset=utf-8"});`
      + `var u=URL.createObjectURL(b);`
      + `var a=document.createElement("a");a.href=u;a.download=${JSON.stringify(reportFileName(s))};`
      + `a.style.display="none";document.body.appendChild(a);a.click();`
      + `setTimeout(function(){if(a.parentNode){a.parentNode.removeChild(a);}URL.revokeObjectURL(u);},4000);`
      + `}`
      /* Closes the tab this report opened in, returning focus to the app tab
         behind it. window.close() only works on script-opened windows, which
         this always is (see openPrintReport below) — no fallback needed. */
      + `function clearCloseReport(){try{window.close();}catch(e){}}`
      + `<\/script>`
      + `</body></html>`;
  }

  function openPrintReport(s) {
    let doc;
    try {
      doc = buildPrintDocument(s);
    } catch (err) {
      console.warn(err);
      alert("COULDN'T BUILD THE REPORT: " + ((err && err.message) || err));
      return;
    }

    // document.write into a blank window rather than a blob: URL — iOS Safari
    // is unreliable about opening blob URLs in a new tab.
    let w = null;
    try { w = window.open("", "_blank"); } catch (e) { w = null; }
    if (w && w.document) {
      try {
        w.document.open();
        w.document.write(doc);
        w.document.close();
        return;
      } catch (e) { console.warn(e); try { w.close(); } catch (e2) {} }
    }

    // New tab refused (blocked, or a home-screen app with no tabs). Hand the
    // report over as a file instead — the same mechanism the .txt export uses,
    // which is known to work where print() does not.
    try {
      const blob = new Blob([doc], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = reportFileName(s);
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        if (a.parentNode) a.parentNode.removeChild(a);
        URL.revokeObjectURL(url);
      }, 4000);
    } catch (err) {
      console.warn(err);
      alert("COULDN'T OPEN THE REPORT. ALLOW POP-UPS FOR THIS SITE AND TRY AGAIN.");
    }
  }

  /* ------------- ANONYMIZED TEXT EXPORT FOR AI ANALYSIS ------------- */
  // A plain-text snapshot the user can hand to an AI for coaching. Built from
  // an explicit allow-list: every line below names the exact field it reads.
  // Nothing is copied wholesale and then scrubbed, because a deletion filter
  // silently starts leaking the moment a new field is added to the state.
  //
  // Never written: names, the household code, any id, any note, any merchant
  // string, and the merchant/income/bill maps or import profiles.
  //
  // Transactions ARE itemized, but only as amount + the category/bill/debt the
  // budget assigns them to + payment method. The identifying parts of a row are
  // the merchant and the note, and neither is ever emitted — a note in
  // particular routinely holds a merchant or a person's name. Dates appear as a
  // day of the month, and since the month is stated in the preamble that is an
  // absolute date; bill and income due days already were.

  // Bill labels that are generic utility words carry real analytical value and
  // identify nobody, so they survive as a canonical generic. Anything else
  // becomes "Bill N". Matching is on a normalized label, and the OUTPUT is the
  // canonical word, never the user's own text.
  const ANON_BILL_GENERICS = [
    [/\brent\b/, "Rent"],
    [/\bmortgage\b/, "Mortgage"],
    [/\belectric|\bpower\b|\benergy\b/, "Electric"],
    [/\bwater\b|\bsewer\b/, "Water"],
    [/\bgas bill\b|\bnatural gas\b/, "Natural gas"],
    [/\binternet\b|\bwifi\b|\bbroadband\b/, "Internet"],
    [/\bcell\b|\bphone\b|\bmobile\b/, "Cell phone"],
    [/\bcar insurance\b|\bauto insurance\b/, "Car insurance"],
    [/\bhealth insurance\b|\bmedical insurance\b/, "Health insurance"],
    [/\binsurance\b/, "Insurance"],
    [/\bgym\b|\bfitness\b/, "Gym"],
    [/\bstudent loan/, "Student loan"],
    [/\bcar loan\b|\bauto loan\b/, "Car loan"],
    [/\bcar maintenance\b|\bcar repair/, "Car maintenance"],
    [/\bemergency fund\b/, "Emergency fund"],
    [/\bvacation\b/, "Vacation"],
    [/\bretirement\b|\b401k\b|\bira\b/, "Retirement"],
    [/\bchildcare\b|\bdaycare\b/, "Childcare"],
    [/\btrash\b|\bgarbage\b/, "Trash"]
  ];

  const ANON_DEBT_TYPES = [
    [/\bcard\b|\bvisa\b|\bmastercard\b|\bamex\b|\bamerican express\b|\bdiscover\b|\bcredit\b/, "credit card"],
    [/\bcar\b|\bauto\b|\bvehicle\b|\btruck\b|\bmotorcycle\b/, "auto loan"],
    [/\bstudent\b|\bsallie\b|\bnavient\b|\btuition\b|\bschool\b/, "student loan"],
    [/\bmortgage\b|\bhome loan\b|\bheloc\b/, "mortgage"],
    [/\bmedical\b|\bhospital\b|\bdental\b|\bdentist\b|\bdoctor\b|\bsurgery\b/, "medical"],
    [/\bpersonal\b|\bsignature loan\b/, "personal loan"],
    [/\birs\b|\btax\b/, "tax debt"],
    // Last resort before "unspecified": knowing it's an installment loan rather
    // than revolving credit still tells an advisor something useful.
    [/\bloan\b|\bfinanc(e|ing)\b/, "loan, type not specified"]
  ];

  function anonNormalize(label) {
    return String(label == null ? "" : label).toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  }

  function anonBillLabel(label, index) {
    const n = anonNormalize(label);
    for (let i = 0; i < ANON_BILL_GENERICS.length; i++) {
      if (ANON_BILL_GENERICS[i][0].test(n)) return ANON_BILL_GENERICS[i][1];
    }
    return "Bill " + index;
  }

  // Takes the debt, not just its label: a debt linked to a credit card in
  // settings IS a credit card whatever the user called it, and that structural
  // link beats guessing from text. "Chase Freedom" matches none of the patterns
  // below and came out as "unspecified", which is no use to an advisor.
  function anonDebtType(debt) {
    if (debt && debt.cardId) return "credit card";
    const n = anonNormalize(debt && debt.label);
    for (let i = 0; i < ANON_DEBT_TYPES.length; i++) {
      if (ANON_DEBT_TYPES[i][0].test(n)) return ANON_DEBT_TYPES[i][1];
    }
    return "unspecified";
  }

  // Spending category labels are the only user-authored text kept verbatim, and
  // couples do name categories after each other ("Savannah fun money"). Scrub
  // household names out of anything kept, so the Person A / Person B rule holds
  // everywhere and not just in the couple split.
  function anonScrubNames(text, names) {
    let out = String(text == null ? "" : text);
    (names || []).forEach((full, idx) => {
      const person = idx === 0 ? "Person A" : "Person B";
      const parts = String(full || "").split(/\s+/).filter(p => p.length >= 2);
      // Longest first, so "Trey Boudreaux" is replaced before "Trey".
      const targets = [String(full || "")].concat(parts)
        .filter(t => t.length >= 2)
        .sort((a, b) => b.length - a.length);
      targets.forEach(t => {
        const esc = t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        out = out.replace(new RegExp("\\b" + esc + "\\b", "gi"), person);
      });
    });
    return out;
  }

  // Sentence case for AI readability; the app's all-caps degrades it.
  function anonTitleCase(str) {
    return String(str == null ? "" : str).toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase());
  }

  function anonMoney(n) {
    const v = isFinite(Number(n)) ? Number(n) : 0;
    const sign = v < 0 ? "-" : "";
    return sign + "$" + Math.abs(v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  function buildAnonymizedExport(s) {
    const B = BudgetEngine;
    const L = [];
    const month = String(s.currentMonth || Util.currentMonthYM());
    const monthName = anonTitleCase(Util.fmtMonthLong(month) || month);

    // --- Preamble
    L.push("CLEAR - ANONYMIZED FINANCIAL SNAPSHOT");
    L.push("");
    L.push("This is an anonymized one-month snapshot exported from a personal budgeting app.");
    L.push("Names, account identifiers, merchant names, and transaction notes have been removed.");
    L.push("Transactions are listed individually but described only by the category, bill, or");
    L.push("debt each is assigned to. All amounts are in USD and cover a single month: "
      + monthName + ".");
    L.push("");

    // --- Household shape (allow-list: settings.mode only)
    const isCouple = !!(s.settings && s.settings.mode === "couple");
    L.push("HOUSEHOLD");
    L.push("Type: " + (isCouple ? "Couple" : "Solo"));
    L.push("Earners: " + (isCouple ? 2 : 1));
    L.push("");

    // --- Income (allow-list: amount, dueDateOfMonth; labels dropped)
    L.push("INCOME");
    L.push("Expected monthly income: " + anonMoney(B.totalIncome(s)));
    L.push("Received so far this month: " + anonMoney(B.receivedIncome(s)));
    const income = s.income || [];
    L.push("Number of income sources: " + income.length);
    income.forEach((i, idx) => {
      const due = Number(i.dueDateOfMonth) || 0;
      L.push("Income source " + (idx + 1) + ": " + anonMoney(i.amount) + (due ? " (due day " + due + ")" : ""));
    });
    L.push("");

    // --- Tithe (allow-list: derived only)
    if (B.titheEnabled(s)) {
      L.push("TITHE");
      L.push("Rate: " + B.tithePercent(s) + "%");
      L.push("Amount on expected income: " + anonMoney(B.tithe(s)));
      L.push("");
    }

    // --- Bills (allow-list: amount, dueDateOfMonth, category; label genericized)
    const bills = s.bills || [];
    const paidMap = (s.billsPaid || {})[month] || {};
    L.push("BILLS AND FIXED EXPENSES");
    L.push("Total monthly bills and savings: " + anonMoney(B.totalBills(s)));
    L.push("Count: " + bills.length);
    // Captured so the transaction list below describes a row with the very same
    // generic label this section prints, rather than deriving its own.
    const billAnonById = {};
    bills.forEach((b, idx) => {
      const due = Number(b.dueDateOfMonth) || 0;
      const kind = b.category === "savings" ? "savings" : "bill";
      const isPaid = !!(paidMap[b.id] && paidMap[b.id].paid);
      const label = anonBillLabel(b.label, idx + 1);
      billAnonById[b.id] = label;
      L.push(label + ": " + anonMoney(b.amount)
        + (due ? " (due day " + due + ")" : "")
        + " [" + kind + ", " + (isPaid ? "paid" : "unpaid") + "]");
    });
    L.push("");

    // --- Spending categories (labels kept: generic by nature, names scrubbed)
    const cats = s.spendingCategories || [];
    const householdNames = (s.settings && s.settings.names) || [];
    L.push("SPENDING CATEGORIES");
    L.push("Total budgeted for variable spending: " + anonMoney(B.spendingBudgetedTotal(s)));
    const catAnonById = {};
    cats.forEach(c => {
      const spent = B.categorySpent(s, c.id);
      const roll = B.rolloverAmount(s, c.id);
      const budget = B.num(c.budgeted) + roll;
      catAnonById[c.id] = anonScrubNames(anonTitleCase(c.label), householdNames);
      L.push(catAnonById[c.id] + ": budgeted " + anonMoney(B.num(c.budgeted))
        + (roll ? ", rollover " + anonMoney(roll) : "")
        + ", spent " + anonMoney(spent)
        + ", remaining " + anonMoney(budget - spent));
    });
    L.push("");

    // --- Debts (the payload; labels replaced by position plus inferred type)
    const debts = s.debts || [];
    const strat = B.debtStrategy(s);
    const extra = Math.max(0, B.extraForDebt(s));
    const sim = DebtEngine.simulate(debts, extra, month, strat);
    L.push("DEBTS");
    L.push("Payoff strategy in use: " + strat);
    L.push("Total debt: " + anonMoney(B.totalDebt(s)));
    L.push("Total minimum payments per month: " + anonMoney(B.totalDebtMins(s)));
    L.push("Extra available for debt per month: " + anonMoney(extra));
    L.push("Projected debt-free date: " + (sim.debtFreeDate ? anonTitleCase(sim.debtFreeDate) : "not reachable at the current payment level"));
    L.push("Count: " + debts.length);
    const debtAnonById = {};
    B.debtOrder(debts, strat).forEach((d, idx) => {
      const bal = B.num(d.balance);
      const orig = B.num(d.originalBalance);
      const rate = B.num(d.interestRate);
      const payoff = sim.payoffByDebt[d.id];
      debtAnonById[d.id] = "Debt " + (idx + 1) + " (" + anonDebtType(d) + ")";
      L.push(debtAnonById[d.id] + ":"
        + " balance " + anonMoney(bal)
        + (orig > 0 ? ", original balance " + anonMoney(orig) : "")
        + ", minimum payment " + anonMoney(d.minimumPayment)
        + ", interest rate " + rate + "%"
        + ", payoff position " + (idx + 1)
        + (payoff ? ", projected payoff " + anonTitleCase(payoff) : ", not projected to be paid off"));
    });
    L.push("");

    // --- Derived figures
    L.push("DERIVED FIGURES");
    const anchorRec = B.latestAnchor(s);
    L.push("Balance last confirmed: " + (anchorRec ? anchorRec.date + " (" + Util.daysSince(anchorRec.date) + " days ago)" : "never"));
    L.push("Balance in the account now: " + (anchorRec ? anonMoney(B.projectedBalance(s)) : "unknown; no balance confirmed"));
    L.push("Still owed out of it this month: " + anonMoney(B.unpaidObligations(s)));
    L.push("Safe to spend right now: " + (anchorRec ? anonMoney(B.safeToSpend(s)) : "unknown; no balance confirmed"));
    L.push("Total budgeted this month: " + anonMoney(B.totalBudgeted(s)));
    L.push("Unpaid credit this month: " + anonMoney(B.totalUnpaidCredit(s)));
    L.push("Cash available to cover that credit: " + anonMoney(B.cashToCover(s)));
    const dayInfo = B.monthDayInfo(s);
    L.push("Progress through the month: day " + dayInfo.day + " of " + dayInfo.daysInMonth + " (" + dayInfo.pct + "%)");
    L.push("");

    // --- Aggregate spending behavior
    const txns = (s.transactions || []).filter(t => t.month === month);
    let creditSpend = 0, debitSpend = 0, uncategorized = 0;
    txns.forEach(t => {
      const amt = B.num(t.amount);
      if (t.paymentType === "credit") creditSpend += amt; else debitSpend += amt;
      if (!t.categoryId) uncategorized += amt;
    });
    L.push("SPENDING BEHAVIOR THIS MONTH");
    L.push("Total spent: " + anonMoney(creditSpend + debitSpend));
    L.push("Number of purchases logged: " + txns.length);
    L.push("Paid from checking: " + anonMoney(debitSpend));
    L.push("Paid by credit card: " + anonMoney(creditSpend));
    if (uncategorized > 0) L.push("Spending not yet assigned to a category: " + anonMoney(uncategorized));
    if (isCouple) {
      const names = (s.settings && s.settings.names) || [];
      L.push("Spent by Person A: " + anonMoney(B.personSpent(s, names[0])));
      L.push("Spent by Person B: " + anonMoney(B.personSpent(s, names[1])));
      L.push("Spent jointly: " + anonMoney(B.personSpent(s, "JOINT")));
    }
    L.push("");

    // --- Itemized transactions.
    //
    // Merchant strings and user notes are still never written — those are the
    // identifying parts, and a note routinely holds a merchant or a person. What
    // each row carries instead is the category, bill, or debt the budget already
    // attributes it to, taken from the maps the sections above populated so the
    // labels and numbering match exactly. That's the contextual clue: a row reads
    // "Groceries" or "Debt 2 (credit card)", so the spending can be reasoned
    // about without knowing where it was spent.
    const cards = s.creditCards || [];
    const cardAnonFor = (cardId) => {
      if (!cardId) return null;
      const idx = cards.findIndex(c => c.id === cardId);
      return idx >= 0 ? "Card " + (idx + 1) : null;
    };
    const personAnonFor = (p) => {
      const v = String(p || "").toUpperCase();
      if (!v) return null;
      if (v === "JOINT") return "Joint";
      const n0 = String(householdNames[0] || "").toUpperCase();
      const n1 = String(householdNames[1] || "").toUpperCase();
      if (n0 && v === n0) return "Person A";
      if (n1 && v === n1) return "Person B";
      return null;
    };
    const txnAnonFor = (t) => {
      if (!t.categoryId) return "Uncategorized";
      return debtAnonById[t.categoryId]
        || billAnonById[t.categoryId]
        || catAnonById[t.categoryId]
        || "Uncategorized";
    };

    L.push("TRANSACTIONS THIS MONTH");
    L.push("Every purchase and payment logged this month, one per line, oldest first. Merchant");
    L.push("names and notes are withheld. Each row is instead labelled with the category, bill,");
    L.push("or debt it is assigned to in the budget, the same attribution the totals above are");
    L.push("built from, so a row can be reasoned about without knowing the merchant.");
    L.push("\"Uncategorized\" means it was imported and has not been assigned yet, so it counts");
    L.push("toward the month's total but toward no category.");
    L.push("Dates are the day of the month within " + monthName + ".");
    L.push("");
    if (!txns.length) {
      L.push("No transactions logged this month.");
    } else {
      txns.slice()
        .sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")))
        .forEach(t => {
          const day = Number(String(t.date || "").slice(8, 10)) || 0;
          const parts = [t.paymentType === "credit" ? "credit" : "debit"];
          const card = t.paymentType === "credit" ? cardAnonFor(t.cardId) : null;
          if (card) parts.push(card);
          const who = isCouple ? personAnonFor(t.person) : null;
          if (who) parts.push(who);
          if (t.source === "import") parts.push("imported");
          L.push((day ? "Day " + day : "Day unknown") + ": " + anonMoney(B.num(t.amount))
            + ", " + txnAnonFor(t)
            + " [" + parts.join(", ") + "]");
        });
    }
    L.push("");

    // --- Accounts, counted and genericized only
    L.push("ACCOUNTS");
    L.push("Credit cards in use: " + ((s.creditCards || []).length));
    (s.creditCards || []).forEach((c, idx) => { L.push("Card " + (idx + 1)); });
    L.push("Checking accounts in use: " + ((s.banks || []).length));
    (s.banks || []).forEach((b, idx) => { L.push("Bank " + (idx + 1)); });
    L.push("");

    L.push("END OF SNAPSHOT");
    return L.join("\n");
  }

  function downloadAnonExport(s) {
    const text = buildAnonymizedExport(s);
    const month = String(s.currentMonth || Util.currentMonthYM());
    const name = "clear-financial-summary-" + month + ".txt";
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    // Revoke on a delay; Safari can still be reading the blob when click returns.
    setTimeout(() => {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 4000);
  }

  function copyCoachPrompt(btn) {
    const original = "+ COPY PROMPT";
    const confirm = () => {
      btn.textContent = "COPIED ×";
      setTimeout(() => { btn.textContent = original; }, 1800);
    };
    // Older mobile browsers and any non-secure context have no async clipboard.
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = COACH_PROMPT;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "0";
      ta.style.left = "0";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, COACH_PROMPT.length);
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) confirm();
      else { btn.textContent = "COPY FAILED"; setTimeout(() => { btn.textContent = original; }, 1800); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(COACH_PROMPT).then(confirm, fallback);
    } else {
      fallback();
    }
  }

  // Add the starter framework to an existing household — the same set a new one
  // is offered, for anyone who declined it or who wants the rest of it later.
  //
  // Purely additive, matched on label so it's safe to run twice: an item you
  // already have (however you spell its case) is skipped, and nothing you own is
  // renamed, re-costed or removed. Amounts on new items stay at their example
  // values for spending and at zero for bills, exactly as at setup.
  async function applyExampleFramework(s) {
    const hasLabel = (arr, label) => (arr || []).some(x =>
      String(x.label || "").trim().toLowerCase() === String(label || "").trim().toLowerCase());
    const income = (s.income || []).slice();
    exampleIncome().forEach(i => { if (!hasLabel(income, i.label)) income.push(i); });
    const bills = (s.bills || []).slice();
    exampleBills().forEach(b => { if (!hasLabel(bills, b.label)) bills.push(b); });
    const cats = (s.spendingCategories || []).slice();
    exampleSpending().forEach(c => { if (!hasLabel(cats, c.label)) cats.push(c); });
    try {
      await DataService.update({
        income: income,
        bills: bills,
        spendingCategories: cats,
        "settings.exampleFramework": true
      });
      exampleAddConfirm = false;
      render();
    } catch (e) { alert("COULDN'T SAVE; CHECK CONNECTION"); console.warn(e); }
  }

  // Reset the household doc to seed data, KEEPING mode, names, tithePercent, debtStrategy,
  // and the same household code / doc ID. The snapshot listener re-renders both phones.
  async function resetHousehold(s) {
    const mode = s.settings && s.settings.mode ? s.settings.mode : "solo";
    const names = (s.settings && s.settings.names) ? s.settings.names.slice() : ["ME"];
    // Existing households have no stored answer, so they reset to the starter
    // framework exactly as they always have.
    const fresh = buildDefaultData(mode, names, !(s.settings && s.settings.exampleFramework === false));
    fresh.settings.tithePercent = BudgetEngine.tithePercent(s);
    fresh.settings.titheEnabled = BudgetEngine.titheEnabled(s);
    fresh.settings.debtStrategy = BudgetEngine.debtStrategy(s);
    try {
      // Clear any transient UI state that could leak across the reset
      Object.keys(txnEdits).forEach(k => delete txnEdits[k]);
      Object.keys(editStates).forEach(k => delete editStates[k]);
      Object.keys(addForms).forEach(k => addForms[k] = null);
      Object.keys(formErrors).forEach(k => delete formErrors[k]);
      logForm.amount = ""; logForm.categoryId = null; logForm.categoryType = null;
      logForm.paymentType = "cash"; logForm.cardId = null; logForm.note = "";
      extraPreview = 0;
      resetConfirmOpen = false;
      await DataService.set(fresh);
      render();
    } catch (e) { alert("COULDN'T RESET; CHECK CONNECTION"); console.warn(e); resetConfirmOpen = true; render(); }

  async function saveEdit(kind, id, s) {
    const form = root.querySelector(`[data-edit-form][data-kind="${kind}"][data-id="${id}"]`);
    if (!form) return;
    const values = {};
    form.querySelectorAll("[data-edit-field]").forEach(inp => { values[inp.dataset.editField] = inp.value; });
    const patch = {};
    if (kind === "income") {
      const freqOk = BudgetEngine.INCOME_FREQUENCIES.some(f => f.id === values.frequency);
      const arr = (s.income||[]).map(i => i.id === id ? {
        ...i,
        label: (values.label||i.label).toUpperCase(),
        amount: parseFloat(values.amount) || 0,
        dueDateOfMonth: parseInt(values.dueDateOfMonth,10) || 1,
        frequency: freqOk ? values.frequency : BudgetEngine.incomeFrequency(i).id
      } : i);
      patch.income = arr;
    } else if (kind === "bill" || kind === "savings") {
      const arr = (s.bills||[]).map(b => b.id === id ? {
        ...b,
        label: (values.label||b.label).toUpperCase(),
        amount: parseFloat(values.amount) || 0,
        dueDateOfMonth: parseInt(values.dueDateOfMonth,10) || 1
      } : b);
      patch.bills = arr;
    } else if (kind === "spending") {
      const arr = (s.spendingCategories||[]).map(c => c.id === id ? {
        ...c,
        label: (values.label||c.label).toUpperCase(),
        budgeted: parseFloat(values.budgeted) || 0
      } : c);
      patch.spendingCategories = arr;
    } else if (kind === "debt") {
      const arr = (s.debts||[]).map(d => {
        if (d.id !== id) return d;
        const newBal = parseFloat(values.balance);
        return {
          ...d,
          label: (values.label||d.label).toUpperCase(),
          balance: isFinite(newBal) ? newBal : d.balance,
          originalBalance: Number(d.originalBalance) || (isFinite(newBal) ? newBal : d.balance),
          minimumPayment: parseFloat(values.minimumPayment) || 0,
          interestRate: parseFloat(values.interestRate) || 0,
          // Blank stays unset so the bills list shows "-" rather than a made-up day.
          dueDateOfMonth: parseInt(values.dueDateOfMonth, 10) || null
        };
      });
      patch.debts = arr;
    } else if (kind === "bank") {
      patch.banks = (s.banks||[]).map(b => b.id === id ? { ...b, label: (values.label||b.label).toUpperCase() } : b);
    } else if (kind === "card") {
      const arr = (s.creditCards||[]).map(c => c.id === id ? {
        ...c,
        label: (values.label||c.label).toUpperCase()
      } : c);
      patch.creditCards = arr;
    }
    try {
      await DataService.update(patch);
      editStates[kind + "_" + id] = false;
      render();
    } catch (e) { alert("COULDN'T SAVE"); console.warn(e); }
  }

  async function saveNewItem(kind, s) {
    formErrors["add_" + kind] = "";
    const f = addForms[kind] || {};
    const label = (f.label||"").trim();
    if (!label) { formErrors["add_" + kind] = "LABEL REQUIRED"; render(); return; }
    const patch = {};
    if (kind === "income") {
      // Monthly by default; change it on the row's EDIT once it exists.
      const item = { id: Util.uuid(), label: label.toUpperCase(), amount: parseFloat(f.amount)||0, dueDateOfMonth: parseInt(f.dueDateOfMonth,10)||1, frequency: "monthly" };
      patch.income = [...(s.income||[]), item];
    } else if (kind === "bill" || kind === "savings") {
      const item = { id: Util.uuid(), label: label.toUpperCase(), amount: parseFloat(f.amount)||0, dueDateOfMonth: parseInt(f.dueDateOfMonth,10)||1, category: kind };
      patch.bills = [...(s.bills||[]), item];
    } else if (kind === "spending") {
      const item = { id: Util.uuid(), label: label.toUpperCase(), budgeted: parseFloat(f.budgeted)||0, type: "spending" };
      patch.spendingCategories = [...(s.spendingCategories||[]), item];
    } else if (kind === "bank") {
      patch.banks = [...(s.banks||[]), { id: Util.uuid(), label: label.toUpperCase() }];
    } else if (kind === "card") {
      // Card ↔ Debt fuzzy link confirm (mirror of the debt path).
      if (!f.linkChoice) {
        const match = (s.debts || []).find(d => fuzzyLabelMatch(d.label, label));
        if (match) {
          f.pendingMatch = { targetId: match.id, targetLabel: match.label };
          render();
          return;
        }
      }
      const linkDebtId = (f.linkChoice === "yes" && f.pendingMatch) ? f.pendingMatch.targetId : null;
      const item = { id: Util.uuid(), label: label.toUpperCase(), debtId: linkDebtId };
      patch.creditCards = [...(s.creditCards||[]), item];
      if (linkDebtId) {
        patch.debts = (s.debts || []).map(d => d.id === linkDebtId ? { ...d, cardId: item.id } : d);
      }
    }
    try {
      await DataService.update(patch);
      addForms[kind] = null;
      render();
    } catch (e) { alert("COULDN'T SAVE"); console.warn(e); }
  }

  async function deleteItem(kind, id, s) {
    if (!confirm("DELETE THIS ITEM?")) return;
    const patch = {};
    if (kind === "income") patch.income = (s.income||[]).filter(x => x.id !== id);
    else if (kind === "bill" || kind === "savings") patch.bills = (s.bills||[]).filter(x => x.id !== id);
    else if (kind === "spending") patch.spendingCategories = (s.spendingCategories||[]).filter(x => x.id !== id);
    else if (kind === "debt") {
      // Also clear cardId on any card that was linked to this debt.
      patch.debts = (s.debts||[]).filter(x => x.id !== id);
      patch.creditCards = (s.creditCards||[]).map(c => c.debtId === id ? { ...c, debtId: null } : c);
    }
    else if (kind === "bank") {
      patch.banks = (s.banks||[]).filter(x => x.id !== id);
      patch.transactions = (s.transactions||[]).map(t => t.bankId === id ? { ...t, bankId: null } : t);
    }
    else if (kind === "card") {
      patch.creditCards = (s.creditCards||[]).filter(x => x.id !== id);
      // Clear cardId on any debt referencing this card.
      patch.debts = (s.debts||[]).map(d => d.cardId === id ? { ...d, cardId: null } : d);
    }
    try { await DataService.update(patch); render(); } catch (e) { alert("COULDN'T DELETE"); }
  }

  function onCsvFilePicked(s, file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      resetImportFlow();
      importFlow.open = true;
      importFlow.kind = "csv";
      importFlow.fileName = file.name || "IMPORT.CSV";
      const parsed = ImportEngine.csvParse(String(reader.result || ""));
      importFlow.csvHeaders = parsed.headers;
      importFlow.csvRows = parsed.rows;
      // Try to match an existing profile by fingerprint.
      const fp = ImportEngine.computeCsvFingerprint(parsed.headers);
      const profile = (s.importProfiles || []).find(p => p.profileType === "csv" && p.headerFingerprint === fp);
      if (profile) {
        importFlow.matchedProfile = profile;
        goToReviewFromCsv(s);
      } else {
        importFlow.stage = "learning";
        render();
      }
    };
    reader.onerror = () => {
      resetImportFlow();
      importFlow.open = true;
      importFlow.stage = "error";
      importFlow.error = "COULDN'T READ FILE";
      render();
    };
    reader.readAsText(file);
  }

  /* ------------- SCREENSHOT IMPORT ------------- */
  // Screenshots of a bank app are the kindest input OCR ever gets: crisp
  // digital glyphs, flat lighting, no perspective. The recognised text goes
  // through exactly the same parser, review, dedupe and learning as a paste —
  // the only thing this path adds is turning pixels into those lines.

  function openScreenshotOverlay() {
    resetImportFlow();
    importFlow.open = true;
    importFlow.stage = "shot-input";
    importFlow.kind = "shot";
    render();
  }

  // Tesseract is trained on dark text over light paper, and a bank app in dark
  // mode is the exact inverse. Sampling a grid and flipping when the page is
  // predominantly dark costs a few milliseconds and materially improves the
  // read. Also scales small screenshots up, since recognition degrades badly
  // below roughly 1000px wide.
  function prepareShotForOcr(file) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          const scale = img.width < 1000 ? Math.min(2.5, 1000 / img.width) : 1;
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          const data = ctx.getImageData(0, 0, w, h);
          const px = data.data;
          // Sample rather than sum every pixel; a screenshot is uniform enough
          // that a stride of 97 pixels answers "is this dark mode?" reliably.
          let dark = 0, seen = 0;
          for (let i = 0; i < px.length; i += 4 * 97) {
            const lum = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
            if (lum < 110) dark++;
            seen++;
          }
          if (seen && dark / seen > 0.6) {
            for (let i = 0; i < px.length; i += 4) {
              px[i] = 255 - px[i];
              px[i + 1] = 255 - px[i + 1];
              px[i + 2] = 255 - px[i + 2];
            }
            ctx.putImageData(data, 0, 0);
          }
          URL.revokeObjectURL(url);
          canvas.toBlob(b => resolve(b || file), "image/png");
        } catch (e) {
          URL.revokeObjectURL(url);
          resolve(file);
        }
      };
      // Anything unreadable falls through to Tesseract untouched rather than
      // failing the whole batch.
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  async function shotsRunOcr(s, files) {
    const list = Array.from(files || []).filter(f => f && /^image\//.test(f.type || ""));
    if (!list.length) {
      importFlow.error = "PICK AT LEAST ONE SCREENSHOT";
      render();
      return;
    }
    importFlow.error = "";
    importFlow.shotsBusy = true;
    // Append rather than replace, so a second batch adds to the first.
    list.forEach(f => importFlow.shots.push({
      name: f.name || "SCREENSHOT", status: "queued", pct: 0, text: "", error: ""
    }));
    render();

    let T;
    try {
      T = await loadTesseract();
    } catch (err) {
      importFlow.shotsBusy = false;
      importFlow.error = (err && err.message) || "COULDN'T DOWNLOAD THE READER; CHECK CONNECTION";
      importFlow.shots = importFlow.shots.filter(x => x.status === "done");
      render();
      return;
    }

    const base = importFlow.shots.length - list.length;
    for (let i = 0; i < list.length; i++) {
      const slot = importFlow.shots[base + i];
      if (!slot) continue;
      slot.status = "reading";
      render();
      try {
        const prepared = await prepareShotForOcr(list[i]);
        const res = await T.recognize(prepared, "eng", {
          logger: (m) => {
            if (!m || m.status !== "recognizing text") return;
            const pct = Math.round((m.progress || 0) * 100);
            if (pct !== slot.pct) { slot.pct = pct; render(); }
          }
        });
        slot.text = (res && res.data && res.data.text) || "";
        slot.status = slot.text.trim() ? "done" : "failed";
        if (slot.status === "failed") slot.error = "NOTHING READABLE IN THIS ONE";
      } catch (err) {
        console.warn(err);
        slot.status = "failed";
        slot.error = (err && err.message) || "COULDN'T READ THIS ONE";
      }
      render();
    }
    importFlow.shotsBusy = false;
    render();
  }

  // Screenshots are read as one statement rather than one import each. Joining
  // them keeps a date heading at the top of one screenshot governing the rows
  // that spill onto the next, and the running-balance chain stays continuous
  // across the seam. Overlapping shots are harmless — the same duplicate check
  // the other paths use catches the repeats.
  function onShotsSubmit(s) {
    const text = importFlow.shots
      .filter(x => x.status === "done")
      .map(x => x.text)
      .join("\n");
    if (!text.trim()) {
      importFlow.error = "NOTHING WAS READ FROM THOSE SCREENSHOTS";
      render();
      return;
    }
    importFlow.rawText = text;
    finishShotParse(s, ImportEngine.textParse(text, importFlow.assumeDate ? { assumeDate: importFlow.assumeDate } : undefined));
  }

  // Shared by the first parse and the re-parse after a date is supplied.
  function finishShotParse(s, parsed) {
    const st = parsed.structure || {};
    // Two ways a screenshot ends up with rows we can't date: no heading was
    // read at all, or the shot starts mid-scroll so its first rows sit under a
    // heading that was off screen. Both are answerable by asking, and both used
    // to end in rows being silently dropped.
    if (!importFlow.assumeDate && (!st.hasDates || !parsed.items.length || st.orphanRows > 0)) {
      importFlow.askDate = {
        reason: (!st.hasDates || !parsed.items.length) ? "none" : "orphans",
        orphanRows: st.orphanRows || 0,
        found: parsed.items.length,
        value: Util.todayISO(),
        error: ""
      };
      importFlow.stage = "ask-date";
      render();
      return;
    }
    // Not-yet-posted rows are dropped: the amount can still change, the
    // balance beside them is a placeholder that would break the arithmetic
    // check, and they arrive again for real once they clear — on a different
    // date, which is exactly the shape the duplicate check is worst at.
    const posted = parsed.items.filter(i => !i.pending);
    importFlow.pendingSkipped = parsed.items.length - posted.length;
    importFlow.pasteItems = posted.length ? posted : parsed.items;
    importFlow.pasteStructure = parsed.structure;
    importFlow.detectedBalance = ImportEngine.closingBalanceOf(importFlow.pasteItems);

    const fp = ImportEngine.computePasteFingerprint(parsed.structure);
    const profile = (s.importProfiles || []).find(p => p.profileType === "paste" && p.formatFingerprint === fp);
    if (profile) {
      importFlow.matchedProfile = profile;
      goToReviewFromPaste(s);
      return;
    }
    importFlow.learn.hasBalancePrompt = false; // the chain check already settled this
    const signs = importFlow.pasteItems.map(i => Math.sign(i.amount));
    if (signs.every(x => x >= 0)) importFlow.learn.negativeIsPurchase = false;
    else if (signs.every(x => x <= 0)) importFlow.learn.negativeIsPurchase = true;
    importFlow.stage = "learning";
    render();
  }

  function onPasteSubmit(s) {
    const text = importFlow.rawText || "";
    const parsed = ImportEngine.textParse(text, importFlow.assumeDate ? { assumeDate: importFlow.assumeDate } : undefined);
    if (!parsed.structure.hasDates) {
      importFlow.stage = "no-dates";
      render();
      return;
    }
    // Pasted text can also start below a date heading. Ask rather than drop the
    // rows on the floor, same as the screenshot path.
    if (!importFlow.assumeDate && parsed.structure.orphanRows > 0) {
      importFlow.askDate = {
        reason: "orphans",
        orphanRows: parsed.structure.orphanRows,
        found: parsed.items.length,
        value: Util.todayISO(),
        error: ""
      };
      importFlow.stage = "ask-date";
      render();
      return;
    }
    importFlow.pasteItems = parsed.items;
    importFlow.pasteStructure = parsed.structure;
    const fp = ImportEngine.computePasteFingerprint(parsed.structure);
    const profile = (s.importProfiles || []).find(p => p.profileType === "paste" && p.formatFingerprint === fp);
    if (profile) {
      importFlow.matchedProfile = profile;
      // Re-parse with the profile's saved overrides so recognized imports
      // apply the same corrections the user made the first time.
      if (profile.lineFormat) {
        const lf = profile.lineFormat;
        const rep = ImportEngine.textParse(text, {
          amountPos: (lf.amountPosition === "first" || lf.amountPosition === "last") ? lf.amountPosition : undefined,
          secondIsBalance: lf.secondIsBalance == null ? undefined : !!lf.secondIsBalance,
          linesPerTxn: lf.linesPerTransaction || undefined
        });
        importFlow.pasteItems = rep.items;
      }
      goToReviewFromPaste(s);
    } else {
      // Learn mode
      importFlow.learn.hasBalancePrompt = parsed.structure.hasBalance;
      // Auto-detect sign convention when unambiguous
      const signs = parsed.items.map(i => Math.sign(i.amount));
      if (signs.every(x => x >= 0)) importFlow.learn.negativeIsPurchase = false;
      else if (signs.every(x => x <= 0)) importFlow.learn.negativeIsPurchase = true;
      importFlow.stage = "learning";
      render();
    }
  }

  // Build review rows from CSV using either the matched profile or the learning-wizard picks.
  function goToReviewFromCsv(s) {
    const profile = importFlow.matchedProfile || {
      dateColumn: importFlow.learn.dateColumn,
      amountColumn: importFlow.learn.amountColumn,
      descriptionColumn: importFlow.learn.descriptionColumn,
      balanceColumn: importFlow.learn.balanceColumn,
      negativeIsPurchase: !!importFlow.learn.negativeIsPurchase,
      paymentType: importFlow.learn.paymentType,
      label: importFlow.learn.label
    };
    const items = [];
    for (const row of importFlow.csvRows) {
      if (!row || !row.length) continue;
      const dateRaw = row[profile.dateColumn] || "";
      const amtRaw = row[profile.amountColumn] || "";
      const desc = row[profile.descriptionColumn] || "";
      const iso = ImportEngine.parseDate(dateRaw);
      if (!iso) continue;
      const amtToks = ImportEngine.findAmounts(amtRaw) || [];
      const amount = amtToks.length ? amtToks[0].value : parseFloat(String(amtRaw).replace(/[^0-9.\-]/g, ""));
      if (!isFinite(amount)) continue;
      // Only read when a balance column was mapped for this bank's layout.
      let runningBalance = null;
      if (profile.balanceColumn != null) {
        const balToks = ImportEngine.findAmounts(row[profile.balanceColumn] || "") || [];
        const bal = balToks.length ? balToks[0].value : parseFloat(String(row[profile.balanceColumn] || "").replace(/[^0-9.\-]/g, ""));
        if (isFinite(bal)) runningBalance = bal;
      }
      items.push({ date: iso, amount, description: desc, runningBalance });
    }
    importFlow.detectedBalance = ImportEngine.closingBalanceOf(items);
    buildReviewRows(s, items, profile);
  }

  function goToReviewFromPaste(s) {
    const profile = importFlow.matchedProfile || {
      profileType: "paste",
      negativeIsPurchase: !!importFlow.learn.negativeIsPurchase,
      paymentType: importFlow.learn.paymentType,
      label: importFlow.learn.label,
      formatFingerprint: ImportEngine.computePasteFingerprint(importFlow.pasteStructure)
    };
    importFlow.detectedBalance = ImportEngine.closingBalanceOf(importFlow.pasteItems);
    buildReviewRows(s, importFlow.pasteItems, profile);
  }

  // Shared matcher for income and bills. `items` is s.income or s.bills.
  // EXACT = name hit AND amount within 1% (auto-applied, no prompt).
  // FUZZY = name hit, OR amount within 5%, OR within $2 (needs confirmation).
  // Returns the single best candidate: EXACT beats FUZZY, then smallest delta.
  function matchSettingsItem(row, items) {
    let best = null;
    for (const item of (items || [])) {
      const itemKey = ImportEngine.normalizeMerchantKey(item.label || "");
      const keyHit = fuzzyMerchantMatch(row.merchantKey, itemKey);
      const expected = Number(item.amount) || 0;
      const amtDelta = Math.abs((Number(row.amount) || 0) - expected);
      const amtPct = amtDelta / Math.max(1, expected);
      let tier = null;
      if (keyHit && amtPct <= 0.01) tier = "exact";
      else if (keyHit || amtPct <= 0.05 || amtDelta <= 2) tier = "fuzzy";
      if (!tier) continue;
      if (!best) { best = { item, tier, amtDelta }; continue; }
      if (best.tier !== "exact" && tier === "exact") best = { item, tier, amtDelta };
      else if (best.tier === tier && amtDelta < best.amtDelta) best = { item, tier, amtDelta };
    }
    return best ? { item: best.item, tier: best.tier } : null;
  }

  // Two-tier duplicate check for imported income, against s.incomeLog (NOT
  // transactions): exact = same date + amount + normalized label; fuzzy = same
  // amount within 3 days.
  function incomeLogDupe(entry, log) {
    const key = ImportEngine.normalizeMerchantKey(entry.label || "");
    const amt = Number(entry.amount) || 0;
    for (const e of (log || [])) {
      if (!e) continue;
      const sameAmt = Math.abs((Number(e.amount) || 0) - amt) < 0.01;
      if (!sameAmt) continue;
      if (e.date === entry.date &&
          ImportEngine.normalizeMerchantKey(e.label || "") === key) return true;
      const d1 = new Date(String(e.date) + "T00:00:00").getTime();
      const d2 = new Date(String(entry.date) + "T00:00:00").getTime();
      if (isFinite(d1) && isFinite(d2) && Math.abs(d1 - d2) / 86400000 <= 3) return true;
    }
    return false;
  }

  function buildReviewRows(s, items, profile) {
    // Setup wizard shares the whole parse/learning pipeline and only diverges
    // here: instead of a per-row review, analyse the statement for recurring
    // income and bills and propose a budget.
    if (importFlow.wizard) {
      const res = ImportEngine.detectRecurring(items, {
        negativeIsPurchase: profile ? profile.negativeIsPurchase !== false : true
      });
      res.income.forEach((x, i) => { x.id = "wi" + i; });
      res.bills.forEach((x, i) => { x.id = "wb" + i; });
      importFlow.wizardResult = res;
      importFlow.wizardPicks = {};
      importFlow.wizardEdits = {};
      res.income.concat(res.bills).forEach(x => { importFlow.wizardPicks[x.id] = !!x.confident; });
      importFlow.stage = "wizard-review";
      render();
      return;
    }
    const existing = s.transactions || [];
    const mmap = s.merchantMap || {};
    const rows = [];
    for (const it of items) {
      const signed = Number(it.amount) || 0;
      const isNeg = signed < 0;
      // With negativeIsPurchase: negative = purchase, positive = deposit.
      // Without: positive = purchase, negative = deposit/refund.
      const isDeposit = profile.negativeIsPurchase ? !isNeg : isNeg;
      const absAmt = Math.abs(signed);
      // Strip bank-noise prefixes BEFORE merchant-key extraction so mappings key
      // off the real merchant name, not "POS PURCH - HEB" vs "HEB".
      const cleanedDesc = ImportEngine.cleanDescription(it.description);
      const merchantKey = ImportEngine.normalizeMerchantKey(cleanedDesc);
      const mappedCat = mmap[merchantKey] || null;
      // Prefer spending category ids; fall back gracefully.
      let categoryType = null;
      if (mappedCat) {
        const inSpending = (s.spendingCategories || []).some(c => c.id === mappedCat);
        const inBills = (s.bills || []).some(b => b.id === mappedCat);
        categoryType = inSpending ? "spending" : (inBills ? "bill" : "spending");
      }
      const cand = { date: it.date, amount: absAmt, description: cleanedDesc };
      let skipped = false, skipReason = "";
      // Deposits never become transactions. If one matches an expected income
      // source, flag it so commit can clear that source instead.
      let incomeMatch = null;
      if (isDeposit) {
        skipped = true;
        skipReason = "DEPOSIT; SKIPPED";
        // A previously confirmed answer wins: never ask the same question twice.
        const learned = (s.incomeMap || {})[merchantKey];
        const learnedSrc = learned && learned !== "__none__"
          ? (s.income || []).find(i => i.id === learned) : null;
        if (learnedSrc) {
          const lbl = (learnedSrc.label || "").toUpperCase();
          incomeMatch = { incomeId: learnedSrc.id, label: lbl, tier: "exact", learned: true };
          skipReason = `INCOME: ${lbl} · WILL BE CLEARED`;
        } else if (learned !== "__none__") {
          const m = matchSettingsItem({ merchantKey, amount: absAmt }, s.income);
          if (m) {
            const lbl = (m.item.label || "").toUpperCase();
            if (m.tier === "exact") {
              incomeMatch = { incomeId: m.item.id, label: lbl, tier: "exact" };
              skipReason = `INCOME: ${lbl} · WILL BE CLEARED`;
            } else {
              incomeMatch = { incomeId: m.item.id, label: lbl, tier: "fuzzy", answer: null };
            }
          }
        }
      }
      if (!skipped && ImportEngine.isExactDupe(cand, existing)) {
        skipped = true;
        skipReason = "ALREADY LOGGED";
      }
      if (!skipped) {
        const fuzz = ImportEngine.findFuzzyMatch(cand, existing);
        if (fuzz) {
          skipped = true;
          const label = (fuzz.note || "MATCH").toUpperCase();
          skipReason = `MATCHES: ${label} · ${Util.fmtDateShort(fuzz.date)}`;
        }
      }
      // Bill matching runs only on rows that will actually become transactions.
      let billMatch = null;
      let rowCatId = mappedCat;
      let rowCatType = categoryType;
      let rowCatAuto = !!mappedCat;
      if (!skipped && !isDeposit) {
        // Tithe rides along as a matchable candidate here too (see
        // BudgetEngine.titheBillView) so a bank transfer described like
        // "TITHE" or "TITHE.LY" gets recognized the same way a real bill
        // would, without tithe ever being stored as one. Left out entirely
        // while tithing is switched off in Settings.
        const billsForMatch = BudgetEngine.titheEnabled(s)
          ? (s.bills || []).concat([BudgetEngine.titheBillView(s)])
          : (s.bills || []);
        const learnedB = (s.billMap || {})[merchantKey];
        const learnedBill = learnedB && learnedB !== "__none__"
          ? billsForMatch.find(b => b.id === learnedB) : null;
        if (learnedBill) {
          const lbl = (learnedBill.label || "").toUpperCase();
          billMatch = { billId: learnedBill.id, label: lbl, tier: "exact", learned: true };
          if (!rowCatId) { rowCatId = learnedBill.id; rowCatType = "bill"; rowCatAuto = true; }
        } else if (learnedB !== "__none__") {
          const m = matchSettingsItem({ merchantKey, amount: absAmt }, billsForMatch);
          if (m) {
            const lbl = (m.item.label || "").toUpperCase();
            if (m.tier === "exact") {
              billMatch = { billId: m.item.id, label: lbl, tier: "exact" };
              // Never overwrite an existing merchantMap hit.
              if (!rowCatId) { rowCatId = m.item.id; rowCatType = "bill"; rowCatAuto = true; }
            } else {
              billMatch = { billId: m.item.id, label: lbl, tier: "fuzzy", answer: null };
            }
          }
        }
      }
      rows.push({
        id: Util.uuid(),
        date: it.date,
        amount: absAmt,
        originalSigned: signed,
        description: (cleanedDesc || it.description || "").toUpperCase().slice(0, 60),
        merchantKey,
        categoryId: rowCatId,
        categoryType: rowCatType,
        categoryAuto: rowCatAuto,
        incomeMatch,
        billMatch,
        paymentType: profile.paymentType || "cash",
        cardId: null,
        person: (s.settings && s.settings.mode === "couple") ? "JOINT" : ((s.settings && s.settings.names && s.settings.names[0]) || "ME").toUpperCase(),
        isDeposit,
        skipped,
        skipReason
      });
    }
    importFlow.reviewRows = rows;
    importFlow.stage = "review";
    render();
  }

  // Finalize learning wizard, save profile to Firestore, then advance to review.
  async function finalizeLearningAndReview(s) {
    const l = importFlow.learn;
    const label = (l.label || "").trim().toUpperCase() || (importFlow.kind === "csv" ? "CSV IMPORT" : "PASTED IMPORT");
    if (importFlow.kind === "csv") {
      if (l.dateColumn == null || l.amountColumn == null || l.descriptionColumn == null) {
        importFlow.error = "MAP DATE, AMOUNT, AND DESCRIPTION COLUMNS";
        render();
        return;
      }
    }
    if (l.negativeIsPurchase == null) l.negativeIsPurchase = true;
    const profile = {
      id: Util.uuid(),
      label,
      profileType: importFlow.kind === "csv" ? "csv" : "paste",
      paymentType: l.paymentType || "cash",
      negativeIsPurchase: !!l.negativeIsPurchase
    };
    if (importFlow.kind === "csv") {
      profile.dateColumn = l.dateColumn;
      profile.amountColumn = l.amountColumn;
      profile.descriptionColumn = l.descriptionColumn;
      // Optional; stays null when this bank's export has no balance column.
      // Learned per header fingerprint like the rest, so it's asked once.
      profile.balanceColumn = l.balanceColumn == null ? null : l.balanceColumn;
      profile.headerFingerprint = ImportEngine.computeCsvFingerprint(importFlow.csvHeaders);
    } else {
      // Compose effective override values (user picks fall back to auto-detected).
      const auto = importFlow.pasteStructure;
      const ov = l.override || {};
      const legacyOverride = (ov.amountPos == null && l.balanceIsAmount) ? "last" : ov.amountPos;
      const effAmountPos = legacyOverride || auto.amountPos;
      const effSecond = ov.secondIsBalance == null ? true : !!ov.secondIsBalance;
      const effLines = ov.linesPerTxn || auto.linesPerTxn;
      profile.lineFormat = {
        datePosition: auto.datePos,
        amountPosition: effAmountPos,        // "first" | "last" — the user's effective choice
        amountPosAuto: auto.amountPos,        // preserved for debugging / migration
        dateFormat: "AUTO",
        linesPerTransaction: effLines,
        secondIsBalance: effSecond
      };
      // Fingerprint tracks the AUTO-detected shape so future pastes of the same
      // layout are recognized; profile.lineFormat carries the user's overrides.
      profile.formatFingerprint = ImportEngine.computePasteFingerprint(auto);
    }
    try {
      await DataService.update({ importProfiles: [...(s.importProfiles || []), profile] });
    } catch (e) {
      alert("COULDN'T SAVE PROFILE; CHECK CONNECTION"); console.warn(e); return;
    }
    importFlow.matchedProfile = profile;
    // Re-parse the pasted text with the user's final overrides so review shows the
    // corrected items (not the auto-parsed ones from the initial preview).
    if (importFlow.kind === "paste") {
      const reparsed = ImportEngine.textParse(importFlow.rawText, {
        amountPos: profile.lineFormat.amountPosition,
        secondIsBalance: profile.lineFormat.secondIsBalance,
        linesPerTxn: profile.lineFormat.linesPerTransaction
      });
      importFlow.pasteItems = reparsed.items;
    }
    if (importFlow.kind === "csv") goToReviewFromCsv(s);
    else goToReviewFromPaste(s);
  }

  // Called when the user taps → IMPORT ALL. If any non-skipped rows lack a
  // category, we open the three-choice panel instead of blocking. Once the user
  // resolves via AUTO-MATCH (if there are still leftovers), IMPORT-LATER, or
  // PICK-ONE-BY-ONE, we route to commitImportWrite.
  function commitImport(s) {
    const flow = importFlow;
    const uncategorized = flow.reviewRows.filter(r => !r.skipped && !r.categoryId);
    if (uncategorized.length) {
      importFlow.choicePanelOpen = true;
      importFlow.error = "";
      render();
      return;
    }
    commitImportWrite(s, { allowUncategorized: false });
  }

  // Fuzzy match between two normalized merchant keys (already single-token from
  // normalizeMerchantKey). Returns true on equality, prefix-containment, or a
  // shared leading 3+ character run.
  function fuzzyMerchantMatch(a, b) {
    if (!a || !b) return false;
    if (a === b) return true;
    if (a.startsWith(b) || b.startsWith(a)) return true;
    // Both keys are already leading-alphabetic tokens; share the first 3 chars?
    if (a.length >= 3 && b.length >= 3 && a.slice(0, 3) === b.slice(0, 3)) return true;
    return false;
  }

  // Bulk auto-match categories on the review rows. Mutates rows in place.
  // Tries: (1) exact merchantMap hit, (2) fuzzy vs merchantMap keys,
  // (3) fuzzy vs merchant keys extracted from already-categorized transactions.
  function bulkAutoMatchCategories(s, rows) {
    const mmap = s.merchantMap || {};
    const spending = s.spendingCategories || [];
    const catIds = new Set(spending.map(c => c.id));
    // Build a "learned" key→categoryId table from past categorized transactions.
    const learnedCount = {};
    for (const t of (s.transactions || [])) {
      if (!t.categoryId || !catIds.has(t.categoryId)) continue;
      const k = ImportEngine.normalizeMerchantKey(t.note || "");
      if (!k) continue;
      learnedCount[k] = learnedCount[k] || {};
      learnedCount[k][t.categoryId] = (learnedCount[k][t.categoryId] || 0) + 1;
    }
    const learned = {};
    for (const k in learnedCount) {
      let bestId = null, best = 0;
      for (const cid in learnedCount[k]) {
        if (learnedCount[k][cid] > best) { best = learnedCount[k][cid]; bestId = cid; }
      }
      if (bestId) learned[k] = bestId;
    }

    let matched = 0, total = 0;
    for (const r of rows) {
      if (r.skipped || r.categoryId) continue;
      total++;
      const k = r.merchantKey || "";
      if (!k) continue;
      // 1. Exact merchantMap hit
      if (mmap[k] && catIds.has(mmap[k])) {
        r.categoryId = mmap[k]; r.categoryType = "spending"; r.categoryAuto = true; matched++; continue;
      }
      // 2. Fuzzy merchantMap
      let hit = null;
      for (const stored in mmap) {
        if (!catIds.has(mmap[stored])) continue;
        if (fuzzyMerchantMatch(k, stored)) { hit = mmap[stored]; break; }
      }
      if (hit) {
        r.categoryId = hit; r.categoryType = "spending"; r.categoryAuto = true; matched++; continue;
      }
      // 3. Fuzzy against learned keys from past transactions
      for (const stored in learned) {
        if (fuzzyMerchantMatch(k, stored)) { hit = learned[stored]; break; }
      }
      if (hit) {
        r.categoryId = hit; r.categoryType = "spending"; r.categoryAuto = true; matched++;
      }
    }
    return { matched, total, remaining: total - matched };
  }

  async function commitImportWrite(s, opts) {
    opts = opts || {};
    const flow = importFlow;
    const newTxns = [];
    const mapUpdates = {};
    for (const r of flow.reviewRows) {
      if (r.skipped) continue;
      if (!r.categoryId && !opts.allowUncategorized) continue;
      const monthYM = String(r.date || "").slice(0, 7) || s.currentMonth;
      const txn = {
        id: r.id,
        date: r.date,
        amount: Math.round(r.amount * 100) / 100,
        categoryId: r.categoryId || "",
        categoryType: r.categoryType || "spending",
        note: (r.description || "").toUpperCase().slice(0, 60),
        paymentType: r.paymentType,
        person: r.person,
        month: monthYM,
        cardId: r.paymentType === "credit" ? (r.cardId || null) : null,
        // Written before the balance is confirmed (import → anchor → carry on),
        // so same-day imported rows read as already cleared and don't get
        // subtracted from the balance a second time.
        createdAt: Date.now(),
        source: "import"
      };
      if (r.merchantKey) txn.merchantKey = r.merchantKey;
      if (!r.categoryId) txn.needsCategory = true;
      newTxns.push(txn);
      if (r.merchantKey && r.categoryId) mapUpdates[r.merchantKey] = r.categoryId;
    }
    // Second pass: confirmed income matches become incomeLog entries. Deposit
    // rows are still never written as transactions.
    const newIncome = [];
    const existingLog = s.incomeLog || [];
    const clearedThisRun = new Set();
    for (const r of flow.reviewRows) {
      const m = r.incomeMatch;
      if (!m) continue;
      if (!(m.tier === "exact" || m.answer === "yes")) continue;
      const monthYM = String(r.date || "").slice(0, 7) || s.currentMonth;
      // One clear per source per month, counting both what's already stored and
      // what this same import is about to write.
      const alreadyStored = existingLog.some(e => e && e.incomeId === m.incomeId && e.month === monthYM);
      const key = m.incomeId + "|" + monthYM;
      if (alreadyStored || clearedThisRun.has(key)) continue;
      const entry = {
        id: Util.uuid(),
        incomeId: m.incomeId,
        label: m.label,
        amount: Math.round((Number(r.amount) || 0) * 100) / 100,
        date: r.date,
        month: monthYM,
        person: r.person,
        note: "",
        tithe: true,
        createdAt: Date.now(),
        source: "import"
      };
      if (r.merchantKey) entry.merchantKey = r.merchantKey;
      // Two-tier dupe check against the income log itself.
      if (incomeLogDupe(entry, existingLog.concat(newIncome))) continue;
      clearedThisRun.add(key);
      newIncome.push(entry);
    }

    // Learned identities: remember confirmations AND rejections so the next
    // import stops asking. Keyed by merchant key, same idea as merchantMap.
    const incomeMapUpdates = {};
    const billMapUpdates = {};
    for (const r of flow.reviewRows) {
      if (!r.merchantKey) continue;
      if (r.incomeRejected) incomeMapUpdates[r.merchantKey] = "__none__";
      else if (r.incomeMatch && (r.incomeMatch.tier === "exact" || r.incomeMatch.answer === "yes")) {
        incomeMapUpdates[r.merchantKey] = r.incomeMatch.incomeId;
      }
      if (r.billRejected) billMapUpdates[r.merchantKey] = "__none__";
      else if (r.billMatch && (r.billMatch.tier === "exact" || r.billMatch.answer === "yes")) {
        billMapUpdates[r.merchantKey] = r.billMatch.billId;
      }
    }

    // Third pass: confirmed bill matches mark that bill paid for the row's month.
    const billsPaidPatch = { ...(s.billsPaid || {}) };
    let billsPaidCount = 0;
    for (const r of flow.reviewRows) {
      if (r.skipped) continue;
      const m = r.billMatch;
      if (!m) continue;
      if (!(m.tier === "exact" || m.answer === "yes")) continue;
      const monthYM = String(r.date || "").slice(0, 7) || s.currentMonth;
      const forMonth = { ...(billsPaidPatch[monthYM] || {}) };
      if (forMonth[m.billId] && forMonth[m.billId].paid) continue;
      forMonth[m.billId] = {
        paid: true,
        paidDate: r.date,
        amount: Math.round((Number(r.amount) || 0) * 100) / 100,
        createdAt: Date.now(),
        source: "import",
        // Points at the transaction written for this same row, which is what
        // keeps the balance from subtracting this payment twice.
        txnId: r.id
      };
      billsPaidPatch[monthYM] = forMonth;
      billsPaidCount++;
    }

    if (!newTxns.length && !newIncome.length && !billsPaidCount &&
        !Object.keys(incomeMapUpdates).length && !Object.keys(billMapUpdates).length) {
      importFlow.error = "NO TRANSACTIONS TO IMPORT";
      render();
      return;
    }
    // Everything goes out in ONE patch.
    const patch = {};
    if (newTxns.length) patch.transactions = DataService.appendTxns(newTxns);
    if (newIncome.length) patch.incomeLog = DataService.appendTxns(newIncome);
    if (billsPaidCount) patch.billsPaid = billsPaidPatch;
    if (Object.keys(mapUpdates).length) {
      patch.merchantMap = { ...(s.merchantMap || {}), ...mapUpdates };
    }
    if (Object.keys(incomeMapUpdates).length) {
      patch.incomeMap = { ...(s.incomeMap || {}), ...incomeMapUpdates };
    }
    if (Object.keys(billMapUpdates).length) {
      patch.billMap = { ...(s.billMap || {}), ...billMapUpdates };
    }
    try {
      await DataService.update(patch);
      // Compute how many of the imported rows landed outside the current month
      // so the LOG screen can flag it. Off-month rows are valid but won't
      // show in THIS MONTH — this was invisible in V8, hence the notice.
      const cm = s.currentMonth;
      const offMonth = newTxns.filter(t => (t.month || "").slice(0, 7) !== cm).length;
      postImportNotice = {
        total: newTxns.length,
        offMonth,
        incomeCleared: newIncome.length,
        billsPaid: billsPaidCount,
        dismissed: false
      };
      // Import → confirm balance → gap check. Anchoring straight after the
      // import means the rows just written are already inside the number the
      // user confirms, and any gap that survives points at the export missing
      // something rather than at sloppy logging.
      const detected = importFlow.detectedBalance;
      resetImportFlow();
      importMenuOpen = false;
      currentTab = "log";
      openBalanceOverlay(detected);
    } catch (e) { alert("COULDN'T IMPORT; CHECK CONNECTION"); console.warn(e); }
  }
