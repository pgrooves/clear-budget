    ));
  }
  function fmtMoney(n, decimals) {
    decimals = decimals || 0;
    if (!isFinite(n)) n = 0;
    const neg = n < 0;
    const abs = Math.abs(n);
    const s = abs.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    return (neg ? "-$" : "$") + s;
  }
  function fmtMonthShort(ym) {
    if (!ym) return "";
    const [y, m] = ym.split("-").map(Number);
    const names = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    return `${names[m-1]} ${y}`;
  }
  function fmtMonthLong(ym) {
    if (!ym) return "";
    const [y, m] = ym.split("-").map(Number);
    const names = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
    return `${names[m-1]} ${y}`;
  }
  function fmtDateShort(iso) {
    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    const names = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    return `${names[d.getMonth()]} ${d.getDate()}`;
  }
  function todayISO() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  function currentMonthYM() {
    return todayISO().slice(0,7);
  }
  function nextMonthYM(ym) {
    let [y, m] = String(ym || "").split("-").map(Number);
    if (!y || !m) return currentMonthYM();
    m++;
    if (m > 12) { m = 1; y++; }
    return `${y}-${String(m).padStart(2,"0")}`;
  }
  function prevMonthYM(ym) {
    let [y, m] = String(ym || "").split("-").map(Number);
    if (!y || !m) return currentMonthYM();
    m--;
    if (m < 1) { m = 12; y--; }
    return `${y}-${String(m).padStart(2,"0")}`;
  }
  // Whole days between an ISO date and today. Used to age the balance anchor:
  // a confirmed balance is exact on the day it's taken and drifts from there,
  // so how old it is belongs on screen next to it.
  function daysSince(iso) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ""))) return 0;
    const then = new Date(iso + "T00:00:00");
    const now = new Date(todayISO() + "T00:00:00");
    return Math.max(0, Math.round((now - then) / 86400000));
  }
  function uuid() {
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 9);
  }
  // Display form only. 10-char codes render as XXXXX-XXXXX for readability;
  // 6-char legacy codes display as-is. The dash is NEVER stored in Firestore,
  // localStorage, or copied to the clipboard — it's presentation only.
  function fmtCode(code) {
    const s = String(code == null ? "" : code);
    if (s.length === 10) return s.slice(0, 5) + "-" + s.slice(5);
    return s;
  }
  return { esc, fmtMoney, fmtMonthShort, fmtMonthLong, fmtDateShort, todayISO, currentMonthYM, nextMonthYM, prevMonthYM, daysSince, uuid, fmtCode };
})();

/* ============================================================
   DATA SERVICE
   Firestore + localStorage household code
   ============================================================ */
const DataService = (() => {
  const HOUSEHOLD_KEY = "clear_household_id";
  let unsub = null;
  let currentDoc = null;
  let currentId = null;
  const dataListeners = [];
  const errorListeners = [];

  // 10 characters from a 32-char alphabet using crypto.getRandomValues.
  // 32 divides 2^32 evenly, so `value % 32` is uniform (no modulo bias).
  // Legacy 6-char codes remain valid on join; only NEW codes are 10 chars.
  function generateCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 32 chars
    const buf = new Uint32Array(10);
    crypto.getRandomValues(buf);
    let s = "";
    for (let i = 0; i < 10; i++) s += chars[buf[i] % 32];
    return s;
  }
  function getHouseholdId() {
    try { return localStorage.getItem(HOUSEHOLD_KEY); } catch (e) { return null; }
  }
  function setHouseholdIdLocal(id) {
    try { localStorage.setItem(HOUSEHOLD_KEY, id); } catch (e) {}
    currentId = id;
  }
  function clearHouseholdId() {
    try { localStorage.removeItem(HOUSEHOLD_KEY); } catch (e) {}
    if (unsub) { try { unsub(); } catch (e) {} unsub = null; }
    currentDoc = null;
    currentId = null;
  }
  function onData(fn) { dataListeners.push(fn); }
  function onError(fn) { errorListeners.push(fn); }
  function emit(doc) { dataListeners.forEach(f => { try { f(doc); } catch (e) { console.warn(e); } }); }
  function emitErr(e) { errorListeners.forEach(f => { try { f(e); } catch (er) { console.warn(er); } }); }

  function subscribe(id) {
    if (!db) { emitErr(new Error("firestore unavailable")); return; }
    if (unsub) { try { unsub(); } catch (e) {} }
    currentId = id;
    try {
      unsub = db.collection("households").doc(id).onSnapshot(
        snap => {
          currentDoc = snap && snap.exists ? snap.data() : null;
          emit(currentDoc);
        },
        err => {
          console.warn("snapshot error", err);
          emitErr(err);
        }
      );
    } catch (e) {
      console.warn("subscribe threw", e);
      emitErr(e);
    }
  }

  function get() { return currentDoc; }
  function getId() { return currentId; }

  function set(data) {
    if (!db || !currentId) return Promise.reject(new Error("no household"));
    return db.collection("households").doc(currentId).set(data);
  }
  function update(patch) {
    if (!db || !currentId) return Promise.reject(new Error("no household"));
    return db.collection("households").doc(currentId).update(patch);
  }
  // Server-side array append for new transactions. Sending the whole rebuilt
  // array meant two devices writing in the same instant would overwrite each
  // other and silently lose one transaction; arrayUnion merges on the server so
  // both survive. Only safe for ADDING — edits and deletes still need the
  // read-modify-write / arrayRemove paths, since arrayUnion cannot replace an
  // existing element.
  function appendTxns(txnOrArray) {
    const items = Array.isArray(txnOrArray) ? txnOrArray : [txnOrArray];
    return firebase.firestore.FieldValue.arrayUnion.apply(null, items);
  }
  async function checkExists(id) {
    if (!db) throw new Error("firestore unavailable");
    // source: "server" is deliberate. With offline persistence enabled, a plain
    // get() can answer this from the local cache, and for a household this
    // device has never opened that yields exists === false — telling someone
    // with a perfectly valid code that no such household exists. Joining is
    // inherently an online operation, so require an authoritative answer and
    // let an offline attempt reject ("unavailable") into the connection-error
    // branch instead.
    const snap = await db.collection("households").doc(id).get({ source: "server" });
    return snap.exists;
  }

  return {
    generateCode, getHouseholdId, setHouseholdIdLocal, clearHouseholdId,
    subscribe, onData, onError, get, getId, set, update, appendTxns, checkExists
  };
})();

/* ============================================================
   BUDGET ENGINE — pure functions, no DOM
   ============================================================ */
const BudgetEngine = (() => {
  const num = v => (isFinite(Number(v)) ? Number(v) : 0);

  /* ---------- INCOME FREQUENCY ----------
     An income's `amount` is what arrives each time it arrives, not what it adds
     up to per month. Everything else in the app thinks in months, so a source's
     frequency is what converts between the two. Records with no frequency read
     as monthly, which is exactly what they meant before this existed. */
  const INCOME_FREQUENCIES = [
    { id: "weekly",     label: "WEEKLY",      perMonth: 52 / 12, everyDays: 7 },
    { id: "biweekly",   label: "EVERY 2 WKS", perMonth: 26 / 12, everyDays: 14 },
    { id: "semimonthly",label: "TWICE A MO",  perMonth: 2,       everyDays: 15 },
    { id: "monthly",    label: "MONTHLY",     perMonth: 1,       everyDays: 0 },
    { id: "quarterly",  label: "QUARTERLY",   perMonth: 1 / 3,   everyDays: 0 },
    { id: "yearly",     label: "YEARLY",      perMonth: 1 / 12,  everyDays: 0 }
  ];
  function incomeFrequency(inc) {
    const id = inc && inc.frequency;
    return INCOME_FREQUENCIES.find(f => f.id === id) || INCOME_FREQUENCIES.find(f => f.id === "monthly");
  }
  // What this source contributes to a month, whatever its cadence.
  function incomeMonthlyAmount(inc) {
    return num(inc && inc.amount) * incomeFrequency(inc).perMonth;
  }
  function totalIncome(s) {
    return (s.income || []).reduce((a, i) => a + incomeMonthlyAmount(i), 0);
  }
  // The days a source actually pays within a month, earliest first, and what
  // lands each time. A month is not one paycheck: where a fortnightly earner's
  // paydays sit relative to the bills is the whole point of the cash-flow walk,
  // so every landing has to be its own dated event.
  function incomeLandings(inc, lastDay) {
    const freq = incomeFrequency(inc);
    // A 31st pay date in a 30-day month would otherwise produce no landing at
    // all and read as a month with no income.
    const first = Math.max(1, Math.min(lastDay, num(inc && inc.dueDateOfMonth) || 1));
    const each = num(inc && inc.amount);
    const out = [];
    if (freq.everyDays > 0 && freq.everyDays < 15) {
      for (let d = first; d <= lastDay; d += freq.everyDays) out.push({ day: d, amount: each });
    } else if (freq.id === "semimonthly") {
      // Twice a month is a pair of fixed dates, not a 15-day cycle: stepping it
      // would fit a third landing into a 31-day month and overstate the year.
      out.push({ day: first, amount: each });
      out.push({ day: Math.min(first + 15, lastDay), amount: each });
    } else {
      // Monthly and rarer. Quarterly and yearly have no payday in most months,
      // so they keep contributing their averaged monthly share rather than
      // implying a lump sum that isn't coming.
      out.push({ day: first, amount: freq.perMonth >= 1 ? each : incomeMonthlyAmount(inc) });
    }
    return out;
  }
  /* ---------- ONE SLOT PER LANDING ----------
     A source that pays fortnightly lands two or three times in a month, so a
     single "cleared?" flag cannot say which of them has actually arrived.
     Every landing gets its own slot, and an incomeLog entry occupies one.

     Entries tagged with a landingIndex claim that slot outright. Untagged ones
     — everything logged before this existed, every entry from the LOG INCOME
     form, every import — fill the earliest unclaimed slots in order, which is
     exactly the rule the walk used when a source could only be ticked once.
     That is what keeps existing data reading the way it always has.

     More entries than landings is allowed and deliberate: a bonus or a
     correction filed against a source still counts as received income, it just
     has no slot to tick. */
  function landingsForMonth(s, inc, ym) {
    if (!inc) return [];
    const slots = incomeLandings(inc, daysInMonthOf(ym)).map((l, index) => ({
      index, day: l.day, date: isoOf(ym, l.day), amount: l.amount, entry: null
    }));
    const entries = (s.incomeLog || [])
      .filter(e => e && e.incomeId === inc.id && e.month === ym)
      .slice()
      .sort((a, b) => num(a.createdAt) - num(b.createdAt));
    const untagged = [];
    entries.forEach(e => {
      const idx = e.landingIndex;
      if (typeof idx === "number" && slots[idx] && !slots[idx].entry) slots[idx].entry = e;
      else untagged.push(e);
    });
    untagged.forEach(e => {
      const slot = slots.find(l => !l.entry);
      if (slot) slot.entry = e;
    });
    return slots;
  }
  // Pay-date order, which is how they actually arrive. Undated sources sort
  // last rather than pretending to be the 1st.
  function incomeByDate(s) {
    return (s.income || []).slice().sort((a, b) => {
      const da = num(a.dueDateOfMonth) || 99;
      const db = num(b.dueDateOfMonth) || 99;
      if (da !== db) return da - db;
      return String(a.label || "").localeCompare(String(b.label || ""));
    });
  }
  function tithePercent(s) {
    return num(s.settings && s.settings.tithePercent != null ? s.settings.tithePercent : 10);
  }
  // Master on/off switch, set during setup or flipped later in Settings.
  // Defaults true so existing households (from before this switch existed)
  // keep behaving exactly as they always have.
  function titheEnabled(s) {
    return !(s.settings && s.settings.titheEnabled === false);
  }
  // Returns 0 while disabled — a single choke point so every caller (Safe To
  // Spend, Budgeted, the Bills row, every display line) automatically drops
  // tithe without each one needing its own titheEnabled check. The rate
  // itself (tithePercent) is left untouched so turning this back on restores
  // the exact same math instantly.
  function tithe(s) {
    if (!titheEnabled(s)) return 0;
    return totalIncome(s) * tithePercent(s) / 100;
  }
  // Money actually received this month, per the income log. This is the basis
  // for safeToSpend; totalIncome stays the EXPECTED basis so Budgeted and the
  // debt-free date do not move as paychecks land.
  function receivedIncome(s) {
    const m = s.currentMonth;
    return (s.incomeLog || [])
      .filter(e => e && e.month === m)
      .reduce((a, e) => a + num(e.amount), 0);
  }
  // Only counts incomeLog entries not explicitly opted out via the LOG INCOME
  // form's TITHE? chip (entry.tithe === false). Older/imported entries with no
  // flag at all still count, same as before this existed.
  function titheOnReceived(s) {
    if (!titheEnabled(s)) return 0;
    const m = s.currentMonth;
    const titheableReceived = (s.incomeLog || [])
      .filter(e => e && e.month === m && e.tithe !== false)
      .reduce((a, e) => a + num(e.amount), 0);
    return titheableReceived * tithePercent(s) / 100;
  }
  // Synthetic bill-shaped view of tithe for the Bills tab / import matching —
  // never stored in s.bills, so there's one source of truth (settings.tithePercent
  // + income) instead of a duplicated record that could drift from it.
  // Plain "tithe", not "__tithe__" — Firestore reserves field names matching
  // /^__.*__$/ and silently rejects writes that use one (this is why marking
  // the tithe row paid failed with "COULDN'T SAVE").
  function titheBillView(s) {
    return { id: "tithe", label: "TITHE", amount: tithe(s), dueDateOfMonth: 0, isTithe: true };
  }
  /* This month's tithe, split across the pay days it will actually be taken
     from — one tickable share per landing, in date order.

     Shares are prorated INSIDE each source rather than across all of them.
     A source's monthly tithe is its monthly-equivalent income times the rate,
     and a fortnightly source lands three times in some months and twice in
     others; splitting its own share between its own landings keeps each
     source contributing exactly what it owes, and keeps the whole list adding
     up to the figure on the TITHE row. A breakdown that doesn't sum to the
     number above it is worse than no breakdown.

     legacyKey is the pre-split "whole source" id. Records written under it
     still exist, so the earliest landing answers to both and an old tick can
     still be untucked instead of becoming an orphan nothing can clear. */
  function titheLandings(s, ym) {
    const month = ym || s.currentMonth;
    // Through the same on/off choke point as tithe(), so a disabled switch
    // zeroes the split here too rather than leaving shares that would still
    // be tickable from an older screen.
    const rate = titheEnabled(s) ? tithePercent(s) / 100 : 0;
    const out = [];
    (s.income || []).forEach(i => {
      if (num(i.amount) <= 0) return;
      const slots = landingsForMonth(s, i, month);
      const total = slots.reduce((a, l) => a + l.amount, 0);
      const sourceShare = incomeMonthlyAmount(i) * rate;
      slots.forEach(l => out.push({
        incomeId: i.id,
        label: String(i.label || "INCOME"),
        index: l.index,
        date: l.date,
        amount: l.amount,
        share: total > 0 ? sourceShare * (l.amount / total) : 0,
        received: !!l.entry,
        key: "tithe:" + i.id + ":" + l.index,
        legacyKey: l.index === 0 ? "tithe:" + i.id : null
      }));
    });
    return out.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  }
  // The paid record covering a landing, under either id. Returns the key it
  // was found under so a tick always removes the record that actually exists.
  function titheLandingRecord(s, landing, paidMap) {
    const map = paidMap || ((s.billsPaid || {})[s.currentMonth] || {});
    if (map[landing.key]) return { key: landing.key, rec: map[landing.key] };
    if (landing.legacyKey && map[landing.legacyKey]) {
      return { key: landing.legacyKey, rec: map[landing.legacyKey] };
    }
    return { key: landing.key, rec: null };
  }
  function billsSubtotal(s) {
    return (s.bills || []).reduce((a, b) => a + num(b.amount), 0);
  }
  // Sum of stored bills only. Tithe is a display-only locked line and is
  // subtracted separately in safeToSpend / extraForDebt as the FIRST allocation from income.
  function totalBills(s) {
    return billsSubtotal(s);
  }
  function totalDebtMins(s) {
    return (s.debts || []).reduce((a, d) => a + num(d.minimumPayment), 0);
  }
  function totalUnpaidCredit(s) {
    const m = s.currentMonth;
    return (s.transactions || [])
      .filter(t => t.paymentType === "credit" && t.month === m)
      .reduce((a, t) => a + num(t.amount), 0);
  }
  /* ---------- BANK BALANCE ANCHOR ----------
     Safe To Spend used to be derived purely from flows: received income minus
     obligations. That could never see money the app was not told about, so it
     drifted from the account silently — and it started every month at zero
     regardless of what was actually sitting in checking.

     It is now anchored to a real observed balance instead. The account is the
     most accurate thing available, so the anchor is the basis and the ledger
     only carries it forward from the moment it was taken. Re-anchoring wipes
     any accumulated logging error; there is deliberately no drift-reconciling
     machinery, because typing today's balance IS the reconciliation. */

  // Most recent observation. Sorted by date, then by when the row was written,
  // so two checks on the same day resolve to the later one.
  function latestAnchor(s) {
    const list = (s.balanceChecks || []).filter(b => b && b.date);
    if (!list.length) return null;
    return list.slice().sort((a, b) => {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return num(a.createdAt) - num(b.createdAt);
    })[list.length - 1];
  }
  function hasAnchor(s) { return !!latestAnchor(s); }

  // Has this ledger row happened since the anchor was taken — i.e. is it money
  // the observed balance could NOT already know about?
  //
  // Date decides it in the normal case. Same-day rows fall back to creation
  // time because the intended flow is import → confirm balance → carry on
  // logging: anything created after the anchor is genuinely new activity, and
  // anything created before it (including everything an import just wrote) has
  // already cleared and is baked into the number the user typed. Rows with no
  // createdAt — everything logged before this existed — count as already
  // absorbed, which errs toward never subtracting the same money twice.
  function isAfterAnchor(row, anchor) {
    if (!anchor || !row) return false;
    const d = String(row.date || "");
    if (!d) return false;
    if (d > anchor.date) return true;
    if (d < anchor.date) return false;
    return num(row.createdAt) > num(anchor.createdAt);
  }

  // Debit spending the balance has not seen yet. Credit is excluded on purpose:
  // a card purchase does not touch checking until the card is paid, and it is
  // already reserved separately as unpaid credit.
  function debitSinceAnchor(s, anchor) {
    return (s.transactions || [])
      .filter(t => t && t.paymentType !== "credit" && isAfterAnchor(t, anchor))
      .reduce((a, t) => a + num(t.amount), 0);
  }
  function incomeSinceAnchor(s, anchor) {
    return (s.incomeLog || [])
      .filter(e => isAfterAnchor(e, anchor))
      .reduce((a, e) => a + num(e.amount), 0);
  }

  // Ticking a bill, savings transfer or tithe writes a paid record but NO
  // ledger transaction, so without this the money would leave the account in
  // real life and never leave the projected balance — the reservation would
  // drop while the balance stayed put, overstating what's spendable by exactly
  // the amount just paid.
  //
  // Records carrying a txnId came from an import, where a real transaction was
  // written alongside; those are already counted as debit spending and would
  // otherwise be subtracted twice.
  function billPaymentsSinceAnchor(s, anchor) {
    if (!anchor) return 0;
    let total = 0;
    const all = s.billsPaid || {};
    Object.keys(all).forEach(month => {
      const forMonth = all[month] || {};
      Object.keys(forMonth).forEach(id => {
        const rec = forMonth[id];
        if (!rec || !rec.paid || rec.txnId) return;
        if (!isAfterAnchor({ date: rec.paidDate, createdAt: rec.createdAt }, anchor)) return;
        total += num(rec.amount);
      });
    });
    return total;
  }

  // What the account should hold right now: the last confirmed balance carried
  // forward by everything logged since. Zero with no anchor — callers must gate
  // on hasAnchor rather than display this cold.
  function projectedBalance(s) {
    const a = latestAnchor(s);
    if (!a) return 0;
    return num(a.amount) + incomeSinceAnchor(s, a) - debitSinceAnchor(s, a) - billPaymentsSinceAnchor(s, a);
  }

  // Only UNPAID obligations get reserved. Anything already ticked has left the
  // account, so it is inside the observed balance already and reserving it
  // again would understate what is spendable. This is the mirror image of the
  // old flow-based math, which subtracted every bill whether paid or not.
  function unpaidBillsTotal(s) {
    const paid = (s.billsPaid || {})[s.currentMonth] || {};
    return (s.bills || [])
      .filter(b => !(paid[b.id] && paid[b.id].paid))
      .reduce((a, b) => a + num(b.amount), 0);
  }
  // Tithe is a display-only line rather than a stored bill, and it can be
  // ticked either as one total or per income source, so its paid amount is
  // summed from both key shapes and clamped.
  function unpaidTithe(s) {
    if (!titheEnabled(s)) return 0;
    const paid = (s.billsPaid || {})[s.currentMonth] || {};
    let paidAmt = 0;
    Object.keys(paid).forEach(k => {
      if (k !== "tithe" && k.indexOf("tithe:") !== 0) return;
      if (paid[k] && paid[k].paid) paidAmt += num(paid[k].amount);
    });
    return Math.max(0, tithe(s) - paidAmt);
  }
  // Ticking a debt minimum writes a real debit transaction, so a paid minimum
  // has already come out of the balance and must not be reserved on top.
  function unpaidDebtMins(s) {
    const m = s.currentMonth;
    const paidIds = {};
    (s.transactions || []).forEach(t => {
      if (t && t.tickPay && t.categoryType === "debt" && t.month === m) paidIds[t.categoryId] = true;
    });
    return (s.debts || [])
      .filter(d => !paidIds[d.id])
      .reduce((a, d) => a + num(d.minimumPayment), 0);
  }
  function unpaidObligations(s) {
    return unpaidBillsTotal(s) + unpaidTithe(s) + unpaidDebtMins(s);
  }

  // Expected income that has not landed yet. Shown beside the balance so "what
  // is here" and "what is still coming" stay visibly separate instead of being
  // blended into one optimistic figure.
  function incomeStillExpected(s) {
    return Math.max(0, totalIncome(s) - receivedIncome(s));
  }

  /* ---------- THE CASH-FLOW WALK ----------
     Holding today's balance against the WHOLE month's bills reads deeply
     negative for most of every month, because the month's income hasn't
     arrived yet. It answers "can I cover all of August right now", which is a
     question nobody asks.

     So the walk steps forward day by day instead, adding income as it lands
     and taking bills as they fall due. Two figures come out of it:

       SAFE TO SPEND  — the lowest the balance gets between now and the next
                        payday. Spend up to this and everything due before you
                        are paid again still clears. This is the number you
                        make a decision against in a shop.
       TIGHTEST POINT — the lowest it gets across the whole horizon, with the
                        date it happens. This is the warning, and it sits
                        beside Safe To Spend rather than replacing it, so a
                        rough patch three weeks out is visible without making
                        today's grocery money read as zero.

     The horizon deliberately runs a rolling 35 days rather than stopping at
     month end. A hard stop on the 31st counted the bills due on the 28th but
     not the paycheck on the 1st, so the walk fell off a cliff every month and
     the figure went negative for the last stretch of every month by
     construction. Rolling past the boundary is not a loosening — it stops the
     walk pretending income ends with the calendar month. */

  const HORIZON_DAYS = 35;

  function daysInMonthOf(ym) {
    const [y, m] = String(ym || "").split("-").map(Number);
    return new Date(y, m, 0).getDate();
  }
  function dayOfMonthToday(s) {
    return s.currentMonth === Util.currentMonthYM() ? new Date().getDate() : 1;
  }
  // The walk works in real calendar dates so it can cross into next month.
  // Browsing a past month starts at its 1st, matching dayOfMonthToday.
  function walkStartISO(s) {
    return s.currentMonth === Util.currentMonthYM()
      ? Util.todayISO()
      : `${s.currentMonth}-01`;
  }
  // Day-of-month clamped into a real date for that month, so a 31st due day in
  // a 30-day month lands on the 30th instead of falling off the calendar.
  function isoOf(ym, day) {
    const d = Math.max(1, Math.min(daysInMonthOf(ym), num(day) || 1));
    return `${ym}-${String(d).padStart(2, "0")}`;
  }
  function isoAddDays(iso, n) {
    const d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + n);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  /* Which card due day this month's credit spending will actually leave the
     account on. A purchase does not touch checking when you swipe it — it
     touches checking when the card gets paid, which for this month's spending
     is next month's statement. Cards carry no due day of their own, so it
     comes from the debt the card is linked to. */
  function creditDueDay(s, cardId) {
    if (!cardId) return 0;
    const card = (s.creditCards || []).find(c => c && c.id === cardId);
    let debt = card && card.debtId ? (s.debts || []).find(d => d && d.id === card.debtId) : null;
    if (!debt) debt = (s.debts || []).find(d => d && d.cardId === cardId);
    return debt ? num(debt.dueDateOfMonth) : 0;
  }
  function creditCardLabel(s, cardId) {
    const c = cardId ? (s.creditCards || []).find(x => x && x.id === cardId) : null;
    return c && c.label ? String(c.label) : "UNPAID CREDIT";
  }
  // Unpaid credit grouped by card, each dated to when that card takes it. With
  // no known due day it falls to the 1st of next month — the earliest a
  // statement covering this month's spending could realistically be due, so an
  // unlinked card is still treated conservatively.
  function creditDueEvents(s) {
    const m = s.currentMonth;
    const nextYm = Util.nextMonthYM(m);
    const byCard = new Map();
    (s.transactions || []).forEach(t => {
      if (!t || t.paymentType !== "credit" || t.month !== m) return;
      const key = t.cardId || "";
      byCard.set(key, (byCard.get(key) || 0) + num(t.amount));
    });
    const out = [];
    byCard.forEach((amount, cardId) => {
      if (amount <= 0) return;
      out.push({
        amount,
        label: cardId ? creditCardLabel(s, cardId) : "UNPAID CREDIT",
        date: isoOf(nextYm, creditDueDay(s, cardId) || 1)
      });
    });
    return out;
  }

  /* The next pay date on the CALENDAR, whether or not that paycheck has been
     marked received yet, and strictly after today.

     Reading it off the schedule rather than off the unlogged income events is
     what stops Safe To Spend moving when you do your bookkeeping. Taken from
     the events, ticking the next paycheck removed it from the list, so "your
     next payday" jumped to the one after it and the window swallowed another
     fortnight of bills — logging money you had actually received made the
     figure go DOWN, and logging the last one made the window vanish
     altogether. The calendar does not care what has been ticked.

     Strictly after today, so that on payday itself the window is the fortnight
     ahead rather than a single flattering day. */
  function nextPayDateISO(s, startISO, endISO) {
    let best = null;
    (s.income || []).forEach(i => {
      if (num(i.amount) <= 0) return;
      for (let ym = startISO.slice(0, 7), n = 0; ym <= endISO.slice(0, 7) && n < 4; ym = Util.nextMonthYM(ym), n++) {
        incomeLandings(i, daysInMonthOf(ym)).forEach(l => {
          const d = isoOf(ym, l.day);
          if (d <= startISO || d > endISO) return;
          if (!best || d < best) best = d;
        });
      }
    });
    return best;
  }

  // Every dated money movement from today to the end of the horizon, as
  // { date, day, seq, amount, label, kind }. Anything already overdue and
  // unpaid lands on today, because it is owed now whatever its due date said.
  function horizonEvents(s, opts) {
    const o = opts || {};
    const startISO = walkStartISO(s);
    const endISO = isoAddDays(startISO, HORIZON_DAYS);
    // Within a day: money in, then the tithe taken from it, then money out.
    // This used to be the other way round, on the grounds that bills-before-
    // income is the pessimistic reading of a day. Inside a single month that
    // was cheap, because a due day and a pay day rarely collided. Rolling past
    // the month boundary makes them collide constantly — rent on the 1st and a
    // paycheck on the 1st is the normal shape of a month — and paying that rent
    // out of a balance the paycheck hasn't joined yet invents a dip the size of
    // the rent, every month, on the day nothing is actually wrong. Tithe still
    // comes after income, because it cannot be owed on a paycheck that hasn't
    // landed.
    const IN = 0, TITHE = 1, OUT = 2;
    const events = [];
    const add = (date, seq, amount, label, kind) =>
      events.push({ date, day: Number(date.slice(8, 10)), seq, amount, label: label || "", kind });
    // Outflows: a past due date means it is owed now, and one beyond the
    // horizon is simply not this walk's problem.
    const out = (date, amount, label, kind) => {
      const d = date < startISO ? startISO : date;
      if (d > endISO) return;
      add(d, OUT, amount, label, kind);
    };

    // This month's tithe when there is no pay day left in the month to take it
    // from; placed once every landing is known, on the next one in view.
    let pendingTithe = 0;

    // Every calendar month the horizon touches. 35 days spans two, or three
    // only if it starts near the end of a short month; the guard is belt and
    // braces against a malformed currentMonth.
    const months = [];
    for (let ym = startISO.slice(0, 7); ym <= endISO.slice(0, 7) && months.length < 4; ym = Util.nextMonthYM(ym)) {
      months.push(ym);
    }

    months.forEach(ym => {
      const paid = (s.billsPaid || {})[ym] || {};
      (s.bills || []).forEach(b => {
        if (paid[b.id] && paid[b.id].paid) return;
        if (num(b.amount) <= 0) return;
        out(isoOf(ym, b.dueDateOfMonth), -num(b.amount), b.label, "bill");
      });

      // A minimum whose tick already wrote a transaction is spent, not pending.
      const minPaid = {};
      (s.transactions || []).forEach(t => {
        if (t && t.tickPay && t.categoryType === "debt" && t.month === ym) minPaid[t.categoryId] = true;
      });
      (s.debts || []).forEach(d => {
        if (minPaid[d.id]) return;
        if (num(d.minimumPayment) <= 0) return;
        out(isoOf(ym, d.dueDateOfMonth), -num(d.minimumPayment), d.label, "debt");
      });

      // Income not yet marked received. A landing whose pay day has already
      // gone by is deliberately NOT pulled forward to today — money that was
      // due and hasn't shown up is not money you can spend, and quietly
      // counting it is how this number would start lying.
      //
      // Slots rather than a count: a filled slot has arrived and is inside the
      // balance, an empty one is still ahead. Counting entries could only say
      // how MANY had landed, so ticking the second of three paychecks silently
      // cancelled the first instead of leaving it standing.
      const landed = [];
      (s.income || []).forEach(i => {
        if (num(i.amount) <= 0) return;
        landingsForMonth(s, i, ym).forEach(l => {
          if (l.entry) return;
          if (l.date < startISO || l.date > endISO) return;
          add(l.date, IN, l.amount, i.label, "income");
          landed.push({ date: l.date, amount: l.amount });
        });
      });

      // Tithe comes due with the income it is taken from, not on the 1st. For
      // this month, what is still owed is spread across the paydays still to
      // come in proportion to what each one brings, so the events sum to
      // exactly the outstanding amount however much has already been given.
      // Later months have nothing given yet, so it is simply the rate.
      if (titheEnabled(s)) {
        const base = landed.reduce((a, l) => a + l.amount, 0);
        if (ym === s.currentMonth) {
          const owed = Math.max(0, unpaidTithe(s));
          if (owed > 0 && base > 0) {
            landed.forEach(l => {
              const cut = owed * (l.amount / base);
              if (cut > 0) add(l.date, TITHE, -cut, "TITHE", "tithe");
            });
          } else if (owed > 0) {
            // Nothing left to land THIS month to take it from. It is owed on
            // income already received, so it cannot drop out of the walk and
            // flatter the number — but dumping it on today made marking your
            // last paycheck received knock the whole tithe off Safe To Spend
            // in one go. It goes on the next pay day in view instead, which is
            // when it would actually be given, and only falls back to today
            // when no pay day is coming at all.
            pendingTithe = owed;
          }
        } else {
          const rate = tithePercent(s) / 100;
          landed.forEach(l => {
            const cut = l.amount * rate;
            if (cut > 0) add(l.date, TITHE, -cut, "TITHE", "tithe");
          });
        }
      }
    });

    // Tithe owed on income already received, with no pay day left this month
    // to take it from: it rides on the next pay day in view, whichever month
    // that falls in, and only lands on today if none is coming.
    if (pendingTithe > 0) {
      const nextIn = events.filter(e => e.kind === "income").sort((a, b) => (a.date < b.date ? -1 : 1))[0];
      add(nextIn ? nextIn.date : startISO, TITHE, -pendingTithe, "TITHE", "tithe");
    }

    // Credit is clamped into the horizon rather than dropped when the card's
    // due day falls beyond it. Landing it early is pessimistic, and quietly
    // losing a real claim off the end of the walk would not be.
    if (!o.excludeCredit) {
      creditDueEvents(s).forEach(c => {
        const d = c.date < startISO ? startISO : (c.date > endISO ? endISO : c.date);
        add(d, OUT, -c.amount, c.label, "credit");
      });
    }

    return events.sort((a, b) =>
      (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) || (a.seq - b.seq) || (a.amount - b.amount));
  }

  // Kept for callers that only care about this calendar month.
  function remainingMonthEvents(s) {
    const last = `${s.currentMonth}-${String(daysInMonthOf(s.currentMonth)).padStart(2, "0")}`;
    return horizonEvents(s).filter(e => e.date <= last);
  }

  /* { low, lowDate, lowDay, windowLow, windowEnd, monthEnd } — everything the
     two headline figures are read off, from one pass so they can never
     disagree with each other. */
  function cashFlowOutlook(s, opts) {
    // Money already set aside into categories is claimed, so it comes off the
    // balance the walk starts from — one deduction at the moment you fund,
    // which then shifts the whole curve down rather than nibbling at it with
    // every purchase. Spending against a funded category lowers the balance
    // and the reservation together, leaving this figure where it was.
    const startISO = walkStartISO(s);
    const start = projectedBalance(s) - totalReserved(s);
    const events = horizonEvents(s, opts);

    // The Safe To Spend window runs to the next payday inclusive, taken from
    // the pay schedule so that marking a paycheck received can never move it.
    const windowEnd = nextPayDateISO(s, startISO, isoAddDays(startISO, HORIZON_DAYS));
    const monthLast = `${s.currentMonth}-${String(daysInMonthOf(s.currentMonth)).padStart(2, "0")}`;

    let running = start, low = start, lowDate = startISO;
    let windowLow = start, windowLowDate = startISO, monthEnd = start;
    // The two headline figures split the horizon between them at the next
    // payday. Reporting the whole-horizon low on the right made it duplicate
    // Safe To Spend on the left whenever the worst moment happened to fall
    // before payday — which, with overdue bills pinned to today, is most days.
    // Splitting the stretch guarantees the second figure says something the
    // first one didn't.
    let atWindowEnd = start, afterLow = null, afterLowDate = null;
    events.forEach(e => {
      running += e.amount;
      if (running < low) { low = running; lowDate = e.date; }
      if (!windowEnd || e.date <= windowEnd) {
        if (running < windowLow) { windowLow = running; windowLowDate = e.date; }
        atWindowEnd = running;
      } else if (afterLow === null || running < afterLow) {
        afterLow = running; afterLowDate = e.date;
      }
      if (e.date <= monthLast) monthEnd = running;
    });
    // The stretch after payday starts the moment payday closes, so the balance
    // at that moment is itself a candidate: a month where nothing further goes
    // out is at its lowest the second you are paid.
    if (windowEnd) {
      if (afterLow === null || atWindowEnd < afterLow) {
        afterLow = atWindowEnd; afterLowDate = windowEnd;
      }
    } else {
      // No paycheck in the whole horizon, so there is no "after" to report.
      // The figure falls back to the plain low, and the caller says so rather
      // than implying a payday that isn't coming.
      afterLow = low; afterLowDate = lowDate;
    }
    return {
      low, lowDate, lowDay: Number(lowDate.slice(8, 10)),
      windowLow, windowLowDate, windowEnd, monthEnd,
      afterLow, afterLowDate, hasAfter: !!windowEnd, atWindowEnd,
      // Where the balance finishes the horizon. A one-day dip and a household
      // genuinely running out of money look identical at the low point and
      // completely different here, so the breakdown gets to say which it is.
      end: running,
      startISO, horizonEnd: isoAddDays(startISO, HORIZON_DAYS)
    };
  }

  // What is genuinely free to spend: the lowest your balance gets between now
  // and your next paycheck. Spend up to this and everything due before you are
  // paid again still clears.
  function safeToSpend(s) {
    return cashFlowOutlook(s).windowLow;
  }
  // The lowest the balance gets once your next paycheck has landed, through
  // the end of the horizon. The warning that sits beside Safe To Spend, and
  // deliberately the OTHER half of the horizon so the two never report the
  // same moment. With no paycheck in view it falls back to the plain low.
  function tightestPoint(s) {
    return cashFlowOutlook(s).afterLow;
  }
  // Where the month lands if every expected paycheck arrives and every unpaid
  // bill goes out. The reassuring counterpart to the numbers above.
  function monthEndBalance(s) {
    return cashFlowOutlook(s).monthEnd;
  }
  // Landings whose pay day has passed with nothing marked received. Counting
  // them would flatter every figure here, so they are surfaced instead. One
  // per landing, not one per source: a fortnightly earner who has logged the
  // first of the month but not the fifteenth is owed one paycheck, and saying
  // "this source is fine" because something arrived would hide it.
  function overdueIncome(s) {
    const startISO = walkStartISO(s);
    const out = [];
    (s.income || []).forEach(i => {
      if (num(i.amount) <= 0) return;
      landingsForMonth(s, i, s.currentMonth).forEach(l => {
        if (l.entry || l.date >= startISO) return;
        out.push({
          id: i.id, label: i.label, dueDateOfMonth: i.dueDateOfMonth,
          amount: l.amount, landingIndex: l.index, landingDate: l.date
        });
      });
    });
    return out;
  }
  /* ---------- WHY EACH NUMBER IS WHAT IT IS ----------
     A figure on its own tells you there's a problem and nothing about which
     one. The causes are not interchangeable either: income that hasn't been
     logged, a duplicated purchase, money deliberately set aside and a
     genuinely overcommitted month all read identically on the headline and
     want completely different responses.

     Both headline figures are low points of the same walk, so both decompose
     exactly:

         low = (balance + income landing by then)
             - (money set aside + everything due by then)

     which makes the two columns arithmetic rather than opinion — they always
     reconcile to the number that was tapped. The notes on top are the
     judgement part, and each one that can be acted on is costed by re-running
     the whole walk with that one thing changed, so "log it and this becomes
     $1,580" is the real figure rather than a guess.

     The two reports deliberately read differently, because the two numbers
     fail for different reasons and are fixed in different ways:

       SAFE TO SPEND  is about the stretch you are standing in. It goes wrong
                      because of things that already happened — a paycheck not
                      logged, a bill paid but not ticked, spending that got
                      away from you. Its notes are about the record being
                      wrong or the week being tight, and most carry a fix.
       TIGHTEST POINT is about a day you can see coming. It goes wrong because
                      of how obligations are ARRANGED — too many landing
                      together, a card falling due, a gap between paychecks.
                      Its notes are about timing and shape: which day is
                      heaviest, what is on it, whether the paychecks in
                      between are already counted, and where it recovers to. */

  // Re-runs the walk against a throwaway copy of the household with one change
  // applied. Pure functions all the way down, so nothing leaks back.
  function whatIf(s, mutate, read) {
    let copy;
    try { copy = JSON.parse(JSON.stringify(s)); } catch (e) { return null; }
    try { mutate(copy); } catch (e) { return null; }
    return read(copy);
  }
  function whatIfSafeToSpend(s, mutate) { return whatIf(s, mutate, safeToSpend); }
  function whatIfTightest(s, mutate) { return whatIf(s, mutate, tightestPoint); }

  /* Note builders. Each returns one note or null, and takes `after` — the
     function that re-reads whichever headline is being explained — so the same
     cause is costed against the number the user actually tapped. */

  // Expected money that never got logged. The walk deliberately refuses to
  // count it, so it is the cheapest thing on either list to fix.
  function noteOverdueIncome(s, after) {
    const overdue = overdueIncome(s);
    if (!overdue.length) return null;
    const m = s.currentMonth;
    return {
      kind: "income",
      count: overdue.length,
      amount: overdue.reduce((a, i) => a + num(i.amount), 0),
      labels: overdue.map(i => String(i.label || "INCOME")),
      after: after(s, c => {
        // Tagged with the landing they fill, so two missing paychecks from one
        // source claim two slots instead of both landing on the first.
        c.incomeLog = (c.incomeLog || []).concat(overdue.map(i => ({
          id: "whatif-" + i.id + "-" + i.landingIndex, incomeId: i.id,
          landingIndex: i.landingIndex, amount: num(i.amount),
          month: m, date: i.landingDate || Util.todayISO(), createdAt: Date.now(), tithe: true
        })));
      })
    };
  }
  // Money set aside is still yours; it is only held back. Worth saying so,
  // because this is the one cause that is not a problem at all.
  function noteReserved(s, after) {
    const reserved = totalReserved(s);
    if (reserved <= 0) return null;
    const m = s.currentMonth;
    return {
      kind: "reserved", amount: reserved,
      after: after(s, c => { if (c.categoryFunding) delete c.categoryFunding[m]; })
    };
  }
  // Overdue and unticked bills are pinned to today by the walk, so a bill paid
  // last week but never ticked lands its whole amount on the number now.
  function noteLateBills(s) {
    const paid = (s.billsPaid || {})[s.currentMonth] || {};
    const today = dayOfMonthToday(s);
    const late = (s.bills || []).filter(b =>
      !(paid[b.id] && paid[b.id].paid) && num(b.dueDateOfMonth) > 0 && num(b.dueDateOfMonth) < today);
    if (!late.length) return null;
    return {
      kind: "lateBills", count: late.length,
      amount: late.reduce((a, b) => a + num(b.amount), 0),
      // Carried so the breakdown can offer the tick right there. A bill that
      // already went out is the one cause on this list the user can clear in a
      // single tap, and making them go and find it on another tab is why they
      // were still sitting here unticked.
      bills: late.map(b => ({ id: b.id, label: String(b.label || "BILL"), amount: num(b.amount) }))
    };
  }
  // Everything is carried forward from the last confirmed balance, so the
  // older that is, the more room there has been for it to drift.
  function noteStaleAnchor(s) {
    const anchor = latestAnchor(s);
    if (!anchor) return null;
    const age = Util.daysSince(anchor.date);
    return age >= 7 ? { kind: "staleAnchor", days: age } : null;
  }
  // One fat-fingered amount or an import landing twice shows up here.
  function noteBigTxns(s) {
    const anchor = latestAnchor(s);
    const big = (s.transactions || [])
      .filter(t => t && t.paymentType !== "credit" && isAfterAnchor(t, anchor))
      .slice()
      .sort((x, y) => num(y.amount) - num(x.amount))
      .slice(0, 3)
      .filter(t => num(t.amount) > 0);
    if (!big.length) return null;
    return {
      kind: "bigTxns",
      items: big.map(t => ({ note: String(t.note || "NO DESCRIPTION"), amount: num(t.amount), date: t.date || "" }))
    };
  }
  function noteUncategorized(s) {
    const uncat = uncategorizedSpent(s);
    if (uncat <= 0) return null;
    return { kind: "uncategorized", amount: uncat, count: uncategorizedTxns(s).length };
  }

  /* Tightest-point notes. These are about shape rather than hygiene: the
     figure is usually not caused by a mistake, it is caused by several
     ordinary obligations landing on top of each other. */

  // The single day between here and the low that takes the most out, with what
  // is on it. This is the actionable one: a dip made by three bills sharing a
  // date is fixed by moving one of them, and you cannot see that from a total.
  /* Each panel explains its own stretch of the horizon and nothing else, so
     the same pile-up is never blamed twice. Safe To Spend owns everything up
     to and including payday; the Tightest Point owns what follows. With no
     payday in view there is only one stretch and it covers the lot. */
  function safeSpan(outlook) {
    return { after: null, to: outlook.windowLowDate };
  }
  function tightSpan(outlook) {
    return { after: outlook.hasAfter ? outlook.windowEnd : null, to: outlook.afterLowDate };
  }
  function inSpan(e, span) {
    return e.date <= span.to && (!span.after || e.date > span.after);
  }
  function noteHeaviestDay(s, span) {
    const byDate = new Map();
    horizonEvents(s).forEach(e => {
      if (!inSpan(e, span) || e.amount >= 0) return;
      const cur = byDate.get(e.date) || { date: e.date, amount: 0, items: [] };
      cur.amount += -e.amount;
      cur.items.push({ label: String(e.label || "DUE"), amount: -e.amount });
      byDate.set(e.date, cur);
    });
    let worst = null;
    byDate.forEach(d => { if (!worst || d.amount > worst.amount) worst = d; });
    // One bill on its own is not a pile-up, and calling it one would be noise.
    if (!worst || worst.items.length < 2) return null;
    worst.items.sort((a, b) => b.amount - a.amount);
    return { kind: "heaviestDay", date: worst.date, amount: worst.amount, items: worst.items.slice(0, 4), count: worst.items.length };
  }
  // Where the low sits relative to the paychecks, and how many are already
  // inside it. A dip on the far side of two paydays is a different problem
  // from one before you are paid at all, and the number cannot say which.
  function notePayPosition(s, outlook) {
    const pays = horizonEvents(s).filter(e => e.kind === "income" && e.date <= outlook.afterLowDate);
    return {
      kind: "payPosition",
      count: pays.length,
      amount: pays.reduce((a, e) => a + e.amount, 0),
      nextDate: outlook.windowEnd,
      lastDate: pays.length ? pays[pays.length - 1].date : null
    };
  }
  // Card money coming due inside the horizon. It used to be taken off the top
  // the moment it was spent, so it never had a date to point at.
  function noteCreditDue(s, span) {
    const credit = horizonEvents(s).filter(e => e.kind === "credit" && inSpan(e, span));
    if (!credit.length) return null;
    return {
      kind: "creditDue",
      amount: credit.reduce((a, e) => a + -e.amount, 0),
      items: credit.map(e => ({ label: String(e.label || "UNPAID CREDIT"), amount: -e.amount, date: e.date }))
    };
  }
  // Where it ends up. A single bad Tuesday and a household genuinely running
  // out of money are identical at the low point and nothing alike five weeks
  // out, and only one of them is worth losing sleep over.
  function noteRecovery(s, outlook) {
    if (outlook.end <= outlook.afterLow) return null;
    return { kind: "recovery", amount: outlook.end, date: outlook.horizonEnd, low: outlook.afterLow };
  }
  // What the biggest single claim is costing. Re-running the walk without it
  // turns "RENT is the largest" into what RENT is actually worth here, which
  // is not the same thing once other bills sit under it.
  function noteBiggestClaim(s, span) {
    const outs = horizonEvents(s).filter(e => inSpan(e, span) && e.amount < 0);
    if (outs.length < 2) return null;
    const biggest = outs.slice().sort((a, b) => a.amount - b.amount)[0];
    if (-biggest.amount <= 0) return null;
    return {
      kind: "biggestClaim",
      label: String(biggest.label || "DUE"),
      amount: -biggest.amount,
      date: biggest.date,
      share: outs.reduce((a, e) => a + -e.amount, 0) > 0
        ? -biggest.amount / outs.reduce((a, e) => a + -e.amount, 0) : 0
    };
  }

  function compact(list) { return list.filter(Boolean); }

  /* The two sides of a figure, plus what to look at. `targetDate` is the day
     the figure happens on: only what has happened by then made it, and
     anything after is on the far side of the dip and did not cause it. */
  function walkBreakdown(s, targetDate, from) {
    // `from` scopes the columns to the stretch after a date, opening with the
    // balance as it stands then. Without it the Tightest Point panel would
    // re-list every bill that Safe To Spend already accounted for, and the
    // reader would have to work out which half of the list was theirs.
    if (from) {
      const events = horizonEvents(s).filter(e => e.date > from.date && e.date <= targetDate);
      const incoming = events.filter(e => e.amount > 0)
        .map(e => ({ label: String(e.label || "INCOME"), amount: e.amount, date: e.date, day: e.day }));
      const claims = events.filter(e => e.amount < 0)
        .map(e => ({ label: String(e.label || "DUE"), amount: -e.amount, date: e.date, day: e.day, kind: e.kind === "credit" ? "credit" : "due" }))
        .sort((a, b) => b.amount - a.amount);
      const available = from.balance + incoming.reduce((a, e) => a + e.amount, 0);
      return {
        balance: from.balance, balanceDate: from.date, incoming, available,
        claims, claimed: claims.reduce((a, c) => a + c.amount, 0)
      };
    }
    const byThen = horizonEvents(s).filter(e => e.date <= targetDate);
    const balance = projectedBalance(s);
    const reserved = totalReserved(s);

    const incoming = byThen.filter(e => e.amount > 0)
      .map(e => ({ label: String(e.label || "INCOME"), amount: e.amount, date: e.date, day: e.day }));
    // Unpaid credit is a dated event in the walk now rather than a flat
    // deduction, so it arrives through byThen like every other claim; listing
    // it separately as well would count it twice.
    const claims = [];
    if (reserved > 0) claims.push({ label: "SET ASIDE IN CATEGORIES", amount: reserved, kind: "reserved" });
    byThen.filter(e => e.amount < 0).forEach(e =>
      claims.push({ label: String(e.label || "DUE"), amount: -e.amount, date: e.date, day: e.day, kind: e.kind === "credit" ? "credit" : "due" }));
    claims.sort((a, b) => b.amount - a.amount);

    const available = balance + incoming.reduce((a, e) => a + e.amount, 0);
    const claimed = claims.reduce((a, c) => a + c.amount, 0);
    return { balance, incoming, available, claims, claimed };
  }

  // Why Safe To Spend is what it is: the stretch between here and payday, and
  // the things that are making it tight — most of which are fixable today.
  function safeToSpendReport(s) {
    const o = cashFlowOutlook(s);
    // Shape first — a week made tight by three bills sharing a day is fixed
    // differently from one made tight by a paycheck that never got logged —
    // then the things that can be put right today.
    const span = safeSpan(o);
    const notes = compact([
      noteHeaviestDay(s, span),
      noteOverdueIncome(s, whatIfSafeToSpend),
      noteLateBills(s),
      noteCreditDue(s, span),
      noteReserved(s, whatIfSafeToSpend),
      noteUncategorized(s),
      noteBigTxns(s),
      noteStaleAnchor(s)
    ]);
    // The pointer across is the last word, not the first: this report is about
    // getting to payday, and the far side of it is the other number's job.
    if (o.afterLow < o.windowLow) notes.push({ kind: "seeTightest", amount: o.afterLow, date: o.afterLowDate });
    return {
      mode: "safe",
      amount: o.windowLow, date: o.windowLowDate,
      payDate: o.windowEnd, other: o.afterLow, otherDate: o.afterLowDate,
      startISO: o.startISO, horizonEnd: o.horizonEnd, end: o.end,
      ...walkBreakdown(s, o.windowLowDate),
      notes
    };
  }

  // Why the Tightest Point is what it is: which day, what lands on it, how
  // many paychecks are already counted against it, and where it recovers to.
  function tightestPointReport(s) {
    const o = cashFlowOutlook(s);
    const span = tightSpan(o);
    const notes = compact([
      noteHeaviestDay(s, span),
      notePayPosition(s, o),
      noteBiggestClaim(s, span),
      noteCreditDue(s, span),
      noteRecovery(s, o),
      noteOverdueIncome(s, whatIfTightest),
      noteLateBills(s),
      noteReserved(s, whatIfTightest),
      noteStaleAnchor(s)
    ]);
    return {
      mode: "tight",
      amount: o.afterLow, date: o.afterLowDate, hasAfter: o.hasAfter,
      payDate: o.windowEnd, other: o.windowLow, otherDate: o.windowLowDate,
      startISO: o.startISO, horizonEnd: o.horizonEnd, end: o.end,
      // Opens at the balance as payday closes, so the columns cover only the
      // far stretch and still reconcile: that balance already carries
      // everything before it.
      ...walkBreakdown(s, o.afterLowDate,
        o.hasAfter ? { date: o.windowEnd, balance: o.atWindowEnd } : null),
      notes
    };
  }

  function shortfallReport(s, mode) {
    return mode === "safe" ? safeToSpendReport(s) : tightestPointReport(s);
  }

  function spendingBudgetedTotal(s) {
    return (s.spendingCategories || []).reduce((a, c) => a + num(c.budgeted), 0);
  }
  function totalBudgeted(s) {
    return billsSubtotal(s) + tithe(s) + totalDebtMins(s) + spendingBudgetedTotal(s);
  }
  function extraForDebt(s) {
    return totalIncome(s) - tithe(s) - totalBills(s) - totalDebtMins(s) - spendingBudgetedTotal(s);
  }
  function categorySpent(s, id) {
    const m = s.currentMonth;
    return (s.transactions || [])
      .filter(t => t.categoryId === id && t.month === m)
      .reduce((a, t) => a + num(t.amount), 0);
  }
  function rolloverAmount(s, id) {
    return num(s.monthlyRollover && s.monthlyRollover[s.currentMonth] && s.monthlyRollover[s.currentMonth][id]);
  }
  function categoryRemaining(s, cat) {
    return num(cat.budgeted) + rolloverAmount(s, cat.id) - categorySpent(s, cat.id);
  }

  /* ---------- FUNDED CATEGORIES ----------
     A category budget is an intention, not money. Reserving every budget at
     the start of the month would hold Safe To Spend against income that has
     not arrived — the same mistake that made it read negative all month.

     So a category holds nothing until you deliberately put money in it, and
     you can only do that once income has actually landed. Funding is stored
     per month, exactly like rollover, and starts empty each month: until you
     fund, every purchase reduces Safe To Spend, categorised or not.

     Once funded, spending in that category draws the reserve down instead.
     The balance falls and the reservation falls with it, so Safe To Spend
     holds steady — the money was already accounted for when you funded it.
     Spend past what you set aside and the reserve floors at zero, so the
     excess starts biting again. Spending with no category has nothing behind
     it and bites immediately, which is the whole point of surfacing it. */

  // What a category is aiming to hold this month: its budget plus whatever
  // last month left it.
  function categoryTarget(s, cat) {
    return num(cat && cat.budgeted) + rolloverAmount(s, cat && cat.id);
  }
  // How much has actually been set aside for it this month.
  function categoryFunded(s, id) {
    const m = s.currentMonth;
    return num(s.categoryFunding && s.categoryFunding[m] && s.categoryFunding[m][id]);
  }
  function totalFunded(s) {
    return (s.spendingCategories || []).reduce((a, c) => a + categoryFunded(s, c.id), 0);
  }
  // Set aside and not yet spent — the slice of the balance already claimed.
  // Floored at zero so overspending a category cannot swing the reservation
  // negative and hand the overspend back as if it were spendable.
  function categoryReserve(s, id) {
    return Math.max(0, categoryFunded(s, id) - categorySpent(s, id));
  }
  function totalReserved(s) {
    return (s.spendingCategories || []).reduce((a, c) => a + categoryReserve(s, c.id), 0);
  }
  // The share of this month's expected income that has actually landed, which
  // is what "fund my share" funds. Capped at 1 so a three-payday month cannot
  // push a category past what it asked for.
  function fundedShare(s) {
    const expected = totalIncome(s);
    if (expected <= 0) return 0;
    return Math.min(1, receivedIncome(s) / expected);
  }
  // What each category would take to reach its share of the month. Tops up
  // rather than restarting, and never goes negative: a category already
  // funded past the share is left alone rather than clawed back.
  function fundingPlan(s, mode) {
    const share = mode === "full" ? 1 : fundedShare(s);
    return (s.spendingCategories || []).map(c => {
      const target = categoryTarget(s, c);
      const already = categoryFunded(s, c.id);
      return {
        id: c.id, label: c.label, target, already,
        add: Math.max(0, Math.round(target * share) - already)
      };
    });
  }
  function fundingPlanTotal(s, mode) {
    return fundingPlan(s, mode).reduce((a, p) => a + p.add, 0);
  }
  // Transactions behind a figure on the dashboard, newest first, so every
  // total on that screen can be opened up and checked.
  function categoryTxns(s, id) {
    const m = s.currentMonth;
    return (s.transactions || [])
      .filter(t => t && t.month === m && t.categoryId === id)
      .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
  }
  // Spending that never got a category. Debt payments carry their debt's id,
  // so they are not swept in here.
  function uncategorizedTxns(s) {
    const m = s.currentMonth;
    return (s.transactions || [])
      .filter(t => t && t.month === m && !t.categoryId)
      .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
  }
  function uncategorizedSpent(s) {
    return uncategorizedTxns(s).reduce((a, t) => a + num(t.amount), 0);
  }

  /* ---------- THE BUDGET MONTH FOLLOWS THE CALENDAR ----------
     currentMonth used to advance only when someone pressed START NEW MONTH.
     Miss it and every figure kept describing the month that had already
     ended: income read as unreceived, bills read as overdue, and imported
     transactions landed in a month the app wasn't showing. The calendar is
     not a decision, so it is no longer treated as one — the pointer moves on
     its own and the rollover choice becomes something you revisit rather than
     a gate you have to pass first. */

  // Month-explicit variants of the three above. The defaults read
  // s.currentMonth, which is no use when rolling several months in one pass.
  function categorySpentIn(s, id, month) {
    return (s.transactions || [])
      .filter(t => t.categoryId === id && t.month === month)
      .reduce((a, t) => a + num(t.amount), 0);
  }
  function rolloverAmountIn(s, id, month) {
    return num(s.monthlyRollover && s.monthlyRollover[month] && s.monthlyRollover[month][id]);
  }
  function categoryRemainingIn(s, cat, month) {
    return num(cat.budgeted) + rolloverAmountIn(s, cat.id, month) - categorySpentIn(s, cat.id, month);
  }

  // What a category would carry into `month` from the one before it, under the
  // default "roll unspent forward" rule. Used both when advancing and when
  // showing what to keep or clear afterwards.
  function rolloverCandidate(s, cat, month) {
    const prev = Util.prevMonthYM(month);
    const remaining = categoryRemainingIn(s, cat, prev);
    return remaining > 0 ? Math.round(remaining * 100) / 100 : 0;
  }

  // Patch that walks currentMonth up to today's month, filling in each
  // intervening month's rollovers, or null when nothing needs to move.
  // Rolling unspent money forward is the default because it is the
  // non-destructive one — nothing is lost, and it can be cleared afterwards
  // from the rollover review.
  function autoAdvancePatch(s) {
    const real = Util.currentMonthYM();
    const cur = s && s.currentMonth;
    if (!cur || !real || real <= cur) return null;
    const mr = Object.assign({}, s.monthlyRollover || {});
    let m = cur;
    // Bounded so a corrupt currentMonth can never spin here.
    for (let guard = 0; m < real && guard < 600; guard++) {
      const next = Util.nextMonthYM(m);
      const rollovers = {};
      (s.spendingCategories || []).forEach(c => {
        const remaining = num(c.budgeted) + num(mr[m] && mr[m][c.id]) - categorySpentIn(s, c.id, m);
        if (remaining > 0) rollovers[c.id] = Math.round(remaining * 100) / 100;
      });
      mr[next] = rollovers;
      m = next;
    }
    return { monthlyRollover: mr, currentMonth: real };
  }
  function personSpent(s, person) {
    const m = s.currentMonth;
    return (s.transactions || [])
      .filter(t => t.month === m && t.person === person)
      .reduce((a, t) => a + num(t.amount), 0);
  }
  function totalDebt(s) {
    return (s.debts || []).reduce((a, d) => a + num(d.balance), 0);
  }
  // Debt payoff order:
  //   avalanche = interest rate DESC, tie-break smaller balance first
  //   snowball  = balance ASC,        tie-break higher rate first
  function debtOrder(debts, strategy) {
    const strat = strategy === "snowball" ? "snowball" : "avalanche";
    return (debts || []).slice().sort((a, b) => {
      if (strat === "avalanche") {
        const r = num(b.interestRate) - num(a.interestRate);
        if (r !== 0) return r;
        return num(a.balance) - num(b.balance);
      }
      const bal = num(a.balance) - num(b.balance);
      if (bal !== 0) return bal;
      return num(b.interestRate) - num(a.interestRate);
    });
  }
  function debtStrategy(s) {
    return (s && s.settings && s.settings.debtStrategy === "snowball") ? "snowball" : "avalanche";
  }
  function targetDebt(s) {
    const active = debtOrder((s.debts || []).filter(d => num(d.balance) > 0), debtStrategy(s));
    return active[0] || null;
  }
  // Actually paid on credit that has been "covered" (spent from cash budget). We use a simple model:
  // cash to cover = safeToSpend + totalUnpaidCredit (i.e. what would remain if credit was paid off).
  function unpaidCredit(s) { return totalUnpaidCredit(s); }
  // How far through the viewed month we are, 0..1. Used to judge spending pace:
  // 80% of a category on the 5th is very different from 80% on the 28th. A month
  // that is not the current one is treated as fully elapsed.
  function monthElapsed(s, today) {
    const ym = s.currentMonth;
    const now = today ? new Date(today) : new Date();
    const nowYm = Util.currentMonthYM();
    if (!ym) return 1;
    if (ym !== nowYm) return 1;
    const [y, m] = ym.split("-").map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const day = now.getDate();
    return Math.max(0, Math.min(1, day / daysInMonth));
  }
  function monthDayInfo(s) {
    const ym = s.currentMonth;
    const nowYm = Util.currentMonthYM();
    const [y, m] = (ym || nowYm).split("-").map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const day = ym === nowYm ? new Date().getDate() : daysInMonth;
    return { day, daysInMonth, pct: Math.round((day / daysInMonth) * 100) };
  }

  function cashToCover(s) {
    // What the tightest point would be if the cards were not a claim at all —
    // i.e. the headroom there is to pay them off. Re-running the walk with
    // credit suppressed gets this directly, and stays right now that credit is
    // dated to its due day instead of being taken off the top.
    return cashFlowOutlook(s, { excludeCredit: true }).low;
  }

  return {
    num,
    totalIncome, receivedIncome, tithePercent, titheEnabled, tithe, titheOnReceived, titheBillView,
    titheLandings, titheLandingRecord,
    INCOME_FREQUENCIES, incomeFrequency, incomeMonthlyAmount, incomeByDate, incomeLandings,
    landingsForMonth,
    billsSubtotal, totalBills, totalDebtMins,
    totalUnpaidCredit, safeToSpend, tightestPoint, spendingBudgetedTotal, totalBudgeted, extraForDebt,
    latestAnchor, hasAnchor, isAfterAnchor, projectedBalance, billPaymentsSinceAnchor,
    unpaidBillsTotal, unpaidTithe, unpaidDebtMins, unpaidObligations, incomeStillExpected,
    remainingMonthEvents, horizonEvents, cashFlowOutlook, monthEndBalance, overdueIncome, daysInMonthOf,
    shortfallReport, safeToSpendReport, tightestPointReport, whatIfSafeToSpend, whatIfTightest,
    categorySpent, rolloverAmount, categoryRemaining, personSpent,
    categoryTarget, categoryFunded, totalFunded, categoryReserve, totalReserved,
    fundedShare, fundingPlan, fundingPlanTotal,
    categoryTxns, uncategorizedTxns, uncategorizedSpent,
    categorySpentIn, rolloverAmountIn, categoryRemainingIn, rolloverCandidate, autoAdvancePatch,
    totalDebt, targetDebt, debtOrder, debtStrategy, unpaidCredit, cashToCover,
    monthElapsed, monthDayInfo
  };
})();

/* ============================================================
   DEBT ENGINE — pure snowball simulation
   ============================================================ */
const DebtEngine = (() => {
  const monthNames = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

  // strategy: "avalanche" (default) or "snowball". Sort order controls both which debt
  // receives the extra payment AND the cascade order when a debt is paid off.
  function simulate(debtsInput, extraPerMonth, startMonth, strategy) {
    const empty = { payoffByDebt: {}, debtFreeDate: null, months: 0, order: [] };
    if (!debtsInput || !debtsInput.length) return empty;
    const strat = strategy === "snowball" ? "snowball" : "avalanche";

    const sim = debtsInput.map(d => ({
      id: d.id,
      label: d.label,
      balance: Number(d.balance) || 0,
      min: Number(d.minimumPayment) || 0,
      rate: Number(d.interestRate) || 0
    })).filter(d => d.balance > 0)
      .sort((a, b) => {
        if (strat === "avalanche") return (b.rate - a.rate) || (a.balance - b.balance);
        return (a.balance - b.balance) || (b.rate - a.rate);
      });

    if (!sim.length) return empty;

    const order = sim.map(d => d.id);
    const payoff = {};
    let [year, month] = (startMonth || Util.currentMonthYM()).split("-").map(Number);
    let cascadedMin = 0;
    let iter = 0;
    const MAX = 720; // 60 years cap safety

    while (sim.some(d => d.balance > 0) && iter < MAX) {
      // 1. Minimum payments to all still-active debts
      for (const d of sim) {
        if (d.balance <= 0) continue;
        d.balance -= d.min;
        if (d.balance < 0) d.balance = 0;
      }
      // 2. Apply interest to all still-active debts
      for (const d of sim) {
        if (d.balance <= 0) continue;
        d.balance += d.balance * (d.rate / 12 / 100);
      }
      // 3. Send extra + cascaded to smallest still-active, cascade overflow
      let extra = (Number(extraPerMonth) || 0) + cascadedMin;
      for (const d of sim) {
        if (d.balance <= 0) continue;
        if (extra <= 0) break;
        const applied = Math.min(extra, d.balance);
        d.balance -= applied;
        extra -= applied;
      }
      // 4. Record any new payoffs, cascade their minimums into future extras
      for (const d of sim) {
        if (d.balance <= 0 && !payoff[d.id]) {
          payoff[d.id] = `${monthNames[month - 1]} ${year}`;
          cascadedMin += d.min;
        }
      }
      iter++;
      if (sim.every(d => d.balance <= 0)) break;
      // Advance month
      month++;
      if (month > 12) { month = 1; year++; }
    }

    // Debt-free date is the latest payoff month
    let latest = null;
    let latestKey = -1;
    for (const id in payoff) {
      const [mo, yr] = payoff[id].split(" ");
      const k = Number(yr) * 12 + monthNames.indexOf(mo);
      if (k > latestKey) { latestKey = k; latest = payoff[id]; }
    }
    return { payoffByDebt: payoff, debtFreeDate: latest, months: iter, order };
  }

  return { simulate };
})();
