  async function saveBulkCategoryEdits(s) {
    const ids = Object.keys(bulkSelection).filter(id => bulkSelection[id]);
    if (!ids.length || !bulkStagedCategoryId) return;
    const catId = bulkStagedCategoryId;
    const spending = s.spendingCategories || [];
    const bills = s.bills || [];
    const type = spending.some(c => c.id === catId) ? "spending" : (bills.some(b => b.id === catId) ? "bill" : "spending");
    const idSet = new Set(ids);
    const mapUpdates = {};
    const newTxns = (s.transactions || []).map(t => {
      if (!idSet.has(t.id)) return t;
      if (t.categoryType === "debt") return t; // safety: debt txns excluded upstream but re-guard here
      const key = t.merchantKey || ImportEngine.normalizeMerchantKey(ImportEngine.cleanDescription(t.note || ""));
      const updated = { ...t, categoryId: catId, categoryType: type };
      if (updated.needsCategory) delete updated.needsCategory;
      if (key) mapUpdates[key] = catId;
      return updated;
    });
    const patch = { transactions: newTxns };
    if (Object.keys(mapUpdates).length) patch.merchantMap = { ...(s.merchantMap || {}), ...mapUpdates };
    try {
      await DataService.update(patch);
      Object.keys(bulkSelection).forEach(k => delete bulkSelection[k]);
      bulkStagedCategoryId = null;
      bulkPickerOpen = false;
      bulkDeleteConfirmOpen = false;
      render();
    } catch (e) { alert("COULDN'T SAVE; CHECK CONNECTION"); console.warn(e); }
  }

  // Bulk delete. Mirrors deleteTxn(), including reversing any debt balance the
  // deleted rows had applied — applyDebtDelta is a no-op for non-debt rows, and
  // debt rows can't be checked today, but chaining it keeps the two delete paths
  // behaving identically if that ever changes.
  async function deleteBulkTxns(s) {
    const ids = Object.keys(bulkSelection).filter(id => bulkSelection[id]);
    if (!ids.length) return;
    const idSet = new Set(ids);
    const removed = (s.transactions || []).filter(t => idSet.has(t.id));
    if (!removed.length) return;
    let debts = s.debts;
    removed.forEach(t => { debts = applyDebtDelta(debts, t, null); });
    const patch = {
      transactions: (s.transactions || []).filter(t => !idSet.has(t.id)),
      debts: debts
    };
    try {
      await DataService.update(patch);
      removed.forEach(t => closeTxnEditor(t.id));
      Object.keys(bulkSelection).forEach(k => delete bulkSelection[k]);
      bulkStagedCategoryId = null;
      bulkPickerOpen = false;
      bulkDeleteConfirmOpen = false;
      render();
    } catch (e) { alert("COULDN'T DELETE; CHECK CONNECTION"); console.warn(e); }
  }

  async function clearAllTransactions(s) {
    try {
      await DataService.update({ transactions: [] });
      clearLogConfirmOpen = false;
      Object.keys(bulkSelection).forEach(k => delete bulkSelection[k]);
      bulkStagedCategoryId = null;
      bulkPickerOpen = false;
      bulkDeleteConfirmOpen = false;
      render();
    } catch (e) { alert("COULDN'T CLEAR; CHECK CONNECTION"); console.warn(e); }
  }

  // Render a single transaction row plus (optionally) its inline editor / delete confirm.
  function renderTxnRow(s, t, catLookup) {
    // Clean at render time so legacy rows (imported before V11 or manually
    // typed with a copy/pasted prefix) also read cleanly.
    const cleanedNote = ImportEngine.cleanDescription(t.note || "");
    const displayNote = cleanedNote || t.note || "";
    const catLabel = catLookup[t.categoryId] || "";
    const needsCat = !!t.needsCategory || (t.source === "import" && !t.categoryId);
    const isDebtTxn = t.categoryType === "debt";
    let tag;
    if (needsCat) {
      tag = "ASSIGN";
    } else if (t.paymentType === "credit") {
      const cl = cardLabelFor(s, t.cardId);
      tag = cl ? cl : "CREDIT";
    } else if (t.bankId) {
      // Mirrors the credit path: show which account it came from when picked.
      const bl = bankLabelFor(s, t.bankId);
      tag = bl ? bl : "DEBIT";
    } else if (t.person && t.person !== "JOINT") {
      tag = t.person;
    } else {
      tag = "DEBIT";
    }
    const edit = txnEdits[t.id];
    const expanded = !!edit;
    const err = formErrors["txn_" + t.id];
    const selected = !!bulkSelection[t.id];
    const staged = bulkStagedCategoryId && selected;
    const stagedCatLabel = staged ? (catLookup[bulkStagedCategoryId] || "") : "";
    const chkClass = "txn-check" + (selected ? " checked" : "") + (isDebtTxn ? " disabled" : "");
    const chkLearn = isDebtTxn
      ? "DEBT PAYMENTS CAN'T BE BULK-EDITED. RE-CATEGORIZING THEM REQUIRES BALANCE RECONCILIATION."
      : "CHECK ROWS TO BULK-EDIT THEIR CATEGORY. A CONTROL BAR APPEARS ABOVE THE LIST WHEN ONE OR MORE ARE CHECKED.";
    const row = `
      <div class="txn-row ${expanded ? 'expanded' : ''} ${needsCat ? 'needs-category' : ''} ${selected ? 'selected' : ''}"
           data-action="toggle-txn" data-id="${Util.esc(t.id)}"
           data-learn="TAP TO EDIT AMOUNT, CATEGORY, PAYMENT METHOD, OR NOTE. TAP AGAIN TO CLOSE. THE × BUTTON INSIDE DELETES THE TRANSACTION.">
        <button class="${chkClass}" data-action="bulk-toggle" data-id="${Util.esc(t.id)}" ${isDebtTxn ? "disabled" : ""} aria-label="SELECT" data-learn="${Util.esc(chkLearn)}"></button>
        <div class="txn-date">${Util.esc(Util.fmtDateShort(t.date))}</div>
        <div class="txn-note">
          ${Util.esc(displayNote || catLabel)}
          <span class="txn-tag ${needsCat ? 'needs' : ''}" data-learn="${Util.esc(needsCat ? "THIS IMPORTED TRANSACTION HAS NO CATEGORY YET. TAP THE ROW TO PICK ONE — DASHBOARD BARS AND SAFE TO SPEND WILL UPDATE ONCE ASSIGNED." : (t.paymentType === "credit" ? "PAID WITH CREDIT. IF A CARD IS LINKED THE CARD LABEL SHOWS HERE INSTEAD OF 'CREDIT'." : "PAID WITH PAID FROM CHECKING. IN COUPLE MODE THIS TAG SHOWS WHO PAID."))}">${Util.esc(tag)}</span>
        </div>
        <div class="txn-cat ${staged ? 'staged' : ''}">${Util.esc(staged ? stagedCatLabel : catLabel)}</div>
        <div class="txn-amt">-${Util.esc(Util.fmtMoney(Number(t.amount)||0, 2))}</div>
      </div>`;
    if (!expanded) return row;
    return row + renderTxnEditor(s, t, edit, err);
  }

  function renderTxnEditor(s, t, edit, err) {
    const f = edit.form;
    const isCouple = s.settings && s.settings.mode === "couple";
    const cards = s.creditCards || [];

    // Category chips.
    // Debts appear ONLY when editing an existing debt payment so applyDebtDelta
    // reconciliation stays available for re-assign. For every other txn the
    // editor's picker mirrors the log form: spending + bills only.
    const chips = [];
    (s.spendingCategories||[]).forEach(c => chips.push({ id: c.id, label: c.label, type: "spending" }));
    (s.bills||[]).forEach(b => chips.push({ id: b.id, label: b.label, type: "bill" }));
    if (t.categoryType === "debt") {
      (s.debts||[]).forEach(d => chips.push({ id: d.id, label: d.label + " (DEBT)", type: "debt" }));
    }
    const chipsHtml = chips.map(c => {
      const cls = "chip " + (f.categoryId === c.id ? "active " : "") +
        (c.type === "debt" ? "debt-chip " : (c.type === "bill" ? "bill-chip " : ""));
      return `<button class="${cls}" data-action="txn-edit-cat" data-txn="${Util.esc(t.id)}" data-id="${Util.esc(c.id)}" data-type="${c.type}">${Util.esc(c.label)}</button>`;
    }).join("");

    // Card row lives inside .field for the same min-width:0 cascade the CATEGORY
    // row gets. Prior to V9 this was a plain <div> — reproduced the iOS overflow
    // when a credit txn had 4+ cards and 10+ categories.
    const cardChipsHtml = f.paymentType === "credit" ? `
      <div class="field">
        <label>WHICH CARD</label>
        ${cards.length ? `
          <div class="chips" data-scroll-key="txn-edit-card-${Util.esc(t.id)}">
            ${cards.map(c => `<button class="chip ${f.cardId===c.id?'active':''}" data-action="txn-edit-card" data-txn="${Util.esc(t.id)}" data-id="${Util.esc(c.id)}">${Util.esc(c.label)}</button>`).join("")}
            ${f.cardId ? `<button class="chip" data-action="txn-edit-card" data-txn="${Util.esc(t.id)}" data-id="">× NONE</button>` : ""}
          </div>
        ` : `<div class="meta">NO CARDS; ADD THEM IN SETTINGS</div>`}
      </div>` : "";

    const personChips = isCouple ? `
      <div class="field">
        <label>WHO PAID</label>
        <div class="chips" data-scroll-key="txn-edit-person-${Util.esc(t.id)}">
          ${[s.settings.names[0], s.settings.names[1], "JOINT"].map(p => {
            const val = p.toUpperCase();
            return `<button class="chip ${f.person===val?'active':''}" data-action="txn-edit-person" data-txn="${Util.esc(t.id)}" data-person="${Util.esc(val)}">${Util.esc(p)}</button>`;
          }).join("")}
        </div>
      </div>` : "";

    const confirmHtml = edit.deleteConfirm ? `
      <div class="txn-confirm">
        <span>DELETE?</span>
        <button data-action="txn-delete-cancel" data-txn="${Util.esc(t.id)}">NO</button>
        <button class="yes" data-action="txn-delete-yes" data-txn="${Util.esc(t.id)}">YES</button>
      </div>` : `
      <div class="txn-actions">
        <button data-action="txn-close" data-txn="${Util.esc(t.id)}">× CLOSE</button>
        <button class="del-btn" data-action="txn-delete-ask" data-txn="${Util.esc(t.id)}">× DELETE</button>
      </div>`;

    return `
      <div class="inline-form">
        <div class="sub-label">EDIT TRANSACTION</div>
        <div class="field"><label>AMOUNT</label><input data-action="txn-edit-field" data-txn="${Util.esc(t.id)}" data-field="amount" value="${Util.esc(f.amount)}" inputmode="decimal"></div>
        <div class="field"><label>CATEGORY</label><div class="chips" style="margin-top:4px;" data-scroll-key="txn-edit-cat-${Util.esc(t.id)}">${chipsHtml}</div></div>
        <div class="field"><label>PAYMENT</label>
          <div class="toggle-row">
            <button class="toggle ${f.paymentType==='cash'?'active':''}" data-action="txn-edit-pay" data-txn="${Util.esc(t.id)}" data-pay="cash">DEBIT</button>
            <button class="toggle ${f.paymentType==='credit'?'active':''}" data-action="txn-edit-pay" data-txn="${Util.esc(t.id)}" data-pay="credit">CREDIT</button>
          </div>
        </div>
        ${cardChipsHtml}
        ${personChips}
        <div class="field"><label>NOTE</label><input data-action="txn-edit-field" data-txn="${Util.esc(t.id)}" data-field="note" value="${Util.esc(f.note)}" maxlength="60"></div>
        ${err ? `<div class="text-danger meta">${Util.esc(err)}</div>` : ""}
        <div class="row-actions">
          <button class="cta ghost" data-action="txn-close" data-txn="${Util.esc(t.id)}">× CANCEL</button>
          <button class="cta" data-action="txn-save" data-txn="${Util.esc(t.id)}">→ SAVE</button>
        </div>
        ${confirmHtml}
      </div>`;
  }

  function findTxn(s, id) { return (s.transactions||[]).find(x => x.id === id); }

  function openTxnEditor(s, id) {
    const t = findTxn(s, id);
    if (!t) return;
    txnEdits[id] = {
      form: {
        amount: String(Number(t.amount) || 0),
        categoryId: t.categoryId || null,
        categoryType: t.categoryType || null,
        paymentType: t.paymentType || "cash",
        person: t.person || "JOINT",
        note: t.note || "",
        cardId: t.cardId || null
      },
      deleteConfirm: false
    };
    formErrors["txn_" + id] = "";
  }

  function closeTxnEditor(id) {
    delete txnEdits[id];
    delete formErrors["txn_" + id];
  }

  function bindTxnRowEvents(s) {
    root.querySelectorAll("[data-action=toggle-txn]").forEach(el => {
      el.addEventListener("click", (e) => {
        // Ignore clicks that already targeted a button inside an expanded editor.
        if (e.target !== el && e.target.closest("button,input")) return;
        const id = el.dataset.id;
        if (txnEdits[id]) closeTxnEditor(id); else openTxnEditor(s, id);
        render();
      });
    });
    root.querySelectorAll("[data-action=txn-close]").forEach(el => {
      el.addEventListener("click", (e) => { e.stopPropagation(); closeTxnEditor(el.dataset.txn); render(); });
    });
    root.querySelectorAll("[data-action=txn-edit-field]").forEach(el => {
      el.addEventListener("input", (e) => {
        e.stopPropagation();
        const ed = txnEdits[el.dataset.txn]; if (!ed) return;
        ed.form[el.dataset.field] = e.target.value;
      });
      el.addEventListener("click", e => e.stopPropagation());
    });
    root.querySelectorAll("[data-action=txn-edit-cat]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const ed = txnEdits[el.dataset.txn]; if (!ed) return;
        ed.form.categoryId = el.dataset.id;
        ed.form.categoryType = el.dataset.type;
        render();
      });
    });
    root.querySelectorAll("[data-action=txn-edit-pay]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const ed = txnEdits[el.dataset.txn]; if (!ed) return;
        ed.form.paymentType = el.dataset.pay;
        if (ed.form.paymentType !== "credit") ed.form.cardId = null;
        render();
      });
    });
    root.querySelectorAll("[data-action=txn-edit-card]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const ed = txnEdits[el.dataset.txn]; if (!ed) return;
        ed.form.cardId = el.dataset.id || null;
        render();
      });
    });
    root.querySelectorAll("[data-action=txn-edit-person]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const ed = txnEdits[el.dataset.txn]; if (!ed) return;
        ed.form.person = el.dataset.person;
        render();
      });
    });
    root.querySelectorAll("[data-action=txn-save]").forEach(el => {
      el.addEventListener("click", (e) => { e.stopPropagation(); saveTxnEdit(s, el.dataset.txn); });
    });
    root.querySelectorAll("[data-action=txn-delete-ask]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const ed = txnEdits[el.dataset.txn]; if (!ed) return;
        ed.deleteConfirm = true;
        render();
      });
    });
    root.querySelectorAll("[data-action=txn-delete-cancel]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const ed = txnEdits[el.dataset.txn]; if (!ed) return;
        ed.deleteConfirm = false;
        render();
      });
    });
    root.querySelectorAll("[data-action=txn-delete-yes]").forEach(el => {
      el.addEventListener("click", (e) => { e.stopPropagation(); deleteTxn(s, el.dataset.txn); });
    });
  }

  async function saveTxnEdit(s, id) {
    const ed = txnEdits[id];
    const old = findTxn(s, id);
    if (!ed || !old) return;
    formErrors["txn_" + id] = "";
    const amount = parseFloat(ed.form.amount);
    if (!isFinite(amount) || amount <= 0) {
      formErrors["txn_" + id] = "ENTER A VALID AMOUNT"; render(); return;
    }
    if (!ed.form.categoryId) {
      formErrors["txn_" + id] = "PICK A CATEGORY"; render(); return;
    }
    const isCouple = s.settings && s.settings.mode === "couple";
    const person = isCouple ? ed.form.person : (s.settings.names[0] || "ME").toUpperCase();
    const updated = {
      ...old,
      amount: Math.round(amount * 100) / 100,
      categoryId: ed.form.categoryId,
      categoryType: ed.form.categoryType,
      paymentType: ed.form.paymentType,
      person: person,
      note: (ed.form.note || "").toUpperCase().slice(0, 60),
      cardId: ed.form.paymentType === "credit" ? (ed.form.cardId || null) : null,
      source: old.source || "manual"
    };
    // Assigning a category to a previously-import-with-no-category txn:
    // clear the flag and also update merchantMap so future imports learn from it.
    if (updated.categoryId) delete updated.needsCategory;
    const patch = {
      transactions: (s.transactions||[]).map(x => x.id === id ? updated : x),
      debts: applyDebtDelta(s.debts, old, updated)
    };
    if (updated.categoryId && old.source === "import" && (old.needsCategory || !old.categoryId)) {
      const key = old.merchantKey || ImportEngine.normalizeMerchantKey(old.note || updated.note || "");
      if (key) patch.merchantMap = { ...(s.merchantMap || {}), [key]: updated.categoryId };
    }
    try {
      await DataService.update(patch);
      closeTxnEditor(id);
      render();
    } catch (err) { alert("COULDN'T SAVE; CHECK CONNECTION"); console.warn(err); }
  }

  async function deleteTxn(s, id) {
    const old = findTxn(s, id);
    if (!old) return;
    const patch = {
      transactions: (s.transactions||[]).filter(x => x.id !== id),
      debts: applyDebtDelta(s.debts, old, null)
    };
    try {
      await DataService.update(patch);
      closeTxnEditor(id);
      render();
    } catch (err) { alert("COULDN'T DELETE; CHECK CONNECTION"); console.warn(err); }
  }

  // Record money actually received. Appends with arrayUnion for the same reason
  // transactions do: two phones logging at once must not clobber each other.
  async function submitIncome(s) {
    formErrors.income = "";
    const amount = parseFloat(incomeForm.amount);
    if (!isFinite(amount) || amount <= 0) {
      formErrors.income = "ENTER A VALID AMOUNT";
      render();
      return;
    }
    // This form is for one-off income only. Set-up paychecks are cleared by
    // ticking them in the expected-income list, so there's no source picker
    // here; the note doubles as the entry's label.
    const note = (incomeForm.note || "").trim();
    const isCouple = s.settings && s.settings.mode === "couple";
    const person = isCouple ? incomeForm.person : (s.settings.names[0] || "ME").toUpperCase();
    const date = Util.todayISO();
    const entry = {
      id: Util.uuid(),
      incomeId: null,
      label: (note || "INCOME").toUpperCase().slice(0, 60),
      amount: Math.round(amount * 100) / 100,
      date: date,
      month: date.slice(0, 7),
      person: person,
      note: note.toUpperCase().slice(0, 60),
      bankId: incomeForm.bankId || null,
      source: "manual"
    };
    try {
      await DataService.update({ incomeLog: DataService.appendTxns(entry) });
      incomeForm.amount = "";
      incomeForm.note = "";
      formErrors.income = "";
      render();
    } catch (e) { alert("COULDN'T SAVE; CHECK CONNECTION"); console.warn(e); }
  }

  // Checkbox on the expected-income list. Checking creates an entry at the
  // expected amount; unchecking removes whatever entry exists for that source
  // this month, regardless of whether it came from manual entry or an import.
  async function toggleIncomeCleared(s, incomeId) {
    const log = s.incomeLog || [];
    const existing = log.find(e => e && e.incomeId === incomeId && e.month === s.currentMonth);
    try {
      if (existing) {
        await DataService.update({
          incomeLog: log.filter(e => !(e && e.incomeId === incomeId && e.month === s.currentMonth))
        });
      } else {
        const src = (s.income || []).find(i => i.id === incomeId);
        if (!src) return;
        const isCouple = s.settings && s.settings.mode === "couple";
        const date = Util.todayISO();
        const entry = {
          id: Util.uuid(),
          incomeId: incomeId,
          label: (src.label || "").toUpperCase().slice(0, 60),
          amount: Math.round((Number(src.amount) || 0) * 100) / 100,
          date: date,
          month: s.currentMonth,
          person: isCouple ? "JOINT" : (s.settings.names[0] || "ME").toUpperCase(),
          note: "",
          source: "manual"
        };
        await DataService.update({ incomeLog: DataService.appendTxns(entry) });
      }
      render();
    } catch (e) { alert("COULDN'T SAVE; CHECK CONNECTION"); console.warn(e); }
  }

  async function submitLog(s) {
    formErrors.log = "";
    const amount = parseFloat(logForm.amount);
    if (!isFinite(amount) || amount <= 0) {
      formErrors.log = "ENTER A VALID AMOUNT";
      render();
      return;
    }
    if (!logForm.categoryId) {
      formErrors.log = "PICK A CATEGORY";
      render();
      return;
    }
    const isCouple = s.settings && s.settings.mode === "couple";
    const person = isCouple ? logForm.person : (s.settings.names[0] || "ME").toUpperCase();
    const txn = {
      id: Util.uuid(),
      date: Util.todayISO(),
      amount: Math.round(amount * 100) / 100,
      categoryId: logForm.categoryId,
      categoryType: logForm.categoryType,
      note: (logForm.note || "").toUpperCase().slice(0, 60),
      paymentType: logForm.paymentType,
      person: person,
      month: s.currentMonth,
      cardId: logForm.paymentType === "credit" ? (logForm.cardId || null) : null,
      bankId: logForm.paymentType === "cash" ? (logForm.bankId || null) : null,
      source: "manual"
    };
    const patch = { transactions: DataService.appendTxns(txn) };

    // If logging against a debt, decrement its balance
    if (logForm.categoryType === "debt") {
      const debts = (s.debts||[]).map(d => {
        if (d.id !== logForm.categoryId) return d;
        const newBal = Math.max(0, (Number(d.balance)||0) - amount);
        return { ...d, balance: Math.round(newBal * 100) / 100 };
      });
      patch.debts = debts;
    }

    try {
      await DataService.update(patch);
      // Reset form
      logForm.amount = "";
      logForm.note = "";
      // keep last-used category and payment for convenience
      render();
    } catch (err) {
      console.warn(err);
      alert("COULDN'T SAVE; CHECK CONNECTION");
    }
  }

  /* ------------- DASHBOARD ------------- */
  function dashboardBodyHtml(s) {
    // Debt block
    const totalDebt = BudgetEngine.totalDebt(s);
    const mins = BudgetEngine.totalDebtMins(s);
    const target = BudgetEngine.targetDebt(s);

    // Category rows
    const elapsed = BudgetEngine.monthElapsed(s);
    const dayInfo = BudgetEngine.monthDayInfo(s);
    const cats = (s.spendingCategories||[]);
    const catRows = cats.map(c => {
      const spent = BudgetEngine.categorySpent(s, c.id);
      const roll = BudgetEngine.rolloverAmount(s, c.id);
      const budget = BudgetEngine.num(c.budgeted) + roll;
      const remaining = budget - spent;
      const pct = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
      // Pace-aware, not just absolute. Over budget is always red. Otherwise a
      // category only warns when it's meaningfully ahead of where the calendar
      // is — 80% spent on the 5th is a problem, on the 28th it isn't.
      const spentFrac = budget > 0 ? spent / budget : 0;
      const barClass = spentFrac >= 1
        ? "danger"
        : (spentFrac > elapsed + 0.30 ? "danger"
          : (spentFrac > elapsed + 0.12 ? "warn" : ""));
      const remainClass = remaining < 0 ? "text-danger" : "";
      return `
        <div class="cat-row">
          <div class="cat-line">
            <span>${Util.esc(c.label)}</span>
            <span>${Util.esc(Util.fmtMoney(spent,0))} / ${Util.esc(Util.fmtMoney(budget,0))}</span>
          </div>
          <div class="progress ${barClass}"><span style="width:${pct}%"></span></div>
          <div class="cat-remaining ${remainClass}">${Util.esc(Util.fmtMoney(remaining,0))} REMAINING${roll ? " · ROLLOVER " + Util.esc(Util.fmtMoney(roll,0)) : ""}</div>
        </div>`;
    }).join("") || `<div class="meta">NO CATEGORIES YET</div>`;

    // Credit block
    const unpaid = BudgetEngine.totalUnpaidCredit(s);
    const cashCover = BudgetEngine.cashToCover(s);
    const covered = cashCover >= unpaid;
    const shortfall = unpaid - cashCover;

    // Per-card breakdown of unpaid credit this month.
    // Transactions whose card was deleted (or that never had one) fall into "CREDIT".
    const cards = s.creditCards || [];
    const cardTotals = new Map();
    let untagged = 0;
    (s.transactions || []).forEach(t => {
      if (t.paymentType !== "credit" || t.month !== s.currentMonth) return;
      const amt = Number(t.amount) || 0;
      const label = cardLabelFor(s, t.cardId);
      if (label) cardTotals.set(label, (cardTotals.get(label) || 0) + amt);
      else untagged += amt;
    });
    const cardRowsHtml = (cards.length || untagged > 0) ? (() => {
      const rows = [];
      cards.forEach(c => {
        const v = cardTotals.get(c.label) || 0;
        const linkedDebt = c.debtId ? (s.debts||[]).find(d => d.id === c.debtId) : null;
        const debtSuffix = linkedDebt ? ` (DEBT: ${Util.fmtMoney(Number(linkedDebt.balance)||0,0)})` : "";
        rows.push(`<div class="sub-label" style="margin-top:4px;">${Util.esc(c.label)}: ${Util.esc(Util.fmtMoney(v,0))}${Util.esc(debtSuffix)}</div>`);
      });
      if (untagged > 0) rows.push(`<div class="sub-label" style="margin-top:4px;">CREDIT: ${Util.esc(Util.fmtMoney(untagged,0))}</div>`);
      return rows.join("");
    })() : "";

    return `
        <section class="section terracotta" data-learn="TOTAL DEBT SUMMARY. SUM OF EVERY DEBT'S BALANCE. TARGETING SHOWS WHICH DEBT GETS THE EXTRA PAYMENT NEXT UNDER YOUR CHOSEN PAYOFF ORDER.">
          <div class="section-label">→ TOTAL DEBT</div>
          <div class="hero" style="margin-top:8px;" data-learn="COMBINED BALANCE OF EVERY DEBT.">${Util.esc(Util.fmtMoney(totalDebt,0))}</div>
          <div class="sub-label" style="margin-top:8px;" data-learn="MONTHLY MINIMUM PAYMENTS ACROSS ALL DEBTS. THESE ARE ALWAYS SUBTRACTED FROM SAFE TO SPEND.">MINIMUMS: ${Util.esc(Util.fmtMoney(mins,0))}/MO</div>
          <div class="sub-label" style="margin-top:4px;" data-learn="THE DEBT YOUR EXTRA PAYMENT GOES TO NEXT UNDER THE CURRENT PAYOFF ORDER (AVALANCHE OR SNOWBALL).">${target ? `TARGETING: ${Util.esc(target.label)} · ${Util.esc(Util.fmtMoney(Number(target.balance)||0,0))} REMAINING` : "NO ACTIVE DEBTS"}</div>
        </section>

        <section class="section teal" data-learn="SPENDING CATEGORIES. EACH ROW SHOWS SPENT / BUDGETED WITH A PROGRESS BAR. THE BAR COMPARES YOUR SPENDING AGAINST HOW FAR THROUGH THE MONTH YOU ARE, SO 80% SPENT ON THE 5TH WARNS BUT 80% ON THE 28TH DOESN'T. RED ALWAYS MEANS OVER BUDGET OR WELL AHEAD OF PACE.">
          <div class="section-label">→ CATEGORIES</div>
          <div class="sub-label" style="margin-top:12px;" data-learn="HOW FAR THROUGH THE MONTH YOU ARE. CATEGORY BARS ARE JUDGED AGAINST THIS, NOT JUST AGAINST YOUR BUDGET.">DAY ${dayInfo.day} OF ${dayInfo.daysInMonth} · ${dayInfo.pct}% THROUGH THE MONTH</div>
          <div style="margin-top:24px;">${catRows}</div>
        </section>

        <section class="section lavender" data-learn="CREDIT THIS MONTH. UNPAID = SUM OF CREDIT TRANSACTIONS NOT YET PAID OFF. AVAILABLE TO COVER = WHAT WOULD BE LEFT IN CHECKING IF YOU PAID EVERY CREDIT PURCHASE TODAY. SHORTFALL WARNS WHEN IT CAN'T COVER.">
          <div class="section-label">→ CREDIT THIS MONTH</div>
          <div class="sub-label" style="margin-top:12px;" data-learn="TOTAL CREDIT TRANSACTIONS THIS MONTH THAT HAVEN'T BEEN PAID OFF.">UNPAID: ${Util.esc(Util.fmtMoney(unpaid,0))}</div>
          <div class="sub-label" style="margin-top:4px;" data-learn="WHAT SAFE TO SPEND WOULD BE IF THE UNPAID CREDIT WAS PAID OFF TODAY. IF THIS IS LESS THAN UNPAID, YOU HAVE A SHORTFALL.">AVAILABLE TO COVER: ${Util.esc(Util.fmtMoney(Math.max(0,cashCover),0))}</div>
          ${cardRowsHtml ? `<div style="margin-top:12px;" data-learn="PER-CARD BREAKDOWN OF UNPAID CREDIT THIS MONTH. IF A CARD IS LINKED TO A DEBT, THE DEBT BALANCE SHOWS IN PARENTHESES.">${cardRowsHtml}</div>` : ""}
          <div class="sub-label ${covered ? '' : 'text-danger'}" style="margin-top:12px;" data-learn="${covered ? "COVERED MEANS YOUR YOUR CHECKING BALANCE CAN PAY OFF THIS MONTH'S CREDIT." : "SHORTFALL MEANS CHECKING CAN'T FULLY COVER YOUR UNPAID CREDIT — YOU'LL CARRY A BALANCE."}">
            ${covered ? "→ COVERED" : "← SHORTFALL: " + Util.esc(Util.fmtMoney(shortfall,0))}
          </div>
        </section>`;
  }

  /* ------------- BILLS SCREEN ------------- */
  // Status tracking only. Checking a bill off deliberately does NOT touch
  // Safe to Spend, Budgeted, or any category total — bills are already fully
  // subtracted as budgeted amounts, and nothing here writes a transaction.
  function billsBodyHtml(s) {
    const month = s.currentMonth;
    const paidMap = (s.billsPaid || {})[month] || {};
    const bills = s.bills || [];
    const todayDay = Number(Util.todayISO().slice(8, 10)) || 0;
    const sameMonth = Util.todayISO().slice(0, 7) === month;

    const paidTotal = bills.reduce((a, b) => {
      const rec = paidMap[b.id];
      return a + (rec && rec.paid ? (Number(rec.amount) || 0) : 0);
    }, 0);
    const paidCount = bills.filter(b => paidMap[b.id] && paidMap[b.id].paid).length;
    const expectedTotal = BudgetEngine.totalBills(s);

    const rowFor = (b) => {
      const rec = paidMap[b.id];
      const isPaid = !!(rec && rec.paid);
      const due = Number(b.dueDateOfMonth) || 0;
      // Overdue styling only for unpaid rows whose due day has already passed
      // in the month we're actually looking at.
      const overdue = !isPaid && sameMonth && due > 0 && due < todayDay;
      const fromImport = isPaid && rec.source === "import";
      return `
        <div class="inc-row">
          <div>
            <div class="inc-label">${Util.esc(b.label)}</div>
            ${fromImport ? `<div class="meta">PAID ${Util.esc(Util.fmtMoney(Number(rec.amount)||0, 2))} ON ${Util.esc(Util.fmtDateShort(rec.paidDate))} · FROM IMPORT</div>` : ""}
          </div>
          <div class="inc-amt">
            ${Util.esc(Util.fmtMoney(Number(b.amount) || 0, 0))}
            <span class="${overdue ? "text-danger" : ""}" style="opacity:0.75;">DUE ${due || "—"}</span>
          </div>
          <button class="txn-check ${isPaid ? "checked" : ""}" data-action="bill-toggle" data-id="${Util.esc(b.id)}" aria-label="PAID" data-learn="MARK THIS BILL AS PAID FOR THIS MONTH. THIS IS STATUS TRACKING ONLY; IT DOES NOT CHANGE SAFE TO SPEND, BUDGETED, OR ANY CATEGORY, BECAUSE BILLS ARE ALREADY SUBTRACTED AS BUDGETED AMOUNTS."></button>
        </div>`;
    };

    const byDue = (a, b) => (Number(a.dueDateOfMonth) || 0) - (Number(b.dueDateOfMonth) || 0);
    const billItems = bills.filter(b => b.category !== "savings").slice().sort(byDue);
    const savingsItems = bills.filter(b => b.category === "savings").slice().sort(byDue);

    // Credit cards carrying a balance ride along in the RECURRING list so every
    // monthly obligation is visible in one place. A card's figures live on the
    // debt it's linked to (balance, minimum, due day).
    //
    // These rows are not entries in s.bills: card minimums are already
    // subtracted from Safe to Spend as debt minimums, so storing them as real
    // bills would double-count them. Their PAID? tick is the same record the
    // DEBTS tab card uses, so ticking here ticks there and vice versa.
    const cardBillItems = (s.creditCards || []).map(c => {
      const d = c.debtId ? (s.debts || []).find(x => x.id === c.debtId) : null;
      if (!d) return null;
      const paidTxn = tickPayTxnFor(s, d.id);
      // A cleared balance normally drops the card out of this list; keep it
      // while its tick is on, or there'd be no way left to undo the payment.
      if ((Number(d.balance) || 0) <= 0 && !paidTxn) return null;
      return {
        debt: d,
        label: c.label,
        amount: Number(d.minimumPayment) || 0,
        dueDateOfMonth: Number(d.dueDateOfMonth) || 0,
        paidTxn: paidTxn
      };
    }).filter(Boolean).sort(byDue);

    const cardRowFor = (c) => {
      const due = Number(c.dueDateOfMonth) || 0;
      const paid = !!c.paidTxn;
      const overdue = !paid && sameMonth && due > 0 && due < todayDay;
      // Nothing to log without a minimum on the linked debt.
      const canPay = c.amount > 0;
      const paidNote = paid
        ? ` · PAID ${Util.fmtMoney(Number(c.paidTxn.amount) || 0, 0)}`
        : (canPay ? "" : " · SET A MINIMUM IN SETTINGS");
      return `
        <div class="inc-row">
          <div>
            <div class="inc-label">${Util.esc(c.label)}</div>
            <div class="meta">CARD MINIMUM${Util.esc(paidNote)}</div>
          </div>
          <div class="inc-amt">
            ${Util.esc(Util.fmtMoney(c.amount, 0))}
            <span class="${overdue ? "text-danger" : ""}" style="opacity:0.75;">DUE ${due || "—"}</span>
          </div>
          <button class="txn-check ${paid ? "checked" : ""} ${canPay ? "" : "disabled"}"${canPay ? "" : " disabled"} data-action="card-min-toggle" data-id="${Util.esc(c.debt.id)}" aria-label="PAID" data-learn="TICK TO LOG A PAYMENT AGAINST THIS CARD. IT ASKS WHETHER YOU PAID THE MINIMUM OR A DIFFERENT AMOUNT, THEN RECORDS A DEBIT TRANSACTION AND REDUCES THE DEBT BALANCE. IT TICKS ON THE DEBTS TAB TOO; UNTICK TO UNDO BOTH."></button>
        </div>
        ${renderMinPayPrompt(s, c.debt)}`;
    };

    const cardRowsHtml = cardBillItems.map(cardRowFor).join("");

    // The header figures describe everything listed in this section, cards
    // included, so the count matches what's actually on screen. These sums are
    // local to this block on purpose: BudgetEngine.totalBills stays bills-only
    // so Safe to Spend and Budgeted don't shift.
    // A card's contribution is capped at its minimum: this line is progress
    // toward what's owed, so overpaying a card shouldn't push it past 100%.
    // The full amount paid still shows on the row and in the debt balance.
    const headerPaidTotal = paidTotal + cardBillItems.reduce((a, c) => {
      if (!c.paidTxn) return a;
      return a + Math.min(Number(c.paidTxn.amount) || 0, Number(c.amount) || 0);
    }, 0);
    const headerExpectedTotal = expectedTotal + cardBillItems.reduce(
      (a, c) => a + (Number(c.amount) || 0), 0);
    const headerPaidCount = paidCount + cardBillItems.filter(c => c.paidTxn).length;
    const headerItemCount = bills.length + cardBillItems.length;

    // Same add-form machinery Settings uses, surfaced at the end of each group.
    const addLink = (kind, label) => addForms[kind]
      ? renderAddForm(kind)
      : `<button class="link" style="margin-top:12px;" data-action="show-add" data-kind="${kind}" data-learn="ADD A NEW ${Util.esc(label)} TO YOUR BUDGET. IT SHOWS UP HERE AND IN SETTINGS.">* ADD ${Util.esc(label)} →</button>`;

    const groupHtml = (title, items, kind, addLabel, extraRows) => `
      <div style="margin-top:24px;">
        <div class="sub-label">${title}</div>
        ${(items.length || extraRows) ? `
          <div class="inc-head" style="margin-top:12px;">
            <div class="sub-label">NAME</div>
            <div class="sub-label">AMOUNT</div>
            <div class="sub-label">PAID?</div>
          </div>
          ${items.map(rowFor).join("")}
          ${extraRows || ""}
        ` : ""}
        ${addLink(kind, addLabel)}
      </div>`;

    const listHtml = groupHtml("BILLS", billItems, "bill", "BILL", cardRowsHtml)
      + groupHtml("SAVINGS", savingsItems, "savings", "SAVINGS");

    // The MONTH OF line and the "→ BILLS" section label used to open this block.
    // Both are redundant now that the shared lime block above carries the month
    // and the tab label.
    return `
        <section class="section lavender" data-learn="BILLS STATUS FOR THIS MONTH. TICK EACH BILL AS IT GETS PAID SO YOU CAN SEE WHAT'S LEFT. THIS IS TRACKING ONLY AND NEVER CHANGES YOUR BUDGET MATH.">
          <div class="section-label">→ RECURRING</div>
          <div class="sub-label" style="margin-top:16px;" data-learn="HOW MUCH OF YOUR MONTHLY TOTAL YOU'VE MARKED PAID SO FAR THIS MONTH. COVERS EVERYTHING LISTED BELOW: BILLS, SAVINGS, AND ANY CREDIT CARD MINIMUMS.">${Util.esc(Util.fmtMoney(headerPaidTotal, 0))} OF ${Util.esc(Util.fmtMoney(headerExpectedTotal, 0))} PAID</div>
          <div class="sub-label" style="margin-top:8px;" data-learn="HOW MANY INDIVIDUAL ROWS BELOW ARE TICKED OFF, CREDIT CARDS INCLUDED.">${headerPaidCount} OF ${headerItemCount} CLEARED</div>
          ${listHtml}
        </section>`;
  }

  function bindBillsEvents(s) {
    root.querySelectorAll("[data-action=bill-toggle]").forEach(el => {
      el.addEventListener("click", () => toggleBillPaid(s, el.dataset.id));
    });
    bindCardMinEvents(s);
    // The ADD BILL / ADD SAVINGS links reuse Settings' add-form machinery.
    bindAddFormEvents(s);
  }

  // Shared by the Settings screen and the Bills tab so both surface the same
  // add-item forms from one implementation.
  function bindAddFormEvents(s) {
    root.querySelectorAll("[data-action=show-add]").forEach(el => {
      el.addEventListener("click", () => {
        const kind = el.dataset.kind;
        if (kind === "income") addForms.income = { label: "", amount: "", dueDateOfMonth: "1" };
        else if (kind === "bill") addForms.bill = { label: "", amount: "", dueDateOfMonth: "1" };
        else if (kind === "savings") addForms.savings = { label: "", amount: "", dueDateOfMonth: "1" };
        else if (kind === "spending") addForms.spending = { label: "", budgeted: "" };
        else if (kind === "card") addForms.card = { label: "" };
        else if (kind === "bank") addForms.bank = { label: "" };
        render();
      });
    });
    root.querySelectorAll("[data-action=add-form-input]").forEach(el => {
      el.addEventListener("input", e => {
        const kind = el.dataset.kind;
        const field = el.dataset.field;
        if (addForms[kind]) addForms[kind][field] = e.target.value;
      });
    });
    root.querySelectorAll("[data-action=cancel-add]").forEach(el => {
      el.addEventListener("click", () => {
        const k = el.dataset.kind;
        addForms[k] = null;
        formErrors["add_" + k] = "";
        render();
      });
    });
    root.querySelectorAll("[data-action=save-add]").forEach(el => {
      el.addEventListener("click", () => saveNewItem(el.dataset.kind, s));
    });
  }

  // Clone the whole billsPaid map, mutate only the current month's key, and send
  // the whole map. A nested partial patch would replace the map and destroy
  // sibling months — same pattern monthlyRollover uses in confirmNewMonth.
  async function toggleBillPaid(s, billId) {
    const month = s.currentMonth;
    const all = { ...(s.billsPaid || {}) };
    const forMonth = { ...(all[month] || {}) };
    if (forMonth[billId] && forMonth[billId].paid) {
      delete forMonth[billId];
    } else {
      const bill = (s.bills || []).find(b => b.id === billId);
      if (!bill) return;
      forMonth[billId] = {
        paid: true,
        paidDate: Util.todayISO(),
        amount: Math.round((Number(bill.amount) || 0) * 100) / 100,
        source: "manual",
        txnId: null
      };
    }
    all[month] = forMonth;
    try {
      await DataService.update({ billsPaid: all });
      render();
    } catch (e) { alert("COULDN'T SAVE; CHECK CONNECTION"); console.warn(e); }
  }

  // Shared by the BILLS tab card rows and the DEBTS tab cards so one tick works
  // identically from either place.
  function bindCardMinEvents(s) {
    root.querySelectorAll("[data-action=card-min-toggle]").forEach(el => {
      el.addEventListener("click", () => toggleDebtMinPaid(s, el.dataset.id));
    });
    root.querySelectorAll("[data-action=min-pay-min]").forEach(el => {
      el.addEventListener("click", () => {
        const d = (s.debts || []).find(x => x.id === el.dataset.id);
        if (d) logDebtTickPayment(s, el.dataset.id, Number(d.minimumPayment) || 0);
      });
    });
    root.querySelectorAll("[data-action=min-pay-custom]").forEach(el => {
      el.addEventListener("click", () => {
        const d = (s.debts || []).find(x => x.id === el.dataset.id);
        const f = minPayPrompts[el.dataset.id];
        if (!f) return;
        f.mode = "custom";
        // Prefill with the minimum so it's an edit, not a blank field.
        f.amount = d ? String(Number(d.minimumPayment) || "") : "";
        f.error = "";
        render();
      });
    });
    root.querySelectorAll("[data-action=min-pay-input]").forEach(el => {
      el.addEventListener("input", e => {
        const f = minPayPrompts[el.dataset.id];
        if (f) f.amount = e.target.value;
      });
    });
    root.querySelectorAll("[data-action=min-pay-save]").forEach(el => {
      el.addEventListener("click", () => {
        const f = minPayPrompts[el.dataset.id];
        logDebtTickPayment(s, el.dataset.id, parseFloat(f ? f.amount : ""));
      });
    });
    root.querySelectorAll("[data-action=min-pay-cancel]").forEach(el => {
      el.addEventListener("click", () => { delete minPayPrompts[el.dataset.id]; render(); });
    });
  }

  // A card/debt row's PAID? tick is backed by one payment transaction, flagged
  // tickPay so it can be found and undone exactly. The BILLS tab card rows and
  // the DEBTS tab cards both read and write this single record, which is what
  // keeps the two tabs in step: ticking either one ticks both, and the payment
  // itself lands in the ledger like any other, so the log, the debt balance and
  // every total that reads them all move together.
  //
  // Unlike a bill's tick this is a real ledger event, so ticking asks first
  // whether it was the minimum or some other amount rather than assuming.
  function tickPayTxnFor(s, debtId) {
    return (s.transactions || []).find(t =>
      t && t.tickPay && t.categoryType === "debt" &&
      t.categoryId === debtId && t.month === s.currentMonth) || null;
  }

  // Tick opens the confirm step; untick reverses immediately.
  async function toggleDebtMinPaid(s, debtId) {
    const debt = (s.debts || []).find(d => d.id === debtId);
    if (!debt) return;
    const existing = tickPayTxnFor(s, debtId);
    if (!existing) {
      if ((Number(debt.minimumPayment) || 0) <= 0) return;
      minPayPrompts[debtId] = { mode: "ask", amount: "", error: "" };
      render();
      return;
    }
    // Undo: drop the payment and let applyDebtDelta restore the balance, the
    // same reversal the txn editor's delete path uses.
    delete minPayPrompts[debtId];
    try {
      await DataService.update({
        transactions: (s.transactions || []).filter(x => x.id !== existing.id),
        debts: applyDebtDelta(s.debts, existing, null)
      });
      render();
    } catch (e) { alert("COULDN'T SAVE; CHECK CONNECTION"); console.warn(e); }
  }

  async function logDebtTickPayment(s, debtId, rawAmount) {
    const debt = (s.debts || []).find(d => d.id === debtId);
    if (!debt) return;
    const f = minPayPrompts[debtId] || (minPayPrompts[debtId] = { mode: "ask", amount: "", error: "" });
    const amount = Math.round((Number(rawAmount) || 0) * 100) / 100;
    if (!isFinite(amount) || amount <= 0) {
      f.error = "ENTER A VALID AMOUNT";
      render();
      return;
    }
    const minAmt = Math.round((Number(debt.minimumPayment) || 0) * 100) / 100;
    const isCouple = s.settings && s.settings.mode === "couple";
    const txn = {
      id: Util.uuid(),
      date: Util.todayISO(),
      amount: amount,
      categoryId: debtId,
      categoryType: "debt",
      note: amount === minAmt ? "MINIMUM PAYMENT" : "PAYMENT",
      paymentType: "cash",
      person: isCouple ? "JOINT" : ((s.settings.names && s.settings.names[0]) || "ME").toUpperCase(),
      // Keyed to the month being tracked, not today, so the tick matches the
      // month the BILLS tab is showing.
      month: s.currentMonth,
      cardId: null,
      tickPay: true,
      source: "manual"
    };
    try {
      await DataService.update({
        transactions: DataService.appendTxns(txn),
        debts: applyDebtDelta(s.debts, null, txn)
      });
      delete minPayPrompts[debtId];
      render();
    } catch (e) { f.error = "COULDN'T SAVE; CHECK CONNECTION"; render(); console.warn(e); }
  }

  // The confirm step itself. Rendered as a sibling of the row that opened it,
  // from either tab, so both places get the identical prompt.
  function renderMinPayPrompt(s, debt) {
    const f = minPayPrompts[debt.id];
    if (!f) return "";
    const minAmt = Math.round((Number(debt.minimumPayment) || 0) * 100) / 100;
    const id = Util.esc(debt.id);
    if (f.mode === "custom") {
      return `
        <div class="inline-form">
          <div class="sub-label">HOW MUCH DID YOU PAY?</div>
          <div class="field"><label>AMOUNT PAID</label><input data-action="min-pay-input" data-id="${id}" value="${Util.esc(f.amount)}" inputmode="decimal" placeholder="${Util.esc(String(minAmt))}"></div>
          <div class="meta">LOGS AS A DEBIT AGAINST ${Util.esc(debt.label)} AND REDUCES THE BALANCE BY THIS AMOUNT.</div>
          ${f.error ? `<div class="text-danger meta">${Util.esc(f.error)}</div>` : ""}
          <div class="row-actions">
            <button class="cta ghost" data-action="min-pay-cancel" data-id="${id}">× CANCEL</button>
            <button class="cta" data-action="min-pay-save" data-id="${id}">→ LOG IT</button>
          </div>
        </div>`;
    }
    return `
      <div class="inline-form">
        <div class="sub-label">DID YOU PAY THE MINIMUM?</div>
        <div class="meta">EITHER WAY THIS LOGS A DEBIT AGAINST ${Util.esc(debt.label)} AND REDUCES THE BALANCE.</div>
        ${f.error ? `<div class="text-danger meta">${Util.esc(f.error)}</div>` : ""}
        <div class="row-actions">
          <button class="cta ghost" data-action="min-pay-custom" data-id="${id}">A DIFFERENT AMOUNT</button>
          <button class="cta" data-action="min-pay-min" data-id="${id}">→ MINIMUM · ${Util.esc(Util.fmtMoney(minAmt, 0))}</button>
        </div>
        <button class="link" data-action="min-pay-cancel" data-id="${id}" style="margin-top:8px;">× CANCEL</button>
      </div>`;
  }

  /* ------------- DEBTS SCREEN ------------- */
  function debtsBodyHtml(s) {
    // Progress since you started: every debt stores originalBalance, so this is
    // pure arithmetic on data already held. No chart, one line.
    const paidOff = (s.debts || []).reduce((a, d) => {
      const orig = Number(d.originalBalance);
      const bal = Number(d.balance) || 0;
      return a + (isFinite(orig) && orig > bal ? orig - bal : 0);
    }, 0);
    const baseExtra = Math.max(0, BudgetEngine.extraForDebt(s));
    const totalExtra = baseExtra + extraPreview;
    const strat = BudgetEngine.debtStrategy(s);
    const sim = DebtEngine.simulate(s.debts||[], totalExtra, s.currentMonth, strat);
    const debtFree = sim.debtFreeDate || "NOT YET";

    const debtsSorted = BudgetEngine.debtOrder(s.debts||[], strat);
    const stratExplainer = strat === "avalanche"
      ? "HIGHEST RATE FIRST; LESS INTEREST PAID"
      : "SMALLEST BALANCE FIRST; QUICK WINS";

    const cardsHtml = debtsSorted.map((d, i) => {
      const bal = Number(d.balance) || 0;
      const orig = Number(d.originalBalance) || Math.max(bal, 1);
      const paidPct = Math.max(0, Math.min(100, (1 - bal/orig) * 100));
      const payoff = sim.payoffByDebt[d.id] || "NOT YET";
      const heading = i === 0 ? "#1  ATTACKING NOW" : `#${i+1}  (AFTER #${i})`;
      const isEditing = editStates["debt_" + d.id];
      const editHtml = isEditing ? renderEditForm("debt", d) : "";
      const linkedCard = d.cardId ? (s.creditCards||[]).find(c => c.id === d.cardId) : null;
      const payForm = debtPayForms[d.id];
      const payHtml = payForm && payForm.open ? renderDebtPayForm(s, d) : "";
      // Same tick as the card row on the BILLS tab — one record, both tabs.
      const minAmt = Number(d.minimumPayment) || 0;
      const minPaidTxn = tickPayTxnFor(s, d.id);
      const minRowHtml = minAmt > 0 ? `
          <div class="inc-row" style="margin-top:8px;">
            <div>
              <div class="inc-label">MINIMUM THIS MONTH</div>
              <div class="meta">${minPaidTxn ? `PAID ${Util.esc(Util.fmtMoney(Number(minPaidTxn.amount) || 0, 0))}; BALANCE REDUCED` : "TICK TO LOG A PAYMENT"}</div>
            </div>
            <div class="inc-amt">${Util.esc(Util.fmtMoney(minAmt, 0))}</div>
            <button class="txn-check ${minPaidTxn ? "checked" : ""}" data-action="card-min-toggle" data-id="${Util.esc(d.id)}" aria-label="MINIMUM PAID" data-learn="TICK TO LOG A PAYMENT AGAINST THIS DEBT. IT ASKS WHETHER YOU PAID THE MINIMUM OR A DIFFERENT AMOUNT, THEN RECORDS A DEBIT TRANSACTION AND REDUCES THE BALANCE. IT TICKS ALONGSIDE THE CARD ROW ON THE BILLS TAB; UNTICK TO UNDO BOTH."></button>
          </div>
          ${renderMinPayPrompt(s, d)}` : "";
      return `
        <div class="debt-card" data-learn="DEBT CARD. SHOWS YOUR REMAINING BALANCE, HOW MUCH OF THE ORIGINAL IS PAID, THE PROJECTED PAYOFF MONTH, AND THE MINIMUM PAYMENT AND INTEREST RATE.">
          <div class="debt-header">
            <span>${Util.esc(heading)}</span>
            <button class="link" data-action="edit-item" data-kind="debt" data-id="${Util.esc(d.id)}" style="padding:0;min-height:auto;" data-learn="EDIT THE DEBT'S LABEL, BALANCE, MINIMUM PAYMENT, OR INTEREST RATE.">EDIT →</button>
          </div>
          <div class="debt-label">${Util.esc(d.label)}</div>
          <div class="debt-balance">${Util.esc(Util.fmtMoney(bal,0))} REMAINING</div>
          <div class="progress" data-learn="PROGRESS BAR. FILL SHOWS HOW MUCH OF THE ORIGINAL BALANCE IS PAID OFF."><span style="width:${paidPct}%"></span></div>
          <div class="debt-meta">${paidPct.toFixed(0)}% PAID · PAYOFF: ${Util.esc(payoff)}</div>
          <div class="debt-meta">MIN: ${Util.esc(Util.fmtMoney(Number(d.minimumPayment)||0,0))}/MO · RATE: ${(Number(d.interestRate)||0).toFixed(1)}%</div>
          ${linkedCard ? `<div class="debt-meta" data-learn="THIS DEBT IS LINKED TO A CREDIT CARD YOU SET UP IN SETTINGS. LINKING IS INFORMATIONAL — BALANCES STAY INDEPENDENT.">LINKED CARD: ${Util.esc(linkedCard.label)}</div>` : ""}
          ${minRowHtml}
          <button class="link" data-action="debt-pay-open" data-id="${Util.esc(d.id)}" style="margin-top:8px;" data-learn="LOG A PAYMENT AGAINST THIS DEBT. OPENS A FORM (AMOUNT, DEBIT/CREDIT, NOTE). ON SAVE THE BALANCE DECREASES AND A TRANSACTION IS RECORDED.">${payForm && payForm.open ? "× CANCEL PAYMENT" : "→ LOG PAYMENT"}</button>
          ${payHtml}
          ${editHtml}
        </div>`;
    }).join("") || `<div class="meta" style="padding:24px;">NO DEBTS YET · ADD ONE BELOW</div>`;

    const addForm = addForms.debt ? renderAddDebtForm() : "";

    return `
        <section class="section terracotta" data-learn="DEBT-FREE DATE. THE MONTH YOU'LL FINISH PAYING OFF EVERY DEBT AT YOUR CURRENT PACE. FACTORS IN MINIMUMS, INTEREST, AND ANY EXTRA PAYMENT.">
          <div class="section-label">→ HOW MUCH LONGER?</div>
          <div class="sub-label" style="margin-top:16px;">DEBT-FREE DATE</div>
          <div class="hero" style="margin-top:8px;">${Util.esc(Util.fmtMonthLong(monthYMFromShort(debtFree)) || debtFree)}</div>
          <div class="sub-label" style="margin-top:8px;">AT CURRENT PACE</div>
          ${paidOff > 0 ? `<div class="sub-label" style="margin-top:8px;" data-learn="HOW MUCH TOTAL DEBT YOU'VE CLEARED SINCE YOU FIRST ENTERED THESE BALANCES. COMPARES EACH DEBT'S ORIGINAL BALANCE TO WHAT'S LEFT.">PAID OFF ${Util.esc(Util.fmtMoney(paidOff,0))} SINCE YOU STARTED</div>` : ""}
        </section>

        <section class="section gray">
          <div class="section-label" data-learn="PAYOFF ORDER TOGGLE. AVALANCHE ATTACKS THE HIGHEST INTEREST RATE FIRST (LESS INTEREST PAID). SNOWBALL ATTACKS THE SMALLEST BALANCE FIRST (QUICK EMOTIONAL WINS).">→ WHAT IF?</div>
          <div class="toggle-row" style="margin-top:8px;">
            <button class="toggle ${strat==='avalanche'?'active':''}" data-action="pick-strategy" data-strategy="avalanche" data-learn="AVALANCHE PAYS THE HIGHEST INTEREST RATE FIRST, TIE-BROKEN BY SMALLER BALANCE. MATHEMATICALLY OPTIMAL; LEAST INTEREST PAID.">AVALANCHE</button>
            <button class="toggle ${strat==='snowball'?'active':''}" data-action="pick-strategy" data-strategy="snowball" data-learn="SNOWBALL PAYS THE SMALLEST BALANCE FIRST, TIE-BROKEN BY HIGHER RATE. QUICK WINS; MOTIVATING BUT MAY COST MORE INTEREST.">SNOWBALL</button>
          </div>
          <div class="sub-label" style="margin-top:8px; opacity:0.85;">${Util.esc(stratExplainer)}</div>

          <div class="section-label" style="margin-top:32px;" data-learn="EXTRA PAYMENT PER MONTH. ANY MONEY LEFT AFTER TITHE, BILLS, MINIMUMS, AND SPENDING BUDGETS GOES TO THE TARGETED DEBT. TOGGLE +$100/+$200/+$500 TO PREVIEW HOW MUCH FASTER YOU'D BE DEBT-FREE.">→ EXTRA PAYMENT / MONTH</div>
          <div class="sub-label" style="margin-top:12px;" data-learn="AUTO = LEFTOVER AFTER EVERYTHING ELSE IN THE BUDGET. THIS GETS APPLIED TO THE TARGETED DEBT EVERY MONTH.">AUTO: ${Util.esc(Util.fmtMoney(baseExtra,0))} (FROM LEFTOVER)</div>
          <div class="sub-label" style="margin-top:4px; opacity:0.75;">REMAINING AFTER ALL BILLS AND MINIMUMS</div>
          <div class="toggle-row">
            <button class="toggle ${extraPreview===100?'active':''}" data-action="extra-preview" data-amt="100" data-learn="PREVIEW WHAT THE DEBT-FREE DATE WOULD BE IF YOU ADDED $100 MORE PER MONTH. DOESN'T CHANGE ANY STORED VALUES.">+ $100 MORE</button>
            <button class="toggle ${extraPreview===200?'active':''}" data-action="extra-preview" data-amt="200" data-learn="PREVIEW WITH +$200 EXTRA PER MONTH.">+ $200 MORE</button>
            <button class="toggle ${extraPreview===500?'active':''}" data-action="extra-preview" data-amt="500" data-learn="PREVIEW WITH +$500 EXTRA PER MONTH.">+ $500 MORE</button>
            ${extraPreview!==0 ? `<button class="toggle" data-action="extra-preview" data-amt="0" data-learn="CLEAR THE EXTRA-PAYMENT PREVIEW.">× CLEAR</button>` : ""}
          </div>
          ${extraPreview>0 ? `<div class="sub-label" style="margin-top:12px;">WITH EXTRA: ${Util.esc(Util.fmtMoney(baseExtra+extraPreview,0))}/MO</div>` : ""}
        </section>

        <section class="section off-white" style="padding:0;" data-learn="DEBT LIST, SORTED BY PAYOFF ORDER. EACH CARD SHOWS THE BALANCE, PROGRESS BAR, PROJECTED PAYOFF MONTH, MINIMUM, AND INTEREST RATE. TAP → LOG PAYMENT TO RECORD A PAYMENT — IT DEBITS THE BALANCE AND WRITES A TRANSACTION IN ONE STEP.">
          <div class="section-label" style="padding:32px 24px 0;">→ ORDER</div>
          ${cardsHtml}
          <div style="padding:24px;">
            ${addForm || `<button class="link" data-action="show-add-debt" data-learn="ADD A NEW DEBT: LABEL, BALANCE, MINIMUM PAYMENT, AND INTEREST RATE.">* ADD DEBT →</button>`}
          </div>
        </section>`;
  }

  // Convert "AUG 2025" -> "2025-08" (for fmtMonthLong)
  function monthYMFromShort(shortStr) {
    if (!shortStr || shortStr === "NOT YET") return null;
    const parts = shortStr.split(" ");
    if (parts.length !== 2) return null;
    const names = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    const idx = names.indexOf(parts[0]);
    if (idx < 0) return null;
    return `${parts[1]}-${String(idx+1).padStart(2,"0")}`;
  }

  function bindDebtsEvents(s) {
    root.querySelectorAll("[data-action=extra-preview]").forEach(el => {
      el.addEventListener("click", () => {
        const v = parseInt(el.dataset.amt, 10);
        extraPreview = (extraPreview === v ? 0 : v);
        render();
      });
    });
    root.querySelectorAll("[data-action=pick-strategy]").forEach(el => {
      el.addEventListener("click", async () => {

  async function saveDebtPayment(s, debtId) {
    const f = debtPayForms[debtId];
    if (!f) return;
    f.error = "";
    const amount = parseFloat(f.amount);
    if (!isFinite(amount) || amount <= 0) { f.error = "ENTER A VALID AMOUNT"; render(); return; }
    const debt = (s.debts || []).find(d => d.id === debtId);
    if (!debt) { f.error = "DEBT NOT FOUND"; render(); return; }
    const isCouple = s.settings && s.settings.mode === "couple";
    const person = isCouple ? (f.person || "JOINT") : ((s.settings.names && s.settings.names[0]) || "ME").toUpperCase();
    const dateISO = Util.todayISO();
    const txn = {
      id: Util.uuid(),
      date: dateISO,
      amount: Math.round(amount * 100) / 100,
      categoryId: debtId,
      categoryType: "debt",
      note: (f.note || "").toUpperCase().slice(0, 60),
      paymentType: f.paymentType || "cash",
      person: person,
      month: dateISO.slice(0, 7),
      cardId: f.paymentType === "credit" ? (f.cardId || null) : null,
      source: "manual"
    };
    // Reuse applyDebtDelta so the debt-balance reconciliation logic is shared
    // with the txn editor's save path — one source of truth for consistency.
    const patch = {
      transactions: DataService.appendTxns(txn),
      debts: applyDebtDelta(s.debts, null, txn)
    };
    try {
      await DataService.update(patch);
      delete debtPayForms[debtId];
      render();
    } catch (err) { f.error = "COULDN'T SAVE; CHECK CONNECTION"; render(); console.warn(err); }
  }

  async function saveNewDebt(s) {
    formErrors.add_debt = "";
    const f = addForms.debt || {};
    const label = (f.label||"").trim();
    if (!label) { formErrors.add_debt = "LABEL REQUIRED"; render(); return; }
    // Fuzzy-match against existing cards before saving.
    if (!f.linkChoice) {
      const match = (s.creditCards || []).find(c => fuzzyLabelMatch(c.label, label));
      if (match) {
        f.pendingMatch = { targetId: match.id, targetLabel: match.label };
        render(); return;
      }
    }
    const balance = parseFloat(f.balance) || 0;
    const min = parseFloat(f.minimumPayment) || 0;
    const rate = parseFloat(f.interestRate) || 0;
    const linkCardId = (f.linkChoice === "yes" && f.pendingMatch) ? f.pendingMatch.targetId : null;
    const newDebt = {
      id: Util.uuid(),
      label: label.toUpperCase(),
      balance: balance,
      originalBalance: balance,
      minimumPayment: min,
      interestRate: rate,
      dueDateOfMonth: parseInt(f.dueDateOfMonth, 10) || null,
      cardId: linkCardId
    };
    const patch = { debts: [...(s.debts||[]), newDebt] };
    if (linkCardId) {
      patch.creditCards = (s.creditCards || []).map(c => c.id === linkCardId ? { ...c, debtId: newDebt.id } : c);
    }
    try {
      await DataService.update(patch);
      addForms.debt = null;
      render();
    } catch (err) { alert("COULDN'T SAVE"); console.warn(err); }
  }
